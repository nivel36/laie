<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" 
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core" 
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" 
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:g="http://ged.org/ui" 
	xmlns:h="http://java.sun.com/jsf/html" 
	xmlns:o="http://omnifaces.org/ui"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>Isabel</title>
	</ui:define>

	<ui:param name="selectedMenu" value="isabel" />


	<ui:define name="breadcrumb">
		<p:breadCrumb styleClass="breadcrumb">
			<p:menuitem value="#{i18n['menu.index']}" outcome="#{Page.INDEX.getUrl()}" />
			<p:menuitem value="Exportacion" disabled="true" />
		</p:breadCrumb>
	</ui:define>


	<ui:define name="content">
		<div class="panel">
			<h:form>
				<div class="panel-content">
					<div class="panel-content-data">
						<p:pickList value="#{isabelView.model}" var="item" converter="exportViewConverter" itemLabel="#{item.label}" itemValue="#{item}"
							showTargetControls="true" update="@form growl" />
					</div>
				</div>
				<div class="panel-footer">
					<div class="panel-buttons">
						<p:commandButton value="Guardar" action="#{isabelView.save}" process="@form" update="@form growl" />
					</div>
				</div>
			</h:form>
		</div>
	</ui:define>
</ui:composition>
