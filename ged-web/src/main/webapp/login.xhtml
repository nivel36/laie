<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:p="http://primefaces.org/ui" lang="es">

<h:head>
	<f:facet name="first">
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
	</f:facet>
	<title>${i18n['login.login']}</title>
</h:head>

<h:body styleClass="login-body">
	<p:growl id="growl" globalOnly="true" />
	<h:form id="loginForm">
		<div class="card login-panel ui-fluid">
			<div class="login-panel-content">
				<div class="p-grid">
					<div class="p-col-12" style="text-align: center">
						<svg width="80" height="80" viewBox="0 0 170 170">
						<g class="currentLayer">
							<path fill="#f7941e" stroke="#222222" stroke-width="2" stroke-linejoin="round" d="M001,071 L013,048 L044,048 L056,071 L044,095 L013,095 L001,071 z"
								id="svg_1" />
							<path fill="#ed1c24" stroke="#222222" stroke-width="2" stroke-linejoin="round" d="M001,118 L013,094 L044,094 L056,118 L044,142 L013,142 L001,118 z"
								id="svg_5" />
							<path fill="#92278f" stroke="#222222" stroke-width="2" stroke-linejoin="round" d="M044,142 L055,118 L087,118 L099,142 L087,165 L055,165 L044,142 z"
								id="svg_6" />
							<path fill="#39b54a" stroke="#222222" stroke-width="2" stroke-linejoin="round" d="M087,071 L099,047 L131,047 L143,071 L131,095 L099,095 L087,071 z"
								id="svg_3" />
							<path fill="#25aae1" stroke="#222222" stroke-width="2" stroke-linejoin="round" d="M087,118 L099,095 L131,095 L143,118 L131,142 L099,142 L087,118 z"
								id="svg_4" />
							<path fill="#fff143" stroke="#222222" stroke-width="2" stroke-linejoin="round" d="M044,047 L056,024 L087,024 L099,047 L087,071 L056,071 L044,047 z"
								id="svg_2" />
						</g>
					</svg>
					</div>
					<div class="p-col-12 username-container">
						<h:panelGroup>
							<label>#{i18n['login.username']}</label>
							<div class="login-input">
								<p:inputText id="username" value="#{loginView.username}" />
							</div>
						</h:panelGroup>
					</div>
					<div class="p-col-12 password-container">
						<h:panelGroup>
							<label>#{i18n['login.password']}</label>
							<div class="login-input">
								<p:password id="password" value="#{loginView.password}" />
							</div>
						</h:panelGroup>
					</div>
					<div class="p-col-12 p-sm-6 p-md-6 rememberme-container">
						<p:selectBooleanCheckbox id="rememberme" />
						<label>#{i18n['login.rememberme']}</label>
					</div>

					<div class="p-col-12 p-sm-6 p-md-6 forgetpassword-container">
						<a href="#" class="forget-password">#{i18n['login.forget_password']}</a>
					</div>

					<div class="p-col-12 p-sm-6 p-md-6">
						<p:commandButton action="#{loginView.login}" value="${i18n['login.enter']}" icon="fa fa-user" update="@form growl" />
					</div>
				</div>
			</div>
		</div>
	</h:form>

	<h:outputStylesheet name="css/primeflex.css" library="roma-layout" />
	<h:outputStylesheet name="css/layout.css" library="roma-layout" />
</h:body>

</html>
