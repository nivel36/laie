<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:jsf="http://xmlns.jcp.org/jsf"
	xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:p="http://primefaces.org/ui">
<h:head>
	<title>${i18n['login.login']}</title>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
	<meta content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0' name='viewport' />
	<meta name="viewport" content="width=device-width" />
	<h:outputStylesheet name="css/flat-classic-blue/components.css" />
</h:head>
<h:body>
	<p:growl id="msg" life="10000" />
	<div class="wrapper">
		<div class="full-page login-page" data-image="/web/resources/img/loginbg.jpg">
			<div class="content">
				<h:form id="form">
					<p:panel styleClass="card-login card-hidden" header="${i18n['login.login']}">
						<div class="input-group">
							<div class="form-group label-floating">
								<p:outputLabel for="username" styleClass="control-label" value="${i18n['login.username']}" />
								<p:inputText id="username" styleClass="form-control" value="#{loginBean.username}" />
							</div>
						</div>
						<div class="input-group">
							<div class="form-group label-floating">
								<p:outputLabel for="password" styleClass="control-label" value="${i18n['login.password']}" />
								<p:password id="password" styleClass="form-control" value="#{loginBean.password}" />
							</div>
						</div>
						<p:commandButton styleClass="btn btn-primary btn-simple btn-wd btn-lg" action="#{loginBean.login}"
							value="${i18n['login.enter']}" update="msg" />
					</p:panel>
				</h:form>
			</div>
		</div>
	</div>
</h:body>
<script type="text/javascript">
login = {
	checkFullPageBackgroundImage: function(){
	    $page = $('.full-page');
	    image_src = $page.data('image');
	    if(image_src !== undefined){
	        image_container = '<div class="full-page-background" style="background-image: url(' + image_src + ') "/>'
	        $page.append(image_container);
	    }
	}
}

$().ready(function() {
    login.checkFullPageBackgroundImage();
    setTimeout(function() {
        $('.ui-panel').removeClass('card-hidden');
    }, 800)
});
</script>
</html>
