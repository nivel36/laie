<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets">

<f:view contentType="text/html" locale="#{sessionBean.locale}">
	<h:head>
		<ui:insert name="title">
			<title>#{i18n['login.login']}</title>
		</ui:insert>
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
		<h:outputStylesheet name="css/login.css" />
	</h:head>
	<h:body>
		<h:form id="loginForm" prependId="false">
			<h1>Login</h1>
			<h:outputLabel value="#{i18n['login.username']}"
				styleClass="required">
				<h:inputText id="j_username" label="#{i18n['login.username']}"
					required="true" value="#{loginBean.username}"
					styleClass="#{not component.valid ? 'inputError' : ''}" />
				<h:message for="j_username" errorClass="error" />
			</h:outputLabel>
			<h:outputLabel value="#{i18n['login.password']}"
				styleClass="required">
				<h:inputSecret id="j_password" label="#{i18n['login.password']}"
					required="true" value="#{loginBean.password}"
					styleClass="#{not component.valid ? 'inputError' : ''}" />
				<h:message for="j_password" errorClass="error" />
			</h:outputLabel>
			<h:commandButton action="#{loginBean.login}"
				value="#{i18n['login.enter']}" />
		</h:form>
	</h:body>
</f:view>
</html>
