<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html" xmlns:i18n="http://ged.com/i18n"
	xmlns:p="http://primefaces.org/ui" xmlns:cc="http://xmlns.jcp.org/jsf/composite/components">

<h:head>
	<title>${i18n['login.login']}</title>
	<meta http-equiv="content-type" content="text/html;charset=UTF-8" />
	<meta name="viewport" content="width=device-width,maximum-scale=2" />
	<h:outputStylesheet name="css/reset.css" />
	<h:outputStylesheet name="css/flat-classic-blue/components.css" />
</h:head>
<h:body>
	<p:growl id="msg" sticky="true" />
	<div class="full-page login-page">
		<div class="content">
			<h:form>
				<div class="login panel dialog">
					<div class="panel-header">
						<div class="panel-header-title">${i18n['login.login']}</div>
					</div>
					<div class="panel-content panel-content-data">
						<cc:inputText id="username" labelIcon="fa-user" value="#{loginBean.username}" />
						<cc:inputPassword id="password" labelIcon="fa-lock" value="#{loginBean.password}" />
					</div>
					<div class="panel-footer">
						<div class="panel-buttons">
							<p:commandButton action="#{loginBean.login}" value="${i18n['login.enter']}" />
						</div>
					</div>
				</div>
			</h:form>
		</div>
	</div>
</h:body>
</html>
