<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml" 
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core" 
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" 
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:g="http://ged.org/ui" 
	xmlns:h="http://java.sun.com/jsf/html" 
	xmlns:o="http://omnifaces.org/ui"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://java.sun.com/jsf/facelets">

<h:head>
	<title>${i18n['login.login']}</title>
	<meta http-equiv="content-type" content="text/html;charset=UTF-8" />
	<meta name="viewport" content="width=device-width,maximum-scale=2" />
	<h:outputStylesheet name="css/reset.css" />
	<h:outputStylesheet name="css/flat-classic-blue/components.css" />
</h:head>

<h:body>
	<p:growl id="growl" globalOnly="true" />
	<div class="full-page login-page">
		<div class="content">
			<h:form>
				<div class="login panel dialog">
					<div class="panel-header">
						<div class="panel-header-title">${i18n['login.login']}</div>
					</div>
					<div class="panel-content panel-content-data grid">
						<div class="col-12">
							<g:input id="username" icon="fa-user" value="#{loginView.username}" required="true" />
							<g:input id="password" icon="fa-lock" value="#{loginView.password}" required="true" type="password"/>
						</div>
					</div>
					<div class="panel-footer">
						<div class="panel-buttons">
							<p:commandButton action="#{loginView.login}" value="${i18n['login.enter']}" update="@form growl" />
						</div>
					</div>
				</div>
			</h:form>
		</div>
	</div>
</h:body>
</html>
