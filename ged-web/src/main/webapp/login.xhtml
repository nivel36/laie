<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:p="http://primefaces.org/ui">
<h:head>
	<title>${i18n['login.login']}</title>
	<meta http-equiv="content-type" content="text/html;charset=UTF-8" />
	<meta name="viewport" content="width=device-width,maximum-scale=2" />
	<h:outputStylesheet name="css/reset.css" />
	<h:outputStylesheet name="css/flat-classic-blue/components.css" />
</h:head>
<h:body>
	<p:growl id="msg" sticky="true" />
	<div class="full-page login-page">
		<div class="content">
			<h:form>
				<div class="login dialog purple">
					<div class="dialog-header">
						<h2>${i18n['login.login']}</h2>
					</div>
					<div class="dialog-content">
						<div class="input-text input-group">
							<span class="input-group-addon"><em class="fa fa-user" /></span>
							<p:inputText id="username" value="#{loginBean.username}" />
						</div>
						<div class="input-text input-group">
							<span class="input-group-addon"><em class="fa fa-lock" /></span>
							<p:password id="password" value="#{loginBean.password}" />
						</div>
					</div>
					<div class="dialog-footer">
						<p:commandButton action="#{loginBean.login}" value="${i18n['login.enter']}" />
					</div>
				</div>
			</h:form>
		</div>
	</div>
</h:body>
</html>
