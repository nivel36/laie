<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" 
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core" 
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" 
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:g="http://ged.org/ui" 
	xmlns:h="http://java.sun.com/jsf/html" 
	xmlns:o="http://omnifaces.org/ui"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['job.search_results']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="index" />

	<ui:define name="content">
		<cc:users users="#{globalSearchView.users}" rendered="#{not empty globalSearchView.users}"></cc:users>
		<cc:jobOffers jobOffers="#{globalSearchView.jobOffers}" rendered="#{not empty globalSearchView.jobOffers}"></cc:jobOffers>
		<cc:candidates candidates="#{globalSearchView.candidates}" rendered="#{not empty globalSearchView.candidates}"></cc:candidates>
		<cc:clients clients="#{globalSearchView.clients}" rendered="#{not empty globalSearchView.clients}"></cc:clients>
	</ui:define>
</ui:composition>
