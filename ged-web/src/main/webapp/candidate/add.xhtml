<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" 
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core" 
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" 
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:g="http://ged.org/ui" 
	xmlns:h="http://java.sun.com/jsf/html" 
	xmlns:o="http://omnifaces.org/ui"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['candidate.new_candidate']}</title>
	</ui:define>

	<ui:define name="breadcrumb">
		<p:breadCrumb styleClass="breadcrumb">
			<p:menuitem value="#{i18n['menu.index']}" outcome="#{Page.INDEX.getUrl()}" />
			<p:menuitem value="#{i18n['candidate.candidates']}" outcome="#{Page.CANDIDATE_SEARCH.getUrl()}" />
			<p:menuitem value="#{i18n['candidate.new_candidate']}" disabled="true" />
		</p:breadCrumb>
	</ui:define>

	<ui:define name="content">
		<div class="grid">
			<div class="col-12 xl-9">
				<h:form id="candidateForm">
					<div class="panel">
						<div class="panel-aside">
							<div class="column candidate-metadata">
								<cc:inputAvatar id="candidate_image" value="#{addCandidateView.candidate.imageFileName}"
									fileUploadListener="#{addCandidateView.uploadImage}" />
								<div class="candidate-rating" style="text-align: center;">
									<p:rating value="#{addCandidateView.candidate.rating}" cancel="false">
										<p:ajax event="rate" listener="#{addCandidateView.onrate}" update="" />
									</p:rating>
								</div>
								<cc:inputTag value="#{addCandidateView.tags}" completeMethod="#{addCandidateView.queryTags}" />
							</div>
						</div>
						<div class="panel-content panel-content-data">
							<div class="grid">
								<div class="col-12 sm-6">
									<h4>#{i18n['candidate.personal_information']}</h4>

									<g:input id="name" label="#{i18n['candidate.name']}" value="#{addCandidateView.candidate.name}"
										required="true" />

									<g:input id="surname" label="#{i18n['candidate.surname']}" value="#{addCandidateView.candidate.surname}"
										required="true" />

									<g:input id="born_date" label="#{i18n['candidate.bornDate']}"
										value="#{addCandidateView.candidate.bornDate}" yearRange="c-100:c0" type="calendar"/>

									<g:input id="city" label="#{i18n['candidate.city']}" value="#{addCandidateView.candidate.address.city}" />

									<g:input id="state" label="#{i18n['candidate.state']}" value="#{addCandidateView.candidate.address.state}" />
								</div>

								<div class="col-12 sm-6">
									<h4>#{i18n['candidate.contact_information']}</h4>

									<g:input id="phone_number" label="#{i18n['candidate.phone_number']}"
										value="#{addCandidateView.candidate.phoneNumber}" styleClass="small" />

									<g:input id="email" label="#{i18n['candidate.email']}" value="#{addCandidateView.candidate.email}" />

									<g:input id="skype" label="#{i18n['candidate.skype']}" value="#{addCandidateView.candidate.skype}" />

									<g:input id="linkedin" label="#{i18n['candidate.linkedin']}"
										value="#{addCandidateView.candidate.linkedinProfileUrl}" />
								</div>


								<div class="col-12 sm-6">
									<h4>#{i18n['candidate.job_information']}</h4>

									<g:input id="jobProfile" label="#{i18n['candidate.jobProfile']}"
										value="#{addCandidateView.candidate.jobProfile}" required="true" />

									<cc:inputSelect label="#{i18n['candidate.origin']}" value="#{addCandidateView.candidate.origin}" other="true">
										<f:selectItems value="#{origins.list}" var="origin" itemValue="#{origin.code}"
											itemLabel="#{g:translate(origin.code)}" />
									</cc:inputSelect>

									<g:input id="salary" label="#{i18n['candidate.salary']}" value="#{addCandidateView.candidate.salary}"
										type="money" />

									<g:input id="expected_salary" label="#{i18n['candidate.expected_salary']}"
										value="#{addCandidateView.candidate.expectedSalary}" type="money" />
								</div>
							</div>
						</div>

						<div class="panel-footer">
							<div class="panel-buttons">
								<p:button styleClass="btn-gray" value="#{i18n['action.cancel']}" outcome="#{Page.CANDIDATE_SEARCH.getUrl()}" />
								<p:commandButton value="#{i18n['action.save']}" action="#{addCandidateView.save}" process="@form"
									update="@form growl" />
							</div>
						</div>
					</div>
				</h:form>
			</div>
		</div>
	</ui:define>
</ui:composition>
