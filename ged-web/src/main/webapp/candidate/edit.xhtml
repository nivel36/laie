<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" 
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" 
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:g="http://ged.org/ui"
	xmlns:h="http://java.sun.com/jsf/html" 
	xmlns:o="http://omnifaces.org/ui" 
	xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" 
	xmlns:ui="http://java.sun.com/jsf/facelets" 
	template="/WEB-INF/templates/template.xhtml">

	<ui:define name="title">
		#{i18n['candidate.candidate_edit']} - #{editCandidateView.candidate.fullName}
	</ui:define>
	
	<ui:param name="selectedMenu" value="candidates" />

	<ui:define name="breadcrumb">
		<p:breadCrumb>
			<p:menuitem value="#{i18n['menu.index']}" outcome="#{Page.INDEX.getUrl()}" />
			<p:menuitem value="#{i18n['candidate.candidates']}" outcome="#{Page.CANDIDATE_SEARCH.getUrl()}" />
			<p:menuitem value="#{editCandidateView.candidate.fullName}" outcome="#{Page.CANDIDATE.getUrl()}">
				<f:param name="id" value="#{editCandidateView.candidate.uid}" />
			</p:menuitem>
			<p:menuitem value="#{i18n['action.edit']}" disabled="true" />
		</p:breadCrumb>
	</ui:define>
	
	<ui:define name="buttons">
		<h:form>
			<p:button value="#{i18n['action.cancel']}" outcome="#{Page.CANDIDATE.getUrl()}" styleClass="secondary-button" >
				<f:param name="id" value="#{editCandidateView.candidate.uid}" />
			</p:button>
			<p:commandButton value="#{i18n['action.save']}" onclick="save()" styleClass="success-button" />
		</h:form>
	</ui:define>

	<ui:define name="content">
	
		<h:form id="candidateForm">
			<p:remoteCommand name="save" process="@form" update="@form growl" action="#{editCandidateView.save}" />
			<div class="p-grid">
				<div class="p-col-12 p-xl-6">
					<div class="card card-w-title ui-fluid">
						<h5>#{i18n['candidate.personal_information']}</h5>
						<div class="p-formgrid p-grid">
							<div class="p-col-12 p-sm-6">
								<g:input id="name" label="#{i18n['candidate.name']}" value="#{editCandidateView.candidate.name}" required="true" />
							</div>
							<div class="p-col-12 p-sm-6">
								<g:input id="surname" label="#{i18n['candidate.surname']}" value="#{editCandidateView.candidate.surname}" required="true" />
							</div>
							<div class="p-col-12 p-sm-6">
								<g:input id="city" label="#{i18n['candidate.city']}" value="#{editCandidateView.candidate.address.city}" />
							</div>
							<div class="p-col-12 p-sm-6">
								<g:input id="state" label="#{i18n['candidate.state']}" value="#{editCandidateView.candidate.address.region}" />
							</div>
							<div class="p-col-12 p-sm-6">
								<g:input id="born_date" label="#{i18n['candidate.bornDate']}" value="#{editCandidateView.candidate.bornDate}" yearRange="c-100:c-15" type="calendar" />
							</div>
						</div>
					</div>
				</div>
				<div class="p-col-12 p-xl-6">
					<div class="card card-w-title ui-fluid">
						<h5>#{i18n['candidate.contact_information']}</h5>
						<div class="p-formgrid p-grid">
							<div class="p-col-12 p-sm-6">
								<g:input id="email" label="#{i18n['candidate.email']}" value="#{editCandidateView.candidate.email}" />
							</div>
							<div class="p-col-12 p-sm-6"></div>
							<div class="p-col-12 p-sm-6">
								<g:input id="phone_number" label="#{i18n['candidate.phone_number']}" value="#{editCandidateView.candidate.phoneNumber}" styleClass="small" />
							</div>
							<div class="p-col-12 p-sm-6"></div>
							<div class="p-col-12 p-sm-6">
								<g:input id="linkedin" label="#{i18n['candidate.linkedin']}" value="#{editCandidateView.candidate.linkedinProfileUrl}" />
							</div>
							<div class="p-col-12 p-sm-6">
								<g:input id="skype" label="#{i18n['candidate.skype']}" value="#{editCandidateView.candidate.skype}" />
							</div>
						</div>
					</div>
				</div>
				<div class="p-col-12 p-xl-6">
					<div class="card card-w-title ui-fluid">
						<h5>#{i18n['candidate.job_information']}</h5>
						<div class="p-formgrid p-grid">
							<div class="p-col-12 p-sm-6">
								<g:input id="jobProfile" label="#{i18n['candidate.jobProfile']}" value="#{editCandidateView.candidate.jobProfile}" required="true" />
							</div>
							<div class="p-col-12 p-sm-6"></div>
							<div class="p-col-12 p-sm-6">
								<g:input id="salary" label="#{i18n['candidate.salary']}" value="#{editCandidateView.candidate.salary}" type="money" />
							</div>
							<div class="p-col-12 p-sm-6">
								<g:input id="expected_salary" label="#{i18n['candidate.expected_salary']}" value="#{editCandidateView.candidate.expectedSalary}" type="money" />
							</div>
						</div>
					</div>
				</div>
				<div class="p-col-12 p-xl-6">
					<div class="card card-w-title ui-fluid">
						<h5>#{i18n['candidate.other_data']}</h5>
						<div class="p-formgrid p-grid">
							<div class="p-col-12 p-sm-6">
								<div class="input-group">
									<div class="label-container">
										<p:outputLabel id="rating_label" for="rating" value="#{i18n['candidate.rating']}" />
									</div>
									<p:rating id="rating" value="#{editCandidateView.candidate.rating}" cancel="false">
										<p:ajax event="rate" listener="#{editCandidateView.onrate}" update="" />
									</p:rating>
								</div>
							</div>
							<div class="p-col-12 p-sm-6">
								<g:input type="selectOneMenu" label="#{i18n['candidate.origin']}" value="#{editCandidateView.candidate.origin}">
									<f:selectItems value="#{origins.list}" var="origin" itemValue="#{origin}" itemLabel="#{i18n[origin.code]}" />
								</g:input>
							</div>
							<div class="p-col-12">
								<div class="input-group">
									<div class="label-container">
										<p:outputLabel id="tags_label" for="tags" value="#{i18n['candidate.tags']}" />
									</div>
									<p:chips id="tags" value="#{editCandidateView.tags}" required="#{required}" styleClass="input input-chips" completeMethod="#{editCandidateView.queryTags}">
										<f:converter converterId="tagConverter" for="tags" />
									</p:chips>
								</div>
							</div>
						</div>
					</div>
				</div>
				<div class="p-col-12 p-xl-6">
					<div class="card ui-fluid">
						<div class="p-grid">
							<div class="p-col-12 p-xl-6">
								<cc:inputAvatar id="candidate_image" value="#{editCandidateView.candidate.picture}" fileUploadListener="#{editCandidateView.uploadImage}" />
							</div>
						</div>
					</div>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
