<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" xmlns:f="http://java.sun.com/jsf/core" xmlns:g="http://ged.org/ui"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" xmlns:ui="http://java.sun.com/jsf/facelets" template="/WEB-INF/templates/template.xhtml">

	<ui:define name="title">
		#{i18n['candidate.candidate_edit']} - #{editCandidateView.candidate.fullName}
	</ui:define>

	<ui:define name="breadcrumb">
		<p:breadCrumb>
			<p:menuitem value="#{i18n['menu.index']}" outcome="#{Page.INDEX.getUrl()}" />
			<p:menuitem value="#{i18n['candidate.candidates']}" outcome="#{Page.CANDIDATE_SEARCH.getUrl()}" />
			<p:menuitem value="#{editCandidateView.candidate.fullName}" outcome="#{Page.CANDIDATE.getUrl()}">
				<f:param name="id" value="#{editCandidateView.candidate.id}" />
			</p:menuitem>
			<p:menuitem value="#{i18n['action.edit']}" disabled="true" />
		</p:breadCrumb>
	</ui:define>

	<ui:define name="content">
		<h:form id="candidateForm">
			<div class="p-grid">
				<div class="p-col-12 p-xl-8">
					<div class="card-aside">
						<cc:inputAvatar id="candidate_image" value="#{editCandidateView.candidate.imageFileName}"
							fileUploadListener="#{editCandidateView.uploadImage}" />
						<div class="candidate-rating" style="text-align: center;">
							<p:rating value="#{editCandidateView.candidate.rating}" cancel="false">
								<p:ajax event="rate" listener="#{editCandidateView.onrate}" update="" />
							</p:rating>
						</div>
					</div>
					<div class="card">
						<div class="p-grid">
							<div class="p-col-12 p-xl-6">
								<h4>#{i18n['candidate.personal_information']}</h4>

								<div class="form-field ui-fluid">
									<g:input id="name" label="#{i18n['candidate.name']}" value="#{editCandidateView.candidate.name}" required="true" />

									<g:input id="surname" label="#{i18n['candidate.surname']}" value="#{editCandidateView.candidate.surname}" required="true" />

									<g:input id="born_date" label="#{i18n['candidate.bornDate']}" value="#{editCandidateView.candidate.bornDate}"
										yearRange="c-100:c-15" type="calendar" />

									<g:input id="city" label="#{i18n['candidate.city']}" value="#{editCandidateView.candidate.address.city}" />

									<g:input id="state" label="#{i18n['candidate.state']}" value="#{editCandidateView.candidate.address.state}" />
								</div>
							</div>

							<div class="p-col-12 p-xl-6">
								<h4>#{i18n['candidate.contact_information']}</h4>

								<div class="form-field ui-fluid">

									<g:input id="phone_number" label="#{i18n['candidate.phone_number']}" value="#{editCandidateView.candidate.phoneNumber}"
										styleClass="small" />

									<g:input id="email" label="#{i18n['candidate.email']}" value="#{editCandidateView.candidate.email}" />

									<g:input id="skype" label="#{i18n['candidate.skype']}" value="#{editCandidateView.candidate.skype}" />

									<g:input id="linkedin" label="#{i18n['candidate.linkedin']}" value="#{editCandidateView.candidate.linkedinProfileUrl}" />
								</div>
							</div>

							<div class="p-col-12 p-xl-6">
								<h4>#{i18n['candidate.job_information']}</h4>
								<div class="form-field ui-fluid">

									<g:input id="jobProfile" label="#{i18n['candidate.jobProfile']}" value="#{editCandidateView.candidate.jobProfile}" required="true" />

									<cc:inputSelect label="#{i18n['candidate.origin']}" value="#{editCandidateView.candidate.origin}" other="true">
										<f:selectItems value="#{origins.list}" var="origin" itemValue="#{origin.code}" itemLabel="#{g:translate(origin.code)}" />
									</cc:inputSelect>

									<g:input id="salary" label="#{i18n['candidate.salary']}" value="#{editCandidateView.candidate.salary}" type="money" />

									<g:input id="expected_salary" label="#{i18n['candidate.expected_salary']}" value="#{editCandidateView.candidate.expectedSalary}"
										type="money" />
								</div>
							</div>
							<div class="p-col-12 ">
								<h4>#{i18n['candidate.tags']}</h4>
								<div class="form-field ui-fluid">
									<p:chips id="tags" value="#{editCandidateView.tags}" required="#{required}" styleClass="input input-chips"
										completeMethod="#{editCandidateView.queryTags}">
										<f:converter converterId="tagConverter" for="tags" />
									</p:chips>
								</div>
							</div>

							<div class="p-col-12 ">
								<div class="buttons">
									<p:button value="#{i18n['action.cancel']}" outcome="#{Page.CANDIDATE.getUrl()}" styleClass="secondary-button">
										<f:param name="id" value="#{editCandidateView.candidate.id}" />
									</p:button>
									<p:commandButton value="#{i18n['action.save']}" action="#{editCandidateView.save}" process="@form" update="@form growl"
										styleClass="" />
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
