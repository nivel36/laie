<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core" xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:g="http://ged.org/ui" xmlns:h="http://java.sun.com/jsf/html" xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" xmlns:ui="http://java.sun.com/jsf/facelets" template="/WEB-INF/templates/template.xhtml">

	<ui:define name="title">
		#{i18n['education.education']}
	</ui:define>

	<ui:define name="breadcrumb">
		<p:breadCrumb>
			<p:menuitem value="#{i18n['menu.index']}" outcome="#{Page.INDEX.getUrl()}" />
			<p:menuitem value="#{i18n['candidate.candidates']}" outcome="#{Page.CANDIDATE_SEARCH.getUrl()}" />
			<p:menuitem value="#{educationView.curriculum.candidate.fullName}" outcome="#{Page.CANDIDATE.getUrl()}">
				<f:param name="id" value="#{educationView.curriculum.candidate.uid}" />
			</p:menuitem>
			<p:menuitem value="#{i18n['curriculum.curriculum']}" outcome="#{Page.CURRICULUM.getUrl()}">
				<f:param name="candidateId" value="#{educationView.curriculum.candidate.uid}" />
				<f:param name="id" value="#{educationView.curriculum.uid}" />
			</p:menuitem>
			<p:menuitem value="#{i18n['education.education']}" disabled="true" />
		</p:breadCrumb>
	</ui:define>

	<ui:define name="buttons">
		<h:form>
			<p:button value="#{i18n['action.cancel']}" outcome="#{Page.CURRICULUM.getUrl()}" styleClass="secondary-button">
				<f:param name="candidateId" value="#{educationView.curriculum.candidate.uid}" />
				<f:param name="id" value="#{educationView.curriculum.uid}" />
			</p:button>
			<p:commandButton value="#{i18n['action.delete']}" action="#{educationView.delete}" process="@this" rendered="#{not educationView.newEducation}" styleClass="danger-btn">
				<p:confirm message="#{i18n['education.message.remove']}" icon="fa fa-exclamation-triangle" />
			</p:commandButton>
			<p:commandButton value="#{i18n['action.save']}" onclick="processForm()" styleClass="success-btn" />
		</h:form>
	</ui:define>

	<ui:define name="content">
		<h:form id="education">
			<p:remoteCommand name="processForm" process="@form" update="@form growl" action="#{educationView.save}" />
			<div class="p-grid">
				<div class="p-col-12 p-xl-6">
					<div class="card ui-fluid">
						<div class="p-grid">
							<div class="p-col-12 p-sm-6">
								<g:input id="degree" label="#{i18n['education.degree']}" value="#{educationView.education.degree}" required="true" />
							</div>
							<div class="p-col-12 p-sm-6">
								<g:input id="school" label="#{i18n['education.school']}" value="#{educationView.education.school}" required="true" />
							</div>
							<div class="p-col-12 p-sm-4">
								<g:input type="inputSelect" id="fromDate" label="#{i18n['education.from_date']}" value="#{educationView.education.startYear}">
									<f:selectItem itemLabel="#{i18n['date.year']}" itemValue="" />
									<f:selectItems var="year" value="#{educationView.years}" itemValue="#{year}" itemLabel="#{year}" />
								</g:input>
							</div>
							<div class="p-col-12 p-sm-4">
								<h:panelGroup layout="block" id="toDateWrapper">
									<g:input type="inputSelect" id="toDate" label="#{i18n['education.to_date']}" value="#{educationView.education.endYear}" rendered="#{not educationView.education.stillStudying}">
										<f:selectItem itemLabel="#{i18n['date.year']}" itemValue="" />
										<f:selectItems var="year" value="#{educationView.years}" itemValue="#{year}" itemLabel="#{year}" />
									</g:input>
								</h:panelGroup>
							</div>
							<div class="p-col-12 p-sm-4">
								<g:input id="still" label="#{i18n['job.still_working']}" value="#{educationView.education.stillStudying}" type="checkbox">
									<f:ajax event="change" render="education:toDateWrapper" />
								</g:input>
							</div>
							<div class="p-col-12">
								<g:input id="description" label="#{i18n['education.description']}" value="#{educationView.education.description}" type="textarea" />
							</div>
						</div>
					</div>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
