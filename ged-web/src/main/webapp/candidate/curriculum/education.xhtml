<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:i18n="http://ged.com/i18n" xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:p="http://primefaces.org/ui" xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" xmlns:o="http://omnifaces.org/ui"
	xmlns:of="http://omnifaces.org/functions" template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['education.education']}</title>
	</ui:define>

	<ui:define name="breadcrumb">
		<p:breadCrumb styleClass="breadcrumb">
			<p:menuitem value="#{i18n['menu.index']}" outcome="#{Page.INDEX.getUrl()}" />
			<p:menuitem value="#{i18n['candidate.candidates']}" outcome="#{Page.CANDIDATE_SEARCH.getUrl()}" />
			<p:menuitem value="#{educationView.curriculum.candidate.fullName}" outcome="#{Page.CANDIDATE.getUrl()}">
				<f:param name="id" value="#{educationView.curriculum.candidate.id}" />
			</p:menuitem>
			<p:menuitem value="#{i18n['curriculum.curriculum']}" outcome="#{Page.CURRICULUM.getUrl()}">
				<f:param name="id" value="#{educationView.curriculum.candidate.id}" />
			</p:menuitem>
			<p:menuitem value="#{i18n['education.education']}" disabled="true" />
		</p:breadCrumb>
	</ui:define>

	<ui:define name="content">
		<h:form id="education">
			<div class="grid nogutter">
				<div class="panel curriculum col-12 xl-8">
					<div class="panel-content">
						<div class="panel-content-data">
							<cc:input id="degree" label="#{i18n['education.degree']}" value="#{educationView.education.degree}" required="true" />

							<cc:input id="school" label="#{i18n['education.school']}" value="#{educationView.education.school}" required="true" />

							<cc:inputSelect id="fromDate" label="#{i18n['education.from_date']}" value="#{educationView.education.startYear}">
								<f:selectItem itemLabel="#{i18n['date.year']}" itemValue="" />
								<f:selectItems var="year" value="#{educationView.years}" itemValue="#{year}" itemLabel="#{year}" />
							</cc:inputSelect>

							<h:panelGroup layout="block" id="toDateWrapper">
								<cc:inputSelect id="toDate" label="#{i18n['education.to_date']}" value="#{educationView.education.endYear}"
									rendered="#{not educationView.education.stillStudying}">
									<f:selectItem itemLabel="#{i18n['date.year']}" itemValue="" />
									<f:selectItems var="year" value="#{educationView.years}" itemValue="#{year}" itemLabel="#{year}" />
								</cc:inputSelect>
							</h:panelGroup>

							<cc:input id="still" label="#{i18n['job.still_working']}" value="#{jobExperienceBean.stillWorking}" type="checkbox" >
								<f:ajax event="change" render="jobExperience:toDateWrapper" />
							</cc:input>

							<cc:input id="description" label="#{i18n['education.description']}" value="#{educationView.education.description}" type="textarea" />
						</div>
					</div>

					<div class="panel-footer">
						<div class="panel-buttons">
							<p:button value="#{i18n['action.cancel']}" outcome="#{Page.CURRICULUM.getUrl()}" styleClass="btn-gray">
								<f:param name="id" value="#{educationView.curriculum.candidate.id}" />
							</p:button>
							<p:commandButton value="#{i18n['action.delete']}" action="#{educationView.delete}" process="@this"
								rendered="#{not educationView.newEducation}" />
							<p:commandButton value="#{i18n['action.save']}" action="#{educationView.save}" process="@form" update="@form" />
						</div>
					</div>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
