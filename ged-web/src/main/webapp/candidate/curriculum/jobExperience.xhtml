<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:i18n="http://ged.com/i18n" xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:p="http://primefaces.org/ui" xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" xmlns:o="http://omnifaces.org/ui"
	xmlns:of="http://omnifaces.org/functions" template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['job_experience.job_experience']}</title>
	</ui:define>

	<ui:define name="content">
		<p:breadCrumb styleClass="breadcrumb">
			<p:menuitem value="#{i18n['menu.index']}" outcome="#{Page.INDEX.getUrl()}" />
			<p:menuitem value="#{i18n['candidate.candidates']}" outcome="#{Page.CANDIDATE_SEARCH.getUrl()}" />
			<p:menuitem value="#{jobExperienceBean.jobExperience.curriculum.candidate.fullName}" outcome="#{Page.CANDIDATE.getUrl()}">
				<f:param name="id" value="#{jobExperienceBean.jobExperience.curriculum.candidate.id}" />
			</p:menuitem>
			<p:menuitem value="#{i18n['curriculum.curriculum']}" outcome="#{Page.CURRICULUM.getUrl()}">
				<f:param name="id" value="#{jobExperienceBean.jobExperience.curriculum.candidate.id}" />
			</p:menuitem>
			<p:menuitem value="#{i18n['job_experience.job_experience']}" disabled="true" />
		</p:breadCrumb>

		<h:form id="jobExperience">
			<div class="grid nogutter">
				<div class="panel curriculum col-12 xl-8">
					<div class="panel-header">
						<div class="panel-header-title">#{i18n['job_experience.job_experience']}</div>
					</div>
					<div class="panel-content">
						<div class="panel-content-data">
							<cc:inputText id="degree" label="#{i18n['job_experience.company_name']}" value="#{jobExperienceBean.jobExperience.companyName}"
								required="true" />

							<cc:inputText id="jobPosition" label="#{i18n['job_experience.job_position']}" value="#{jobExperienceBean.jobExperience.jobPosition}"
								required="true" />

							<cc:inputYearMonth id="fromDate" label="#{i18n['job.from_date']}" value="#{jobExperienceBean.fromDate}" />

							<h:panelGroup layout="block" id="toDateWrapper">
								<cc:inputYearMonth id="toDate" label="#{i18n['job.to_date']}" value="#{jobExperienceBean.toDate}"
									rendered="#{not jobExperienceBean.stillWorking}" />
							</h:panelGroup>

							<cc:inputCheckbox id="still" label="#{i18n['job.still_working']}" value="#{jobExperienceBean.stillWorking}">
								<f:ajax event="change" render="jobExperience:toDateWrapper" />
							</cc:inputCheckbox>

							<cc:richText id="description" label="#{i18n['job_experience.description']}" value="#{jobExperienceBean.jobExperience.description}" />
						</div>
					</div>

					<div class="panel-footer">
						<div class="panel-buttons">
							<p:button value="#{i18n['action.cancel']}" outcome="#{Page.CURRICULUM.getUrl()}" styleClass="btn-gray">
								<f:param name="id" value="#{jobExperienceBean.jobExperience.curriculum.candidate.id}" />
							</p:button>
							<p:commandButton value="#{i18n['action.delete']}" action="#{jobExperienceBean.delete}" process="@this"
								rendered="#{not jobExperienceBean.newJobExperience}" />
							<p:commandButton value="#{i18n['action.save']}" action="#{jobExperienceBean.save}" process="@form" update="@form" />
						</div>
					</div>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
