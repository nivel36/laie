<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core" xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:g="http://ged.org/ui" xmlns:h="http://java.sun.com/jsf/html" xmlns:o="http://omnifaces.org/ui"
	xmlns:p="http://primefaces.org/ui" xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" xmlns:ui="http://java.sun.com/jsf/facelets"
	template="/WEB-INF/templates/template.xhtml">

	<ui:define name="title">
		#{i18n['skill.skills']}
	</ui:define>

	<ui:define name="breadcrumb">
		<p:breadCrumb>
			<p:menuitem value="#{i18n['menu.index']}" outcome="#{Page.INDEX.getUrl()}" />
			<p:menuitem value="#{i18n['candidate.candidates']}" outcome="#{Page.CANDIDATE_SEARCH.getUrl()}" />
			<p:menuitem value="#{exportCurriculumView.curriculum.candidate.fullName}" outcome="#{Page.CANDIDATE.getUrl()}">
				<f:param name="id" value="#{exportCurriculumView.curriculum.candidate.uid}" />
			</p:menuitem>
			<p:menuitem value="#{i18n['curriculum.curriculum']}" outcome="#{Page.CURRICULUM.getUrl()}">
				<f:param name="candidateId" value="#{exportCurriculumView.curriculum.candidate.uid}" />
				<f:param name="id" value="#{exportCurriculumView.curriculum.uid}" />
			</p:menuitem>
			<p:menuitem value="#{i18n['skill.skills']}" disabled="true" />
		</p:breadCrumb>
	</ui:define>

	<ui:define name="buttons">
		<h:form>
			<p:button value="#{i18n['action.back']}" outcome="#{Page.CURRICULUM.getUrl()}" styleClass="secondary-button">
				<f:param name="candidateId" value="#{exportCurriculumView.curriculum.candidate.uid}" />
				<f:param name="id" value="#{exportCurriculumView.curriculum.uid}" />
			</p:button>
		</h:form>
	</ui:define>

	<ui:define name="content">
		<h:form>
			<div class="p-grid">
				<ui:repeat var="template" value="#{exportCurriculumView.templates}">
					<div class="p-col-12 p-xl-6">
						<div class="card card-w-title ui-fluid">
							<p:commandButton value="export" action="#{exportCurriculumView.export(documentTemplate)}" />
						</div>
					</div>
				</ui:repeat>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
