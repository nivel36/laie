<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" 
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core" 
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" 
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:g="http://ged.org/ui" 
	xmlns:h="http://java.sun.com/jsf/html" 
	xmlns:o="http://omnifaces.org/ui"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['skill.skills']}</title>
	</ui:define>

	<ui:define name="content">
		<h:form>
			<div class="grid">
				<div class="col-12">
					<div class="form-group">
						<p:outputLabel value="#{i18n['skill.skill']}" />
						<div class="inputgroup">
							<p:input id="skill" value="#{skillsView.skillName}" />
							<p:commandButton id="addSkill" action="#{skillsView.addSkill}" process="@form" update="@form" styleClass="btn-green" icon="fa fa-plus" />
						</div>
						<p:message for="skill" />
					</div>
				</div>
				<div class="col-12">
					<p:chips value="#{skillsView.skills}" converter="skillConverter" disabled="true" />
				</div>
				<div class="col-12">
					<div class="form-action-primary">
						<p:commandButton styleClass="btn-gray" value="#{i18n['action.close']}" process="@this" update="@form" />
					</div>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
