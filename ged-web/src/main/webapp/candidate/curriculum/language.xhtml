<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core" xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:g="http://ged.org/ui" xmlns:h="http://java.sun.com/jsf/html" xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" xmlns:ui="http://java.sun.com/jsf/facelets" template="/WEB-INF/templates/template.xhtml">

	<ui:define name="title">
		#{i18n['language.language']}
	</ui:define>

	<ui:define name="breadcrumb">
		<p:breadCrumb>
			<p:menuitem value="#{i18n['menu.index']}" outcome="#{Page.INDEX.getUrl()}" />
			<p:menuitem value="#{i18n['candidate.candidates']}" outcome="#{Page.CANDIDATE_SEARCH.getUrl()}" />
			<p:menuitem value="#{languageView.curriculum.candidate.fullName}" outcome="#{Page.CANDIDATE.getUrl()}">
				<f:param name="id" value="#{languageView.curriculum.candidate.uid}" />
			</p:menuitem>
			<p:menuitem value="#{i18n['curriculum.curriculum']}" outcome="#{Page.CURRICULUM.getUrl()}">
				<f:param name="id" value="#{languageView.curriculum.uid}" />
				<f:param name="candidateId" value="#{languageView.curriculum.candidate.uid}" />
			</p:menuitem>
			<p:menuitem value="#{i18n['language.language']}" disabled="true" />
		</p:breadCrumb>
	</ui:define>

	<ui:define name="buttons">
		<h:form>
			<p:button value="#{i18n['action.back']}" outcome="#{Page.CURRICULUM.getUrl()}" styleClass="secondary-button">
				<f:param name="id" value="#{languageView.curriculum.uid}" />
				<f:param name="candidateId" value="#{languageView.curriculum.candidate.uid}" />
			</p:button>
			<p:commandButton value="#{i18n['action.save']}" onclick="save()" styleClass="susccess-button" />
		</h:form>
	</ui:define>

	<ui:define name="content">
		<h:form id="language">
			<p:remoteCommand name="save" process="@this language:languages" update="growl language:languages" action="#{languageView.save}" />
			<div class="p-grid">
				<div class="p-col-12 p-xl-6">
					<div class="card ui-fluid">
						<h:panelGroup styleClass="language section" id="languages" layout="block">
							<ui:repeat var="language" value="#{languageView.languages}">
								<div class="p-grid">
									<div class="p-col-5">
										<g:input id="input-text" value="#{language.name}" required="true" styleClass="input input-text" />
									</div>
									<div class="p-col-5">
										<p:selectOneMenu id="level" required="true" styleClass="input input-select" value="#{language.level}">
											<f:selectItem />
											<f:selectItems value="#{languageView.languageLevels}" var="languageLevel" itemValue="#{languageLevel}" itemLabel="#{i18n[languageLevel]}" />
										</p:selectOneMenu>
										<div class="message-container">
											<p:message id="message" for="input-text" styleClass="message-error" />
										</div>
									</div>
									<div class="p-col-2">
										<p:commandButton icon="fa fa-trash" action="#{languageView.deleteLanguage(language)}" process="@this" update="language:languages" styleClass="danger-btn">
											<p:confirm message="#{i18n['language.message.remove']}" icon="fa fa-exclamation-triangle" />
										</p:commandButton>
									</div>
								</div>
							</ui:repeat>
						</h:panelGroup>
						<h:panelGroup styleClass="language section" id="new_language" layout="block">
							<div class="ui-fluid">
								<div class="p-grid">
									<div class="p-col-5">
										<g:input id="input-text" value="#{languageView.languageName}" required="true" styleClass="input input-text" />
									</div>
									<div class="p-col-5">
										<p:selectOneMenu id="selectOneMenu" required="true" styleClass="input input-select" value="#{languageView.languageLevel}">
											<f:selectItem />
											<f:selectItems value="#{languageView.languageLevels}" var="languageLevel" itemValue="#{languageLevel}" itemLabel="#{i18n[languageLevel]}" />
										</p:selectOneMenu>
										<div class="message-container">
											<p:message id="message" for="input-text" styleClass="message-error" />
										</div>
									</div>
									<div class="p-col-2">
										<p:commandButton icon="fa fa-plus" action="#{languageView.newLanguage}" process="language:new_language" update="@form" styleClass="success-btn" />
									</div>
								</div>
							</div>
						</h:panelGroup>
					</div>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
