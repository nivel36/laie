<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html" xmlns:i18n="http://ged.com/i18n"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" xmlns:p="http://primefaces.org/ui"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" xmlns:o="http://omnifaces.org/ui"
	xmlns:of="http://omnifaces.org/functions" template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['language.language']}</title>
	</ui:define>

	<ui:define name="content">
		<h:form id="language">
			<div class="grid nogutter">
				<div class="panel curriculum col-12 xl-8">
					<div class="panel-header">
						<div class="panel-header-title"></div>
					</div>
					<div class="panel-content">
						<div class="panel-content-data">
							<cc:inputText id="languageName" label="#{i18n['language.language']}" value="#{languageBean.language.name}"
								required="true" />

							<cc:inputSelect label="#{i18n['language.level']}" value="#{languageBean.language.level}" required="true">
								<f:selectItem itemLabel="#{i18n['language.level']}" itemValue="" />
								<f:selectItems value="#{languageLevels.list}" var="languageLevel" itemValue="#{languageLevel.name}"
									itemLabel="#{i18n:translate(languageLevel.name)}" />
							</cc:inputSelect>
						</div>

						<div class="panel-footer">
							<div class="panel-buttons">
								<p:button value="#{i18n['action.cancel']}" outcome="#{Page.CURRICULUM.getUrl()}">
									<f:param name="id" value="#{languageBean.language.curriculum.candidate.id}" />
								</p:button>
								<p:commandButton value="#{i18n['action.delete']}" action="#{languageBean.delete}" process="@this"
									rendered="#{not languageBean.newLanguage}" />
								<p:commandButton value="#{i18n['action.save']}" action="#{languageBean.save}" process="@form" update="@form" />
							</div>
						</div>
					</div>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
