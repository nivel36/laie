<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:i18n="http://legion.com/i18n"
	template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['curriculum.curriculum']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="candidates" />

	<ui:define name="content">
		<h:form id="form">
			<h:graphicImage value="/resources/img/salesforce/no-photo.png"
				styleClass="pictureIcon" />
			<h1 class="header">#{curriculumEditBean.curriculum.candidate}</h1>

			<h:panelGroup layout="block" styleClass="panel">
				<h1>#{i18n['curriculum.curriculum']}</h1>

				<!-- PROFILE -->

				<h:panelGroup layout="block" id="perfilesProfesionales">
					<h:outputLabel value="#{i18n['curriculum.perfil_profesional']}"
						styleClass="required large">
						<h:inputText id="perfilProfesional"
							value="#{curriculumEditBean.curriculum.perfilProfesional}"
							label="#{i18n['curriculum.perfil_profesional']}" required="true"
							styleClass="#{not component.valid ? 'inputError' : ''}" />
						<h:message for="perfilProfesional" errorClass="error" />
					</h:outputLabel>
				</h:panelGroup>

				<!-- EDUCATION -->

				<h:panelGroup layout="block" id="educationPanel">
					<h2>#{i18n['curriculum.education']}</h2>
					<ui:repeat value="#{curriculumEditBean.education}" var="education"
						id="repeatedPanel">
						<h:panelGroup layout="block" class="repeatedPanel">

							<h:outputLabel value="#{i18n['education.degree']}"
								styleClass="required large">
								<h:inputText id="degree" value="#{education.degree}"
									label="#{i18n['education.degree']}" required="true"
									styleClass="#{not component.valid ? 'inputError' : ''}" />
								<h:message for="degree" errorClass="error" />
							</h:outputLabel>

							<br />

							<h:outputLabel value="#{i18n['education.school']}"
								styleClass="required large">
								<h:inputText id="school" value="#{education.school}"
									label="#{i18n['education.school']}" required="true"
									styleClass="#{not component.valid ? 'inputError' : ''}" />
								<h:message for="school" errorClass="error" />
							</h:outputLabel>

							<br />

							<h:outputLabel value="#{i18n['education.from_date']}"
								styleClass="small">
								<h:inputText id="from" value="#{education.fromDate}"
									label="#{i18n['education.from_date']}">
									<f:convertDateTime pattern="MM / yyyy" />
								</h:inputText>
							</h:outputLabel>

							<h:outputLabel value="#{i18n['education.to_date']}"
								styleClass="small">
								<h:inputText id="toDate" value="#{education.toDate}"
									label="#{i18n['education.to_date']}"
									disabled="#{education.stillStudying}">
									<f:convertDateTime pattern="MM / yyyy" />
								</h:inputText>
							</h:outputLabel>

							<h:outputLabel value="#{i18n['education.still_studying']}"
								styleClass="small">
								<h:selectBooleanCheckbox value="#{education.stillStudying}"
									id="stillStudying" label="#{i18n['education.still_studying']}">
									<f:ajax render="toDate" />
								</h:selectBooleanCheckbox>
							</h:outputLabel>

							<br />

							<h:outputLabel value="#{i18n['education.description']}"
								styleClass="largest">
								<h:inputTextarea value="#{education.description}"
									id="description" label="#{i18n['education.description']}" />
							</h:outputLabel>

							<br />

							<h:panelGroup layout="block" class="buttonGroup">
								<h:commandButton value="#{i18n['action.remove']}"
									action="#{curriculumEditBean.removeEducation(education)}"
									immediate="true">
									<f:ajax execute=":form:educationPanel"
										render=":form:educationPanel" />
								</h:commandButton>
							</h:panelGroup>
						</h:panelGroup>
					</ui:repeat>

					<h:panelGroup layout="block" styleClass="buttonGroup">
						<h:commandButton value="#{i18n['action.add']}"
							action="#{curriculumEditBean.addEducation}">
							<f:ajax execute="educationPanel" render="educationPanel" />
						</h:commandButton>
					</h:panelGroup>
				</h:panelGroup>

				<!-- JOB EXPERIENCE -->

				<h:panelGroup layout="block" id="jobExperiences">
					<h2>#{i18n['curriculum.job_experiences']}</h2>
					<ui:repeat value="#{curriculumEditBean.jobExperiences}"
						var="jobExperience" id="jobExperience">
						<h:panelGroup layout="block" class="repeatedPanel">

							<h:outputLabel value="#{i18n['job_experience.company_name']}"
								styleClass="required large">
								<h:inputText id="companyName"
									value="#{jobExperience.companyName}"
									label="#{i18n['job_experience.company_name']}" required="true"
									styleClass="#{not component.valid ? 'inputError' : ''}" />
								<h:message for="companyName" errorClass="error" />
							</h:outputLabel>

							<br />
							<h:outputLabel value="#{i18n['job_experience.job_position']}"
								styleClass="required large">
								<h:inputText id="jobPosition"
									value="#{jobExperience.jobPosition}"
									label="#{i18n['job_experience.job_position']}" required="true"
									styleClass="#{not component.valid ? 'inputError' : ''}" />
								<h:message for="jobPosition" errorClass="error" />
							</h:outputLabel>

							<br />

							<h:outputLabel value="#{i18n['job_experience.from_date']}"
								styleClass="small">
								<h:inputText id="from" value="#{jobExperience.fromDate}"
									label="#{i18n['job_experience.from_date']}">
									<f:convertDateTime pattern="MM / yyyy" />
								</h:inputText>
							</h:outputLabel>

							<h:outputLabel value="#{i18n['job_experience.to_date']}"
								styleClass="small">
								<h:inputText id="toDate" value="#{jobExperience.toDate}"
									label="#{i18n['job_experience.to_date']}"
									disabled="#{jobExperience.stillWorking}">
									<f:convertDateTime pattern="MM / yyyy" />
								</h:inputText>
							</h:outputLabel>

							<h:outputLabel value="#{i18n['job_experience.still_working']}"
								styleClass="small">
								<h:selectBooleanCheckbox value="#{jobExperience.stillWorking}"
									id="stillWorking"
									label="#{i18n['job_experience.still_working']}">
									<f:ajax render="toDate" />
								</h:selectBooleanCheckbox>
							</h:outputLabel>

							<br />

							<h:outputLabel value="#{i18n['job_experience.description']}"
								styleClass="required largest">
								<h:inputTextarea id="description"
									value="#{jobExperience.description}"
									label="#{i18n['job_experience.description']}" required="true"
									styleClass="#{not component.valid ? 'inputError' : ''}" />
								<h:message for="description" errorClass="error" />
							</h:outputLabel>

							<br />

							<h:panelGroup layout="block" class="buttonGroup">
								<h:commandButton value="#{i18n['action.remove']}"
									action="#{curriculumEditBean.removeJobExperience(jobExperience)}"
									immediate="true">
									<f:ajax render=":form:jobExperiences"
										execute=":form:jobExperiences" />
								</h:commandButton>
							</h:panelGroup>
						</h:panelGroup>
					</ui:repeat>
					<h:panelGroup layout="block" class="buttonGroup">
						<h:commandButton value="#{i18n['action.add']}"
							action="#{curriculumEditBean.addJobExperience}">
							<f:ajax execute="jobExperiences" render="jobExperiences" />
						</h:commandButton>
					</h:panelGroup>
				</h:panelGroup>

				<!-- LANGUAGES -->

				<h:panelGroup layout="block" id="languages">
					<h2>#{i18n['curriculum.languages']}</h2>
					<ui:repeat value="#{curriculumEditBean.languages}" var="language"
						varStatus="current" id="language">
						<h:panelGroup layout="block" class="repeatedPanel">

							<h:outputLabel value="#{i18n['language.language']}"
								styleClass="required small">
								<h:inputText id="languageName" value="#{language.languageName}"
									label="#{i18n['language.language']}" required="true"
									styleClass="#{not component.valid ? 'inputError' : ''}" />
								<h:message for="languageName" errorClass="error" />
							</h:outputLabel>

							<h:outputLabel value="#{i18n['language.read']}"
								styleClass="compact small">
								<h:selectOneMenu id="read" value="#{language.read}">
									<f:selectItems var="languageLevel"
										itemValue="#{languageLevel.name}"
										value="#{applicationBean.languageLevels}"
										itemLabel="#{i18n:translate(languageLevel.name)}" />
								</h:selectOneMenu>
							</h:outputLabel>

							<h:outputLabel value="#{i18n['language.speak']}"
								styleClass="compact small">
								<h:selectOneMenu id="speak" value="#{language.speak}">
									<f:selectItems var="languageLevel"
										itemValue="#{languageLevel.name}"
										value="#{applicationBean.languageLevels}"
										itemLabel="#{i18n:translate(languageLevel.name)}" />
								</h:selectOneMenu>
							</h:outputLabel>

							<h:outputLabel value="#{i18n['language.write']}"
								styleClass="compact small">
								<h:selectOneMenu id="write" value="#{language.write}">
									<f:selectItems var="languageLevel"
										itemValue="#{languageLevel.name}"
										value="#{applicationBean.languageLevels}"
										itemLabel="#{i18n:translate(languageLevel.name)}" />
								</h:selectOneMenu>
							</h:outputLabel>

							<h:commandButton value="#{i18n['action.remove']}"
								action="#{curriculumEditBean.removeLanguage(language)}"
								immediate="true">
								<f:ajax render=":form:languages" execute=":form:languages" />
							</h:commandButton>
						</h:panelGroup>
					</ui:repeat>
					<h:panelGroup layout="block" class="buttonGroup">
						<h:commandButton value="#{i18n['action.add']}"
							action="#{curriculumEditBean.addLanguage}">
							<f:ajax execute="languages" render="languages" />
						</h:commandButton>
					</h:panelGroup>
				</h:panelGroup>

				<!-- SKILLS -->

				<h:panelGroup layout="block" id="skills">
					<h2>#{i18n['curriculum.skills']}</h2>
					<ui:repeat value="#{curriculumEditBean.skills}" var="skill"
						id="skill">
						<h:panelGroup layout="block" class="repeatedPanel">

							<h:outputLabel styleClass="required small">
								<h:inputText id="name" value="#{skill.name}"
									label="#{i18n['skill.name']}" required="true" />
							</h:outputLabel>

							<h:outputLabel styleClass="compact small">
								<h:selectOneMenu id="level" value="#{skill.level}" label="#{curriculumEditBean.skills}">
									<f:selectItems var="skillLevel" itemValue="#{skillLevel.name}"
										value="#{applicationBean.skillLevels}"
										itemLabel="#{i18n:translate(skillLevel.name)}" />
								</h:selectOneMenu>
							</h:outputLabel>

							<h:commandButton value="#{i18n['action.remove']}"
								action="#{curriculumEditBean.removeSkill(skill)}"
								immediate="true">
								<f:ajax render=":form:skills" execute=":form:skills" />
							</h:commandButton>

						</h:panelGroup>
					</ui:repeat>

					<h:panelGroup layout="block" class="buttonGroup">
						<h:commandButton value="#{i18n['action.add']}"
							action="#{curriculumEditBean.addSkill}">
							<f:ajax render="skills" />
						</h:commandButton>
					</h:panelGroup>
				</h:panelGroup>
			</h:panelGroup>

			<h:panelGroup layout="block" class="buttonGroup">
				<h:commandButton value="#{i18n['action.save']}"
					action="#{curriculumEditBean.save}" />
				<h:commandButton value="#{i18n['action.cancel']}"
					action="#{curriculumEditBean.cancel}" immediate="true" />
			</h:panelGroup>
		</h:form>
	</ui:define>
</ui:composition>
