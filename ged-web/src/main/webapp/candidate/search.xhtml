<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core" xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:g="http://ged.org/ui" xmlns:h="http://java.sun.com/jsf/html" xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" xmlns:ui="http://java.sun.com/jsf/facelets" template="/WEB-INF/templates/template.xhtml">

	<ui:define name="title">
		#{i18n['candidate.candidates']}
	</ui:define>

	<ui:param name="selectedMenu" value="candidates" />

	<ui:define name="breadcrumb">
		<p:breadCrumb>
			<p:menuitem value="#{i18n['menu.index']}" outcome="#{Page.INDEX.getUrl()}" />
			<p:menuitem value="#{i18n['candidate.candidates']}" disabled="true" />
		</p:breadCrumb>
	</ui:define>

	<ui:define name="buttons">
		<h:form>
			<p:button value="#{i18n['candidate.new_candidate']}" outcome="#{Page.CANDIDATE_ADD.getUrl()}" styleClass="success-button" />
			<p:commandButton value="#{i18n['action.export']}" onclick="export()" icon="fa fa-file-excel-o" styleClass="info-button"/>
		</h:form>
	</ui:define>

	<ui:define name="content">
		<h:form id="candidateSearchForm">
			<p:remoteCommand name="export" process="@form" update="@form growl" action="#{searchCandidateView.export}" />
			<div class="card">
				<div class="p-grid">
					<div class="p-col-12 p-lg-5">
						<div class="searchBar ui-fluid">
							<cc:inputSearch searchText="#{searchCandidateView.searchText}" searchAction="#{searchCandidateView.search}" update="candidateSearchForm:candidates" />
						</div>
					</div>
					<div class="p-col-12">
						<p:dataTable var="candidate" id="candidates" value="#{searchCandidateView.candidates}" emptyMessage="#{i18n['candidate.no_candidates_found']}" reflow="true" paginator="true"
							paginatorPosition="bottom" rows="#{sessionUser.rowsPerPage}" sortBy="#{candidate.name}" sortOrder="ascending" lazy="true">

							<p:column headerText="#{i18n['candidate.name']}" sortBy="#{candidate.name}">
							    <cc:avatar value="#{candidate.picture}" styleClass="small" />
								<h:link value="#{candidate.fullName}" outcome="#{Page.CANDIDATE.getUrl()}" style="vertical-align: middle;margin-left: .5rem;">
									<f:param name="id" value="#{candidate.uid}" />
								</h:link>
							</p:column>

							<p:column headerText="#{i18n['candidate.jobProfile']}" sortBy="#{candidate.jobProfile}" priority="5">
								<h:outputText value="#{candidate.jobProfile}" />
							</p:column>

							<p:column headerText="#{i18n['candidate.email']}">
								<h:outputText value="#{candidate.email}" />
							</p:column>

							<p:column headerText="#{i18n['candidate.phone_number']}" priority="6">
								<h:outputText value="#{candidate.phoneNumber}" />
							</p:column>

							<p:column headerText="#{i18n['candidate.rating']}" sortBy="#{candidate.rating}" priority="4">
								<p:rating value="#{candidate.rating}" cancel="false" readonly="true" />
							</p:column>
						</p:dataTable>
					</div>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
