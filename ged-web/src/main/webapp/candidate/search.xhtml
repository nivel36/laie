<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html" xmlns:i18n="http://ged.com/i18n"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" xmlns:p="http://primefaces.org/ui"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" xmlns:o="http://omnifaces.org/ui"
	xmlns:of="http://omnifaces.org/functions" template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['candidate.candidates']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="candidates" />

	<ui:define name="actions">
		<p:button value="#{i18n['candidate.new_candidate']}" outcome="#{Page.CANDIDATE_ADD.getUrl()}" />
	</ui:define>

	<ui:define name="breadcrumb">
		<p:breadCrumb styleClass="breadcrumb">
			<p:menuitem value="#{i18n['menu.index']}" outcome="#{Page.INDEX.getUrl()}" />
			<p:menuitem value="#{i18n['candidate.candidates']}" disabled="true" />
		</p:breadCrumb>
	</ui:define>

	<ui:define name="content">
		<h:form id="candidateSearchForm">
			<div class="panel">
				<div class="panel-content">
					<div class="panel-content-data">
						<cc:inputSearch searchText="#{searchCandidateView.searchText}" searchAction="#{searchCandidateView.search}"
							update="@form" />
						<div class="panel-buttons">
							<p:commandButton value="#{i18n['action.export']}" action="#{searchCandidateView.export}" process="@this"
								icon="fa-file-excel-o" />
						</div>
					</div>
					<p:dataTable var="candidate" id="candidates" value="#{searchCandidateView.candidates}"
						emptyMessage="#{i18n['candidate.no_candidates_found']}" reflow="true" paginator="true" paginatorPosition="bottom"
						rows="#{sessionUser.rowsPerPage}" sortBy="#{candidate.name}" sortOrder="descending" lazy="true">

						<p:column>
							<p:graphicImage class="image image-icon" value="/images/#{candidate.imageFileName}"
								rendered="#{not empty candidate.imageFileName}" />
							<p:graphicImage class="image image-icon" value="/resources/img/default-avatar.png"
								rendered="#{empty candidate.imageFileName}" />
						</p:column>

						<p:column headerText="#{i18n['candidate.name']}" sortBy="#{candidate.name}">
							<h:link value="#{candidate.fullName}" outcome="#{Page.CANDIDATE.getUrl()}">
								<f:param name="id" value="#{candidate.id}" />
							</h:link>
						</p:column>

						<p:column headerText="#{i18n['candidate.jobProfile']}" sortBy="#{candidate.jobProfile}">
							<h:outputText value="#{candidate.jobProfile}" />
						</p:column>

						<p:column headerText="#{i18n['candidate.email']}">
							<h:outputText value="#{candidate.email}" />
						</p:column>

						<p:column headerText="#{i18n['candidate.phone_number']}">
							<h:outputText value="#{candidate.phoneNumber}" />
						</p:column>

						<p:column headerText="#{i18n['candidate.rating']}" sortBy="#{candidate.rating}">
							<p:rating value="#{candidate.rating}" cancel="false" readonly="true" />
						</p:column>
						
					</p:dataTable>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
