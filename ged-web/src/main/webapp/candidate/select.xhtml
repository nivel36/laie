<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:i18n="http://ged.com/i18n"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" template="/WEB-INF/templates/dialog.xhtml">

	<ui:define name="title">
		<title>#{i18n['candidate.candidates']}</title>
	</ui:define>

	<ui:define name="content">
		<h:form id="candidateSelectForm">
			<div class="panel">
				<div class="panel-content">
					<div class="panel-content-data">
						<cc:inputSearch searchText="#{selectClientBean.searchText}" searchAction="#{selectCandidateView.search}" update="@form" />
					</div>

					<p:dataTable var="candidate" id="candidates" value="#{selectCandidateView.candidates}"
						emptyMessage="#{i18n['candidate.no_candidates_found']}" reflow="true" paginator="true" paginatorPosition="bottom"
						selection="#{selectCandidateView.selectedCandidates}" disabledSelection="#{selectCandidateView.isAlredySelected(candidate.id)}"
						rows="#{sessionUser.rowsPerPage}" sortBy="#{candidate.name}" sortOrder="descending" lazy="true">

						<p:column selectionMode="multiple" style="width:16px;text-align:center" />

						<p:column>
							<p:graphicImage class="image image-icon" value="/images/#{candidate.imageFileName}" rendered="#{not empty candidate.imageFileName}" />
							<p:graphicImage class="image image-icon" value="/resources/img/default-avatar.png" rendered="#{empty candidate.imageFileName}" />
						</p:column>

						<p:column headerText="#{i18n['candidate.name']}" sortBy="#{candidate.name}">
							<h:outputText value="#{candidate.fullName}" />
						</p:column>

						<p:column headerText="#{i18n['candidate.jobProfile']}" sortBy="#{candidate.jobProfile}">
							<h:outputText value="#{candidate.jobProfile}" />
						</p:column>

						<p:column headerText="#{i18n['candidate.email']}">
							<h:outputText value="#{candidate.email}" />
						</p:column>

						<p:column headerText="#{i18n['candidate.phone_number']}">
							<h:outputText value="#{candidate.phoneNumber}" />
						</p:column>

						<p:column headerText="#{i18n['candidate.rating']}" sortBy="#{candidate.rating}">
							<p:rating value="#{candidate.rating}" cancel="false" readonly="true" />
						</p:column>

						<p:column headerText="#{i18n['candidate.state']}">
						</p:column>
					</p:dataTable>

					<div class="panel-footer">
						<div class="panel-buttons">
							<p:commandButton value="#{i18n['action.cancel']}" action="#{selectCandidateView.cancel}" process="@this" styleClass="btn-gray" />
							<p:commandButton value="#{i18n['action.select']}" action="#{selectCandidateView.select}" update="@form" process="@form" />
						</div>
					</div>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
