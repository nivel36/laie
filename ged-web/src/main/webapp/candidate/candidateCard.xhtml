<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:composite="http://xmlns.jcp.org/jsf/composite"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" xmlns:o="http://omnifaces.org/ui" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	xmlns:g="http://ged.org/ui">
	<p:link outcome="#{Page.CANDIDATE.getUrl()}">
		<f:param name="candidateId" value="#{candidate.id}" />
		<div class="user-minicard">
			<div class="user-image">
				<cc:avatar value="#{candidate.imageFileName}" />
			</div>
			<div class="user-info">
				<div class="name">#{candidate}</div>
				<div class="position">#{candidate.jobProfile}</div>
			</div>
		</div>
	</p:link>
	</ui:composition>
