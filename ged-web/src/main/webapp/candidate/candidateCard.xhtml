<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:p="http://primefaces.org/ui" xmlns:i18n="http://ged.com/i18n">
	<p:link outcome="#{Page.CANDIDATE.getUrl()}">
		<f:param name="candidateId" value="#{candidate.id}" />
		<div class="user-minicard">
			<div class="user-image">
				<cc:avatar value="#{candidate.imageFileName}" />
			</div>
			<div class="user-info">
				<div class="name">#{candidate}</div>
				<div class="position">#{candidate.jobProfile}</div>
			</div>
		</div>
	</p:link>
</ui:composition>
