<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui"
	xmlns:i18n="http://ged.com/i18n" xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{jobOfferEditBean.newJobOffer ? i18n['job.new_job_offer'] : jobOfferEditBean.jobOffer.name}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="offers" />

	<ui:define name="content">

		<p:breadCrumb styleClass="breadcrumb">
			<p:menuitem value="#{i18n['menu.index']}" url="/index.xhtml" />
			<p:menuitem value="#{i18n['job.job_offers']}" url="/jobOffer/jobOfferSearch.xhtml" />
			<p:menuitem value="#{jobOfferEditBean.jobOffer}"
				url="/job/jobOffer.xhtml?jobId=#{jobOfferEditBean.jobOffer.id}" rendered="#{not jobOfferEditBean.newJobOffer}" />
			<p:menuitem value="#{jobOfferEditBean.newJobOffer ? i18n['job.new_job_offer'] : i18n['job.edit_job']}"
				disabled="true" />
		</p:breadCrumb>
		<h:form id="jobOfferForm">
			<div class="panel">
				<div class="panel-header">
					<div class="panel-header-title">#{jobOfferEditBean.newJobOffer ? i18n['job.new_job_offer'] :
						jobOfferEditBean.jobOffer.name}</div>
				</div>
				<div class="panel-content panel-content-data">
					<div class="grid">
						<div class="col-12 sm-6">
							<h3>#{i18n['user.personal_information']}</h3>

							<cc:inputText label="#{i18n['job.name']}" value="#{jobOfferEditBean.jobOffer.name}" required="true" />

							<cc:inputClient id="client" label="#{i18n['job.client']}" value="#{jobOfferEditBean.jobOffer.client}"
								search="#{jobOfferEditBean.openClientSearchDialog}" required="true">
								<p:ajax event="dialogReturn" listener="#{jobOfferEditBean.onCloseClientSearchDialog}" update="client" />
							</cc:inputClient>

							<cc:inputNumber id="places" min="0" label="#{i18n['job.places']}" value="#{jobOfferEditBean.jobOffer.places}" />

							<cc:calendar id="dateOpened" label="#{i18n['job.date_opened']}" value="#{jobOfferEditBean.jobOffer.dateOpened}" />

							<cc:calendar id="dateClosed" label="#{i18n['job.date_closed']}" value="#{jobOfferEditBean.jobOffer.dateClosed}" />

							<cc:inputText id="city" label="#{i18n['job.city']}" value="#{jobOfferEditBean.jobOffer.city}" required="true" />

							<cc:inputText id="state" label="#{i18n['job.state']}" value="#{jobOfferEditBean.jobOffer.state}" required="true" />
						</div>
						<div class="col-12 sm-6">
							<h3>#{i18n['user.personal_information']}</h3>

							<cc:inputUser id="owner" label="#{i18n['job.owner']}" value="#{jobOfferEditBean.jobOffer.owner}"
								completeMethod="#{jobOfferEditBean.searchOwner}" />

							<cc:inputTag id="recruiters" label="#{i18n['job.recruiters']}" value="#{jobOfferEditBean.recruiters}"
								tagLabel="#{jobOfferEditBean.recruiters}" />
						</div>
						<div class="col-12">
							<h3>#{i18n['user.personal_information']}</h3>
							<cc:richText id="description" name="description" label="#{i18n['job.description']}"
								value="#{jobOfferEditBean.jobOffer.description}" />
						</div>
					</div>
				</div>
				<div class="panel-footer">
					<div class="panel-buttons">
						<p:button styleClass="btn-gray" value="#{i18n['action.cancel']}" outcome="jobOfferSearch"
							rendered="#{jobOfferEditBean.newJobOffer}" />
						<p:button styleClass="btn-gray" value="#{i18n['action.cancel']}" outcome="jobOffer"
							rendered="#{not jobOfferEditBean.newJobOffer}">
							<f:param name="jobOfferId" value="#{jobOfferEditBean.jobOffer.id}" />
						</p:button>
						<p:commandButton value="#{i18n['action.save']}" action="#{jobOfferEditBean.save}" process="@form" update="@form"
							styleClass="btn-primary" />
					</div>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
