<ui:component xmlns="http://www.w3.org/1999/xhtml" 
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" 
	xmlns:p="http://primefaces.org/ui"
	xmlns:composite="http://xmlns.jcp.org/jsf/composite" 
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:o="http://omnifaces.org/ui" 
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

	<composite:interface>
		<composite:attribute name="value" required="true" />
		<composite:attribute name="fileUploadListener" method-signature="void listener(org.primefaces.event.FileUploadEvent)"
			required="true" />
	</composite:interface>

	<composite:implementation>
		<div id="#{cc.clientId}" class="input-image">
			<p:outputPanel layout="block" id="inputImage">
				<p:fileUpload id="inputImage_fileUpload" styleClass="invisible" fileUploadListener="#{cc.attrs.fileUploadListener}"
					mode="advanced" dragDropSupport="false" update="inputImage" auto="true" />
				<h:outputLabel id="inputImage_image" for="inputImage_fileUpload_input">
					<p:graphicImage styleClass="selectable image" value="/images/#{cc.attrs.value}"
						rendered="#{not empty cc.attrs.value}" />
					<p:graphicImage styleClass="selectable image" value="/resources/img/default-avatar.png"
						rendered="#{empty cc.attrs.value}" />
				</h:outputLabel>
			</p:outputPanel>
		</div>
	</composite:implementation>
</ui:component>
