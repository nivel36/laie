<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:i18n="http://ged.com/i18n" xmlns:composite="http://xmlns.jcp.org/jsf/composite">

<composite:interface>
	<composite:attribute name="value" required="true" />
	<composite:attribute name="fileUploadListener" method-signature="void listener(org.primefaces.event.FileUploadEvent)" required="true" />
</composite:interface>

<composite:implementation>
	<h:panelGroup id="#{cc.clientId}" layout="block" styleClass="inputImage">
		<p:outputPanel layout="block" id="inputImage" styleClass="user-image">
			<p:fileUpload id="inputImage_fileUpload" styleClass="invisible uploadImageButton" fileUploadListener="#{cc.attrs.fileUploadListener}" mode="advanced"
				dragDropSupport="false" update="inputImage" auto="true" />
			<h:outputLabel id="inputImage_image" for="inputImage_fileUpload_input">
				<p:graphicImage styleClass="selectable image" value="/images/#{cc.attrs.value}" rendered="#{not empty cc.attrs.value}" />
				<p:graphicImage styleClass="selectable image" value="/resources/img/default-avatar.png" rendered="#{empty cc.attrs.value}" />
			</h:outputLabel>
		</p:outputPanel>
	</h:panelGroup>
</composite:implementation>
</html>
