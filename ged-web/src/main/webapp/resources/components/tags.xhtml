<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core" 
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:composite="http://xmlns.jcp.org/jsf/composite" 
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:g="http://ged.org/ui" 
	xmlns:h="http://java.sun.com/jsf/html" 
	xmlns:o="http://omnifaces.org/ui"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://java.sun.com/jsf/facelets">

	<composite:interface>
		<composite:attribute name="rendered" default="true" />
		<composite:attribute name="value" required="true" />
		<composite:attribute name="completeMethod" method-signature="void function(java.lang.String)" required="true" />
		<composite:editableValueHolder name="input-tag" />
		<composite:attribute name="styleClass" required="false" default="" />
	</composite:interface>

	<composite:implementation>
		<div id="#{cc.clientId}" class="tags #{cc.attrs.styleClass}">
			<p:autoComplete id="input-tag" completeMethod="#{cc.attrs.completeMethod}" var="tag" itemLabel="#{tag.label}"
				itemValue="#{user}" forceSelection="true" required="#{cc.attrs.required}" binding="#{cc.input}" />
			<p:chips id="tags" value="#{candidateEditView.tags}" label="#{i18n['candidateEditView.tags']}"
				converter="stringConverter"  />
		</div>
	</composite:implementation>
</ui:component>
