<ui:component xmlns="http://www.w3.org/1999/xhtml" 
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" 
	xmlns:p="http://primefaces.org/ui"
	xmlns:composite="http://xmlns.jcp.org/jsf/composite" 
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:o="http://omnifaces.org/ui" 
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

	<composite:interface>
		<composite:attribute name="labelIcon" required="false" />
		<composite:attribute name="label" required="false" />
		<composite:attribute name="tagLabel" required="false" />
		<composite:attribute name="required" default="false" />
		<composite:attribute name="rendered" default="true" />
		<composite:attribute name="validator" targets="input-text" />
		<composite:attribute name="value" required="true" />
		<composite:attribute name="styleClass" required="false" default="" />
		<composite:editableValueHolder name="input-text" />
	</composite:interface>

	<composite:implementation>
		<h:panelGroup layout="block" styleClass="input-group input-tag #{cc.attrs.styleClass}" rendered="#{cc.attrs.rendered}">
			<h:panelGroup layout="block" styleClass="label-icon icon" rendered="#{not empty cc.attrs.labelIcon}">
				<em class="fa  #{cc.attrs.labelIcon}" />
			</h:panelGroup>
			<h:panelGroup layout="block" styleClass="label" rendered="#{not empty cc.attrs.label}">
				<p:outputLabel id="label" for="input-tag" value="#{cc.attrs.label}" />
			</h:panelGroup>
			<div class="input">
				<p:chips id="input-tag" value="#{cc.attrs.value}" label="#{cc.attrs.tagLabel}" required="#{cc.attrs.required}"
					converter="stringConverter" styleClass="#{cc.attrs.inputStyleClass}" />
			</div>
			<div class="message-error">
				<p:message id="message" for="input-tag" />
			</div>
		</h:panelGroup>
	</composite:implementation>
</ui:component>
