<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core" 
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:composite="http://xmlns.jcp.org/jsf/composite" 
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:g="http://ged.org/ui" 
	xmlns:h="http://java.sun.com/jsf/html" 
	xmlns:o="http://omnifaces.org/ui"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://java.sun.com/jsf/facelets">

	<composite:interface>
		<composite:attribute name="labelIcon" required="false" />
		<composite:attribute name="label" required="false" />
		<composite:attribute name="required" default="false" />
		<composite:attribute name="value" required="true" />
		<composite:attribute name="styleClass" required="false" default="" />
		<composite:attribute name="inputStyleClass" required="false" default="" />
		<composite:attribute name="completeMethod" method-signature="void function(java.lang.String)" required="true" />
		<composite:editableValueHolder name="input" />
	</composite:interface>

	<composite:implementation>
		<div id="#{cc.clientId}" class="input-group input-group-tag #{cc.attrs.styleClass}">
			<h:panelGroup layout="block" styleClass="label-container label-icon-container" rendered="#{not empty cc.attrs.labelIcon}">
				<em class="icon fa #{cc.attrs.labelIcon}" />
			</h:panelGroup>
			<h:panelGroup layout="block" styleClass="label-container" rendered="#{not empty cc.attrs.label}">
				<p:outputLabel id="label" for="input" value="#{cc.attrs.label}" styleClass="label" />
			</h:panelGroup>
			<div class="input-container">
				<p:autoComplete id="input" value="#{cc.attrs.value}" required="#{cc.attrs.required}" styleClass="input input-tag"
					completeMethod="#{cc.attrs.completeMethod}" minQueryLength="3" var="tag" itemValue="#{tag}" itemLabel="#{tag.label}"
					disabled="#{cc.attrs.disabled}" multiple="true" converter="tagConverter" forceSelection="false" autoHighlight="false"
					autoSelection="true" unique="true" />
			</div>
			<div class="message-container">
				<p:message id="message" for="input" styleClass="message-error" />
			</div>
		</div>
	</composite:implementation>
</ui:component>
