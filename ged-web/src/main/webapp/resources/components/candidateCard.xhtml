<ui:component xmlns="http://www.w3.org/1999/xhtml" 
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" 
	xmlns:p="http://primefaces.org/ui"
	xmlns:composite="http://xmlns.jcp.org/jsf/composite" 
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:o="http://omnifaces.org/ui" 
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

	<composite:interface>
		<composite:attribute name="candidate" type="ged.ejb.candidate.Candidate" required="true" />
		<composite:attribute name="styleClass" required="false" default="" />
	</composite:interface>

	<composite:implementation>
		<h:panelGroup layout="block" sytleClass="candidate-card #{cc.attrs.styleClass}">
			<p:link outcome="/faces/candidate/candidate">
				<f:param name="candidateId" value="#{cc.attrs.candidate.id}" />
				<div class="user-minicard">
					<div class="user-image">
						<p:graphicImage class="image" value="/images/#{cc.attrs.candidate.imageFileName}"
							rendered="#{not empty cc.attrs.candidate.imageFileName}" />
						<p:graphicImage class="image" value="/resources/img/default-avatar.png"
							rendered="#{empty cc.attrs.candidate.imageFileName}" />
					</div>
					<div class="user-info">
						<div class="name">#{cc.attrs.candidate}</div>
						<div class="position">#{cc.attrs.candidate.jobProfile}</div>
					</div>
				</div>
			</p:link>
		</h:panelGroup>
	</composite:implementation>
</ui:component>
