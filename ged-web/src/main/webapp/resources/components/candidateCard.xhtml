<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core" 
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:composite="http://xmlns.jcp.org/jsf/composite" 
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:g="http://ged.org/ui" 
	xmlns:h="http://java.sun.com/jsf/html" 
	xmlns:o="http://omnifaces.org/ui"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://java.sun.com/jsf/facelets">

	<composite:interface>
		<composite:attribute name="candidate" type="ged.ejb.candidate.Candidate" required="true" />
		<composite:attribute name="styleClass" required="false" default="" />
	</composite:interface>

	<composite:implementation>
		<div id="#{cc.clientId}" class="#{cc.attrs.styleClass}">
			<p:link outcome="#{Page.CANDIDATE.getUrl()}" styleClass="candidate-card">
				<f:param name="id" value="#{cc.attrs.candidate.id}" />
				<div class="image">
					<cc:avatar value="#{cc.attrs.candidate.imageFileName}" />
				</div>
				<div class="info">
					<div class="name">#{cc.attrs.candidate}</div>
					<div class="position">#{cc.attrs.candidate.jobProfile}</div>
				</div>
			</p:link>
		</div>
	</composite:implementation>
</ui:component>
