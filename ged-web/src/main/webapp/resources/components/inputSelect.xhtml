<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui" xmlns:i18n="http://ged.com/i18n"
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	xmlns:composite="http://java.sun.com/jsf/composite">

<composite:interface>
	<composite:attribute name="name" />
	<composite:attribute name="label" required="true" />
	<composite:attribute name="value" required="true" />
	<composite:clientBehavior name="change" event="change" targets="selectOneMenu" />
	<composite:attribute name="required" />
</composite:interface>

<composite:implementation>
	<div class="form-group">
		<p:outputLabel value="#{cc.attrs.label}" for="selectOneMenu" />
		<p:selectOneMenu id="selectOneMenu" name="#{cc.attrs.name}" value="#{cc.attrs.value}" required="#{cc.attrs.required}">
			<c:if test="#{empty cc.attrs.value}">
				<f:selectItem />
			</c:if>
			<composite:insertChildren />
		</p:selectOneMenu>
		<p:message for="selectOneMenu" />
	</div>
</composite:implementation>
</html>
