<ui:component xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui"
	xmlns:composite="http://xmlns.jcp.org/jsf/composite" xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:o="http://omnifaces.org/ui" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

	<composite:interface componentType="inputSelect">
		<composite:attribute name="name" />
		<composite:attribute name="label" required="true" />
		<composite:attribute name="value" required="true" />
		<composite:attribute name="required" default="false" type="boolean" />
		<composite:attribute name="rendered" default="true" />
		<composite:attribute name="other" default="false" type="boolean" />
		<composite:attribute name="styleClass" default="" />
		<composite:clientBehavior name="change" event="change" targets="selectOneMenu" />
	</composite:interface>

	<composite:implementation>
		<h:panelGroup layout="block" styleClass="input-group input-select #{cc.attrs.styleClass}"
			rendered="#{cc.attrs.rendered}">
			<div class="label">
				<p:outputLabel id="label" value="#{cc.attrs.label}" for="selectOneMenu" />
			</div>
			<div class="input">
				<c:if test="#{cc.attrs.other}">
					<p:selectOneMenu id="selectOneMenu" name="#{cc.attrs.name}" required="#{cc.attrs.required}"
						binding="#{cc.selectInput}">
						<f:selectItem />
						<composite:insertChildren />
						<f:selectItem itemLabel="#{i18n['select.other']}" itemValue="other" />
						<p:ajax event="change" process="@this" update="@parent" listener="#{cc.onChangeSelectValue}" />
					</p:selectOneMenu>
					<p:inputText id="other" binding="#{cc.otherInputText}" />
					<h:inputHidden value="#{cc.attrs.value}" binding="#{cc.inputHidden}" />
				</c:if>

				<c:if test="#{not cc.attrs.other}">
					<p:selectOneMenu id="selectOneMenu" name="#{cc.attrs.name}" value="#{cc.attrs.value}"
						required="#{cc.attrs.required}">
						<f:selectItem />
						<composite:insertChildren />
					</p:selectOneMenu>
				</c:if>
			</div>
			<div class="message-error">
				<p:message for="selectOneMenu" />
			</div>
		</h:panelGroup>
	</composite:implementation>
</ui:component>
