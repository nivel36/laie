<ui:component xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:composite="http://xmlns.jcp.org/jsf/composite"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" xmlns:o="http://omnifaces.org/ui" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

	<composite:interface componentType="inputSelect">
		<composite:attribute name="name" />
		<composite:attribute name="label" required="true" />
		<composite:attribute name="value" required="true" />
		<composite:clientBehavior name="change" event="change" targets="selectOneMenu-group" />
		<composite:attribute name="required" />
		<composite:attribute name="other" required="false" default="false" />
	</composite:interface>

	<composite:implementation>
		<div id="#{cc.clientId}" class="input-select input-group">
			<p:outputLabel value="#{cc.attrs.label}" for="selectOneMenu" styleClass="label" />
			<div class="input">

				<c:if test="#{cc.attrs.other}">
					<h:panelGroup id="selectOneMenu-group" style="display:flex; width:100%;">
						<p:selectOneMenu id="selectOneMenu" name="#{cc.attrs.name}" required="#{cc.attrs.required}" binding="#{cc.selectInput}">
							<f:selectItem />
							<composite:insertChildren />
							<f:selectItem itemLabel="#{i18n['select.other']}" itemValue="other" />
							<p:ajax event="change" process="@this" update="selectOneMenu-group" listener="#{cc.onChangeSelectValue}" />
						</p:selectOneMenu>
						<p:inputText id="other" binding="#{cc.otherInputText}" />
					</h:panelGroup>
					<h:inputHidden value="#{cc.attrs.value}" binding="#{cc.inputHidden}" />
					<p:message for="selectOneMenu" />
				</c:if>

				<c:if test="#{not cc.attrs.other}">
					<p:selectOneMenu id="selectOneMenu" name="#{cc.attrs.name}" value="#{cc.attrs.value}" required="#{cc.attrs.required}">
						<f:selectItem />
						<composite:insertChildren />
					</p:selectOneMenu>
					<p:message for="selectOneMenu" />
				</c:if>
			</div>
		</div>
	</composite:implementation>
</ui:component>
