<ui:component xmlns="http://www.w3.org/1999/xhtml" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core" xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:composite="http://xmlns.jcp.org/jsf/composite" xmlns:f="http://java.sun.com/jsf/core" xmlns:g="http://ged.org/ui" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui" xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" xmlns:ui="http://java.sun.com/jsf/facelets">

	<composite:interface componentType="inputSelect">
		<composite:attribute name="label" required="true" />
		<composite:attribute name="value" required="true" />
		<composite:attribute name="required" default="false" type="boolean" />
		<composite:attribute name="other" default="false" type="boolean" />
		<composite:attribute name="styleClass" default="" />
		<composite:clientBehavior name="change" event="change" targets="selectOneMenu" />
	</composite:interface>

	<composite:implementation>
		<div id="#{cc.clientId}" class="input-group input-group-select #{cc.attrs.styleClass}">
			<div class="label-container">
				<p:outputLabel id="label" value="#{cc.attrs.label}" for="selectOneMenu" styleClass="label" />
			</div>
			<c:if test="#{cc.attrs.other}">
				<h:panelGroup layout="block" id="selectOneMenuWrapper" styleClass="input-container">
					<p:selectOneMenu id="selectOneMenu" name="#{cc.attrs.name}" required="#{cc.attrs.required}" binding="#{cc.selectInput}" styleClass="input input-select">
						<f:selectItem />
						<composite:insertChildren />
						<f:selectItem itemLabel="#{i18n['select.other']}" itemValue="other" />
						<p:ajax event="change" process="@this" update="selectOneMenuWrapper" listener="#{cc.onChangeSelectValue}" />
					</p:selectOneMenu>
					<p:inputText id="other" binding="#{cc.otherInputText}" styleClass="input input-text" />
				</h:panelGroup>
				<h:inputHidden value="#{cc.attrs.value}" binding="#{cc.inputHidden}" />
			</c:if>
			<c:if test="#{not cc.attrs.other}">
				<div class="input-container">
					<p:selectOneMenu id="selectOneMenu" name="#{cc.attrs.name}" value="#{cc.attrs.value}" required="#{cc.attrs.required}" styleClass="input input-select" >
						<f:selectItem />
						<composite:insertChildren />
					</p:selectOneMenu>
				</div>
			</c:if>
			<div class="message-container">
				<p:message for="selectOneMenu" styleClass="message-error" />
			</div>
		</div>
	</composite:implementation>
</ui:component>
