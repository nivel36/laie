<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui" xmlns:i18n="http://ged.com/i18n"
	xmlns:composite="http://java.sun.com/jsf/composite">

<composite:interface>
	<composite:attribute name="name" required="true" />
	<composite:attribute name="label" required="true" />
	<composite:attribute name="value" required="true" />
	<composite:attribute name="required" />
</composite:interface>

<composite:implementation>
	<div class="form-group">
		<p:outputLabel value="#{cc.attrs.value}" for="#{cc.attrs.name}" />
		<p:selectOneMenu id=""#{cc.attrs.name}"" value="#{userEditBean.user.role}"
			required="true" styleClass="required">
			<p:ajax event="change" update="manager role" process="role"
				listener="#{userEditBean.changeRoleListener}" />
			<c:if test="#{empty userEditBean.user.role}">
				<f:selectItem />
			</c:if>
			<f:selectItems var="role" itemValue="#{role}"
				value="#{applicationBean.roles}"
				itemLabel="#{i18n:translate(role.name)}" />
		</p:selectOneMenu>
		<p:message for=""#{cc.attrs.name}"" />
	</div>
</composite:implementation>
</html>
