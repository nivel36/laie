<ui:component xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:composite="http://xmlns.jcp.org/jsf/composite"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" xmlns:o="http://omnifaces.org/ui" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

	<composite:interface>
		<composite:attribute name="value" required="true" />
		<composite:attribute name="styleClass" required="false" default="" />
		<composite:attribute name="fileUploadListener" method-signature="void listener(org.primefaces.event.FileUploadEvent)" required="true" />
		<composite:attribute name="captureListener" method-signature="void listener(org.primefaces.event.CaptureEvent)" />
		<composite:attribute name="allowCamera" default="false" type="java.lang.Boolean" />
	</composite:interface>

	<composite:implementation>
		<div id="#{cc.clientId}" class="input-avatar #{cc.attrs.styleClass}">
			<p:fileUpload id="fileUpload" styleClass="invisible" fileUploadListener="#{cc.attrs.fileUploadListener}" mode="advanced"
				dragDropSupport="false" process="@this" update="#{cc.clientId}" auto="true" />
			<h:outputLabel for="fileUpload_input">
				<cc:avatar value="#{cc.attrs.value}" />
			</h:outputLabel>
			<c:if test="#{cc.attrs.allowCamera}">
				<p:commandButton id="cameraButton" icon="fa-camera" onclick="PF('cameraDialog').show();" styleClass="camera-button icon" process="@this" />
				<p:dialog widgetVar="cameraDialog" closable="true" dynamic="true" modal="true">
					<p:photoCam widgetVar="camera" listener="#{cc.attrs.captureListener}" update="#{cc.clientId}" />
					<p:commandButton type="button" value="Capture" onclick="PF('camera').capture()" />
				</p:dialog>
			</c:if>
		</div>
	</composite:implementation>
</ui:component>
