<ui:component xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:composite="http://xmlns.jcp.org/jsf/composite"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" xmlns:o="http://omnifaces.org/ui" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

	<composite:interface>
		<composite:attribute name="name" />
		<composite:attribute name="label" required="true" />
		<composite:attribute name="value" required="true" />
		<composite:attribute name="openAction" method-signature="void action()" required="true" />
		<composite:clientBehavior name="dialogReturn" event="dialogReturn" targets="openSearchDialogButton" />
		<composite:attribute name="required" />
	</composite:interface>

	<composite:implementation>
		<div id="#{cc.clientId}" class="form-group">
			<p:outputLabel value="#{cc.attrs.label}" for="inputClient" id="label" />
			<div class="ui-inputgroup">
				<p:inputText id="inputClient" value="#{cc.attrs.value}" required="#{cc.attrs.required}" />
				<p:commandButton process="@this" update="#{cc.clientId}" styleClass="btn-gray" icon="fa fa-times" rendered="#{not empty cc.attrs.value}">
					<p:resetInput target="#{cc.attrs.name}" />
				</p:commandButton>
				<p:commandButton id="openSearchDialogButton" icon="fa fa-search" styleClass="green-button" actionListener="#{cc.attrs.openAction}" process="@this" />
			</div>
			<p:message for="inputClient" id="message" />
		</div>
	</composite:implementation>
</ui:component>
