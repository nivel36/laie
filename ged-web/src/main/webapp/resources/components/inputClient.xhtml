<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:i18n="http://ged.com/i18n" xmlns:composite="http://java.sun.com/jsf/composite">

<composite:interface>
	<composite:attribute name="name" required="true" />
	<composite:attribute name="label" required="true" />
	<composite:attribute name="value" required="true" />
	<composite:attribute name="openAction"  method-signature="void action()" required="true"/>
	<composite:clientBehavior name="dialogReturn" event="dialogReturn" targets="openSearchDialogButton" />
	<composite:attribute name="required" />
</composite:interface>

<composite:implementation>
	<h:panelGroup id="inputGroup" layout="block" styleClass="form-group">
		<p:outputLabel value="#{cc.attrs.label}" for="#{cc.attrs.name}" />
		<div class="ui-inputgroup">
			<p:inputText id="#{cc.attrs.name}" value="#{cc.attrs.value}" required="#{cc.attrs.required}" />
			<p:commandButton process="@this" update="inputGroup" styleClass="btn-gray" icon="fa fa-times" rendered="#{not empty cc.attrs.value}" >
				<p:resetInput target="#{cc.attrs.name}" />
			</p:commandButton>
			<p:commandButton id="openSearchDialogButton" icon="fa fa-search" styleClass="green-button" actionListener="#{cc.attrs.openAction}" process="@this" />
		</div>
		<p:message for="#{cc.attrs.name}" />
	</h:panelGroup>
</composite:implementation>
</html>
