<ui:component xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:composite="http://xmlns.jcp.org/jsf/composite"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" xmlns:o="http://omnifaces.org/ui" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

	<composite:interface componentType="inputClient">
		<composite:attribute name="label" required="true" />
		<composite:attribute name="required" type="java.lang.Boolean" default="false" />
		<composite:attribute name="search" method-signature="void action()" required="true" />
		<composite:attribute name="value" type="ged.ejb.client.Client" required="true" />
		<composite:clientBehavior name="dialogReturn" event="dialogReturn" targets="search" />
		<composite:editableValueHolder name="input-client" />
	</composite:interface>

	<composite:implementation>
		<div id="#{cc.clientId}" class="form-group">
			<p:outputLabel id="label" for="input-client" value="#{cc.attrs.label}" />
			<div class="inputgroup">
				<p:inputText id="input-client" value="#{cc.attrs.value.name}" required="#{cc.attrs.required}" binding="#{cc.input}" styleClass="input-client" />
				<p:commandButton id="clean" action="#{cc.clean}" process="@this" update="#{cc.clientId}" styleClass="btn-gray" icon="fa fa-times"
					binding="#{cc.cleanButton}" />
				<p:commandButton id="search" action="#{cc.attrs.search}" process="@this" icon="fa fa-search" styleClass="green-button">
					<p:resetInput target="input-client" />
				</p:commandButton>
			</div>
			<p:message id="message" for="input-client" />
		</div>
	</composite:implementation>
</ui:component>
