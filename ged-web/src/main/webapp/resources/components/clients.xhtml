<ui:component xmlns="http://www.w3.org/1999/xhtml" 
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" 
	xmlns:p="http://primefaces.org/ui"
	xmlns:composite="http://xmlns.jcp.org/jsf/composite" 
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:o="http://omnifaces.org/ui" 
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

	<composite:interface>
		<composite:attribute name="clients" required="true" />
		<composite:attribute name="rendered" required="false" />
		<composite:attribute name="styleClass" required="false" default="" />
		<composite:attribute name="title" required="false" default="#{i18n['client.clients']}" />
	</composite:interface>

	<composite:implementation>
		<h:panelGroup layout="block" styleClass="clients #{cc.attrs.styleClass}"
			rendered="#{cc.attrs.rendered}">
			<div class="panel">
				<div class="panel-header">
					<div class="panel-header-title">#{cc.attrs.title}</div>
				</div>
				<div class="panel-content">
					<p:dataTable var="client" id="clients" value="#{cc.attrs.clients}"
						emptyMessage="#{i18n['client.no_clients_found']}" reflow="true" paginator="true" paginatorPosition="bottom"
						rows="#{sessionUser.rowsPerPage}" sortBy="#{client.name}" sortOrder="ascending">

						<p:column headerText="#{i18n['client.name']}" sortBy="#{client.name}">
							<h:link value="#{client.name}" outcome="/faces/client/client">
								<f:param name="clientId" value="#{client.id}" />
							</h:link>
						</p:column>

						<p:column headerText="#{i18n['client.phone_number']}" sortBy="#{client.phoneNumber}">
							<h:outputText value="#{client.phoneNumber}" />
						</p:column>

						<p:column headerText="#{i18n['client.cif']}" sortBy="#{client.cif}">
							<h:outputText value="#{client.cif}" />
						</p:column>

						<p:column headerText="#{i18n['client.city']}" sortBy="#{client.address.city}">
							<h:outputText value="#{client.address.city}" />
						</p:column>

						<p:column headerText="#{i18n['client.state']}" sortBy="#{client.address.state}">
							<h:outputText value="#{client.address.state}" />
						</p:column>

						<p:column headerText="#{i18n['client.owner']}" sortBy="#{client.owner.fullName}">
							<h:link value="#{client.owner.fullName}" outcome="/faces/user/user">
								<f:param name="userId" value="#{client.owner.id}" />
							</h:link>
						</p:column>
					</p:dataTable>
				</div>
				<h:panelGroup layout="block" styleClass="panel-footer"
					rendered="#{component.findComponent('children').childCount > 0}">
					<h:panelGroup id="children" styleClass="panel-buttons">
						<composite:insertChildren />
					</h:panelGroup>
				</h:panelGroup>
			</div>
		</h:panelGroup>
	</composite:implementation>
</ui:component>
