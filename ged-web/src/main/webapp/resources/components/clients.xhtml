<?xml version="1.0" encoding="UTF-8"?>
<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core" 
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:composite="http://xmlns.jcp.org/jsf/composite" 
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:g="http://ged.org/ui" 
	xmlns:h="http://java.sun.com/jsf/html" 
	xmlns:o="http://omnifaces.org/ui"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://java.sun.com/jsf/facelets">

	<composite:interface>
		<composite:attribute name="clients" required="true" />
		<composite:attribute name="styleClass" required="false" default="" />
		<composite:attribute name="title" required="false" default="#{i18n['client.clients']}" />
	</composite:interface>

	<composite:implementation>
		<div id="#{cc.clientId}" style="height:100%">
			<p:panel header="#{cc.attrs.title}" styleClass="clients #{cc.attrs.styleClass}">
				<p:dataTable var="client" id="clients" value="#{cc.attrs.clients}" emptyMessage="#{i18n['client.no_clients_found']}"
					reflow="true" paginator="true" paginatorPosition="bottom" rows="#{sessionUser.rowsPerPage}" sortBy="#{client.name}"
					sortOrder="ascending">
					<p:column headerText="#{i18n['client.name']}" sortBy="#{client.name}">
						<h:link value="#{client.name}" outcome="#{Page.CLIENT.getUrl()}">
							<f:param name="id" value="#{client.id}" />
						</h:link>
					</p:column>
					<p:column headerText="#{i18n['client.phone_number']}" sortBy="#{client.phoneNumber}">
						<h:outputText value="#{client.phoneNumber}" />
					</p:column>
					<p:column headerText="#{i18n['client.cif']}" sortBy="#{client.cif}">
						<h:outputText value="#{client.cif}" />
					</p:column>
					<p:column headerText="#{i18n['client.city']}" sortBy="#{client.address.city}">
						<h:outputText value="#{client.address.city} " /> <h:panelGroup rendered="#{not empty client.address.state}">(<h:outputText value="#{client.address.state}" />)</h:panelGroup>
					</p:column>
					<p:column headerText="#{i18n['client.owner']}" sortBy="#{client.owner.fullName}">
						<h:link value="#{client.owner.fullName}" outcome="#{Page.USER_SEARCH.getUrl()}">
							<f:param name="id" value="#{client.owner.id}" />
						</h:link>
					</p:column>
				</p:dataTable>
				<f:facet name="footer">
					<h:panelGroup id="children" styleClass="panel-buttons">
						<composite:insertChildren />
					</h:panelGroup>
				</f:facet>
			</p:panel>
		</div>
	</composite:implementation>
</ui:component>
