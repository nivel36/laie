<ui:component xmlns="http://www.w3.org/1999/xhtml" xmlns:composite="http://xmlns.jcp.org/jsf/composite"
	xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" xmlns:o="http://omnifaces.org/ui"
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

	<composite:interface>
		<composite:attribute name="label" required="true" />
		<composite:attribute name="value" required="true" />
		<composite:attribute name="styleClass" required="false" default="" />
		<composite:editableValueHolder name="element" targets="text" />
	</composite:interface>

	<composite:implementation>
		<div id="#{cc.clientId}" class="data  #{cc.attrs.styleClass}">
			<div class="label">#{cc.attrs.label}</div>
			<div class="input">
				<h:panelGroup layout="block" styleClass="text" rendered="#{not empty cc.attrs.value}">
					<h:outputText id="text" value="#{cc.attrs.value}" />
				</h:panelGroup>
				<h:panelGroup layout="block" styleClass="text" rendered="#{empty cc.attrs.value}"> --- </h:panelGroup>
			</div>
		</div>
	</composite:implementation>
</ui:component>
