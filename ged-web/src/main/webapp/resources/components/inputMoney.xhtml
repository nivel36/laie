<ui:component xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui"
	xmlns:composite="http://xmlns.jcp.org/jsf/composite" xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:o="http://omnifaces.org/ui" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

	<composite:interface>
		<composite:attribute name="name" />
		<composite:attribute name="label" required="true" />
		<composite:attribute name="value" required="true" />
		<composite:attribute name="min" default="0" />
		<composite:attribute name="max" default="100" /> 
		<composite:attribute name="showIcon" type="java.lang.Boolean" default="true" />
		<composite:attribute name="required" />
		<composite:attribute name="styleClass" required="false" default="" />
	</composite:interface>

	<composite:implementation>
		<div id="#{cc.clientId}" class="input-group input-group-money #{cc.attrs.styleClass}">
			<div class="label-container">
				<p:outputLabel value="#{cc.attrs.label}" for="inputNumber" styleClass="label" />
			</div>
			<div class="input-container">
				<p:inputNumber id="inputNumber" name="#{cc.attrs.name}" value="#{cc.attrs.value}" required="#{cc.attrs.required}"
					min="#{cc.attrs.min}" max="#{cc.attrs.max}" inputStyleClass="input input-money" />
				<h:panelGroup layout="block" styleClass="icon-field" rendered="#{not empty cc.attrs.showIcon}">
					<i class="icon right-icon fa fa-euro" aria-hidden="true"></i>
				</h:panelGroup>
			</div>
			<div class="message-container">
				<p:message id="message" for="inputNumber" styleClass="message-error" />
			</div>
		</div>
	</composite:implementation>
</ui:component>
