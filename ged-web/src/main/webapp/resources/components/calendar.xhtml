<ui:component xmlns="http://www.w3.org/1999/xhtml" 
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" 
	xmlns:p="http://primefaces.org/ui"
	xmlns:composite="http://xmlns.jcp.org/jsf/composite" 
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:o="http://omnifaces.org/ui" 
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

	<composite:interface>
		<composite:attribute name="label" required="true" />
		<composite:attribute name="value" required="true" />
		<composite:attribute name="yearRange" default="c-5:c+1" />
		<composite:attribute name="required" default="false" />
		<composite:attribute name="rendered" default="true" />
		<composite:attribute name="validator" targets="calendar" />
		<composite:attribute name="styleClass" required="false" default="" />
	</composite:interface>

	<composite:implementation>
		<h:panelGroup layout="block" styleClass="input-group input-group-calendar #{cc.attrs.styleClass}"
			rendered="#{cc.attrs.rendered}">
			<div class="label-container">
				<p:outputLabel id="label" for="calendar" value="#{cc.attrs.label}" styleClass="label" />
			</div>
			<div class="input-container">
				<p:calendar id="calendar" value="#{cc.attrs.value}" pattern="dd/MM/yyyy" navigator="true"
					yearRange="#{cc.attrs.yearRange}" required="#{cc.attrs.required}" styleClass="input calendar">
					<f:convertDateTime type="localDate" pattern="dd/MM/yyyy" />
				</p:calendar>
				<i class="icon fa fa-calendar" aria-hidden="true"></i>
			</div>
			<div class="message-container">
				<p:message id="message" for="calendar" styleClass="message-error" />
			</div>
		</h:panelGroup>
	</composite:implementation>
</ui:component>
