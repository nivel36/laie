<ui:component xmlns="http://www.w3.org/1999/xhtml" 
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" 
	xmlns:p="http://primefaces.org/ui"
	xmlns:composite="http://xmlns.jcp.org/jsf/composite" 
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:o="http://omnifaces.org/ui" 
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

	<composite:interface>
		<composite:attribute name="label" required="true" />
		<composite:attribute name="required" default="false" />
		<composite:attribute name="rendered" default="true" />
		<composite:attribute name="validator" targets="input-text" />
		<composite:attribute name="value" required="true" />
		<composite:attribute name="styleClass" required="false" default="" />
		<composite:editableValueHolder name="input-text" />
	</composite:interface>

	<composite:implementation>
		<h:panelGroup id="#{cc.clientId}" layout="block" styleClass="input-group input-text #{cc.attrs.styleClass}"
			rendered="#{cc.attrs.rendered}">
			<div class="label">
				<p:outputLabel id="label" for="input-text" value="#{cc.attrs.label}" />
			</div>
			<div class="input">
				<p:inputText id="input-text" value="#{cc.attrs.value}" required="#{cc.attrs.required}"
					styleClass="#{cc.attrs.inputStyleClass}" />
			</div>
			<div class="message-error">
				<p:message id="message" for="input-text" />
			</div>
		</h:panelGroup>
	</composite:implementation>
</ui:component>
