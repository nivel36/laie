<ui:component xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:composite="http://xmlns.jcp.org/jsf/composite"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" xmlns:o="http://omnifaces.org/ui" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

	<composite:interface>
		<composite:attribute name="type" default="text" />
		<composite:attribute name="label" />
		<composite:attribute name="icon"  />
		<composite:attribute name="iconPosition" default="left" />
		<composite:attribute name="required" type="java.lang.Boolean" default="false" />
		<composite:attribute name="validator" targets="input" />
		<composite:attribute name="value" required="true" />
		<composite:attribute name="styleClass"  default="" />
		<composite:editableValueHolder name="input" targets="input" />
	</composite:interface>

	<composite:implementation>
		<div id="#{cc.clientId}" class="input-group input-group-text #{styleClass}">

			<h:panelGroup layout="block" styleClass="label-container" rendered="#{not empty label}">
				<p:outputLabel id="label" for="input" value="#{label}" styleClass="label" />
			</h:panelGroup>

			<div class="input-container">
				<h:panelGroup layout="block" rendered="#{not empty icon}" styleClass="input-icon">
					<em class="icon #{iconPosition eq 'left' ? 'left-icon' : 'right-icon'} fa #{icon}" />
				</h:panelGroup>
				<c:choose>
					<c:when test="#{type eq 'text'}">
						<p:inputText id="input" value="#{value}" required="#{required}"
							styleClass="input input-text #{inputStyleClass}" />
					</c:when>
				</c:choose>
			</div>

			<h:panelGroup layout="block" class="message-container" rendered="#{!component.findComponent('input').valid}">
				<p:message id="message" for="input" styleClass="message-error" />
			</h:panelGroup>
		</div>
	</composite:implementation>
</ui:component>
