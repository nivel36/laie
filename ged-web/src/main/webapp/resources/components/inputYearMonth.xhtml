<ui:component xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui"
	xmlns:composite="http://xmlns.jcp.org/jsf/composite" xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:o="http://omnifaces.org/ui" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

	<composite:interface componentType="inputYearMonth">
		<composite:attribute name="labelIcon" required="false" />
		<composite:attribute name="label" required="false" />
		<composite:attribute name="required" default="false" />
		<composite:attribute name="rendered" default="true" />
		<composite:attribute name="validator" targets="input-text" />
		<composite:attribute name="value" type="ged.web.core.YearMonthDto" required="true" />
		<composite:attribute name="plusYear" type="java.lang.Integer" required="false" default="0" />
		<composite:attribute name="minusYear" type="java.lang.Integer" required="false" default="20" />
		<composite:attribute name="styleClass" required="false" default="" />
		<composite:attribute name="showMonths" type="java.lang.Boolean" required="false" default="false" />
	</composite:interface>

	<composite:implementation>
		<h:panelGroup layout="block" rendered="#{cc.attrs.rendered}">
			<div id="#{cc.clientId}" class="input-group input-year-month #{cc.attrs.styleClass}">
				<h:panelGroup layout="block" styleClass="label-icon-container" rendered="#{not empty cc.attrs.labelIcon}">
					<em class="label-icon icon fa #{cc.attrs.labelIcon}" />
				</h:panelGroup>
				<h:panelGroup layout="block" styleClass="label-container" rendered="#{not empty cc.attrs.label}">
					<p:outputLabel id="label" for="month" value="#{cc.attrs.label}" styleClass="label" />
				</h:panelGroup>
				<div class="input-container">
					<p:selectOneMenu id="month" value="#{cc.attrs.value.month}" required="#{cc.attrs.required}"
						rendered="#{cc.attrs.showMonths}">
						<f:selectItem itemLabel="#{i18n['date.month']}" itemValue="" />
						<f:selectItems var="month" value="#{cc.months}" itemValue="#{month.monthNumber}" itemLabel="#{month.monthName}" />
					</p:selectOneMenu>
					<p:selectOneMenu id="year" value="#{cc.attrs.value.year}" required="#{cc.attrs.required}">
						<f:selectItem itemLabel="#{i18n['date.year']}" itemValue="" />
						<f:selectItems var="year" value="#{cc.years}" itemValue="#{year}" itemLabel="#{year}" />
					</p:selectOneMenu>
				</div>
				<div class="message-container">
					<p:message id="message" for="month" styleClass="message-error" />
				</div>
			</div>
		</h:panelGroup>
	</composite:implementation>
</ui:component>
