<ui:component xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui"
	xmlns:composite="http://xmlns.jcp.org/jsf/composite" xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:o="http://omnifaces.org/ui" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

	<composite:interface componentType="inputPerson">
		<composite:attribute name="label" />
		<composite:attribute name="value" type="ged.ejb.person.Person" required="true" />
		<composite:attribute name="completeMethod" method-signature="void function(java.lang.String)" required="true" />
		<composite:attribute name="required" type="java.lang.Boolean" default="false" />
		<composite:attribute name="showIcon" type="java.lang.Boolean" default="true" />
		<composite:attribute name="disabled" type="java.lang.Boolean" default="false" />
		<composite:attribute name="styleClass" required="false" default="" />
		<composite:clientBehavior name="selectPerson" targets="input" event="select" />
		<composite:editableValueHolder name="input" />
	</composite:interface>

	<composite:implementation>
		<div id="#{cc.clientId}" class="input-group input-group-user #{cc.attrs.styleClass}">
			<div class="label-container">
				<p:outputLabel id="label" value="#{cc.attrs.label}" for="input" styleClass="label" />
			</div>
			<div class="input-container">
				<p:autoComplete id="input" value="#{cc.attrs.value}" required="#{cc.attrs.required}" binding="#{cc.input}"
					completeMethod="#{cc.attrs.completeMethod}" forceSelection="true" minQueryLength="3"
					var="person" itemLabel="#{person.fullName}" itemValue="#{person}" disabled="#{cc.attrs.disabled}"
					converter="personConverter" maxResults="9" inputStyleClass="input input-person">
					<p:column styleClass="select-person image">
						<cc:avatar styleClass="image-icon" value="#{person.imageFileName}" />
					</p:column>
					<p:column styleClass="select-person name">
						<h:outputText value="#{person.fullName}" />
					</p:column>
					<p:ajax event="itemSelect" update="#{cc.clientId}" process="input" />
				</p:autoComplete>
				<p:commandButton id="cleanButton" process="@this" update="#{cc.clientId}" action="#{cc.clean}" styleClass="btn-gray"
					icon="fa fa-times" binding="#{cc.cleanButton}">
				</p:commandButton>
				<h:panelGroup layout="block" styleClass="icon-field" rendered="#{not empty cc.attrs.showIcon}">
					<i class="icon right-icon fa fa-search" aria-hidden="true"></i>
				</h:panelGroup>
			</div>
			<div class="message-container">
				<p:message id="message" for="input" styleClass="message-error" />
			</div>
		</div>
	</composite:implementation>
</ui:component>
