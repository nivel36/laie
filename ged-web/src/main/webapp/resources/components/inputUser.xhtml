<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:i18n="http://ged.com/i18n" xmlns:composite="http://xmlns.jcp.org/jsf/composite">

<composite:interface>
	<composite:attribute name="name" />
	<composite:attribute name="label" required="true" />
	<composite:attribute name="value" required="true" />
	<composite:attribute name="completeMethod" method-signature="void function(java.lang.String)" required="true" />
	<composite:attribute name="required" />
</composite:interface>

<composite:implementation>
	<h:panelGroup id="userGroup" layout="block" styleClass="form-group">
		<p:outputLabel value="#{cc.attrs.label}" for="inputUser" />
		<div class="ui-inputgroup">
			<p:autoComplete id="inputUser" value="#{cc.attrs.value}" completeMethod="#{cc.attrs.completeMethod}" var="user" itemLabel="#{user.fullName}"
				itemValue="#{user}" forceSelection="true">
				<p:column styleClass="user-select image">
					<p:graphicImage class="image image-icon" value="/images/#{user.imageFileName}" rendered="#{not empty user.imageFileName}" />
					<p:graphicImage class="image image-icon" value="/resources/img/default-avatar.png" rendered="#{empty user.imageFileName}" />
				</p:column>
				<p:column styleClass="user-select name">
					<h:outputText value="#{user.fullName}" />
				</p:column>
				<p:ajax event="itemSelect" update="userGroup" process="#{cc.attrs.name}" />
			</p:autoComplete>
			<p:commandButton id="cleanUserButton" process="@this" update="userGroup" styleClass="btn-gray" icon="fa fa-times" rendered="#{not empty cc.attrs.value}" >
				<p:resetInput target="#{cc.attrs.name}" />
			</p:commandButton>
		</div>
		<p:message for="inputUser" />
	</h:panelGroup>
</composite:implementation>
</html>
