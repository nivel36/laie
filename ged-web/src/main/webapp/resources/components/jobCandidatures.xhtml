<?xml version="1.0" encoding="UTF-8"?>
<ui:component xmlns="http://www.w3.org/1999/xhtml" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" xmlns:composite="http://xmlns.jcp.org/jsf/composite"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:g="http://ged.org/ui" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui" xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://java.sun.com/jsf/facelets">

	<composite:interface>
		<composite:attribute name="value" required="true" />
		<composite:attribute name="showCandidate" default="true" />
		<composite:attribute name="showJobOffer" default="true" />
		<composite:attribute name="styleClass" required="false" default="" />
		<composite:attribute name="title" required="false" default="#{i18n['job_candidature.job_candidatures']}" />
		<composite:attribute name="rows" required="false" default="#{sessionUser.rowsPerPage}" />
	</composite:interface>

	<composite:implementation>
		<div id="#{cc.clientId}" class="card card-w-title jobCandidatures #{cc.attrs.styleClass}">
			<h5>#{cc.attrs.title}</h5>

			<p:dataTable var="jobCandidature" value="#{cc.attrs.value}"
				emptyMessage="#{i18n['job_candidature.no_job_candidatures_found']}" reflow="true" paginator="true"
				paginatorPosition="bottom" rows="#{cc.attrs.rows}" sortBy="#{jobOffer.title}" sortOrder="ascending"
				styleClass="ui-datatable-borderless">

				<p:column headerText="#{i18n['job_candidature.job_offer']}" rendered="#{cc.attrs.showJobOffer}">
					<h:link value="#{jobCandidature.jobOffer.title}" outcome="#{Page.JOB.getUrl()}">
						<f:param name="id" value="#{jobCandidature.jobOffer.uid}" />
					</h:link>
					<span class="job_address">#{jobCandidature.jobOffer.address.city}
						(#{jobCandidature.jobOffer.address.region})</span>
				</p:column>
				<p:column headerText="#{i18n['job_candidature.client']}" rendered="#{cc.attrs.showJobOffer}">
					<h:link value="#{jobCandidature.jobOffer.client.name}" outcome="#{Page.CLIENT.getUrl()}">
						<f:param name="id" value="#{jobCandidature.jobOffer.client.uid}" />
					</h:link>
				</p:column>
				<p:column rendered="#{cc.attrs.showCandidate}">
					<cc:avatar value="#{jobCandidature.candidate.picture}" styleClass="small" />
				</p:column>
				<p:column headerText="#{i18n['job_candidature.candidate']}" rendered="#{cc.attrs.showCandidate}">
					<h:link value="#{jobCandidature.candidate.fullName}" outcome="#{Page.CANDIDATE.getUrl()}">
						<f:param name="id" value="#{jobCandidature.candidate.uid}" />
					</h:link>
				</p:column>
				<p:column headerText="#{i18n['candidate.rating']}" rendered="#{cc.attrs.showCandidate}">
					<p:rating value="#{jobCandidature.candidate.rating}" cancel="false" readonly="true" />
				</p:column>
				<p:column headerText="#{i18n['job_candidature.job_candidature_state']}">
					<p:link outcome="#{Page.EVENT_ADD.getUrl()}">
						<f:param name="jobCandidatureId" value="#{jobCandidature.uid}" />
						<div class="tag #{jobCandidature.state.color}">#{i18n[jobCandidature.state.name]}</div>
					</p:link>
				</p:column>
			</p:dataTable>
			<div class="buttons">
				<composite:insertChildren />
			</div>
		</div>
	</composite:implementation>
</ui:component>
