<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core" 
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:composite="http://xmlns.jcp.org/jsf/composite" 
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:g="http://ged.org/ui" 
	xmlns:h="http://java.sun.com/jsf/html" 
	xmlns:o="http://omnifaces.org/ui"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://java.sun.com/jsf/facelets">

	<composite:interface>
		<composite:attribute name="jobCandidatures" required="true" />
		<composite:attribute name="showCandidate" default="true" />
		<composite:attribute name="showJobOffer" default="true" />
		<composite:attribute name="styleClass" required="false" default="" />
		<composite:attribute name="title" required="false" default="#{i18n['job_candidature.job_candidatures']}" />
	</composite:interface>

	<composite:implementation>
		<div id="#{cc.clientId}" >
			<p:panel header="#{cc.attrs.title}">
				<p:dataTable var="jobCandidature" value="#{cc.attrs.jobCandidatures}"
					emptyMessage="#{i18n['job_candidature.no_job_candidatures_found']}" reflow="true" paginator="true" paginatorPosition="bottom"
					rows="#{sessionUser.rowsPerPage}" sortBy="#{jobOffer.name}" sortOrder="ascending">
					<p:column headerText="#{i18n['job_candidature.job_offer']}" rendered="#{cc.attrs.showJobOffer}">
						<h:link value="#{jobCandidature.jobOffer.name}" outcome="#{Page.JOB.getUrl()}">
							<f:param name="id" value="#{jobCandidature.jobOffer.id}" />
						</h:link>
						<span class="job_address">#{jobCandidature.jobOffer.address.city} (#{jobCandidature.jobOffer.address.state})</span>
					</p:column>
					<p:column headerText="#{i18n['job_candidature.client']}" rendered="#{cc.attrs.showJobOffer}">
						<h:link value="#{jobCandidature.jobOffer.client.name}" outcome="#{Page.CLIENT.getUrl()}">
							<f:param name="id" value="#{jobCandidature.jobOffer.client.id}" />
						</h:link>
					</p:column>
					<p:column rendered="#{cc.attrs.showCandidate}">
						<cc:avatar value="#{jobCandidature.candidate.imageFileName}" styleClass="image-icon" />
					</p:column>
					<p:column headerText="#{i18n['job_candidature.candidate']}" rendered="#{cc.attrs.showCandidate}">
						<h:link value="#{jobCandidature.candidate.fullName}" outcome="#{Page.CANDIDATE.getUrl()}">
							<f:param name="id" value="#{jobCandidature.candidate.id}" />
						</h:link>
					</p:column>
					<p:column headerText="#{i18n['candidate.rating']}" rendered="#{cc.attrs.showCandidate}">
						<p:rating value="#{jobCandidature.candidate.rating}" cancel="false" readonly="true" />
					</p:column>
					<p:column headerText="#{i18n['job_candidature.job_candidature_state']}">
						<div class="tag #{jobCandidature.jobCandidatureState.color}">#{g:translate(jobCandidature.jobCandidatureState.name)}</div>
					</p:column>
				</p:dataTable>
			
				<h:panelGroup layout="block" class="panel-footer" rendered="#{component.findComponent('children').childCount > 0}">
					<h:panelGroup id="children" styleClass="panel-buttons">
						<composite:insertChildren />
					</h:panelGroup>
				</h:panelGroup>
			</p:panel>
		</div>
	</composite:implementation>
</ui:component>
