<ui:component xmlns="http://www.w3.org/1999/xhtml" 
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" 
	xmlns:p="http://primefaces.org/ui"
	xmlns:composite="http://xmlns.jcp.org/jsf/composite" 
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:o="http://omnifaces.org/ui" 
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

	<composite:interface>
		<composite:attribute name="user" type="ged.ejb.user.User" required="true" />
		<composite:attribute name="rendered" required="false" />
	</composite:interface>

	<composite:implementation>
		<h:panelGroup id="#{cc.clientId}" class="user-minicard" rendered="#{not empty cc.attrs.rendered}">
			<p:link outcome="/faces/user/user">
				<f:param name="userId" value="#{cc.attrs.user.id}" />
				<cc:avatar styleClass="user-minicard-image" imageFileName="#{cc.attrs.user.imageFileName}" />
				<div class="user-minicard-info">
					<h:panelGroup layout="block" styleClass="name">#{cc.attrs.user}</h:panelGroup>
				</div>
			</p:link>
		</h:panelGroup>

	</composite:implementation>
</ui:component>
