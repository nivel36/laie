<ui:component xmlns="http://www.w3.org/1999/xhtml" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" xmlns:composite="http://xmlns.jcp.org/jsf/composite"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:g="http://ged.org/ui" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui" xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://java.sun.com/jsf/facelets">

	<composite:interface>
		<composite:attribute name="value" required="true" />

		<composite:attribute name="styleClass" required="false" default="" />
		<composite:attribute name="title" required="false" default="#{i18n['meeting.meetings']}" />
	</composite:interface>

	<composite:implementation>
		<div id="#{cc.clientId}" class="panel meetings #{cc.attrs.styleClass}">
			<div class="panel-header">
				<div class="panel-header-title">#{cc.attrs.title}</div>
			</div>
			<div class="panel-content">
				<ui:repeat var="meeting" value="#{cc.attrs.value}">
					<cc:meeting value="#{meeting}" />
				</ui:repeat>
			</div>
		</div>
	</composite:implementation>
</ui:component>
