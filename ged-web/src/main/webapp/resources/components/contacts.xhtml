<ui:component xmlns="http://www.w3.org/1999/xhtml" 
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" 
	xmlns:p="http://primefaces.org/ui"
	xmlns:composite="http://xmlns.jcp.org/jsf/composite" 
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:o="http://omnifaces.org/ui" 
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

	<composite:interface>
		<composite:attribute name="contacts" type="java.util.List" required="true" />
		<composite:attribute name="rendered" required="false" />
		<composite:attribute name="styleClass" required="false" default="" />
		<composite:attribute name="title" required="false" default="#{i18n['client.contacts']}" />
	</composite:interface>

	<composite:implementation>
		<h:panelGroup layout="block" rendered="#{cc.attrs.rendered}">
			<div id="#{cc.clientId}" class="panel contacts #{cc.attrs.styleClass}">
				<div class="panel-header">
					<div class="panel-header-title">#{cc.attrs.title}</div>
				</div>
				<div class="panel-content">
					<p:dataGrid layout="grid" var="contact" value="#{cc.attrs.contacts}"
						emptyMessage="#{i18n['client.no_contacts_found']}" paginator="true" paginatorPosition="bottom">
						<div class="card contact">
							<div class="image">
								<p:graphicImage class="image image-icon" value="/resources/img/default-avatar.png" />
							</div>
							<div class="container">
								<h4>#{contact.fullName}</h4>
								<h5>#{contact.position}</h5>
								<div class="contact-info">
									<p class="email">#{contact.email}</p>
									<p class="phone">#{contact.phoneNumber}</p>
								</div>
							</div>
						</div>
					</p:dataGrid>
				</div>
				<h:panelGroup layout="block" class="panel-footer" rendered="#{component.findComponent('children').childCount > 0}">
					<h:panelGroup id="children" styleClass="panel-buttons">
						<composite:insertChildren />
					</h:panelGroup>
				</h:panelGroup>
			</div>
		</h:panelGroup>
	</composite:implementation>
</ui:component>
