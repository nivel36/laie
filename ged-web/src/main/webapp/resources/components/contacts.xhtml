<?xml version="1.0" encoding="UTF-8"?>
<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:composite="http://xmlns.jcp.org/jsf/composite"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:g="http://ged.org/ui"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://java.sun.com/jsf/facelets">

	<composite:interface>
		<composite:attribute name="value" type="java.util.List"
			required="true" />
		<composite:attribute name="styleClass" required="false" default="" />
		<composite:attribute name="title" required="false"
			default="#{i18n['client.contacts']}" />
		<composite:attribute name="rows" required="false"
			default="#{sessionUser.rowsPerPage}" />
	</composite:interface>

	<composite:implementation>
		<div id="#{cc.clientId}"
			class="card card-w-title contacts #{cc.attrs.styleClass}">
			<h5>#{cc.attrs.title}</h5>

			<p:dataTable var="contact" value="#{cc.attrs.value}"
				emptyMessage="#{i18n['client.no_contacts_found']}" paginator="true"
				paginatorPosition="bottom" styleClass="ui-datatable-borderless"
				rows="#{cc.attrs.rows}">
				<p:column headerText="#{i18n['contact.name']}"
					sortBy="#{contact.name}">
						 #{contact.name} #{contact.surname}
						</p:column>
				<p:column headerText="#{i18n['contact.email']}">
						#{contact.email}
						</p:column>
				<p:column headerText="#{i18n['contact.position']}">
						#{contact.position}
						</p:column>
			</p:dataTable>
		</div>
	</composite:implementation>
</ui:component>
