<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:i18n="http://legion.com/i18n"
	xmlns:composite="http://java.sun.com/jsf/composite">

<composite:interface>
	<composite:attribute name="contacts" required="true" />
</composite:interface>

<composite:implementation>
	<p:panel id="contacts" header="#{i18n['client.contacts']}">
		<p:dataGrid layout="grid" var="contact" value="#{cc.attrs.contacts}" emptyMessage="#{i18n['client.no_contacts_found']}" paginator="true"
			paginatorPosition="bottom">
			<div class="card contact">
				<div class="image">
					<p:graphicImage class="image image-icon" value="/resources/img/default-avatar.png" />
				</div>
				<div class="container">
					<h4>#{contact.fullName}</h4>
					<h5>#{contact.position}</h5>
					<div class="contact-info">
						<p class="email">#{contact.email}</p>
						<p class="phone">#{contact.phoneNumber}</p>
					</div>
				</div>
			</div>
		</p:dataGrid>
		<div class="pull-right">
			<composite:insertChildren />
		</div>
	</p:panel>
</composite:implementation>
</html>
