<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:composite="http://xmlns.jcp.org/jsf/composite">

<composite:interface componentType="inputSearch">
	<composite:attribute name="name" />
	<composite:attribute name="searchText" required="true" />
	<composite:attribute name="searchAction" method-signature="void action()" required="true" />
	<composite:attribute name="update" required="true" />
</composite:interface>

<composite:implementation>
	<h:panelGroup id="#{cc.clientId}" layout="block" styleClass="form-group">
		<p:defaultCommand target="searchButton" />
		<p:inputText id="searchText" value="#{cc.attrs.searchText}" binding="#{cc.searchInputText}" />
		<p:button id="cleanSearchButton" action="#{cc.clean}" styleClass="btn-gray" icon="fa fa-times" rendered="#{not empty cc.attrs.searchText}" process="@this" />
		<p:commandButton id="searchButton" action="#{cc.attrs.searchAction}" process="@this searchText" styleClass="green-button" icon="fa fa-search"
			binding="#{cc.searchCommandButton}" update="#{cc.attrs.update}" />
	</h:panelGroup>
</composite:implementation>
</html>
