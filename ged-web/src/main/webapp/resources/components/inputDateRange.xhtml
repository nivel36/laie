<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:i18n="http://ged.com/i18n" xmlns:o="http://omnifaces.org/ui"
	xmlns:composite="http://xmlns.jcp.org/jsf/composite">

<composite:interface componentType="inputDateRange">
	<composite:attribute name="fromYear" type="java.lang.Integer" required="true" />
	<composite:attribute name="toYear" type="java.lang.Integer" required="true" />
	<composite:attribute name="fromMonth" type="java.lang.Integer" />
	<composite:attribute name="toMonth" type="java.lang.Integer" />
	<composite:attribute name="plusYear" type="java.lang.Integer" required="false" default="0" />
	<composite:attribute name="minusYear" type="java.lang.Integer" required="false" default="20" />
	<composite:attribute name="showMonths" type="java.lang.Boolean" required="false" default="false" />
	<composite:attribute name="still" />
	<composite:attribute name="required" />
</composite:interface>

<composite:implementation>
	<h:panelGroup id="#{cc.clientId}" layout="block" styleClass="inputDateRange">
		<div class="grid">
			<div class="col-5">
				<div class="form-group">
					<p:outputLabel value="#{i18n['education.from_date']}" />
					<p:selectOneMenu id="fromMonth" value="#{cc.attrs.fromMonth}" required="#{cc.attrs.showMonths}" rendered="#{cc.attrs.showMonths}">
						<f:selectItem itemLabel="#{i18n['date.month']}" itemValue="" />
						<f:selectItems var="month" value="#{cc.months}" itemValue="#{month.monthNumber}" itemLabel="#{month.monthName}" />
					</p:selectOneMenu>
					<p:selectOneMenu id="fromYear" value="#{cc.attrs.fromYear}" required="true">
						<f:selectItem itemLabel="#{i18n['date.year']}" itemValue="" />
						<f:selectItems var="year" value="#{cc.years}" itemValue="#{year}" itemLabel="#{year}" />
					</p:selectOneMenu>
					<p:message for="fromYear" />
				</div>
			</div>

			<div class="col-5">
				<h:panelGroup id="endDate" class="form-group" layout="block">
					<p:outputLabel value="#{i18n['education.to_date']}" rendered="#{not cc.attrs.still}" />
					<p:selectOneMenu id="toMonth" value="#{cc.attrs.toMonth}" required="#{cc.attrs.showMonths}" rendered="#{cc.attrs.showMonths and not cc.attrs.still}">
						<f:selectItem itemLabel="#{i18n['date.month']}" itemValue="" />
						<f:selectItems var="month" value="#{cc.months}" itemValue="#{month.monthNumber}" itemLabel="#{month.monthName}" />
					</p:selectOneMenu>
					<p:selectOneMenu id="toYear" value="#{cc.attrs.toYear}" rendered="#{not cc.attrs.still}" required="true">
						<f:selectItem itemLabel="#{i18n['date.year']}" itemValue="" />
						<f:selectItems var="year" value="#{cc.years}" itemValue="#{year}" itemLabel="#{year}" />
					</p:selectOneMenu>
					<p:message for="toYear" />
				</h:panelGroup>
			</div>

			<div class="col-2">
				<div class="form-group">
					<p:outputLabel value="#{i18n['education.still_studying']}" />
					<p:selectBooleanCheckbox value="#{cc.attrs.still}" id="still">
						<f:ajax render="endDate" />
					</p:selectBooleanCheckbox>
				</div>
			</div>
			<o:validateMultiple id="validationDates" components="fromYear toYear still" validator="#{cc.validateDates}" message="#{i18n['education.error.dates']}"
				showMessageFor="toYear" />
		</div>
	</h:panelGroup>
</composite:implementation>
</html>
