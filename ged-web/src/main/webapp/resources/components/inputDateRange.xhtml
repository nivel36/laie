<ui:component xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui"
	xmlns:composite="http://xmlns.jcp.org/jsf/composite" xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:o="http://omnifaces.org/ui" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

	<composite:interface>
		<composite:attribute name="styleClass" required="false" default="" />
		<composite:attribute name="fromDate" type="ged.web.core.YearMonthDto" required="true" />
		<composite:attribute name="toDate" type="ged.web.core.YearMonthDto" required="true" />
		<composite:attribute name="plusYear" type="java.lang.Integer" required="false" default="0" />
		<composite:attribute name="minusYear" type="java.lang.Integer" required="false" default="20" />
		<composite:attribute name="showMonths" type="java.lang.Boolean" required="false" default="true" />
		<composite:attribute name="still" />
		<composite:attribute name="required" type="java.lang.Boolean" required="false" default="false" />
		<composite:attribute name="rendered" type="java.lang.Boolean" required="false" default="true" />
	</composite:interface>

	<composite:implementation>
		<h:panelGroup layout="block" rendered="#{cc.attrs.rendered}">
			<div id="#{cc.clientId}" class="input-date-range #{cc.attrs.styleClass}">

				<div class="from-date">
					<cc:inputYearMonth id="fromDate" label="#{i18n['education.from_date']}" value="#{cc.attrs.fromDate}"
						required="#{cc.attrs.required}" showMonths="#{cc.attrs.showMonths}" />
				</div>
				<div class="to-date">
					<cc:inputYearMonth id="toDate" label="#{i18n['education.to_date']}" value="#{cc.attrs.toDate}"
						required="#{cc.attrs.required}" showMonths="#{cc.attrs.showMonths}" rendered="#{cc.attrs.still}" />
				</div>
				<div class="still">
					<cc:inputCheckbox id="still" label="#{i18n['education.still_studying']}" value="#{cc.attrs.still}">
						<f:ajax event="change" render="toDate" />
					</cc:inputCheckbox>
				</div>
			</div>
		</h:panelGroup>
	</composite:implementation>
</ui:component>
