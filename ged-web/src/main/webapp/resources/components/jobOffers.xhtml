<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core" 
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:composite="http://xmlns.jcp.org/jsf/composite" 
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:g="http://ged.org/ui" 
	xmlns:h="http://java.sun.com/jsf/html" 
	xmlns:o="http://omnifaces.org/ui"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://java.sun.com/jsf/facelets">

	<composite:interface>
		<composite:attribute name="jobOffers" required="true" />
		<composite:attribute name="styleClass" required="false" default="" />
		<composite:attribute name="title" required="false" default="#{i18n['job.job_offers']}" />
	</composite:interface>

	<composite:implementation>
		<div id="#{cc.clientId}" class="card card-w-title">
			<h1>#{cc.attrs.title}</h1>

			<p:dataTable var="jobOffer" value="#{cc.attrs.jobOffers}" emptyMessage="#{i18n['job.no_jobs_found']}" reflow="true" paginator="true"
				paginatorPosition="bottom" paginatorTemplate="{PageLinks}" rows="#{sessionUser.rowsPerPage}" sortBy="#{jobOffer.name}"
				sortOrder="descending">

				<p:column headerText="#{i18n['job.name']}">
					<h:link value="#{jobOffer.name}" outcome="#{Page.JOB.getUrl()}">
						<f:param name="id" value="#{jobOffer.id}" />
					</h:link>
					<span class="job_address">#{jobOffer.address.city} (#{jobOffer.address.state})</span>
				</p:column>

				<p:column headerText="#{i18n['job.date_closed']}">
					<h:outputText value="#{jobOffer.dateClosed}">
						<f:convertDateTime pattern="dd / MM / yyyy" type="localDate" />
					</h:outputText>
				</p:column>

				<p:column headerText="#{i18n['job.owner']}">
					<h:link value="#{jobOffer.owner.fullName}" outcome="#{Page.USER_SEARCH.getUrl()}">
						<f:param name="id" value="#{jobOffer.owner.id}" />
					</h:link>
				</p:column>

				<p:column headerText="#{i18n['job.job_offer_state']}">
					<div class="tag #{jobOffer.jobOfferState.color}">#{g:translate(jobOffer.jobOfferState.name)}</div>
				</p:column>
			</p:dataTable>

			<f:facet name="footer">
				<h:panelGroup id="children" styleClass="panel-buttons">
					<composite:insertChildren />
				</h:panelGroup>
			</f:facet>
		</div>
	</composite:implementation>
</ui:component>
