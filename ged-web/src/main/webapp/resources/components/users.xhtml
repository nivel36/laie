<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core" 
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:composite="http://xmlns.jcp.org/jsf/composite" 
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:g="http://ged.org/ui" 
	xmlns:h="http://java.sun.com/jsf/html" 
	xmlns:o="http://omnifaces.org/ui"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://java.sun.com/jsf/facelets">

	<composite:interface>
		<composite:attribute name="users" required="true" />
		<composite:attribute name="styleClass" required="false" default="" />
		<composite:attribute name="title" required="false" default="#{i18n['user.users']}" />
	</composite:interface>

	<composite:implementation>
		<div id="#{cc.clientId}" class="panel users #{cc.attrs.styleClass}">
			<div class="panel-header">
				<div class="panel-header-title">#{cc.attrs.title}</div>
			</div>
			<div class="panel-content">
				<p:dataGrid layout="grid" var="user" value="#{cc.attrs.users}" emptyMessage="#{i18n['user.no_team']}"
					paginator="true" paginatorPosition="bottom" columns="2" rows="6" paginatorTemplate="{PageLinks}">
					<p:link outcome="#{Page.USER.getUrl()}">
						<f:param name="id" value="#{user.id}" />
						<g:person value="#{user}" showDescription="false" />
					</p:link>
				</p:dataGrid>
			</div>
			<h:panelGroup layout="block" styleClass="panel-footer"
				rendered="#{component.findComponent('children').childCount > 0}">
				<div id="children" class="panel-buttons">
					<composite:insertChildren />
				</div>
			</h:panelGroup>
		</div>
	</composite:implementation>
</ui:component>
