<ui:component xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui"
	xmlns:composite="http://xmlns.jcp.org/jsf/composite" xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:o="http://omnifaces.org/ui" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

	<composite:interface>
		<composite:attribute name="users" required="true" />
		<composite:attribute name="rendered" required="false" />
		<composite:attribute name="styleClass" required="false" default="" />
		<composite:attribute name="title" required="false" default="#{i18n['user.users']}" />
	</composite:interface>

	<composite:implementation>
		<h:panelGroup layout="block" rendered="#{cc.attrs.rendered}">
			<div id="#{cc.clientId}" class="panel users #{cc.attrs.styleClass}">
				<div class="panel-header">
					<div class="panel-header-title">#{cc.attrs.title}</div>
				</div>
				<div class="panel-content">
					<p:dataGrid layout="grid" var="user" value="#{cc.attrs.users}" emptyMessage="#{i18n['user.no_team']}"
						paginator="true" paginatorPosition="bottom" columns="2" rows="6" paginatorTemplate="{PageLinks}">
						<ui:include src="/user/userCard.xhtml">
							<ui:param name="user" value="#{user}" />
						</ui:include>
					</p:dataGrid>
				</div>
				<h:panelGroup layout="block" styleClass="panel-footer"
					rendered="#{component.findComponent('children').childCount > 0}">
					<div id="children" class="panel-buttons">
						<composite:insertChildren />
					</div>
				</h:panelGroup>
			</div>
		</h:panelGroup>
	</composite:implementation>
</ui:component>
