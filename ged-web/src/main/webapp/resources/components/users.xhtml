<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core" 
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:composite="http://xmlns.jcp.org/jsf/composite" 
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:g="http://ged.org/ui" 
	xmlns:h="http://java.sun.com/jsf/html" 
	xmlns:o="http://omnifaces.org/ui"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://java.sun.com/jsf/facelets">

	<composite:interface>
		<composite:attribute name="users" required="true" />
		<composite:attribute name="styleClass" required="false" default="" />
		<composite:attribute name="title" required="false" default="#{i18n['user.users']}" />
	</composite:interface>

	<composite:implementation>
		<div id="#{cc.clientId}">
			<p:panel header="#{cc.attrs.title}" styleClass="panel users #{cc.attrs.styleClass}">
				<p:dataList var="user" value="#{cc.attrs.users}" emptyMessage="#{i18n['user.no_team']}" paginator="true"
					paginator="true" paginatorPosition="bottom">
					<p:link outcome="#{Page.USER.getUrl()}">
						<f:param name="id" value="#{user.id}" />
						<cc:person value="#{user}" showDescription="false" />
					</p:link>
				</p:dataList>

				<h:panelGroup layout="block" styleClass="panel-footer" rendered="#{component.findComponent('children').childCount > 0}">
					<h:panelGroup id="children" styleClass="panel-buttons">
						<composite:insertChildren />
					<</h:panelGroup>
				</h:panelGroup>
			</p:panel>
		</div>
	</composite:implementation>
</ui:component>
