<ui:component xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:composite="http://xmlns.jcp.org/jsf/composite"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" xmlns:o="http://omnifaces.org/ui" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

	<composite:interface>
		<composite:attribute name="users" required="true" />
		<composite:attribute name="title" />
	</composite:interface>

	<composite:implementation>
		<h:panelGroup id="#{cc.clientId}" layout="block" styleClass="users">
			<p:panel id="users" header="#{empty cc.attrs.title ? i18n['user.users'] : cc.attrs.title}">
				<p:dataGrid layout="grid" var="user" value="#{cc.attrs.users}" emptyMessage="#{i18n['user.no_team']}" paginator="true" paginatorPosition="bottom"
					columns="2" rows="6">
					<ui:include src="/faces/user/userCard.xhtml">
						<ui:param name="user" value="#{user}" />
					</ui:include>
				</p:dataGrid>
				<h:panelGroup styleClass="form-action-primary" rendered="#{component.findComponent('children').childCount != 0}">
					<composite:insertChildren />
				</h:panelGroup>
			</p:panel>
		</h:panelGroup>
	</composite:implementation>
</ui:component>
