<ui:component xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:composite="http://xmlns.jcp.org/jsf/composite"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" xmlns:o="http://omnifaces.org/ui" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

	<composite:interface>
		<composite:attribute name="labelIcon" required="false" />
		<composite:attribute name="label" required="false" />
		<composite:attribute name="required" default="false" />
		<composite:attribute name="rendered" default="true" />
		<composite:attribute name="validator" targets="input-text-area" />
		<composite:attribute name="value" required="true" />
		<composite:attribute name="styleClass" required="false" default="" />
		<composite:editableValueHolder name="input-text-area" />
	</composite:interface>

	<composite:implementation>
		<h:panelGroup layout="block" rendered="#{cc.attrs.rendered}">
			<div id="#{cc.clientId}" class="input-group input-group-text-area #{cc.attrs.styleClass}">
				<h:panelGroup layout="block" styleClass="label-icon-container" rendered="#{not empty cc.attrs.labelIcon}">
					<em class="label-icon icon fa #{cc.attrs.labelIcon}" />
				</h:panelGroup>
				<h:panelGroup layout="block" styleClass="label-container" rendered="#{not empty cc.attrs.label}">
					<p:outputLabel id="label" for="input-text-area" value="#{cc.attrs.label}" styleClass="label" />
				</h:panelGroup>
				<div class="input-container">
					<p:textEditor id="input-text-area" value="#{cc.attrs.value}" required="#{cc.attrs.required}">
						<f:facet name="toolbar">
							<span class="ql-formats">
								<button class="ql-bold" />
								<button class="ql-italic" />
								<button class="ql-underline" />
							</span>
							<span class="ql-formats"> <select class="ql-color" /> <select class="ql-background" />
							</span>
							<span class="ql-formats">
								<button class="ql-script" value="sub" />
								<button class="ql-script" value="super" />
							</span>
							<span class="ql-formats">
								<button class="ql-header" value="1" />
								<button class="ql-header" value="2" />
								<button class="ql-blockquote" />
								<button class="ql-code-block" />
							</span>
							<span class="ql-formats">
								<button class="ql-list" value="ordered" />
								<button class="ql-list" value="bullet" />
								<button class="ql-indent" value="-1" />
								<button class="ql-indent" value="+1" />
							</span>
							<span class="ql-formats">
								<button class="ql-direction" value="rtl" /> <select class="ql-align" />
							</span>
							<span class="ql-formats">
								<button class="ql-clean" />
							</span>
						</f:facet>
					</p:textEditor>
				</div>
				<div class="message-container">
					<p:message id="message" for="input-text-area" styleClass="message-error" />
				</div>
			</div>
		</h:panelGroup>

	</composite:implementation>
</ui:component>
