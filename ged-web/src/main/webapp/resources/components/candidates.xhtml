<?xml version="1.0" encoding="UTF-8"?>
<ui:component xmlns="http://www.w3.org/1999/xhtml" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core" xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:composite="http://xmlns.jcp.org/jsf/composite" xmlns:f="http://java.sun.com/jsf/core" xmlns:g="http://ged.org/ui" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui" xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" xmlns:ui="http://java.sun.com/jsf/facelets">

	<composite:interface>
		<composite:attribute name="value" required="true" />
		<composite:attribute name="styleClass" required="false" default="" />
		<composite:attribute name="title" required="false" default="#{i18n['candidate.candidates']}" />
		<composite:attribute name="rows" required="false" default="#{sessionUser.rowsPerPage}" />
	</composite:interface>

	<composite:implementation>
		<div id="#{cc.clientId}" class="card card-w-title candidates #{cc.attrs.styleClass}">
			<h3>#{cc.attrs.title}</h3>

			<p:dataTable var="candidate" id="candidates" value="#{cc.attrs.value}" emptyMessage="#{i18n['candidate.no_candidates_found']}" reflow="true" paginator="true"
				paginatorPosition="bottom" rows="#{cc.attrs.rows}" sortBy="#{candidate.name}" sortOrder="descending" lazy="true" styleClass="ui-datatable-borderless">

				<p:column>
					<cc:avatar value="#{candidate.imageFileName}" styleClass="small" />
				</p:column>

				<p:column headerText="#{i18n['candidate.name']}" sortBy="#{candidate.name}">
					<h:link value="#{candidate.fullName}" outcome="#{Page.CANDIDATE.getUrl()}">
						<f:param name="id" value="#{candidate.id}" />
					</h:link>
				</p:column>

				<p:column headerText="#{i18n['candidate.jobProfile']}" sortBy="#{candidate.jobProfile}" priority="5">
					<h:outputText value="#{candidate.jobProfile}" />
				</p:column>

				<p:column headerText="#{i18n['candidate.rating']}" sortBy="#{candidate.rating}" priority="4">
					<p:rating value="#{candidate.rating}" cancel="false" readonly="true" />
				</p:column>
			</p:dataTable>

			<h:panelGroup id="children" styleClass="buttons">
				<composite:insertChildren />
			</h:panelGroup>
		</div>
	</composite:implementation>
</ui:component>
