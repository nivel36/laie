<ui:component xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui"
	xmlns:composite="http://xmlns.jcp.org/jsf/composite" xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:o="http://omnifaces.org/ui" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

	<composite:interface>
		<composite:attribute name="candidates" type="java.util.List" required="true" />
		<composite:attribute name="rendered" required="false" />
		<composite:attribute name="styleClass" required="false" default="" />
		<composite:attribute name="title" required="false" default="#{i18n['candidate.candidates']}" />
	</composite:interface>

	<composite:implementation>
		<h:panelGroup id="#{cc.clientId}" layout="block" styleClass="jobOffers panel #{cc.attrs.styleClass}"
			rendered="#{cc.attrs.rendered}">
			<div class="panel-header">
				<div class="panel-header-title">#{cc.attrs.title}</div>
			</div>
			<div class="panel-content">
				<p:dataGrid layout="grid" var="candidate" value="#{cc.attrs.candidates}"
					emptyMessage="#{i18n['candidate.no_candidates_found']}" paginator="true" paginatorPosition="bottom" columns="2"
					rows="6">
					<cc:candidateCard candidate="#{candidate}" />
				</p:dataGrid>
			</div>
			<h:panelGroup layout="block" class="panel-footer" rendered="#{component.findComponent('children').childCount > 0}">
				<h:panelGroup id="children" styleClass="panel-buttons">
					<composite:insertChildren />
				</h:panelGroup>
			</h:panelGroup>
		</h:panelGroup>
	</composite:implementation>
</ui:component>
