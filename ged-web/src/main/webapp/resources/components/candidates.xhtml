<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:i18n="http://ged.com/i18n"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" xmlns:composite="http://xmlns.jcp.org/jsf/composite">

<composite:interface>
	<composite:attribute name="candidates" required="true" />
	<composite:attribute name="title" />
</composite:interface>

<composite:implementation>
	<p:panel id="candidates" header="#{empty cc.attrs.title ? i18n['candidate.candidates'] : cc.attrs.title}">
		<p:dataGrid layout="grid" var="candidate" value="#{cc.attrs.candidates}" emptyMessage="#{i18n['candidate.no_candidates_found']}" paginator="true"
			paginatorPosition="bottom" columns="2" rows="6">
			<cc:candidateCard candidate="#{candidate}" />
		</p:dataGrid>
		<h:panelGroup styleClass="form-action-primary" rendered="#{component.findComponent('children').childCount != 0}">
			<composite:insertChildren />
		</h:panelGroup>
	</p:panel>
</composite:implementation>
</html>
