<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core" 
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:composite="http://xmlns.jcp.org/jsf/composite" 
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:g="http://ged.org/ui" 
	xmlns:h="http://java.sun.com/jsf/html" 
	xmlns:o="http://omnifaces.org/ui"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://java.sun.com/jsf/facelets">

	<composite:interface>
		<composite:attribute name="candidates" type="java.util.List" required="true" />
		<composite:attribute name="styleClass" required="false" default="" />
		<composite:attribute name="title" required="false" default="#{i18n['candidate.candidates']}" />
	</composite:interface>

	<composite:implementation>
		<div id="#{cc.clientId}">
			<p:panel header="#{cc.attrs.title}" styleClass="panel candidates #{cc.attrs.styleClass}">
				<p:dataList var="candidate" value="#{cc.attrs.candidates}" emptyMessage="#{i18n['candidate.no_candidates_found']}"
					paginator="true" paginatorPosition="bottom">
					<p:link outcome="#{Page.CANDIDATE.getUrl()}">
						<f:param name="id" value="#{candidate.id}" />
						<cc:person value="#{candidate}" description="#{candidate.jobProfile}" />
					</p:link>
				</p:dataList>
				
				<h:panelGroup layout="block" styleClass="panel-footer" rendered="#{component.findComponent('children').childCount > 0}">
					<h:panelGroup id="children" styleClass="panel-buttons">
						<composite:insertChildren />
					</h:panelGroup>
				</h:panelGroup>
			</p:panel>
		</div>
	</composite:implementation>
</ui:component>
