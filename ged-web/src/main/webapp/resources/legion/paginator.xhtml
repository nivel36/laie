<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:cc="http://java.sun.com/jsf/composite">

<cc:interface>
	<cc:attribute name="id" />
	<cc:attribute name="paginator" type="ged.web.core.view.Paginator" />
</cc:interface>

<cc:implementation>
	<h:panelGroup layout="block" styleClass="paginator" id="#{cc.attrs.id}"
		rendered="#{not empty cc.attrs.paginator.dataList}">
		<h:commandButton disabled="#{ cc.attrs.paginator.currentPage eq 0}"
			value="#{i18n['paginator.first']}"
			action="#{cc.attrs.paginator.firstPage}">
			<f:ajax render="@form" />
		</h:commandButton>
		<h:commandButton disabled="#{cc.attrs.paginator.currentPage eq 0}"
			value="#{i18n['paginator.previous']}"
			action="#{cc.attrs.paginator.previousPage}">
			<f:ajax render="@form" />
		</h:commandButton>
		<ui:repeat value="#{cc.attrs.paginator.pages}" var="page">
			<h:commandButton value="#{page+1}"
				action="#{cc.attrs.paginator.gotoPage(page)}"
				disabled="#{cc.attrs.paginator.currentPage eq page}">
				<f:ajax render="@form" />
			</h:commandButton>
		</ui:repeat>
		<h:commandButton value="#{i18n['paginator.next']}"
			disabled="#{cc.attrs.paginator.currentPage eq cc.attrs.paginator.pagesSize-1}"
			action="#{cc.attrs.paginator.nextPage}">
			<f:ajax render="@form" />
		</h:commandButton>
		<h:commandButton value="#{i18n['paginator.last']}"
			disabled="#{cc.attrs.paginator.currentPage eq cc.attrs.paginator.pagesSize-1}"
			action="#{cc.attrs.paginator.lastPage}">
			<f:ajax render="@form" />
		</h:commandButton>
		<h:outputLabel value="#{i18n['paginator.show']}">
			<h:selectOneMenu value="#{cc.attrs.paginator.rowsPerPage}">
				<f:selectItem itemValue="5" itemLabel="5" />
				<f:selectItem itemValue="10" itemLabel="10" />
				<f:selectItem itemValue="25" itemLabel="25" />
				<f:ajax listener="#{cc.attrs.paginator.rowsPerPageChange}"
					render="@form" execute="#{cc.attrs.id}" />
			</h:selectOneMenu>
		</h:outputLabel>
	</h:panelGroup>
</cc:implementation>
</html>
