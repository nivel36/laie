<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:i18n="http://legion.com/i18n" xmlns:p="http://primefaces.org/ui"
	xmlns:composite="http://java.sun.com/jsf/composite">

<composite:interface componentType="afDialog">
	<composite:attribute name="id" type="java.lang.String" />
	<composite:attribute name="label" required="true" type="java.lang.String" />
</composite:interface>

<composite:implementation>
	<p:commandButton id="button" value="#{cc.attrs.label}" actionListener="#{cc.showDialog()}" update="dialog" process="@this" />
	<p:dialog id="dialog" binding="#{cc.dialog}" modal="true" resizable="false" responsive="true" closable="true" styleClass="medium">
	 	<p:ajax event="close" listener="#{cc.handleClose}" />
		<composite:insertChildren />
	</p:dialog>
</composite:implementation>
</html>
