<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" 
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core" 
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" 
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:g="http://ged.org/ui" 
	xmlns:h="http://java.sun.com/jsf/html" 
	xmlns:o="http://omnifaces.org/ui"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['config.change_password']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="config" />

	<ui:define name="breadcrumb">
		<p:breadCrumb>
			<p:menuitem value="#{i18n['menu.index']}" url="/index.xhtml" />
			<p:menuitem value="#{i18n['config.config']}" url="/config.xhtml" />
			<p:menuitem value="#{i18n['config.change_password']}" disabled="true" />
		</p:breadCrumb>
	</ui:define>

	<ui:define name="content">
		<div class="grid">
			<div class="col-12 lg-4">
				<h:form id="changePasswordForm">
					<p:panel>
						<div class="panel-content-data grid">
							<div class="col-12">
								<g:input id="password" label="#{i18n['config.password']}" value="#{changePasswordView.password}" required="true" type="password" />
								<g:input id="newPassword" label="#{i18n['config.new_password']}" value="#{changePasswordView.newPassword}" required="true"
									type="password" />
								<g:input id="repeatPassword" label="#{i18n['config.repeat_password']}" value="#{changePasswordView.repeatPassword}" required="true"
									type="password" />
							</div>
						</div>
						<f:facet name="footer">
							<div class="panel-buttons">
								<p:commandButton styleClass="btn-gray" value="#{i18n['action.cancel']}" action="#{Page.CONFIG.getRedirectedUrl()}" process="@this" />
								<p:commandButton value="#{i18n['action.change']}" action="#{changePasswordView.change}" process="@form" update="@form growl" />
							</div>
						</f:facet>
					</p:panel>
				</h:form>
			</div>
		</div>
	</ui:define>
</ui:composition>
