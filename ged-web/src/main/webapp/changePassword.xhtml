<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" xmlns:f="http://java.sun.com/jsf/core" xmlns:g="http://ged.org/ui"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" xmlns:ui="http://java.sun.com/jsf/facelets" template="/WEB-INF/templates/template.xhtml">

	<ui:define name="title">
		#{i18n['config.change_password']}
	</ui:define>

	<ui:param name="selectedMenu" value="config" />

	<ui:define name="breadcrumb">
		<p:breadCrumb>
			<p:menuitem value="#{i18n['menu.index']}" url="/index.xhtml" />
			<p:menuitem value="#{i18n['config.config']}" url="/config.xhtml" />
			<p:menuitem value="#{i18n['config.change_password']}" disabled="true" />
		</p:breadCrumb>
	</ui:define>

	<ui:define name="content">
		<div class="p-grid">
			<div class="p-col-12 p-xl-4">
				<h:form id="changePasswordForm">
					<div class="card">
						<div class="p-grid">
							<div class="p-col-12">
								<div class="ui-fluid">
									<g:input id="password" label="#{i18n['config.password']}" value="#{changePasswordView.password}" required="true" type="password" />
									<g:input id="newPassword" label="#{i18n['config.new_password']}" value="#{changePasswordView.newPassword}" required="true"
										type="password" />
									<g:input id="repeatPassword" label="#{i18n['config.repeat_password']}" value="#{changePasswordView.repeatPassword}" required="true"
										type="password" />
								</div>
							</div>
							<div class="p-col-12">
								<div class="buttons">
									<p:commandButton value="#{i18n['action.cancel']}" action="#{Page.CONFIG.getRedirectedUrl()}" process="@this"
										styleClass="secondary-button" />
									<p:commandButton value="#{i18n['action.change']}" action="#{changePasswordView.change}" process="@form" update="@form growl" />
								</div>
							</div>
						</div>
					</div>
				</h:form>
			</div>
		</div>
	</ui:define>
</ui:composition>
