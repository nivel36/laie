<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:p="http://primefaces.org/ui"
	xmlns:i18n="http://legion.com/i18n">
	<p:link outcome="userView">
		<f:param name="id" value="#{user.id}" />
		<div class="user-minicard">
			<div class="user-image">
				<p:graphicImage class="image" value="/images/#{user.imageFileName}" rendered="#{not empty user.imageFileName}" />
				<p:graphicImage class="image" value="/resources/img/default-avatar.png" rendered="#{empty user.imageFileName}" />
			</div>
			<div class="user-info">
				<div class="name">#{user}</div>
				<div class="position">#{i18n:translate(user.role.name)}</div>
			</div>
		</div>
	</p:link>
</ui:composition>
