<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui"
	xmlns:i18n="http://legion.com/i18n" template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['user.user']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="users" />

	<ui:define name="content">

		<ui:include src="userSearchPopup.xhtml">
			<ui:param name="callback" value="#{userViewBean.manager}" />
			<ui:param name="render" value=":form:managerBlock" />
		</ui:include>

		<f:metadata>
			<f:viewParam name="id" value="#{userViewBean.userId}" />
			<f:viewAction action="#{userViewBean.init}" />
		</f:metadata>

		<h:form id="form">
			<input type="hidden" id="userId" value="#{userViewBean.user.id}" />

			<div class="ui-g">
				<div class="ui-md-12 ui-lg-3 ui-xl-2">
					<div class="panel user-card">
						<div class="panel-content">
							<div class="user-image">
								<img class="image" src="/web/resources/img/abel.jpg" />
							</div>
							<div class="user-info">
								<span class="name">#{userViewBean.user}</span> <span class="position">#{i18n:translate(userViewBean.user.role.name)}</span>
							</div>
							<div class="form-action">
								<p:commandButton styleClass="medium rounded" id="exportExcel" icon="fa fa-file-excel-o" value="#{i18n['action.export']}"
									action="#{userViewBean.export}" rendered="#{not userViewBean.editable}" />
							</div>
						</div>
					</div>
				</div>

				<div class="ui-md-12 ui-lg-9 ui-xl-6">
					<p:panel styleClass="with-tabs" header="#{i18n['user.user']}">
						<p:tabView dynamic="true" cache="true" >
							<p:tab title="Detalles">
								<div class="ui-g">
									<div class="ui-md-12 ui-lg-6">
										<div class="form-group">
											<p:outputLabel value="#{i18n['user.username']}" for="username" />
											<p:inputText id="username" value="#{userViewBean.user.username}" required="true"
												validator="#{userViewBean.validateUsername}" readonly="#{not userViewBean.editable}" />
										</div>
										<h:message for="username" errorClass="error" />
									</div>
									<div class="ui-md-12 ui-lg-6">
										<div class="form-group">
											<p:outputLabel value="#{i18n['user.email']}" for="email" />
											<p:inputText id="email" p:type="email" value="#{userViewBean.user.email}" required="true"
												validator="#{userViewBean.validateEmail}" readonly="#{not userViewBean.editable}" />
										</div>
										<h:message for="email" errorClass="error" />
									</div>
									<div class="ui-md-12 ui-lg-6">
										<div class="form-group">
											<p:outputLabel value="#{i18n['user.name']}" for="name" />
											<p:inputText id="name" value="#{userViewBean.user.name}" required="true"
												readonly="#{not userViewBean.editable}" />
										</div>
										<h:message for="name" errorClass="error" />
									</div>

									<div class="ui-md-12 ui-lg-6">
										<div class="form-group">
											<p:outputLabel value="#{i18n['user.surename']}" for="surename" />
											<p:inputText id="surename" value="#{userViewBean.user.surename}" required="true"
												readonly="#{not userViewBean.editable}" />
										</div>
										<h:message for="surename" errorClass="error" />
									</div>

									<div class="ui-md-12 ui-lg-6">
										<div class="form-group">
											<p:outputLabel value="#{i18n['user.role']}" for="role" />
											<p:selectOneMenu id="role" value="#{userViewBean.user.role}" validator="#{userViewBean.validateRole}"
												readonly="#{not userViewBean.editable}">
												<f:selectItems var="role" itemValue="#{role}" value="#{applicationBean.roles}"
													itemLabel="#{i18n:translate(role.name)}" />
											</p:selectOneMenu>
										</div>
										<h:message for="role" errorClass="error" />
									</div>

									<div class="ui-md-12 ui-lg-6">
										<div class="form-group">
											<p:outputLabel value="#{i18n['user.manager']}" />
											<p:inputText id="manager" value="#{userViewBean.manager.fullName}" label="#{i18n['user.manager']}"
												readonly="#{facesContext.renderResponse}" validator="#{userViewBean.validateManager}" />
											<p:commandButton value="+" onclick="PF('managerDlg').show();" rendered="#{userViewBean.editable}" />
											<p:commandButton action="#{userViewBean.removeManager}" value="-"
												rendered="#{not empty userViewBean.manager.username and userViewBean.editable}" id="removeManager"
												process="@this" update="managerBlock" />
										</div>
										<h:message for="manager" errorClass="error" />
									</div>
								</div>

								<div class="ui-g">
									<div class="ui-g-12">
										<div class="form-action-primary">
											<h:panelGroup id="actionButtons" layout="block">
												<p:commandButton value="#{i18n['action.undelete']}" action="#{userViewBean.undeleteUser}" immediate="true"
													rendered="#{userViewBean.user.deleted}" />
												<p:commandButton value="#{i18n['action.edit']}" action="#{userViewBean.editUser}" immediate="true"
													rendered="#{not userViewBean.user.deleted and not userViewBean.editable}" update="@form" />
												<p:commandButton value="#{i18n['action.save']}" action="#{userViewBean.saveUser}"
													rendered="#{not userViewBean.user.deleted and userViewBean.editable}" update="@form growl" />
												<p:commandButton styleClass="btn-gray" value="#{i18n['action.cancel']}"
													action="#{userViewBean.cancelEditUser}"
													rendered="#{not userViewBean.user.deleted and userViewBean.editable}" immediate="true" update="@form growl" />
												<!-- <p:commandButton value="#{i18n['bookmark.add_to_bookmarks']}" action="#{bookmarksBean.add(userViewBean.user)}"
											immediate="true"
											rendered="#{(not bookmarksBean.isBookmarked(userViewBean.user))	and (not userViewBean.user.deleted) and (not userViewBean.editable)}"
											update="actionButtons :asideForm:bookmarks" />
										<p:commandButton value="#{i18n['bookmark.remove_from_bookmarks']}"
											action="#{bookmarksBean.remove(userViewBean.user)}" immediate="true"
											rendered="#{bookmarksBean.isBookmarked(userViewBean.user)} and not userViewBean.editable"
											update="actionButtons :asideForm:bookmarks" /> -->

											</h:panelGroup>
										</div>
									</div>
								</div>
							</p:tab>
							<p:tab title="Avatar">
								<p:photoCam widgetVar="pc" listener="#{userViewBean.uploadImage}" update="photo" />
								<p:commandButton type="button" value="Capture" onclick="PF('pc').capture()" />
								<p:outputPanel id="photo">
									<p:graphicImage name="#{userViewBean.user.imageFileName}"
										rendered="#{not empty userViewBean.user.imageFileName}" />
								</p:outputPanel>
							</p:tab>
							<p:tab title="Responsable">
							</p:tab>
						</p:tabView>
					</p:panel>
				</div>

				<div class="ui-md-12 ui-lg-6 ui-xl-4">
					<p:panel styleClass="magenta" header="#{i18n['user.team']}">
						<p:dataTable var="user" value="#{userViewBean.team}" emptyMessage="#{i18n['user.no_users_found']}" reflow="true"
							paginator="true" paginatorPosition="bottom" rows="#{sessionBean.rowsPerPage}">
							<h:column>
								<f:facet name="header">
									<h:outputText value="#{i18n['user.name']}" />
								</f:facet>
								<h:outputText value="#{user.fullName}" />
							</h:column>

							<h:column>
								<f:facet name="header">
									<h:outputText value="#{i18n['user.role']}" />
								</f:facet>
								<h:outputText value="#{i18n:translate(user.role.name)}" />
							</h:column>

							<h:column>
								<f:facet name="header">
									<h:outputText value="#{i18n['action.action']}" />
								</f:facet>
								<h:link value="#{i18n['action.view']}" outcome="userView">
									<f:param name="id" value="#{user.id}" />
								</h:link>
							</h:column>
						</p:dataTable>
					</p:panel>
				</div>
				<div class="ui-md-12 ui-lg-6">
					<p:panel styleClass="magenta" header="#{i18n['job.job_offers']}">
						<p:dataTable var="jobOffer" value="#{userViewBean.jobOffers}" emptyMessage="#{i18n['user.no_users_found']}"
							reflow="true" paginator="true" paginatorPosition="bottom" rows="#{sessionBean.rowsPerPage}">
							<h:column>
								<f:facet name="header">
									<h:outputText value="#{i18n['job.name']}" />
								</f:facet>
								<h:outputText value="#{jobOffer.name}" />
							</h:column>

							<h:column>
								<f:facet name="header">
									<h:outputText value="#{i18n['job.client']}" />
								</f:facet>
								<h:outputText value="#{jobOffer.client.name}" />
							</h:column>

							<h:column>
								<f:facet name="header">
									<h:outputText value="#{i18n['action.action']}" />
								</f:facet>
								<h:link value="#{i18n['action.view']}" outcome="/faces/jobOffer/jobOfferView">
									<f:param name="id" value="#{jobOffer.id}" />
								</h:link>
							</h:column>
						</p:dataTable>
					</p:panel>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
