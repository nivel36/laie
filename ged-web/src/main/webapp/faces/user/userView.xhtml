<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui" xmlns:i18n="http://legion.com/i18n"
	template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['user.user']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="users" />

	<ui:define name="content">
		<f:metadata>
			<f:viewParam name="id" value="#{userViewBean.userId}" />
			<f:viewAction action="#{userViewBean.init}" />
		</f:metadata>

		<h:form id="form">
			<input type="hidden" id="userId" value="#{userViewBean.user.id}" />

			<div class="ui-g">
				<div class="ui-g-12">

					<h:panelGroup layout="block" styleClass="panel">
						<h:panelGroup layout="block" styleClass="panel-header">
							<h4>#{i18n['user.user']}</h4>
						</h:panelGroup>
						<h:panelGroup layout="block" styleClass="panel-content">
							<h:panelGroup layout="block" styleClass="textBlock">
								<h:outputText styleClass="label" value="#{i18n['user.name']}:" />
								<h:outputText
									value="#{userViewBean.user.name} #{userViewBean.user.surename}" />
							</h:panelGroup>

							<h:panelGroup layout="block" styleClass="textBlock">
								<h:outputText styleClass="label" value="#{i18n['user.email']}:" />
								<h:outputText value="#{userViewBean.user.email}" />
							</h:panelGroup>

							<h:panelGroup layout="block" styleClass="textBlock">
								<h:outputText styleClass="label" value="#{i18n['user.role']}:" />
								<h:outputText
									value="#{i18n:translate(userViewBean.user.role.name)}" />
							</h:panelGroup>

							<h:panelGroup layout="block" styleClass="textBlock">
								<h:outputText styleClass="label"
									value="#{i18n['user.manager']}:" />
								<h:outputText value="#{userViewBean.user.manager}" />
							</h:panelGroup>

							<h:panelGroup id="actionButtons" layout="block"
								styleClass="buttonGroup">
								<p:commandButton value="#{i18n['action.undelete']}"
									action="#{userViewBean.undeleteUser}" immediate="true"
									rendered="#{userViewBean.user.deleted}" />
								<p:commandButton value="#{i18n['action.edit']}"
									action="#{userViewBean.editUser}" immediate="true"
									rendered="#{not userViewBean.user.deleted}" />
								<p:commandButton value="#{i18n['bookmark.add_to_bookmarks']}"
									action="#{bookmarksBean.add(userViewBean.user)}"
									immediate="true"
									rendered="#{(not bookmarksBean.isBookmarked(userViewBean.user))	and (not userViewBean.user.deleted)}"
									update="actionButtons :asideForm:bookmarks" />
								<p:commandButton
									value="#{i18n['bookmark.remove_from_bookmarks']}"
									action="#{bookmarksBean.remove(userViewBean.user)}"
									immediate="true"
									rendered="#{bookmarksBean.isBookmarked(userViewBean.user)}"
									update="actionButtons :asideForm:bookmarks" />
								<p:commandButton id="exportPdf" icon="fa fa-file-pdf-o"
									value="#{i18n['action.export']}"
									action="#{userViewBean.export}" />
								<p:commandButton id="exportExcel" icon="fa fa-file-excel-o"
									value="#{i18n['action.export']}"
									action="#{userViewBean.export}" />
							</h:panelGroup>
						</h:panelGroup>
					</h:panelGroup>
				</div>
			</div>

			<div class="ui-g">
				<div class="ui-g-12 ui-md-12 ui-lg-6">
					<p:panel styleClass="magenta" header="#{i18n['user.team']}">
						<p:dataTable var="user" value="#{userViewBean.team}"
							emptyMessage="#{i18n['user.no_users_found']}" reflow="true"
							paginator="true" paginatorPosition="bottom"
							rows="#{sessionBean.rowsPerPage}">
							<h:column>
								<f:facet name="header">
									<h:outputText value="#{i18n['user.name']}" />
								</f:facet>
								<h:outputText value="#{user.fullName}" />
							</h:column>

							<h:column>
								<f:facet name="header">
									<h:outputText value="#{i18n['user.role']}" />
								</f:facet>
								<h:outputText value="#{i18n:translate(user.role.name)}" />
							</h:column>

							<h:column>
								<f:facet name="header">
									<h:outputText value="#{i18n['action.action']}" />
								</f:facet>
								<h:link value="#{i18n['action.view']}" outcome="userView">
									<f:param name="id" value="#{user.id}" />
								</h:link>
							</h:column>
						</p:dataTable>
					</p:panel>
				</div>
				<div class="ui-g-12 ui-md-12 ui-lg-6">
					<p:panel styleClass="magenta" header="#{i18n['job.job_offers']}">
						<p:dataTable var="jobOffer" value="#{userViewBean.jobOffers}"
							emptyMessage="#{i18n['user.no_users_found']}" reflow="true"
							paginator="true" paginatorPosition="bottom"
							rows="#{sessionBean.rowsPerPage}">
							<h:column>
								<f:facet name="header">
									<h:outputText value="#{i18n['job.name']}" />
								</f:facet>
								<h:outputText value="#{jobOffer.name}" />
							</h:column>

							<h:column>
								<f:facet name="header">
									<h:outputText value="#{i18n['job.client']}" />
								</f:facet>
								<h:outputText value="#{jobOffer.client.name}" />
							</h:column>

							<h:column>
								<f:facet name="header">
									<h:outputText value="#{i18n['action.action']}" />
								</f:facet>
								<h:link value="#{i18n['action.view']}"
									outcome="/faces/jobOffer/jobOfferView">
									<f:param name="id" value="#{jobOffer.id}" />
								</h:link>
							</h:column>
						</p:dataTable>
					</p:panel>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
