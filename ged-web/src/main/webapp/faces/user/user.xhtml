<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html" xmlns:i18n="http://ged.com/i18n"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" xmlns:p="http://primefaces.org/ui"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['user.user']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="users" />

	<ui:define name="content">
		<p:breadCrumb styleClass="breadcrumb">
			<p:menuitem value="#{i18n['menu.index']}" url="/faces/index.xhtml" />
			<p:menuitem value="#{i18n['user.users']}" url="/faces/user/userSearch.xhtml" />
			<p:menuitem value="#{userBean.user}" disabled="true" />
		</p:breadCrumb>


		<div class="candidate panel">
			<div class="panel-header">
				<div class="panel-header-data">
					<div class="candidate-image">
						<p:graphicImage styleClass="user-image" value="/images/#{userBean.user.imageFileName}"
							rendered="#{not empty userBean.user.imageFileName}" />
						<p:graphicImage styleClass="user-image" value="/resources/img/default-avatar.png"
							rendered="#{empty userBean.user.imageFileName}" />
					</div>
				</div>
				<div class="panel-header-data">
					<div class="name">#{userBean.user.fullName}</div>
					<div class="job-profile">#{i18n:translate(userBean.user.role)}</div>
					<div class="data email">
						<div class="icon">
							<i class="fa fa-envelope"></i>
						</div>
						<div class="text">#{userBean.user.email}</div>
					</div>
					<h:panelGroup layout="block" styleClass="data phone" rendered="#{not empty userBean.user.phoneNumber}">
						<span class="icon"><i class="fa fa-phone"></i></span>
						<span class="text">#{userBean.user.phoneNumber}</span>
					</h:panelGroup>
				</div>
				<div class="panel-header-buttons">
					<p:commandButton value="#{i18n['action.export']}" process="@this" actionListener="#{userBean.export}" ajax="false" 
						icon="fa-file-excel-o" action="/faces/user/userEdit?faces-redirect=true" />
					<p:commandButton value="#{i18n['action.edit']}" process="@this" actionListener="#{userBean.editUser}"
						action="/faces/user/userEdit?faces-redirect=true" />
				</div>
			</div>
		</div>
		<div class="grid nogutter">
			<div class="col-12 lg-6">
				<h:form id="userTeamForm">
					<cc:users users="#{userBean.team}" title="#{i18n['user.team']}" />
				</h:form>
			</div>
			<div class="col-12 lg-6">
				<h:form id="jobMeetingsForm">
					<cc:jobMeetings />
				</h:form>
			</div>

			<div class="col-12 lg-12">
				<h:form id="jobOffersForm">
					<cc:jobOffers jobOffers="#{userBean.jobOffers}" />
				</h:form>
			</div>
		</div>
	</ui:define>
</ui:composition>
