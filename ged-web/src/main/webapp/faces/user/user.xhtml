<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:i18n="http://legion.com/i18n" xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['user.user']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="users" />

	<ui:define name="content">
		<div class="ui-g">
			<div class="ui-g-12 ui-xl-8">
				<p:breadCrumb homeDisplay="text">
					<p:menuitem value="#{i18n['menu.index']}" url="/faces/index.xhtml" />
					<p:menuitem value="#{i18n['user.users']}" url="/faces/user/userSearch.xhtml" />
					<p:menuitem value="#{userBean.user}" disabled="true" />
				</p:breadCrumb>
			</div>
		</div>
		<div class="ui-g">
			<div class="ui-g-12 ui-lg-12 ui-xl-7">
				<h:form>
					<p:panel header="#{userBean.user}">
						<div class="ui-g">
							<div class="ui-g-12 ui-lg-3 ui-xl-2">
								<div class="user-card">
									<p:outputPanel layout="block" id="userImage" styleClass="user-image">
										<p:graphicImage styleClass="image" value="/images/#{userBean.user.imageFileName}" rendered="#{not empty userBean.user.imageFileName}" />
										<p:graphicImage styleClass="image" value="/resources/img/default-avatar.png" rendered="#{empty userBean.user.imageFileName}" />
									</p:outputPanel>
								</div>
							</div>

							<div class="ui-g-12 ui-lg-9 ui-xl-10">
								<div class="ui-g">
									<div class="ui-g-12 ui-md-4">
										<div class="form-group">
											<p:outputLabel value="#{i18n['user.name']}" for="name" />
											<p:inputText id="name" value="#{userBean.user.name}" required="true" readonly="true" />
										</div>
									</div>

									<div class="ui-g-12 ui-md-4">
										<div class="form-group">
											<p:outputLabel value="#{i18n['user.surname']}" for="surname" />
											<p:inputText id="surname" value="#{userBean.user.surname}" required="true" readonly="true" />
										</div>
									</div>

									<div class="ui-g-12 ui-md-4">
										<div class="form-group">
											<p:outputLabel value="#{i18n['user.email']}" for="email" />
											<p:inputText id="email" value="#{userBean.user.email}" readonly="true" />
										</div>
									</div>

									<div class="ui-g-12 ui-md-4">
										<div class="form-group">
											<p:outputLabel value="#{i18n['user.phone_number']}" for="phone_number" />
											<p:inputText id="phone_number" value="#{userBean.user.phoneNumber}" readonly="true" />
										</div>
									</div>

									<div class="ui-g-12 ui-md-4">
										<div class="form-group">
											<p:outputLabel value="#{i18n['user.role']}" for="role" />
											<p:selectOneMenu id="role" name="role" value="#{userBean.user.role}" disabled="true">
												<f:selectItems var="role" itemValue="#{role}" value="#{applicationBean.roles}" itemLabel="#{i18n:translate(role.name)}" />
											</p:selectOneMenu>
										</div>
									</div>

									<div class="ui-sm-12 ui-md-4">
										<div class="form-group">
											<p:outputLabel value="#{i18n['user.manager']}" for="manager" />
											<p:inputText id="manager" value="#{userBean.user.manager.fullName}" readonly="true" />
										</div>
									</div>

									<div class="ui-g-12 ui-md-4">
										<div class="form-group">
											<p:outputLabel value="#{i18n['user.date_of_join']}" for="date_of_join" />
											<p:calendar id="date_of_join" value="#{userBean.user.dateOfJoin}" readonly="true" disabled="true" pattern="dd/MM/yyyy">
												<f:convertDateTime type="localDate" pattern="dd/MM/yyyy" />
											</p:calendar>
										</div>
									</div>
								</div>

								<div class="ui-g">
									<div class="ui-g-12">

										<div class="form-action-primary">
											<p:commandButton value="#{i18n['action.edit']}" actionListener="#{userBean.editUser}" action="userEdit?faces-redirect=true" process="@this" styleClass="btn-primary" />
											<p:commandButton id="exportExcel" icon="fa fa-file-excel-o" value="#{i18n['action.export']}" action="#{userBean.export}" />
										</div>
									</div>
								</div>
							</div>
						</div>
					</p:panel>
				</h:form>
			</div>

			<div class="ui-g-12 ui-lg-6 ui-xl-5">
				<p:panel header="#{i18n['user.team']}">
					<h:panelGroup layout="block" rendered="#{empty userBean.team}">
						<span class="message">#{i18n['user.no_team']}</span>
					</h:panelGroup>
					<h:panelGroup layout="block" rendered="#{not empty userBean.team}">
						<div class="ui-g">
							<ui:repeat var="userTeamMember" value="#{userBean.team}" varStatus="status">
								<div class="ui-g-12 ui-md-6">
									<ui:include src="userCard.xhtml">
										<ui:param name="user" value="#{userTeamMember}" />
									</ui:include>
								</div>
							</ui:repeat>
						</div>
					</h:panelGroup>
				</p:panel>
			</div>

			<div class="ui-g-12 ui-md-12 ui-lg-6 ui-xl-6">
				<p:panel header="#{i18n['job_meeting.planned_job_meetings']}">

				</p:panel>
			</div>
			<div class="ui-g-12 ui-md-12 ui-lg-6">
				<p:panel header="#{i18n['job.job_offers']}">
					<p:dataTable var="jobOffer" value="#{userBean.jobOffers}" emptyMessage="#{i18n['user.no_users_found']}" reflow="true" paginator="true"
						paginatorPosition="bottom" rows="#{sessionBean.rowsPerPage}">
						<h:column>
							<f:facet name="header">
								<h:outputText value="#{i18n['job.name']}" />
							</f:facet>
							<h:outputText value="#{jobOffer.name}" />
						</h:column>

						<h:column>
							<f:facet name="header">
								<h:outputText value="#{i18n['job.client']}" />
							</f:facet>
							<h:outputText value="#{jobOffer.client.name}" />
						</h:column>

						<h:column>
							<f:facet name="header">
								<h:outputText value="#{i18n['action.action']}" />
							</f:facet>
							<h:link value="#{i18n['action.view']}" outcome="/faces/jobOffer/jobOfferView">
								<f:param name="jobOfferId" value="#{jobOffer.id}" />
							</h:link>
						</h:column>
					</p:dataTable>
				</p:panel>
			</div>
		</div>
	</ui:define>
</ui:composition>
