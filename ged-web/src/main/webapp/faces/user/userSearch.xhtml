<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:i18n="http://ged.com/i18n" xmlns:p="http://primefaces.org/ui" template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['user.users']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="users" />

	<ui:define name="content">

		<div class="grid">
			<div class="col-12">
				<p:breadCrumb homeDisplay="text">
					<p:menuitem value="#{i18n['menu.index']}" url="/faces/index.xhtml" />
					<p:menuitem value="#{i18n['user.users']}" disabled="true" />
				</p:breadCrumb>
			</div>
			<div class="col-12">
				<h:form id="userSearchform">
					<p:defaultCommand target="searchAction" />
					<p:panel id="searchUserPanel" header="#{i18n['user.search']}">
						<div class="grid">
							<div class="col-12 md-8 lg-6 xl-8">
								<div class="ui-inputgroup">
									<p:inputText id="searchText" value="#{userSearchBean.searchText}" />
									<p:commandButton id="cleanSearchTextAction" action="#{userSearchBean.clean}" process="@this" update="@form" styleClass="btn-gray" icon="fa fa-times"
										rendered="#{not empty userSearchBean.searchText}" />
									<p:commandButton id="searchAction" action="#{userSearchBean.search}" process="@this searchText" update="@form" styleClass="green-button"
										icon="fa fa-search" />
								</div>
							</div>
							<div class="col-12 md-4 lg-6 xl-4">
								<div class="form-action">
									<p:commandButton value="#{i18n['action.export']}" action="#{userSearch.export}" process="@this" icon="fa fa-file-excel-o"
										rendered="#{not empty userSearchBean.users}" />
									<p:commandButton value="#{i18n['action.new']}" action="userEdit?faces-redirect=true" process="@this" styleClass="btn-primary" />
								</div>
							</div>

							<div class="col-12">
								<p:dataTable var="user" id="users" value="#{userSearchBean.users}" emptyMessage="#{i18n['user.no_users_found']}" reflow="true" paginator="true"
									paginatorPosition="bottom" rows="#{sessionUser.rowsPerPage}" sortBy="#{user.fullName}" sortOrder="ascending">

									<p:column headerText="#{i18n['user.picture']}">
										<p:graphicImage class="image image-icon" value="/images/#{user.imageFileName}" rendered="#{not empty user.imageFileName}" />
										<p:graphicImage class="image image-icon" value="/resources/img/default-avatar.png" rendered="#{empty user.imageFileName}" />
									</p:column>

									<p:column headerText="#{i18n['user.name']}" sortBy="#{user.fullName}">
										<h:link value="#{user.fullName}" outcome="user">
											<f:param name="userId" value="#{user.id}" />
										</h:link>
									</p:column>

									<p:column headerText="#{i18n['user.email']}" sortBy="#{user.email}">
										<h:outputText value="#{user.email}" />
									</p:column>

									<p:column headerText="#{i18n['user.role']}" sortBy="#{i18n:translate(user.role.name)}">
										<h:outputText value="#{i18n:translate(user.role.name)}" />
									</p:column>

									<p:column headerText="#{i18n['user.manager']}" sortBy="#{user.manager.fullName}">
										<h:link value="#{user.manager.fullName}" outcome="user" rendered="#{not empty user.manager}">
											<f:param name="userId" value="#{user.manager.id}" />
										</h:link>
									</p:column>
								</p:dataTable>
							</div>
						</div>
					</p:panel>
				</h:form>
			</div>
		</div>
	</ui:define>
</ui:composition>
