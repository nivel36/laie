<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html" xmlns:i18n="http://ged.com/i18n"
	xmlns:p="http://primefaces.org/ui" xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['user.users']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="users" />

	<ui:define name="content">

		<p:breadCrumb styleClass="breadcrumb">
			<p:menuitem value="#{i18n['menu.index']}" url="/faces/index.xhtml" />
			<p:menuitem value="#{i18n['user.users']}" disabled="true" />
		</p:breadCrumb>
		<h:form>
			<div class="search">
				<div class="dialog blue">
					<div class="dialog-header">
						<h3>#{i18n['user.search']}</h3>
					</div>
					<div class="dialog-content">
						<div class="searchbar">
							<cc:inputSearch searchText="#{userSearchBean.searchText}" searchAction="#{userSearchBean.search}" update="@form" />
						</div>
					</div>
				</div>
			</div>
			<div class="search-result">
				<div class="search-result-header">
					<div class="search-result-header-title">#{i18n['user.users']}</div>
					<div class="search-result-header-buttons">
						<p:commandButton value="#{i18n['action.export']}" action="#{userSearchBean.export}" process="@this"
							icon="fa-file-excel-o" styleClass="btn-primary" />
						<p:button value="#{i18n['action.new']}" outcome="userEdit" styleClass="btn-primary" />
					</div>
				</div>
				<div class="search-result-content">
					<p:dataTable var="user" id="users" value="#{userSearchBean.users}" emptyMessage="#{i18n['user.no_users_found']}"
						reflow="true" paginator="true" paginatorPosition="bottom" rows="#{sessionUser.rowsPerPage}"
						sortBy="#{user.fullName}" sortOrder="ascending">

						<p:column>
							<p:graphicImage class="image image-icon" value="/images/#{user.imageFileName}"
								rendered="#{not empty user.imageFileName}" />
							<p:graphicImage class="image image-icon" value="/resources/img/default-avatar.png"
								rendered="#{empty user.imageFileName}" />
						</p:column>

						<p:column headerText="#{i18n['user.name']}" sortBy="#{user.fullName}">
							<h:link value="#{user.fullName}" outcome="/faces/user/user">
								<f:param name="userId" value="#{user.id}" />
							</h:link>
						</p:column>

						<p:column headerText="#{i18n['user.email']}" sortBy="#{user.email}">
							<h:outputText value="#{user.email}" />
						</p:column>

						<p:column headerText="#{i18n['user.role']}" sortBy="#{i18n:translate(user.role.name)}">
							<h:outputText value="#{i18n:translate(user.role.name)}" />
						</p:column>

						<p:column headerText="#{i18n['user.manager']}" sortBy="#{user.manager.fullName}">
							<h:link value="#{user.manager.fullName}" outcome="user" rendered="#{not empty user.manager}">
								<f:param name="userId" value="#{user.manager.id}" />
							</h:link>
						</p:column>
					</p:dataTable>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
