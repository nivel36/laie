<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:i18n="http://legion.com/i18n"
	template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['user.users']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="users" />

	<ui:define name="content">
		<h:form id="form">
			<h1 class="header">
				<i class="fa fa-user" /> #{i18n['user.user']}
			</h1>
			<h:panelGroup layout="block" styleClass="actionPanel">
				<h:commandButton value="#{i18n['action.new']}"
					action="#{userSearchBean.newUser}" immediate="true" />
			</h:panelGroup>

			<h:panelGroup layout="block" styleClass="panel">
				<h1>#{i18n['user.search']}</h1>

				<h:outputLabel for="name" value="#{i18n['user.name']}">
					<h:inputText id="name" value="#{userSearchBean.name}"
						label="#{i18n['user.name']}" />
				</h:outputLabel>

				<h:outputLabel for="surename" value="#{i18n['user.surename']}">
					<h:inputText id="surename" value="#{userSearchBean.surename}"
						label="#{i18n['user.surename']}" />
				</h:outputLabel>

				<h:panelGroup layout="block" styleClass="buttonGroup">
					<h:commandButton value="#{i18n['action.clean']}"
						action="#{userSearchBean.clean}" />
					<h:commandButton value="#{i18n['action.search']}"
						action="#{userSearchBean.search}" />
				</h:panelGroup>
			</h:panelGroup>

			<h:panelGroup layout="block" styleClass="panel" id="resultados">
				<h1>#{i18n['user.search_results']}</h1>


				<h:outputText value="#{i18n['user.no_users_found']}"
					rendered="#{empty userSearchBean.dataList}" />

				<h:dataTable var="user" id="user" value="#{userSearchBean.dataList}"
					rendered="#{not empty userSearchBean.dataList}"
					styleClass="dataTable">
					<h:column>
						<f:facet name="header">
							<h:outputText value="#{i18n['user.name']}" />
						</f:facet>
						<h:outputText value="#{user.fullName}" />
					</h:column>

					<h:column>
						<f:facet name="header">
							<h:outputText value="#{i18n['user.username']}" />
						</f:facet>
						<h:outputText value="#{user.username}" />
					</h:column>

					<h:column>
						<f:facet name="header">
							<h:outputText value="#{i18n['user.email']}" />
						</f:facet>
						<h:outputText value="#{user.email}" />
					</h:column>

					<h:column>
						<f:facet name="header">
							<h:outputText value="#{i18n['user.role']}" />
						</f:facet>
						<h:outputText value="#{i18n:translate(user.role.name)}" />
					</h:column>
					<h:column>
						<f:facet name="header">
							<h:outputText value="#{i18n['action.action']}" />
						</f:facet>
						<h:link value="#{i18n['action.view']}" outcome="userView">
							<f:param name="userId" value="#{user.id}" />
						</h:link>
						<h:outputText value=" | " />
						<h:commandLink action="#{userSearchBean.edit(user)}"
							value="#{i18n['action.edit']}" />
						<h:outputText value=" | " rendered="${user.role.name!='ADMIN'}" />
						<h:commandLink action="#{userSearchBean.remove(user)}"
							value="#{i18n['action.remove']}"
							rendered="${user.role.name!='ADMIN'}">
							<f:ajax execute="@form" render="@form" />
						</h:commandLink>
					</h:column>
				</h:dataTable>

				<h:panelGroup layout="block" styleClass="paginator" id="paginator"
					rendered="#{not empty userSearchBean.dataList}">
					<h:commandButton disabled="#{userSearchBean.currentPage eq 0}"
						value="#{i18n['paginator.first']}"
						action="#{userSearchBean.firstPage}">
						<f:ajax render=":form:resultados" />
					</h:commandButton>
					<h:commandButton disabled="#{userSearchBean.currentPage eq 0}"
						value="#{i18n['paginator.previous']}"
						action="#{userSearchBean.previousPage}">
						<f:ajax render=":form:resultados" />
					</h:commandButton>
					<ui:repeat value="#{userSearchBean.pages}" var="page">
						<h:commandButton value="#{page+1}"
							action="#{userSearchBean.gotoPage(page)}"
							disabled="#{userSearchBean.currentPage eq page}">
							<f:ajax render=":form:resultados" />
						</h:commandButton>
					</ui:repeat>
					<h:commandButton value="#{i18n['paginator.next']}"
						disabled="#{userSearchBean.currentPage eq userSearchBean.pagesSize-1}"
						action="#{userSearchBean.nextPage}">
						<f:ajax render=":form:resultados" />
					</h:commandButton>
					<h:commandButton value="#{i18n['paginator.last']}"
						disabled="#{userSearchBean.currentPage eq userSearchBean.pagesSize-1}"
						action="#{userSearchBean.lastPage}">
						<f:ajax render=":form:resultados" />
					</h:commandButton>
					<h:outputLabel value="#{i18n['paginator.show']}">
						<h:selectOneMenu value="#{userSearchBean.rowsPerPage}">
							<f:selectItem itemValue="5" itemLabel="5" />
							<f:selectItem itemValue="10" itemLabel="10" />
							<f:selectItem itemValue="25" itemLabel="25" />
							<f:ajax listener="#{userSearchBean.rowsPerPageChange}"
								render=":form:resultados" execute=":form:paginator" />
						</h:selectOneMenu>
					</h:outputLabel>
				</h:panelGroup>
			</h:panelGroup>
		</h:form>
	</ui:define>
</ui:composition>
