<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html" xmlns:i18n="http://legion.com/i18n"
	xmlns:p="http://primefaces.org/ui" template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['user.user']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="user" />

	<ui:define name="content">
		<p:panel id="searchUserPanel" header="#{i18n['user.new_user']}">
			<h:form id="form">
				<input type="hidden" id="userId" value="#{userEditBean.user.id}" />
				<p:wizard>
					<p:tab id="user" title="#{i18n['user.personal_info']}">
						<div class="ui-g">
							<div class="ui-g-12 ui-lg-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['user.email']}" for="email" />
									<p:inputText id="email" p:type="email" value="#{userEditBean.user.email}" required="true"
										validator="#{userEditBean.validateEmail}" />
								</div>
								<h:message for="email" errorClass="error" />
							</div>

							<div class="ui-g-12 ui-lg-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['user.name']}" for="name" />
									<p:inputText id="name" value="#{userEditBean.user.name}" required="true" />
								</div>
								<h:message for="name" errorClass="error" />
							</div>

							<div class="ui-g-12 ui-lg-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['user.surename']}" for="surename" />
									<p:inputText id="surename" value="#{userEditBean.user.surename}" required="true" />
								</div>
								<h:message for="surename" errorClass="error" />
							</div>

							<div class="ui-g-12 ui-lg-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['user.role']}" for="role" />
									<p:selectOneMenu id="role" value="#{userEditBean.user.role}" validator="#{userEditBean.validateRole}">
										<f:selectItems var="role" itemValue="#{role}" value="#{applicationBean.roles}"
											itemLabel="#{i18n:translate(role.name)}" />
									</p:selectOneMenu>
								</div>
								<h:message for="role" errorClass="error" />
							</div>

							<div class="ui-g-12 ui-lg-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['user.phone_number']}" for="phoneNumber" />
									<p:inputText id="phoneNumber" value="#{userEditBean.user.phoneNumber}" />
								</div>
								<h:message for="phoneNumber" errorClass="error" />
							</div>
						</div>
					</p:tab>
					<p:tab id="manager" title="#{i18n['user.manager']}">
						<p:outputPanel layout="block" id="userSearch">
							<div class="ui-g">
								<div class="ui-md-12 ui-lg-6 ui-xl-4">
									<div class="form-group">
										<p:outputLabel for="searchUserName" value="#{i18n['user.name']}" />
										<p:inputText id="searchUserName" value="#{userSearchSnippetBean.name}"
											validator="ged.web.view.SearchFieldValidator" />
									</div>
									<h:message for="searchUserName" errorClass="error" />

									<div class="form-action-primary">
										<p:commandButton value="#{i18n['action.search']}" action="#{userSearchSnippetBean.search}" update="userSearch" />
										<p:commandButton styleClass="btn-gray" value="#{i18n['action.clean']}" action="#{userSearchSnippetBean.clean}"
											update="userSearch" />
									</div>
								</div>
							</div>

							<p:dataTable var="user" value="#{userSearchSnippetBean.users}" emptyMessage="#{i18n['user.no_users_found']}"
								reflow="true" paginator="true" paginatorPosition="bottom" rows="#{sessionBean.rowsPerPage}">
								<p:column headerText="#{i18n['user.name']}">
									<h:outputText value="#{user}" />
								</p:column>
								<p:column headerText="#{i18n['user.email']}">
									<h:outputText value="#{user.email}" />
								</p:column>
								<p:column headerText="#{i18n['user.manager']}">
									<h:outputText value="#{user.manager}" />
								</p:column>
								<p:column headerText="#{i18n['user.role']}">
									<h:outputText value="#{i18n:translate(user.role.name)}" />
								</p:column>
								<p:column>
									<p:commandLink action="#{userEditBean.selectManager(user)}" value="#{i18n['action.select']}"
										update="@form growl" />
								</p:column>
							</p:dataTable>
						</p:outputPanel>
					</p:tab>
					<p:tab id="picture" title="#{i18n['user.avatar']}">
						<div class="ui-g">
							<div class="ui-g-12">
								<div class="form-action-primary">
									<p:commandButton value="#{i18n['action.save']}" action="#{userEditBean.save}" />
									<p:commandButton value="#{i18n['action.cancel']}" styleClass="btn-gray" action="#{userEditBean.cancel}"
										immediate="true" />
								</div>
							</div>
						</div>
					</p:tab>
				</p:wizard>
			</h:form>
		</p:panel>
	</ui:define>
</ui:composition>
