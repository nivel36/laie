<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:i18n="http://ged.com/i18n" 
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{empty userEditBean.user.fullName ? i18n['user.new_user'] : userEditBean.user.fullName}</title>
	</ui:define>

	<ui:define name="content">
		<div class="grid">
			<div class="col-12">
				<p:breadCrumb homeDisplay="text">
					<p:menuitem value="#{i18n['menu.index']}" url="/faces/index.xhtml" />
					<p:menuitem value="#{i18n['user.users']}" url="/faces/user/userSearch.xhtml" />
					<p:menuitem value="#{empty userEditBean.user.fullName ? i18n['user.new_user'] : userEditBean.user.fullName}" disabled="true" />
				</p:breadCrumb>
			</div>
			<div class="col-12">
				<h:form id="userPanelForm" enctype="multipart/form-data">
					<p:panel header="#{empty userEditBean.user.fullName ? i18n['user.new_user'] : userEditBean.user.fullName}">
						<div class="grid">
						
							<div class="col-12 lg-3">
								<cc:inputImage id="userImage" value="#{userEditBean.user.imageFileName}" fileUploadListener="#{userEditBean.uploadImage}"/>
							</div>

							<div class="col-12 lg-9">
								<div class="grid">
									<div class="col-12 sm-6">
										<cc:inputText id="name" name="name" label="#{i18n['user.name']}" value="#{userEditBean.user.name}" required="true" />
									</div>
									<div class="col-12 sm-6">
										<cc:inputText id="surname" name="surname" label="#{i18n['user.surname']}" value="#{userEditBean.user.surname}" required="true" />
									</div>

									<div class="col-12 sm-6">
										<cc:inputText id="email" name="email" label="#{i18n['user.email']}" value="#{userEditBean.user.email}" required="true" />
									</div>

									<div class="col-12 sm-6">
										<cc:inputText id="phone_number" name="phone_number" label="#{i18n['user.phone_number']}" value="#{userEditBean.user.phoneNumber}" />
									</div>

									<div class="col-12 sm-6">
										<cc:inputSelect id="role" name="role" value="#{userEditBean.user.role}" label="#{i18n['user.role']}" required="true">
											<f:selectItems var="role" itemValue="#{role}" value="#{applicationBean.roles}" itemLabel="#{i18n:translate(role.name)}" />
											<p:ajax event="change" update="manager role" process="role" listener="#{userEditBean.changeRoleListener}" />
										</cc:inputSelect>
									</div>

									<div class="col-12 sm-6">
										<cc:inputUser id="manager" name="manager" label="#{i18n['user.manager']}" value="#{userEditBean.user.manager}" completeMethod="#{userEditBean.searchManager}" />
									</div>

									<div class="col-12 sm-6">
										<cc:calendar id="date_of_join" name="date_of_join" label="#{i18n['user.date_of_join']}" value="#{userEditBean.user.dateOfJoin}"/>
									</div>

									<div class="col-12">
										<div class="form-action-primary">
											<p:commandButton styleClass="btn-gray" value="#{i18n['action.cancel']}" action="#{userEditBean.cancel}" process="@this" />
											<p:commandButton styleClass="btn-primary" value="#{i18n['action.save']}" action="#{userEditBean.save}" process="@form" update="@form growl" />
										</div>
									</div>
								</div>
							</div>
						</div>
					</p:panel>
				</h:form>
			</div>
		</div>
	</ui:define>
</ui:composition>
