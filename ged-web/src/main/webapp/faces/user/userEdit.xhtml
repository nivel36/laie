<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui"
	xmlns:i18n="http://ged.com/i18n" xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{empty userEditBean.user.fullName ? i18n['user.new_user'] : userEditBean.user.fullName}</title>
	</ui:define>

	<ui:define name="content">

		<p:breadCrumb styleClass="breadcrumb">
			<p:menuitem value="#{i18n['menu.index']}" url="/faces/index.xhtml" />
			<p:menuitem value="#{i18n['user.users']}" url="/faces/user/userSearch.xhtml" />
			<p:menuitem value="#{userEditBean.user.fullName}" url="/faces/user/user.xhtml?userId=#{userEditBean.user.id}"
				rendered="#{not userEditBean.newUser}" />
			<p:menuitem value="#{userEditBean.newUser ? i18n['user.new_user'] : i18n['user.edit_user']}" disabled="true" />
		</p:breadCrumb>

		<h:form id="userForm" enctype="multipart/form-data">
			<div class="panel">
				<div class="panel-header">
					<h2>#{empty userEditBean.user.fullName ? i18n['user.new_user'] : userEditBean.user.fullName}</h2>
				</div>
				<div class="panel-aside">
					<div class="candidate-metadata">
						<cc:inputImage id="userImage" value="#{userEditBean.user.imageFileName}"
							fileUploadListener="#{userEditBean.uploadImage}" />
					</div>
				</div>
				<div class="panel-content">
					<div class="grid">
						<div class="col-12 sm-5">
							<h3>#{i18n['user.personal_information']}</h3>
							<cc:inputText id="name" label="#{i18n['user.name']}" value="#{userEditBean.user.name}" required="true" />

							<cc:inputText id="surname" label="#{i18n['user.surname']}" value="#{userEditBean.user.surname}" required="true" />

							<cc:inputText id="email" label="#{i18n['user.email']}" value="#{userEditBean.user.email}" required="true"
								validator="#{userEditBean.validateEmail}" />

							<cc:inputText id="phone_number" label="#{i18n['user.phone_number']}" value="#{userEditBean.user.phoneNumber}" />
						</div>

						<div class="col-12 sm-5">

							<h3>#{i18n['user.professional_information']}</h3>

							<cc:inputSelect id="role" value="#{userEditBean.user.role}" label="#{i18n['user.role']}" required="true">
								<f:selectItems value="#{roles.list}" var="role" itemValue="#{role}" itemLabel="#{i18n:translate(role.name)}" />
								<p:ajax event="change" update=":userForm:role :userForm:manager" process="role"
									listener="#{userEditBean.changeRoleListener}" />
							</cc:inputSelect>

							<cc:inputUser id="manager" label="#{i18n['user.manager']}" value="#{userEditBean.user.manager}"
								completeMethod="#{userEditBean.searchManager}" disabled="#{userEditBean.isAdmin()}" />

							<cc:calendar id="date_of_join" label="#{i18n['user.date_of_join']}" value="#{userEditBean.user.dateOfJoin}" />
						</div>
					</div>
				</div>
				<div class="panel-footer">
					<div class="buttons">
						<p:commandButton styleClass="btn-gray" value="#{i18n['action.cancel']}" action="#{userEditBean.cancel}"
							process="@this" />
						<p:commandButton styleClass="btn-primary" value="#{i18n['action.save']}" action="#{userEditBean.save}"
							process="@form" update="@form growl" />
					</div>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
