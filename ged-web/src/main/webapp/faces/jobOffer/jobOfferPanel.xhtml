<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:i18n="http://legion.com/i18n"
	xmlns:cc="http://java.sun.com/jsf/composite/components">

	<ui:include src="/faces/jobOffer/jobOfferDialog.xhtml" />
	<ui:include src="/faces/jobOffer/jobOfferSearchDialog.xhtml" />
	
	<cc:jobOffers id="jobOffers" jobOffers="#{jobOffersPanelBean.jobOffers}">
		<p:commandButton value="#{i18n['action.new']}" actionListener="#{jobOfferDialogBean.openDialog}" process="@this" update="newJobOfferForm"
			styleClass="btn-primary" rendered="#{jobOfferPanelBean.newJobOfferVisible}">
			<f:attribute name="client" value="#{jobOfferPanelBean.client}" />
		</p:commandButton>
		<p:commandButton value="#{i18n['action.add']}" actionListener="#{jobOfferSearchDialogBean.openDialog}" process="@this" update="jobOfferSearchDialogForm"
			styleClass="btn-primary" rendered="#{jobOfferPanelBean.addJobOfferVisible}">
			<f:attribute name="updateField" value="jobOffersForm" />
			<f:attribute name="callback" value="#{jobOfferPanelBean}" />
		</p:commandButton>
	</cc:jobOffers>
</ui:composition>
