<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:i18n="http://legion.com/i18n">

	<ui:include src="/faces/jobOffer/jobOfferDialog.xhtml" />

	<h:form id="jobOffersForm">
		<p:panel header="#{i18n['job.job_offers']}" id="jobOffers">
			<div class="ui-g">
				<div class="ui-g-12">
					<p:dataTable var="jobOffer" value="#{jobOfferPanelBean.jobOffers}" emptyMessage="#{i18n['client.no_job_offers_found']}" reflow="true" paginator="true"
						paginatorPosition="bottom" rows="#{sessionBean.rowsPerPage}" sortBy="#{jobOffer.name}" sortOrder="ascending">
						<p:column headerText="#{i18n['job.name']}">
							<h:outputText value="#{jobOffer.name}" />
						</p:column>
						<p:column headerText="#{i18n['job.date_closed']}">
							<h:outputText value="#{jobOffer.dateClosed}">
								<f:convertDateTime pattern="dd / MM / yyyy" />
							</h:outputText>
						</p:column>
					</p:dataTable>
				</div>
			</div>
			<div class="pull-right">
				<p:commandButton value="#{i18n['action.add']}" actionListener="#{jobOfferDialogBean.openDialog}" process="@this" update="newJobOfferForm">
					<f:attribute name="client" value="#{jobOfferPanelBean.clientId}" />
				</p:commandButton>
				<p:commandButton value="#{i18n['action.new']}" actionListener="#{jobOfferDialogBean.openDialog}" process="@this" update="newJobOfferForm" styleClass="btn-primary">
					<f:attribute name="client" value="#{jobOfferPanelBean.clientId}" />
				</p:commandButton>
			</div>
		</p:panel>
	</h:form>
</ui:composition>
