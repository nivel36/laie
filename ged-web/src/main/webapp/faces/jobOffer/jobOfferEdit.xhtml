<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html" xmlns:i18n="http://legion.com/i18n"
	xmlns:p="http://primefaces.org/ui" template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['job.job_offer']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="offers" />

	<ui:define name="content">
		<h:form id="form">
			<div class="ui-g">
				<div class="ui-g-12">
					<p:panel header="#{jobOfferEditBean.jobOffer.id eq 0?i18n['job.new_job_offer']:jobOfferEditBean.jobOffer.name}">
						<div class="ui-g">
							<div class="ui-g-12 ui-md-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel for="name" value="#{i18n['job.name']}:" />
									<p:inputText id="name" value="#{jobOfferEditBean.jobOffer.name}" required="true" />
								</div>
								<h:message for="name" errorClass="error" />
							</div>
							<div class="ui-g-12 ui-md-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel for="client" value="#{i18n['job.client']}:" />
									<p:inputText id="client" value="#{jobOfferEditBean.jobOffer.client.name}" required="true">
										<f:ajax event="blur" listener="#{jobOfferEditBean.clientChangedListener}" execute="@this" render="cif_wrapper" />
									</p:inputText>
								</div>
								<h:message for="client" errorClass="error" />
							</div>
							<div class="ui-g-12 ui-md-6 ui-xl-4">
								<h:panelGroup layout="block" id="cif_wrapper">
									<h:panelGroup layout="block" class="form-group" rendered="#{jobOfferEditBean.newClient}">
										<p:outputLabel for="cif" value="#{i18n['job.cif']}:" />
										<p:inputText id="cif" value="#{jobOfferEditBean.jobOffer.client.cif}" required="true" />
									</h:panelGroup>
									<h:message for="cif" errorClass="error" />
								</h:panelGroup>
							</div>
						</div>

						<div class="ui-g">
							<div class="ui-g-12">
								<div class="form-group">
									<p:outputLabel for="description" value="#{i18n['job.description']}:" />
									<p:inputTextarea id="description" value="#{jobOfferEditBean.jobOffer.description}" />
								</div>
								<h:message for="description" errorClass="error" />
							</div>
						</div>

						<div class="ui-g">
							<div class="ui-g-12 ui-md-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel for="places" value="#{i18n['job.places']}:" />
									<p:inputText id="places" value="#{jobOfferEditBean.jobOffer.places}" />
								</div>
								<h:message for="places" errorClass="error" />
							</div>
							<div class="ui-g-12 ui-md-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel for="dateOpened" value="#{i18n['job.date_opened']}:" />
									<p:calendar id="dateOpened" value="#{jobOfferEditBean.jobOffer.dateOpened}" />
								</div>
								<h:message for="dateOpened" errorClass="error" />
							</div>
							<div class="ui-g-12 ui-md-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel for="dateClosed" value="#{i18n['job.date_closed']}:" />
									<p:calendar id="dateClosed" value="#{jobOfferEditBean.jobOffer.dateClosed}"  />
								</div>
								<h:message for="dateClosed" errorClass="error" />
							</div>
						</div>

						<div class="ui-g">
							<div class="ui-g-12 ui-md-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel for="city" value="#{i18n['address.city']}:" />
									<p:inputText id="city" value="#{jobOfferEditBean.jobOffer.city}" required="true" />
								</div>
								<h:message for="city" errorClass="error" />
							</div>
							<div class="ui-g-12 ui-md-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel for=" state" value="#{i18n['address.state']}:" />
									<p:inputText id="state" value="#{jobOfferEditBean.jobOffer.state}" required="true" />
								</div>
								<h:message for="state" errorClass="error" />
							</div>
						</div>

						<div class="ui-g">
							<div class="ui-g-12">
								<div class="form-action-primary">
									<p:commandButton styleClass="btn-primary" value="#{i18n['action.save']}" action="#{jobOfferEditBean.save}"
										update="@form growl" />
									<p:commandButton value="#{i18n['action.cancel']}" action="#{jobOfferEditBean.cancel}" immediate="true"
										styleClass="btn-gray" />
								</div>
							</div>
						</div>
					</p:panel>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
