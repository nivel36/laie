<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui" template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['job.job_offer']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="offers" />

	<ui:define name="content">

		<ui:include src="/faces/jobOffer/jobOfferDialog.xhtml" />

		<div class="ui-g">
			<div class="ui-g-12">
				<h:form id="jobOfferSearchform">
					<p:panel header="#{i18n['job.job_offers']}" id="searchPanel">
						<div class="ui-g">
							<div class="ui-g-12 ui-md-6 ui-lg-4">
								<div class="ui-inputgroup">
									<p:inputText id="searchText" value="#{jobOfferSearchBean.searchText}" />
									<p:commandButton id="cleanSearchTextAction" action="#{jobOfferSearchBean.clean}" update="@form" styleClass="btn-gray" icon="fa fa-times"
										rendered="#{not empty jobOfferSearchBean.searchText}" />
									<p:commandButton id="searchAction" action="#{jobOfferSearchBean.search}" update="@form" icon="fa fa-search" />
								</div>
							</div>
							<div class="ui-g-12 ui-md-6 ui-lg-8">
								<div class="pull-right">
									<p:commandButton value="#{i18n['action.export']}" action="#{clientSearchBean.clean}" icon="fa fa-file-excel-o" />
									<p:commandButton value="#{i18n['action.new']}" actionListener="#{jobOfferDialogBean.openDialog}" update="newJobOfferForm" styleClass="btn-primary" />
								</div>
							</div>
						</div>

						<div class="ui-g">
							<div class="ui-g-12">
								<p:dataTable var="jobOffer" value="#{jobOfferSearchBean.jobOffers}" emptyMessage="#{i18n['job.no_jobs_found']}" reflow="true" paginator="true"
									paginatorPosition="bottom" rows="#{sessionBean.rowsPerPage}">

									<p:column headerText="#{i18n['job.name']}" sortBy="#{jobOffer.name}">
										<h:link value="#{jobOffer.name}" outcome="/faces/jobOffer/jobOffer">
											<f:param name="jobOfferId" value="#{jobOffer.id}" />
										</h:link>
									</p:column>
									<p:column headerText="#{i18n['job.client']}" sortBy="#{jobOffer.client.name}">
										<h:link value="#{jobOffer.client.name}" outcome="/faces/client/client">
											<f:param name="clientId" value="#{jobOffer.client.id}" />
										</h:link>
									</p:column>
									<p:column headerText="#{i18n['job.date_opened']}" sortBy="#{jobOffer.dateOpened}">
										<h:outputText value="#{jobOffer.dateOpened}">
											<f:convertDateTime type="localDate" pattern="dd/MM/yyyy" />
										</h:outputText>
									</p:column>
									<p:column headerText="#{i18n['job.date_closed']}" sortBy="#{jobOffer.dateClosed}">
										<h:outputText value="#{jobOffer.dateClosed}">
											<f:convertDateTime type="localDate" pattern="dd/MM/yyyy" />
										</h:outputText>
									</p:column>
									<p:column headerText="#{i18n['user.owner']}" sortBy="#{i18n['user.owner']}">
										<h:link value="#{jobOffer.owner.fullName}" outcome="/faces/user/user">
											<f:param name="userId" value="#{jobOffer.owner.id}" />
										</h:link>
									</p:column>
								</p:dataTable>
							</div>
						</div>
					</p:panel>
				</h:form>
			</div>
		</div>
	</ui:define>
</ui:composition>
