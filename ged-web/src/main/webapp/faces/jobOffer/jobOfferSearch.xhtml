<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['job.job_offer']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="offers" />

	<ui:define name="content">
		<p:breadCrumb styleClass="breadcrumb">
			<p:menuitem value="#{i18n['menu.index']}" url="/faces/index.xhtml" />
			<p:menuitem value="#{i18n['job.job_offers']}" disabled="true" />
		</p:breadCrumb>

		<h:form id="jobOfferSearchform">
			<div class="search">
				<div class="dialog blue">
					<div class="dialog-header">
						<h3>#{i18n['job.job_offers']}</h3>
					</div>
					<div class="dialog-content">
						<div class="searchbar">
							<cc:inputSearch searchText="#{jobOfferSearchBean.searchText}" searchAction="#{jobOfferSearchBean.search}"
								update="@form" />
						</div>
					</div>
				</div>
			</div>
			<div class="search-result">
				<div class="search-result-header">
					<div class="search-result-header-title">#{i18n['job.job_offers']}</div>
					<div class="search-result-header-buttons">
						<p:commandButton value="#{i18n['action.export']}" action="#{jobOfferSearchBean.search}" process="@this"
							icon="fa-file-excel-o" styleClass="btn-primary" />
						<p:button value="#{i18n['action.new']}" outcome="jobOfferEdit" styleClass="btn-primary" />
					</div>
				</div>
				<div class="search-result-content">
					<p:dataTable var="jobOffer" value="#{jobOfferSearchBean.jobOffers}" emptyMessage="#{i18n['job.no_jobs_found']}"
						reflow="true" paginator="true" paginatorPosition="bottom" rows="#{sessionUser.rowsPerPage}">

						<p:column headerText="#{i18n['job.name']}" sortBy="#{jobOffer.name}">
							<h:link value="#{jobOffer.name}" outcome="/faces/jobOffer/jobOffer">
								<f:param name="jobOfferId" value="#{jobOffer.id}" />
							</h:link>
						</p:column>
						<p:column headerText="#{i18n['job.client']}" sortBy="#{jobOffer.client.name}">
							<h:link value="#{jobOffer.client.name}" outcome="/faces/client/client">
								<f:param name="clientId" value="#{jobOffer.client.id}" />
							</h:link>
						</p:column>
						<p:column headerText="#{i18n['job.date_opened']}" sortBy="#{jobOffer.dateOpened}">
							<h:outputText value="#{jobOffer.dateOpened}">
								<f:convertDateTime type="localDate" pattern="dd/MM/yyyy" />
							</h:outputText>
						</p:column>
						<p:column headerText="#{i18n['job.date_closed']}" sortBy="#{jobOffer.dateClosed}">
							<h:outputText value="#{jobOffer.dateClosed}">
								<f:convertDateTime type="localDate" pattern="dd/MM/yyyy" />
							</h:outputText>
						</p:column>
						<p:column headerText="#{i18n['job.places']}">
							<h:outputText value="#{jobOffer.places}" />
						</p:column>
						<p:column headerText="#{i18n['user.owner']}" sortBy="#{user.owner.fullName}">
							<h:link value="#{jobOffer.owner.fullName}" outcome="/faces/user/user">
								<f:param name="userId" value="#{jobOffer.owner.id}" />
							</h:link>
						</p:column>
					</p:dataTable>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
