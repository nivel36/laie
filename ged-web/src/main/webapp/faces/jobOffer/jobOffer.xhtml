<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:i18n="http://ged.com/i18n" xmlns:p="http://primefaces.org/ui"
	xmlns:cc="http://java.sun.com/jsf/composite/components" template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['job.job_offer']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="offers" />

	<ui:define name="content">
		<div class="grid">
			<div class="col-12">
				<p:breadCrumb homeDisplay="text">
					<p:menuitem value="#{i18n['menu.index']}" url="/faces/index.xhtml" />
					<p:menuitem value="#{i18n['job.job_offers']}" url="/faces/jobOffer/jobOfferSearch.xhtml" />
					<p:menuitem value="#{jobOfferBean.jobOffer.name}" disabled="true" />
				</p:breadCrumb>
			</div>
			
			<div class="col-12">
				<h:form id="jobOfferViewForm">
					<p:panel header="#{i18n['job.job_offer']}">
						<div class="grid">
							<div class="col-12 lg-6 xl-4">
								<div class="form-group">
									<p:outputLabel for="name" value="#{i18n['job.name']}" />
									<p:inputText id="name" value="#{jobOfferBean.jobOffer.name}" readonly="true" />
								</div>
							</div>
							<div class="col-12 lg-6 xl-4">
								<div class="form-group">
									<p:outputLabel for="client" value="#{i18n['job.client']}" />
									<p:inputText id="client" value="#{jobOfferBean.jobOffer.client.name}" readonly="true" />
								</div>
							</div>
							<div class="col-12 lg-6 xl-4">
								<div class="form-group">
									<p:outputLabel for="places" value="#{i18n['job.places']}" />
									<p:inputText id="places" value="#{jobOfferBean.jobOffer.places}" readonly="true" />
								</div>
							</div>
							<div class="col-12 lg-6 xl-4">
								<div class="form-group">
									<p:outputLabel for="dateOpened" value="#{i18n['job.date_opened']}" />
									<p:calendar id="dateOpened" value="#{jobOfferBean.jobOffer.dateOpened}" readonly="true" pattern="dd/MM/yyyy">
										<f:convertDateTime type="localDate" pattern="dd/MM/yyyy" />
									</p:calendar>
								</div>
							</div>
							<div class="col-12 lg-6 xl-4">
								<div class="form-group">
									<p:outputLabel for="dateClosed" value="#{i18n['job.date_closed']}" />
									<p:calendar id="dateClosed" value="#{jobOfferBean.jobOffer.dateClosed}" readonly="true" pattern="dd/MM/yyyy">
										<f:convertDateTime type="localDate" pattern="dd/MM/yyyy" />
									</p:calendar>
								</div>
							</div>
							<div class="col-12 lg-6 xl-4">
								<div class="form-group">
									<p:outputLabel for="city" value="#{i18n['address.city']}" />
									<p:inputText id="city" value="#{jobOfferBean.jobOffer.city}" readonly="true" />
								</div>
							</div>
							<div class="col-12 lg-6 xl-4">
								<div class="form-group">
									<p:outputLabel for="state" value="#{i18n['address.state']}" />
									<p:inputText id="state" value="#{jobOfferBean.jobOffer.state}" readonly="true" />
								</div>
							</div>
							<div class="col-12">
								<div class="form-group">
									<p:outputLabel for="description" value="#{i18n['job.description']}" />
									<p:inputTextarea id="description" value="#{jobOfferBean.jobOffer.description}" readonly="true" />
								</div>
							</div>
							
							<div class="col-12">
								<div class="form-action-primary">
									<p:commandButton id="exportExcel" value="#{i18n['action.export']}" action="#" icon="fa fa-file-excel-o" />
									<p:commandButton id="editJobOffer" value="#{i18n['action.edit']}" actionListener="#{jobOfferBean.editJobOffer}"
										action="jobOfferEdit?faces-redirect=true" styleClass="btn-primary" />
								</div>
							</div>
						</div>
					</p:panel>
				</h:form>
			</div>
			<div class="col-12">
				<h:form id="candidatesForm">
					<cc:jobCandidatures jobCandidatures="#{jobOfferBean.jobCandidatures}" showJobOffer="false">
						<p:commandButton value="#{i18n['action.add']}" actionListener="#{jobOfferBean.openSelectCandidatesDialog}" process="@this">
							<p:ajax event="dialogReturn" listener="#{jobOfferBean.onCloseSelectCandidateDialog}" update="@form" />
						</p:commandButton>
					</cc:jobCandidatures>
				</h:form>
			</div>

			<div class="col-12 md-12 lg-6">
				<p:panel header="#{i18n['job_meeting.conducted_job_meetings']}">
				</p:panel>
			</div>
			<div class="col-12 md-12 lg-6">
				<p:panel header="#{i18n['job_meeting.planned_job_meetings']}">

				</p:panel>
			</div>
		</div>
	</ui:define>
</ui:composition>
