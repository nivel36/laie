<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:i18n="http://legion.com/i18n" xmlns:p="http://primefaces.org/ui">

	<ui:include src="/faces/client/clientSearchDialog.xhtml" />

	<h:form id="newJobOfferForm">
		<p:dialog id="newJobOfferDlg" header="#{i18n['job.new_job_offer']}" modal="true" resizable="false" responsive="true" closable="false" styleClass="medium"
			visible="#{jobOfferDialogBean.showDialog}">
			<div class="ui-g">
				<div class="ui-g-12 ui-md-6">
					<div class="form-group">
						<p:outputLabel for="name" value="#{i18n['job.name']}" />
						<p:inputText id="name" value="#{jobOfferDialogBean.jobOffer.name}" required="true" />
						<p:message for="name" />
					</div>
				</div>
				<div class="ui-g-12 ui-md-6">
					<h:panelGroup id="clientGroup" layout="block" styleClass="form-group">
						<p:outputLabel for="client" value="#{i18n['job.client']}" />
						<div class="ui-inputgroup">
							<p:inputText id="client" value="#{jobOfferDialogBean.jobOffer.client.name}" required="true" />
							<p:commandButton action="#{jobOfferDialogBean.cleanClient}" process="@this" update="clientGroup" styleClass="btn-gray" icon="fa fa-times"
								rendered="#{not empty jobOfferDialogBean.jobOffer.client.name}" />
							<p:commandButton icon="fa fa-search" styleClass="green-button" actionListener="#{clientSearchDialogBean.openDialog}" update="clientSearchDialogForm"
								process="@this">
								<f:attribute name="updateField" value="newJobOfferForm:clientGroup" />
								<f:attribute name="callback" value="#{jobOfferDialogBean.selectClientCallback}" />
							</p:commandButton>
						</div>
						<p:message for="client" />
					</h:panelGroup>
				</div>
				<div class="ui-g-12 ui-md-6">
					<div class="form-group">
						<p:outputLabel for="places" value="#{i18n['job.places']}" />
						<p:inputText id="places" value="#{jobOfferDialogBean.jobOffer.places}" />
						<p:message for="places" />
					</div>
				</div>
				<div class="ui-g-12">
					<div class="form-group">
						<p:outputLabel for="description" value="#{i18n['job.description']}" />
						<p:inputTextarea id="description" value="#{jobOfferDialogBean.jobOffer.description}" />
						<p:message for="description" />
					</div>
				</div>
				<div class="ui-g-12 ui-md-6">
					<div class="form-group">
						<p:outputLabel for="dateOpened" value="#{i18n['job.date_opened']}" />
						<p:calendar id="dateOpened" value="#{jobOfferDialogBean.jobOffer.dateOpened}" pattern="dd/MM/yyyy">
							<f:convertDateTime type="localDate" pattern="dd/MM/yyyy" />
						</p:calendar>
						<p:message for="dateOpened" />
					</div>
				</div>
				<div class="ui-g-12 ui-md-6">
					<div class="form-group">
						<p:outputLabel for="dateClosed" value="#{i18n['job.date_closed']}" />
						<p:calendar id="dateClosed" value="#{jobOfferDialogBean.jobOffer.dateClosed}" pattern="dd/MM/yyyy">
							<f:convertDateTime type="localDate" pattern="dd/MM/yyyy" />
						</p:calendar>
						<p:message for="dateClosed" />
					</div>
				</div>
				<div class="ui-g-12 ui-md-6">
					<div class="form-group">
						<p:outputLabel for="city" value="#{i18n['address.city']}" />
						<p:inputText id="city" value="#{jobOfferDialogBean.jobOffer.city}" required="true" />
						<p:message for="city" />
					</div>
				</div>
				<div class="ui-g-12 ui-md-6">
					<div class="form-group">
						<p:outputLabel for=" state" value="#{i18n['address.state']}" />
						<p:inputText id="state" value="#{jobOfferDialogBean.jobOffer.state}" required="true" />
						<p:message for="state" />
					</div>
				</div>
			</div>
			<f:facet name="footer">
				<div class="form-action-primary">
					<p:commandButton value="#{i18n['action.cancel']}" action="#{jobOfferDialogBean.closeDialog}" process="@this" update="@form" styleClass="btn-gray">
						<p:resetInput target="@form" />
					</p:commandButton>
					<p:commandButton value="#{i18n['action.save']}" action="#{jobOfferDialogBean.save}" update="@form growl" styleClass="btn-primary" />
				</div>
			</f:facet>
		</p:dialog>
	</h:form>
</ui:composition>
