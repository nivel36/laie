
<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:i18n="http://legion.com/i18n"
	xmlns:cc="http://java.sun.com/jsf/composite/components" template="/WEB-INF/templates/dialog.xhtml">

	<ui:define name="title">
		<title>#{jobOfferDialogBean.newJobOffer ? i18n['job.new_job'] : jobOfferDialogBean.jobOffer.name}</title>
	</ui:define>

	<ui:define name="content">

		<h:form id="newJobOfferForm">
			<div class="ui-g">
				<div class="ui-g-12 ui-md-6">
					<cc:inputText name="name" label="#{i18n['job.name']}" value="#{jobOfferDialogBean.jobOffer.name}" required="true">
				</div>
				<div class="ui-g-12 ui-md-6">
					<h:panelGroup id="clientGroup" layout="block" styleClass="form-group">
						<p:outputLabel for="client" value="#{i18n['job.client']}" />
						<div class="ui-inputgroup">
							<p:inputText id="client" value="#{jobOfferDialogBean.client.name}" required="true" />
							<p:commandButton action="#{jobOfferDialogBean.cleanClient}" process="@this" update="clientGroup" styleClass="btn-gray" icon="fa fa-times"
								rendered="#{not empty jobOfferDialogBean.client.name}" />
							<p:commandButton icon="fa fa-search" styleClass="green-button" actionListener="#{jobOfferDialogBean.openClientSearchDialog}" process="@this">
								<p:ajax event="dialogReturn" listener="#{jobOfferDialogBean.onCloseClientSearchDialog}" update="clientGroup" />
							</p:commandButton>
						</div>
						<p:message for="client" />
					</h:panelGroup>
				</div>
				<div class="ui-g-12 ui-md-6">
					<cc:inputText name="places" label="#{i18n['job.places']}" value="#{jobOfferDialogBean.jobOffer.places}">
				</div>
				<div class="ui-g-12">
					<div class="form-group">
						<p:outputLabel for="description" value="#{i18n['job.description']}" />
						<p:inputTextarea id="description" value="#{jobOfferDialogBean.jobOffer.description}" />
						<p:message for="description" />
					</div>
				</div>
				<div class="ui-g-12 ui-md-6">
					<div class="form-group">
						<p:outputLabel for="dateOpened" value="#{i18n['job.date_opened']}" />
						<p:calendar id="dateOpened" value="#{jobOfferDialogBean.jobOffer.dateOpened}" pattern="dd/MM/yyyy">
							<f:convertDateTime type="localDate" pattern="dd/MM/yyyy" />
						</p:calendar>
						<p:message for="dateOpened" />
					</div>
				</div>
				<div class="ui-g-12 ui-md-6">
					<div class="form-group">
						<p:outputLabel for="dateClosed" value="#{i18n['job.date_closed']}" />
						<p:calendar id="dateClosed" value="#{jobOfferDialogBean.jobOffer.dateClosed}" pattern="dd/MM/yyyy">
							<f:convertDateTime type="localDate" pattern="dd/MM/yyyy" />
						</p:calendar>
						<p:message for="dateClosed" />
					</div>
				</div>
				<div class="ui-g-12 ui-md-6">
					<cc:inputText name="city" label="#{i18n['job.city']}" value="#{jobOfferDialogBean.jobOffer.city}" required="true" />
				</div>
				<div class="ui-g-12 ui-md-6">
					<cc:inputText name="state" label="#{i18n['job.state']}" value="#{jobOfferDialogBean.jobOffer.state}" required="true" />
				</div>
			</div>
			<div class="form-action-primary">
				<p:commandButton value="#{i18n['action.cancel']}" action="#{jobOfferDialogBean.closeDialog}" process="@this" styleClass="btn-gray" />
				<p:commandButton value="#{i18n['action.save']}" action="#{jobOfferDialogBean.save}" update="@form growl" styleClass="btn-primary" />
			</div>
		</h:form>
	</ui:define>
</ui:composition>
