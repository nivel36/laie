<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:i18n="http://ged.com/i18n"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" template="/WEB-INF/templates/dialog.xhtml">

	<ui:define name="title">
		<title>#{i18n['job.job_offers']}</title>
	</ui:define>

	<ui:define name="content">
		<h:form id="jobOfferSearchDialogForm">
			<div class="grid">
				<div class="col-12 md-6 lg-4">
					<div class="ui-inputgroup">
						<p:inputText id="searchText" value="#{jobOfferSearchDialogBean.searchText}" />
						<p:commandButton id="cleanSearchTextAction" action="#{jobOfferSearchDialogBean.clean}" update="@form" styleClass="btn-gray" icon="fa fa-times"
							rendered="#{not empty jobOfferSearchDialogBean.searchText}" />
						<p:commandButton id="searchAction" action="#{jobOfferSearchDialogBean.search}" update="@form" icon="fa fa-search" />
					</div>
				</div>
				
				<div class="col-12">
					<p:dataTable var="jobOffer" value="#{jobOfferSearchDialogBean.jobOffers}" emptyMessage="#{i18n['job.no_jobs_found']}" reflow="true" paginator="true"
						rowKey="#{jobOffer.id}" paginatorPosition="bottom" rows="#{sessionUser.rowsPerPage}" selection="#{jobOfferSearchDialogBean.selectedJobOffers}">

						<p:column selectionMode="multiple" style="width:16px;text-align:center" />

						<p:column headerText="#{i18n['job.name']}" sortBy="#{jobOffer.name}">
							<h:outputText value="#{jobOffer.name}" />
						</p:column>
						<p:column headerText="#{i18n['job.client']}" sortBy="#{jobOffer.client.name}">
							<h:outputText value="#{jobOffer.client.name}" />
						</p:column>
						<p:column headerText="#{i18n['job.date_opened']}" sortBy="#{jobOffer.dateOpened}">
							<h:outputText value="#{jobOffer.dateOpened}">
								<f:convertDateTime type="localDate" pattern="dd/MM/yyyy" />
							</h:outputText>
						</p:column>
						<p:column headerText="#{i18n['job.date_closed']}" sortBy="#{jobOffer.dateClosed}">
							<h:outputText value="#{jobOffer.dateClosed}">
								<f:convertDateTime type="localDate" pattern="dd/MM/yyyy" />
							</h:outputText>
						</p:column>
						<p:column headerText="#{i18n['user.owner']}" sortBy="#{i18n['user.owner']}">
							<h:outputText value="#{jobOffer.owner.fullName}" />
						</p:column>
					</p:dataTable>
				</div>
				
				<div class="col-12">
					<div class="pull-right">
						<p:commandButton value="#{i18n['action.cancel']}" actionListener="#{jobOfferSearchDialogBean.closeDialog}" process="@this" styleClass="btn-gray" />
						<p:commandButton value="#{i18n['action.select']}" action="#{jobOfferSearchDialogBean.select}" update="@form" />
					</div>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
