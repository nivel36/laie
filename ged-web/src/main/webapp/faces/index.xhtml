<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>Ged</title>
	</ui:define>

	<ui:param name="selectedMenu" value="index" />

	<ui:define name="content">
		<h:form>
			<h:graphicImage value="/resources/img/s.gif"
				styleClass="headerIcon homeIcon" />
			<h1 class="header">#{i18n['index.index']}</h1>

			<h:panelGrid styleClass="panelGrid" columns="2" cellpadding="10px">
				<h:panelGroup layout="block" styleClass="panel">
					<h1>#{i18n['index.last_offers']}</h1>

					<h:outputText value="#{i18n['job.no_jobs_found']}"
						rendered="#{empty jobOfferSearchBean.dataList}" />

					<h:dataTable var="jobOffer" id="jobOffer"
						value="#{jobOfferSearchBean.dataList}"
						rendered="#{not empty jobOfferSearchBean.dataList}">

						<h:column>
							<f:facet name="header">
								<h:outputText value="#{i18n['job.name']}" />
							</f:facet>
							<h:outputText value="#{jobOffer.jobName}" />
						</h:column>
					</h:dataTable>

					<h:panelGroup display="block" styleClass="buttonGroup">
						<h:commandButton value="#{i18n['action.new']}"
							action="job/jobOfferEdit?faces-redirect=true" />
					</h:panelGroup>
				</h:panelGroup>
				<h:panelGroup layout="block" styleClass="panel">
					<h1>#{i18n['index.last_candidates']}</h1>

					<h:outputText value="#{i18n['candidate.no_candidates_found']}"
						rendered="#{empty indexBean.candidates}" />

					<ui:repeat var="candidate" value="${indexBean.candidates}">
						<h:panelGroup styleClass="card" layout="block">
							<h:graphicImage value="/resources/img/classic-blue/no-photo.png"
								styleClass="photo" />
							<h:outputText styleClass="name" value="${candidate.name} ${candidate.surename}" />
							<br/>
							<h:outputText value="Arquitecto de software en GFI"  />
						</h:panelGroup>
					</ui:repeat>

					<h:panelGroup display="block" styleClass="buttonGroup">
						<h:commandButton value="#{i18n['action.new']}"
							action="candidate/candidateEdit?faces-redirect=true" />
					</h:panelGroup>
				</h:panelGroup>
				<h:panelGroup layout="block" styleClass="panel">
					<h1>#{i18n['index.last_reports']}</h1>
					<h:panelGroup display="block" styleClass="buttonGroup">
						<h:commandButton value="#{i18n['action.new']}"
							action="#{jobOfferViewBean.modify}" />
					</h:panelGroup>
				</h:panelGroup>
				<h:panelGroup layout="block" styleClass="panel">
					<h1>#{i18n['index.scheudele']}</h1>
				</h:panelGroup>
			</h:panelGrid>
		</h:form>
	</ui:define>
</ui:composition>
