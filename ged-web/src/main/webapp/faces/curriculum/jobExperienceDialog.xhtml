<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:i18n="http://legion.com/i18n"
	xmlns:cc="http://java.sun.com/jsf/composite/components" template="/WEB-INF/templates/dialog.xhtml">

	<ui:define name="title">
		<title>#{i18n['candidate.candidates']}</title>
	</ui:define>

	<ui:define name="content">
		<div class="ui-g">
			<div class="ui-g-12">
				<div class="form-group">
					<p:outputLabel value="#{i18n['education.degree']}" />
					<p:inputText id="degree" value="#{education.degree}" required="true" />
				</div>
				<h:message for="degree" errorClass="error" />
			</div>
			<div class="ui-g-12">
				<div class="form-group">
					<p:outputLabel value="#{i18n['education.school']}" />
					<p:inputText id="school" value="#{education.school}" required="true" />
				</div>
				<h:message for="school" errorClass="error" />
			</div>
			<div class="ui-g-12">
				<div class="form-group">
					<p:outputLabel value="#{i18n['education.from_date']}" />
					<p:inputText id="fromDate" value="#{education.fromDate}" label="#{i18n['education.from_date']}">
						<f:convertDateTime pattern="MM / yyyy" />
					</p:inputText>
				</div>
				<h:message for="fromDate" errorClass="error" />
			</div>
			<div class="ui-g-12">
				<div class="form-group">
					<p:outputLabel value="#{i18n['education.to_date']}" />
					<p:inputText id="toDate" value="#{education.toDate}" disabled="#{education.stillStudying}">
						<f:convertDateTime pattern="MM / yyyy" />
					</p:inputText>
				</div>
				<h:message for="toDate" errorClass="error" />
			</div>

			<div class="ui-g-12">
				<div class="form-group">
					<p:outputLabel value="#{i18n['education.still_studying']}" />
					<p:selectBooleanCheckbox value="#{education.stillStudying}" id="stillStudying">
						<f:ajax render="toDate" />
					</p:selectBooleanCheckbox>
				</div>
			</div>

			<div class="ui-g-12">
				<div class="form-group">
					<p:outputLabel value="#{i18n['education.description']}" />
					<p:inputTextarea value="#{education.description}" id="description" label="#{i18n['education.description']}" />
				</div>
			</div>
		</div>
		<div class="ui-g">
			<div class="ui-g-12">
				<div class="form-action-primary">
					<p:commandButton styleClass="btn-gray" value="#{i18n['action.remove']}" action="#{curriculumDialogBean.removeEducation(education)}" process="@this"
						update="@form" />
				</div>
			</div>
		</div>
	</ui:define>
</ui:composition>
