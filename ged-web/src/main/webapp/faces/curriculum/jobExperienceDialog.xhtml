<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:i18n="http://legion.com/i18n"
	xmlns:cc="http://java.sun.com/jsf/composite/components" template="/WEB-INF/templates/dialog.xhtml">

	<ui:define name="title">
		<title>#{i18n['job_experience.job_experience']}</title>
	</ui:define>

	<ui:define name="content">
		<h:form>
			<div class="ui-g">
				<div class="ui-g-12 ui-md-6">
					<div class="form-group">
						<p:outputLabel value="#{i18n['job_experience.company_name']}" />
						<p:inputText id="companyName" value="#{jobExperienceDialogBean.jobExperience.companyName}" required="true" />
						<p:message for="companyName" />
					</div>
				</div>

				<div class="ui-g-12 ui-md-6">
					<div class="form-group">
						<p:outputLabel value="#{i18n['job_experience.job_position']}" />
						<p:inputText id="jobPosition" value="#{jobExperienceDialogBean.jobExperience.jobPosition}" required="true" />
						<p:message for="jobPosition" />
					</div>
				</div>
			</div>
			<div class="ui-g">
				<div class="ui-g-12 ui-md-4">
					<div class="form-group">
						<p:outputLabel value="#{i18n['job_experience.from_date']}" />
						<p:selectOneMenu id="startMonth" value="#{jobExperienceDialogBean.startMonth}" required="true" >
							<f:selectItem itemLabel="#{i18n['date.month']}" itemValue="" />
							<f:selectItems var="month" value="#{combo.months}" itemValue="#{combo.months.indexOf(month)+1}" itemLabel="#{month}" />
						</p:selectOneMenu>
						<p:selectOneMenu id="startYear" value="#{jobExperienceDialogBean.startYear}" required="true" >
							<f:selectItem itemLabel="#{i18n['date.year']}" itemValue="" />
							<f:selectItems var="year" value="#{combo.years}" itemValue="#{year}" itemLabel="#{year}" />
						</p:selectOneMenu>
					</div>
				</div>

				<div class="ui-g-12 ui-md-4">
					<h:panelGroup id="endDate" class="form-group" layout="block">
						<p:outputLabel value="#{i18n['job_experience.to_date']}" rendered="#{not jobExperienceDialogBean.jobExperience.stillWorking}" />
						<p:selectOneMenu id="endMonth" value="#{jobExperienceDialogBean.endMonth}" rendered="#{not jobExperienceDialogBean.jobExperience.stillWorking}" required="true">
							<f:selectItem itemLabel="#{i18n['date.month']}" itemValue="" />
							<f:selectItems var="month" value="#{combo.months}" itemValue="#{combo.months.indexOf(month)+1}" itemLabel="#{month}" />
						</p:selectOneMenu>
						<p:selectOneMenu id="endYear" value="#{jobExperienceDialogBean.endYear}" rendered="#{not jobExperienceDialogBean.jobExperience.stillWorking}" required="true">
							<f:selectItem itemLabel="#{i18n['date.year']}" itemValue="" />
							<f:selectItems var="year" value="#{combo.years}" itemValue="#{year}" itemLabel="#{year}" />
						</p:selectOneMenu>
					</h:panelGroup>
				</div>

				<div class="ui-g-12 ui-md-4">
					<div class="form-group">
						<p:outputLabel value="#{i18n['job_experience.still_working']}" />
						<p:selectBooleanCheckbox value="#{jobExperienceDialogBean.jobExperience.stillWorking}" id="stillWorking">
							<f:ajax render="endDate" />
						</p:selectBooleanCheckbox>
					</div>
				</div>
			</div>
			<div class="ui-g">
				<div class="ui-g-12">
					<div class="form-group">
						<p:outputLabel value="#{i18n['job_experience.description']}" />
						<p:textEditor id="description" value="#{jobExperienceDialogBean.jobExperience.description}" styleClass="textArea">
							<f:facet name="toolbar">
								<span class="ql-formats">
									<button class="ql-bold"></button>
									<button class="ql-italic"></button>
									<button class="ql-underline"></button>
								</span>
								<span class="ql-formats"> <select class="ql-color" /> <select class="ql-background" />
								</span>
								<span class="ql-formats">
									<button class="ql-script" value="sub" />
									<button class="ql-script" value="super" />
								</span>
								<span class="ql-formats">
									<button class="ql-header" value="1" />
									<button class="ql-header" value="2" />
									<button class="ql-blockquote" />
									<button class="ql-code-block" />
								</span>
								<span class="ql-formats">
									<button class="ql-list" value="ordered" />
									<button class="ql-list" value="bullet" />
									<button class="ql-indent" value="-1" />
									<button class="ql-indent" value="+1" />
								</span>
								<span class="ql-formats">
									<button class="ql-direction" value="rtl" /> <select class="ql-align" />
								</span>
								<span class="ql-formats">
									<button class="ql-clean" />
								</span>
							</f:facet>
						</p:textEditor>
						<p:message for="description" />
					</div>
				</div>
			</div>
			<div class="ui-g">
				<div class="ui-g-12">
					<div class="form-action-primary">
						<p:commandButton styleClass="btn-gray" value="#{i18n['action.cancel']}" actionListener="#{jobExperienceDialogBean.closeDialog}" process="@this"
							update="@form" />
						<p:commandButton styleClass="btn-red" value="#{i18n['action.delete']}" action="#{jobExperienceDialogBean.delete}" process="@this"
							rendered="#{not jobExperienceDialogBean.newJobExperience}" />
						<p:commandButton styleClass="btn-primary" value="#{i18n['action.save']}" action="#{jobExperienceDialogBean.save}" process="@form" update="@form" />
					</div>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
