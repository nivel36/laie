<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:i18n="http://ged.com/i18n" xmlns:o="http://omnifaces.org/ui"
	xmlns:cc="http://java.sun.com/jsf/composite/components" template="/WEB-INF/templates/dialog.xhtml">

	<ui:define name="title">
		<title>#{i18n['job_experience.job_experience']}</title>
	</ui:define>

	<ui:define name="content">
		<h:form>
			<div class="grid">
				<div class="col-12 md-6">
					<div class="form-group">
						<p:outputLabel value="#{i18n['job_experience.company_name']}" />
						<p:inputText id="companyName" value="#{jobExperienceBean.jobExperience.companyName}" required="true" />
						<p:message for="companyName" />
					</div>
				</div>

				<div class="col-12 md-6">
					<div class="form-group">
						<p:outputLabel value="#{i18n['job_experience.job_position']}" />
						<p:inputText id="jobPosition" value="#{jobExperienceBean.jobExperience.jobPosition}" required="true" />
						<p:message for="jobPosition" />
					</div>
				</div>

				<div class="col-12">
					<cc:inputDateRange fromYear="#{jobExperienceBean.startYear}" toYear="#{jobExperienceBean.endYear}" still="#{jobExperienceBean.jobExperience.stillWorking}"
						fromMonth="#{jobExperienceBean.startMonth}" toMonth="#{jobExperienceBean.endMonth}" showMonths="true" />
				</div>


				<div class="col-12">
					<div class="form-group">
						<p:outputLabel value="#{i18n['job_experience.description']}" />
						<p:textEditor id="description" value="#{jobExperienceBean.jobExperience.description}" styleClass="textArea">
							<f:facet name="toolbar">
								<span class="ql-formats">
									<button class="ql-bold"></button>
									<button class="ql-italic"></button>
									<button class="ql-underline"></button>
								</span>
								<span class="ql-formats"> <select class="ql-color" /> <select class="ql-background" />
								</span>
								<span class="ql-formats">
									<button class="ql-script" value="sub" />
									<button class="ql-script" value="super" />
								</span>
								<span class="ql-formats">
									<button class="ql-header" value="1" />
									<button class="ql-header" value="2" />
									<button class="ql-blockquote" />
									<button class="ql-code-block" />
								</span>
								<span class="ql-formats">
									<button class="ql-list" value="ordered" />
									<button class="ql-list" value="bullet" />
									<button class="ql-indent" value="-1" />
									<button class="ql-indent" value="+1" />
								</span>
								<span class="ql-formats">
									<button class="ql-direction" value="rtl" /> <select class="ql-align" />
								</span>
								<span class="ql-formats">
									<button class="ql-clean" />
								</span>
							</f:facet>
						</p:textEditor>
						<p:message for="description" />
					</div>
				</div>

				<div class="col-12">
					<div class="form-action-primary">
						<p:commandButton styleClass="btn-gray" value="#{i18n['action.cancel']}" actionListener="#{jobExperienceBean.closeDialog}" process="@this" update="@form" />
						<p:commandButton styleClass="btn-red" value="#{i18n['action.delete']}" action="#{jobExperienceBean.delete}" process="@this"
							rendered="#{not jobExperienceBean.newJobExperience}" />
						<p:commandButton styleClass="btn-primary" value="#{i18n['action.save']}" action="#{jobExperienceBean.save}" process="@form" update="@form" />
					</div>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
