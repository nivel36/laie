<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:i18n="http://ged.com/i18n" xmlns:o="http://omnifaces.org/ui"
	xmlns:cc="http://java.sun.com/jsf/composite/components" template="/WEB-INF/templates/dialog.xhtml">

	<ui:define name="title">
		<title>#{i18n['education.education']}</title>
	</ui:define>

	<ui:define name="content">
		<h:form>
			<div class="grid">
				<div class="col-12 md-6">
					<div class="form-group">
						<p:outputLabel value="#{i18n['education.degree']}" />
						<p:inputText id="degree" value="#{educationBean.education.degree}" required="true" />
						<p:message for="degree" />
					</div>
				</div>
				<div class="col-12 md-6">
					<div class="form-group">
						<p:outputLabel value="#{i18n['education.school']}" />
						<p:inputText id="school" value="#{educationBean.education.school}" required="true" />
						<p:message for="school" />
					</div>
				</div>

				<div class="col-12 md-5">
					<div class="form-group">
						<p:outputLabel value="#{i18n['education.from_date']}" />
						<p:selectOneMenu id="startYear" value="#{educationBean.education.startYear}" required="true">
							<f:selectItem itemLabel="#{i18n['date.year']}" itemValue="" />
							<f:selectItems var="year" value="#{combo.years}" itemValue="#{year}" itemLabel="#{year}" />
						</p:selectOneMenu>
						<p:message for="startYear" />
					</div>
				</div>

				<div class="col-12 md-5">
					<h:panelGroup id="endDate" class="form-group" layout="block">
						<p:outputLabel value="#{i18n['education.to_date']}" rendered="#{not educationBean.education.stillStudying}" />
						<p:selectOneMenu id="endYear" value="#{educationBean.education.endYear}" rendered="#{not educationBean.education.stillStudying}" required="true">
							<f:selectItem itemLabel="#{i18n['date.year']}" itemValue="" />
							<f:selectItems var="year" value="#{combo.years}" itemValue="#{year}" itemLabel="#{year}" />
						</p:selectOneMenu>
						<p:message for="endYear" />
						<o:validateMultiple id="validationDates" components="startYear endYear stillStudying" validator="#{educationBean.validateDates}"
							message="#{i18n['education.error.dates']}" showMessageFor="endYear" />
					</h:panelGroup>
				</div>

				<div class="col-12 md-2">
					<div class="form-group">
						<p:outputLabel value="#{i18n['education.still_studying']}" />
						<p:selectBooleanCheckbox value="#{educationBean.education.stillStudying}" id="stillStudying">
							<f:ajax render="endDate" />
						</p:selectBooleanCheckbox>
					</div>
				</div>

				<div class="col-12">
					<div class="form-group">
						<p:outputLabel value="#{i18n['education.description']}" />
						<p:textEditor id="description" value="#{educationBean.education.description}" styleClass="textArea">
							<f:facet name="toolbar">
								<span class="ql-formats">
									<button class="ql-bold"></button>
									<button class="ql-italic"></button>
									<button class="ql-underline"></button>
								</span>
								<span class="ql-formats"> <select class="ql-color" /> <select class="ql-background" />
								</span>
								<span class="ql-formats">
									<button class="ql-script" value="sub" />
									<button class="ql-script" value="super" />
								</span>
								<span class="ql-formats">
									<button class="ql-header" value="1" />
									<button class="ql-header" value="2" />
									<button class="ql-blockquote" />
									<button class="ql-code-block" />
								</span>
								<span class="ql-formats">
									<button class="ql-list" value="ordered" />
									<button class="ql-list" value="bullet" />
									<button class="ql-indent" value="-1" />
									<button class="ql-indent" value="+1" />
								</span>
								<span class="ql-formats">
									<button class="ql-direction" value="rtl" /> <select class="ql-align" />
								</span>
								<span class="ql-formats">
									<button class="ql-clean" />
								</span>
							</f:facet>
						</p:textEditor>
						<p:message for="description" />
					</div>
				</div>

				<div class="col-12">
					<div class="form-action-primary">
						<p:commandButton styleClass="btn-gray" value="#{i18n['action.cancel']}" actionListener="#{educationBean.closeDialog}" process="@this" update="@form" />
						<p:commandButton styleClass="btn-red" value="#{i18n['action.delete']}" action="#{educationBean.delete}" process="@this"
							rendered="#{not educationBean.newEducation}" />
						<p:commandButton styleClass="btn-primary" value="#{i18n['action.save']}" action="#{educationBean.save}" process="@form" update="@form" />
					</div>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
