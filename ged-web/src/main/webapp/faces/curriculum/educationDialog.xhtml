<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:i18n="http://ged.com/i18n" xmlns:o="http://omnifaces.org/ui"
	xmlns:cc="http://java.sun.com/jsf/composite/components" template="/WEB-INF/templates/dialog.xhtml">

	<ui:define name="title">
		<title>#{i18n['education.education']}</title>
	</ui:define>

	<ui:define name="content">
		<h:form>
			<div class="grid">
				<div class="col-12 md-6">
					<cc:inputText id="degree" label="#{i18n['education.degree']}" value="#{educationBean.education.degree}" required="true" />
				</div>
				<div class="col-12 md-6">
					<cc:inputText id="school" label="#{i18n['education.school']}" value="#{educationBean.education.school}" required="true" />
				</div>

				<div class="col-12">
					<cc:inputDateRange id="years" startYear="{educationBean.education.startYear}" endYear="{educationBean.education.startYear}" still="#{educationBean.education.stillStudying}" minYear="21" />
				</div>
					
				<div class="col-12">
					<cc:richText id="description" label="#{i18n['education.description']}" value="#{educationBean.education.description}"/>
				</div>

				<div class="col-12">
					<div class="form-action-primary">
						<p:commandButton styleClass="btn-gray" value="#{i18n['action.cancel']}" actionListener="#{educationBean.closeDialog}" process="@this" update="@form" />
						<p:commandButton styleClass="btn-red" value="#{i18n['action.delete']}" action="#{educationBean.delete}" process="@this"
							rendered="#{not educationBean.newEducation}" />
						<p:commandButton styleClass="btn-primary" value="#{i18n['action.save']}" action="#{educationBean.save}" process="@form" update="@form" />
					</div>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
