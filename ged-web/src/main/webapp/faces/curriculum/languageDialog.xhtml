<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:i18n="http://ged.com/i18n" xmlns:o="http://omnifaces.org/ui"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" template="/WEB-INF/templates/dialog.xhtml">

	<ui:define name="title">
		<title>#{i18n['language.language']}</title>
	</ui:define>

	<ui:define name="content">
		<h:form>

			<div class="grid">
				<div class="col-12 md-6">
					<cc:inputText id="languageName" label="#{i18n['language.language']}" value="#{languageBean.language.name}" required="true" />
				</div>

				<div class="col-12 md-6">
					<cc:inputSelect name="" label="#{i18n['language.level']}" value="#{languageBean.language.level}" required="true">
						<f:selectItem itemLabel="#{i18n['language.level']}" itemValue="" />
						<f:selectItems value="#{languageLevels.list}" var="languageLevel" itemValue="#{languageLevel.name}" itemLabel="#{i18n:translate(languageLevel.name)}" />
					</cc:inputSelect>
				</div>

				<div class="col-12">
					<div class="form-action-primary">
						<p:commandButton styleClass="btn-gray" value="#{i18n['action.cancel']}" actionListener="#{languageBean.closeDialog}" process="@this" update="@form" />
						<p:commandButton styleClass="btn-red" value="#{i18n['action.delete']}" action="#{languageBean.delete}" process="@this"
							rendered="#{not languageBean.newLanguage}" />
						<p:commandButton styleClass="btn-primary" value="#{i18n['action.save']}" action="#{languageBean.save}" process="@form" update="@form" />
					</div>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
