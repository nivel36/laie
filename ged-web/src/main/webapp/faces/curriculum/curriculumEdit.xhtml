<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:i18n="http://legion.com/i18n" xmlns:p="http://primefaces.org/ui" template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['curriculum.curriculum']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="candidates" />

	<ui:define name="content">
		<h:form id="form">
			<div class="ui-g">
				<div class="ui-g-12 ui-lg-8">
					<p:panel header="#{i18n['curriculum.curriculum']}">
						<!-- JOB EXPERIENCE -->
						<h2>#{i18n['curriculum.job_experiences']}</h2>
						<h:panelGroup layout="block" id="jobExperiences">
							<ui:repeat value="#{curriculumEditBean.jobExperiences}" var="jobExperience" id="jobExperience">
								<h:panelGroup layout="block" class="repeatedPanel">
									<div class="ui-g">
										<div class="ui-g-12 ui-md-6">
											<div class="form-group">
												<p:outputLabel value="#{i18n['job_experience.company_name']}" />
												<p:inputText id="companyName" value="#{jobExperience.companyName}" required="true" />
											</div>
											<h:message for="companyName" errorClass="error" />
										</div>

										<div class="ui-g-12 ui-md-6">
											<div class="form-group">
												<p:outputLabel value="#{i18n['job_experience.job_position']}" />
												<p:inputText id="jobPosition" value="#{jobExperience.jobPosition}" required="true" />
											</div>
											<h:message for="jobPosition" errorClass="error" />
										</div>
									</div>
									<div class="ui-g">
										<div class="ui-g-12 ui-md-4">
											<div class="form-group">
												<p:outputLabel value="#{i18n['job_experience.from_date']}" />
												<p:calendar id="fromDate" value="#{jobExperience.fromDate}" pattern="dd/MM/yyyy">
													<f:convertDateTime type="localDate" pattern="dd/MM/yyyy" />
												</p:calendar>
											</div>
										</div>

										<div class="ui-g-12 ui-md-4">
											<div class="form-group">
												<p:outputLabel value="#{i18n['job_experience.to_date']}" />
												<p:calendar id="toDate" value="#{jobExperience.toDate}" pattern="dd/MM/yyyy" disabled="#{jobExperience.stillWorking}">
													<f:convertDateTime type="localDate" pattern="dd/MM/yyyy" />
												</p:calendar>
											</div>
										</div>

										<div class="ui-g-12 ui-md-4">
											<div class="form-group">
												<p:outputLabel value="#{i18n['job_experience.still_working']}" />
												<p:selectBooleanCheckbox value="#{jobExperience.stillWorking}" id="stillWorking">
													<f:ajax render="toDate" />
												</p:selectBooleanCheckbox>
											</div>
										</div>
									</div>
									<div class="ui-g">

										<div class="ui-g-12">
											<div class="form-group">
												<p:outputLabel value="#{i18n['job_experience.description']}" />
												<p:textEditor id="description" value="#{jobExperience.description}">
													<f:facet name="toolbar">
														<span class="ql-formats">
															<button class="ql-bold"></button>
															<button class="ql-italic"></button>
															<button class="ql-underline"></button>
														</span>
														<span class="ql-formats"> <select class="ql-color" /> <select class="ql-background" />
														</span>
														<span class="ql-formats">
															<button class="ql-script" value="sub" />
															<button class="ql-script" value="super" />
														</span>
														<span class="ql-formats">
															<button class="ql-header" value="1" />
															<button class="ql-header" value="2" />
															<button class="ql-blockquote" />
															<button class="ql-code-block" />
														</span>
														<span class="ql-formats">
															<button class="ql-list" value="ordered" />
															<button class="ql-list" value="bullet" />
															<button class="ql-indent" value="-1" />
															<button class="ql-indent" value="+1" />
														</span>
														<span class="ql-formats">
															<button class="ql-direction" value="rtl" /> <select class="ql-align" />
														</span>
														<span class="ql-formats">
															<button class="ql-clean" />
														</span>
													</f:facet>
												</p:textEditor>
												<h:message for="description" errorClass="error" />
											</div>
										</div>
									</div>

									<div class="ui-g">
										<div class="ui-g-12">
											<div class="form-action-primary">
												<p:commandButton styleClass="btn-gray" value="#{i18n['action.remove']}" action="#{curriculumEditBean.removeJobExperience(jobExperience)}"
													update="form:jobExperiences" process="@this" />
											</div>
										</div>
									</div>
								</h:panelGroup>
							</ui:repeat>
							<div class="ui-g">
								<div class="ui-g-12">
									<div class="form-action-primary">
										<p:commandButton value="#{i18n['action.add']}" action="#{curriculumEditBean.addJobExperience}" update="form:jobExperiences"
											process="form:jobExperiences" />
									</div>
								</div>
							</div>
						</h:panelGroup>

						<!-- EDUCATION -->
						<h2>#{i18n['curriculum.education']}</h2>
						<h:panelGroup layout="block" id="educationPanel">
							<ui:repeat value="#{curriculumEditBean.education}" var="education" id="repeatedPanel">
								<h:panelGroup layout="block" class="repeatedPanel">
									<div class="ui-g">
										<div class="ui-g-12 ui-md-6">
											<div class="form-group">
												<p:outputLabel value="#{i18n['education.degree']}" />
												<p:inputText id="degree" value="#{education.degree}" required="true" />
											</div>
											<h:message for="degree" errorClass="error" />
										</div>
										<div class="ui-g-12 ui-md-6">
											<div class="form-group">
												<p:outputLabel value="#{i18n['education.school']}" />
												<p:inputText id="school" value="#{education.school}" required="true" />
											</div>
											<h:message for="school" errorClass="error" />
										</div>
										<div class="ui-g-12 ui-md-6">
											<div class="form-group">
												<p:outputLabel value="#{i18n['education.from_date']}" />
												<p:calendar id="fromDate" value="#{education.fromDate}" pattern="dd/MM/yyyy">
													<f:convertDateTime type="localDate" pattern="dd/MM/yyyy" />
												</p:calendar>
											</div>
											<h:message for="fromDate" errorClass="error" />
										</div>
										<div class="ui-g-12 ui-md-6">
											<div class="form-group">
												<p:outputLabel value="#{i18n['education.to_date']}" />
												<p:calendar id="toDate" value="#{education.toDate}" pattern="dd/MM/yyyy" disabled="#{education.stillStudying}">
													<f:convertDateTime type="localDate" pattern="dd/MM/yyyy" />
												</p:calendar>
											</div>
											<h:message for="toDate" errorClass="error" />
										</div>

										<div class="ui-g-12 ui-md-6">
											<div class="form-group">
												<p:outputLabel value="#{i18n['education.still_studying']}" />
												<p:selectBooleanCheckbox value="#{education.stillStudying}" id="stillStudying">
													<f:ajax render="toDate" />
												</p:selectBooleanCheckbox>
											</div>
										</div>

										<div class="ui-g-12 ui-md-6">
											<div class="form-group">
												<p:outputLabel value="#{i18n['education.description']}" />
												<p:inputTextarea value="#{education.description}" id="description" label="#{i18n['education.description']}" />
											</div>
										</div>
									</div>
									<div class="ui-g">
										<div class="ui-g-12">
											<div class="form-action-primary">
												<p:commandButton styleClass="btn-gray" value="#{i18n['action.remove']}" action="#{curriculumEditBean.removeEducation(education)}" process="@this"
													update="form:educationPanel" />
											</div>
										</div>
									</div>
								</h:panelGroup>
							</ui:repeat>

							<div class="ui-g">
								<div class="ui-g-12">
									<div class="form-action-primary">
										<p:commandButton value="#{i18n['action.add']}" action="#{curriculumEditBean.addEducation}" process="form:educationPanel" update="form:educationPanel" />
									</div>
								</div>
							</div>
						</h:panelGroup>

						<!-- LANGUAGES -->
						<h2>#{i18n['curriculum.languages']}</h2>
						<h:panelGroup layout="block" id="languages">
							<ui:repeat value="#{curriculumEditBean.languages}" var="language" varStatus="current" id="language">
								<h:panelGroup layout="block" class="repeatedPanel">

									<div class="ui-g">
										<div class="ui-g-12 ui-md-6">
											<div class="form-group">
												<p:outputLabel value="#{i18n['language.language']}" />
												<p:inputText id="languageName" value="#{language.languageName}" required="true" />
											</div>
											<h:message for="languageName" errorClass="error" />
										</div>

										<div class="ui-g-12 ui-md-6">
											<div class="form-group">
												<p:outputLabel value="#{i18n['language.read']}" />
												<p:selectOneMenu id="read" value="#{language.read}">
													<f:selectItems var="languageLevel" itemValue="#{languageLevel.name}" value="#{applicationBean.languageLevels}"
														itemLabel="#{i18n:translate(languageLevel.name)}" />
												</p:selectOneMenu>
											</div>
										</div>

										<div class="ui-g-12 ui-md-6">
											<div class="form-group">
												<p:outputLabel value="#{i18n['language.speak']}" />
												<p:selectOneMenu id="speak" value="#{language.speak}">
													<f:selectItems var="languageLevel" itemValue="#{languageLevel.name}" value="#{applicationBean.languageLevels}"
														itemLabel="#{i18n:translate(languageLevel.name)}" />
												</p:selectOneMenu>
											</div>
										</div>

										<div class="ui-g-12 ui-md-6">
											<div class="form-group">
												<p:outputLabel value="#{i18n['language.write']}" />
												<p:selectOneMenu id="write" value="#{language.write}">
													<f:selectItems var="languageLevel" itemValue="#{languageLevel.name}" value="#{applicationBean.languageLevels}" />
												</p:selectOneMenu>
											</div>
										</div>
									</div>
									<div class="ui-g">
										<div class="ui-g-12">
											<div class="form-action-primary">
												<p:commandButton styleClass="btn-gray" value="#{i18n['action.remove']}" action="#{curriculumEditBean.removeLanguage(language)}"
													update="form:languages" process="@this" />
											</div>
										</div>
									</div>
								</h:panelGroup>
							</ui:repeat>
							<div class="ui-g">
								<div class="ui-g-12">
									<div class="form-action-primary">
										<p:commandButton value="#{i18n['action.add']}" action="#{curriculumEditBean.addLanguage}" update="form:languages" process="form:languages" />
									</div>
								</div>
							</div>
						</h:panelGroup>

						<!-- SKILLS -->
						<h2>#{i18n['curriculum.skills']}</h2>
						<h:panelGroup layout="block" id="skills">
							<ui:repeat value="#{curriculumEditBean.skills}" var="skill" id="skill">
								<h:panelGroup layout="block" class="repeatedPanel">

									<div class="ui-g">
										<div class="ui-g-12 ui-md-6">
											<div class="form-group">
												<p:inputText id="name" value="#{skill.name}" label="#{i18n['skill.name']}" required="true" />
											</div>
										</div>

										<div class="ui-g-12 ui-md-6">
											<div class="form-group">
												<p:selectOneMenu id="level" value="#{skill.level}" label="#{curriculumEditBean.skills}">
													<f:selectItems var="skillLevel" itemValue="#{skillLevel.name}" value="#{applicationBean.skillLevels}"
														itemLabel="#{i18n:translate(skillLevel.name)}" />
												</p:selectOneMenu>
											</div>
										</div>
									</div>

									<div class="ui-g">
										<div class="ui-g-12">
											<div class="form-action-primary">
												<p:commandButton styleClass="btn-gray" value="#{i18n['action.remove']}" action="#{curriculumEditBean.removeSkill(skill)}" update="form:skills"
													process="@this" />
											</div>
										</div>
									</div>
								</h:panelGroup>
							</ui:repeat>

							<div class="ui-g">
								<div class="ui-g-12">
									<div class="form-action-primary">
										<p:commandButton value="#{i18n['action.add']}" action="#{curriculumEditBean.addSkill}" process="form:skills" update="form:skills" />
									</div>
								</div>
							</div>
						</h:panelGroup>
						<div class="ui-g">
							<div class="ui-g-12">
								<div class="form-action-primary">
									<p:commandButton value="#{i18n['action.save']}" action="#{curriculumEditBean.save}" process="@form" update="@form growl" />
									<p:commandButton styleClass="btn-gray" value="#{i18n['action.cancel']}" action="#{curriculumEditBean.cancel}" process="@this" />
								</div>
							</div>
						</div>
					</p:panel>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
