<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html" xmlns:i18n="http://legion.com/i18n"
	xmlns:p="http://primefaces.org/ui" template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['maintenance.maintenances']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="maintenances" />

	<ui:define name="content">
		<div class="ui-g">
			<div class="ui-g-12 ui-md-4">
				<p:panel header="#{i18n['maintenance.skill_knowdeleges']}">
					<h:form>
						<div class="ui-g">
							<div class="ui-g-12">
								<p:selectOneMenu id="skillKnowdelege" label="#{i18n['skill.level']}" styleClass="largeInput">
									<f:selectItems var="skillLevel" itemValue="#{skillLevel.name}" value="#{applicationBean.skillLevels}"
										itemLabel="#{i18n:translate(skillLevel.name)}" />
								</p:selectOneMenu>
							</div>
						</div>
						<div class="ui-g">
							<div class="ui-g-12">
								<div class="form-action-primary">
									<p:commandButton styleClass="btn-green" value="#{i18n['action.new']}" />
									<p:commandButton value="#{i18n['action.modify']}" />
								</div>
							</div>
						</div>
					</h:form>
				</p:panel>
			</div>

			<div class="ui-g-12  ui-md-4">
				<p:panel header="#{i18n['maintenance.language_knowdeleges']}">
					<h:form>
						<div class="ui-g">
							<div class="ui-g-12">
								<p:selectOneMenu id="languageKnowdelege" label="#{i18n['language.level']}">
									<f:selectItems var="languageLevel" itemValue="#{languageLevel.name}" value="#{applicationBean.languageLevels}"
										itemLabel="#{i18n:translate(languageLevel.name)}" />
								</p:selectOneMenu>
							</div>
						</div>
						<div class="ui-g">
							<div class="ui-g-12">
								<div class="form-action-primary">
									<p:commandButton styleClass="btn-green" value="#{i18n['action.new']}" />
									<p:commandButton value="#{i18n['action.modify']}" />
								</div>
							</div>
						</div>
					</h:form>
				</p:panel>
			</div>
		</div>
	</ui:define>
</ui:composition>
