<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:i18n="http://ged.com/i18n" xmlns:p="http://primefaces.org/ui" template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['maintenance.maintenances']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="maintenances" />

	<ui:define name="content">
		<div class="grid">
			<div class="col-12 md-4">
				<p:panel header="#{i18n['role.roles']}">
					<h:form>
						<div class="form-group">
							<p:outputLabel value="#{i18n['role.name']}" for="name" />
							<p:inputText id="name" value="#{roleBean.role.name}" required="true" />
							<p:message for="name" />
						</div>
					</h:form>
				</p:panel>
			</div>

			<div class="col-12 -md-4">
				<p:panel header="#{i18n['maintenance.language_knowdeleges']}">
					<h:form>
						<p:selectOneMenu id="languageKnowdelege" label="#{i18n['language.level']}">
							<f:selectItems var="languageLevel" itemValue="#{languageLevel.name}" value="#{applicationBean.languageLevels}"
								itemLabel="#{i18n:translate(languageLevel.name)}" />
						</p:selectOneMenu>
						<div class="form-action-primary">
							<p:commandButton value="#{i18n['action.new']}" />
							<p:commandButton value="#{i18n['action.modify']}" />
						</div>
					</h:form>
				</p:panel>
			</div>
		</div>
	</ui:define>
</ui:composition>
