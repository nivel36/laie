<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:i18n="http://ged.com/i18n"
	xmlns:cc="http://java.sun.com/jsf/composite/components" template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['candidate.new_candidate']}</title>
	</ui:define>

	<ui:define name="content">
		<div class="grid">
			<div class="col-12">
				<p:breadCrumb homeDisplay="text">
					<p:menuitem value="#{i18n['menu.index']}" url="/faces/index.xhtml" />
					<p:menuitem value="#{i18n['candidate.candidates']}" url="/faces/candidate/candidateSearch.xhtml" />
					<p:menuitem value="#{candidateEditBean.newCandidate ? i18n['candidate.new_candidate'] : candidateEditBean.candidate.fullName}" disabled="true" />
				</p:breadCrumb>
			</div>
			
			<div class="col-12">
				<h:form id="candidateForm">
					<p:panel header="#{candidateEditBean.newCandidate ? i18n['candidate.new_candidate'] : candidateEditBean.candidate.fullName}">
						<div class="grid">
							<div class="col-12 md-6">
								<cc:inputImage id="candidate_image" value="#{candidateEditBean.candidate.imageFileName}" fileUploadListener="#{candidateEditBean.uploadImage}"/>
								<div class="user-rating">
									<p:rating value="#{candidateEditBean.candidate.rating}" cancel="false">
										<p:ajax event="rate" listener="#{candidateEditBean.onrate}" update="" />
									</p:rating>
								</div>								
							</div>
							
							<div class="col-12 md-6">
								<div class="form-group">
									<p:outputLabel value="#{i18n['tag.tags']}" for="tags" />
									<p:chips id="tags" value="#{candidateEditBean.tags}" label="#{i18n['candidateEditBean.tags']}" converter="stringConverter" />
									<p:message for="tags" />
								</div>
							</div>

							<div class="col-12 md-6">
								<cc:inputText id="jobProfile" name="job_profile" label="#{i18n['candidate.jobProfile']}" value="#{candidateEditBean.candidate.jobProfile}" required="true"/>						
							</div>
							
							<div class="col-12 md-6">
								<cc:inputText id="name" name="name" label="#{i18n['candidate.name']}" value="#{candidateEditBean.candidate.name}" required="true" />
							</div>

							<div class="col-12 md-6">
								<cc:inputText id="surname" name="surname" label="#{i18n['candidate.surname']}" value="#{candidateEditBean.candidate.surname}" required="true" />
							</div>

							<div class="col-12 md-6">
								<cc:calendar id="born_date" name="born_date" label="#{i18n['candidate.bornDate']}" value="#{candidateEditBean.candidate.bornDate}" yearRange="c-100:c0" /> 
							</div>

							<div class="col-12 md-6">
								<cc:inputText id="phone_number" name="phone_number" label="#{i18n['candidate.phone_number']}" value="#{candidateEditBean.candidate.phoneNumber}" required="true" />
							</div>

							<div class="col-12 md-6">
								<cc:inputText id="email" name="email" label="#{i18n['candidate.email']}" value="#{candidateEditBean.candidate.email}" required="true" />
							</div>

							<div class="col-12 md-6">
								<cc:inputText id="skype" name="skype" label="#{i18n['candidate.skype']}" value="#{candidateEditBean.candidate.skype}" />
							</div>
			
							<div class="col-12 md-6">
								<cc:inputText id="city" name="city" label="#{i18n['candidate.city']}" value="#{candidateEditBean.candidate.address.city}" />
							</div>

							<div class="col-12 md-6">
								<cc:inputText id="state" name="state" label="#{i18n['candidate.state']}" value="#{candidateEditBean.candidate.address.state}" />
							</div>
			
							<div class="col-12 md-6">
								<cc:inputText id="salary" name="salary" label="#{i18n['candidate.salary']}" value="#{candidateEditBean.candidate.salary}" />
							</div>

							<div class="col-12 md-6">
								<cc:inputText id="expected_salary" name="expected_salary" label="#{i18n['candidate.expected_salary']}" value="#{candidateEditBean.candidate.expectedSalary}" />
							</div>
						</div>

						<div class="form-action-primary">
							<p:button styleClass="btn-gray" value="#{i18n['action.cancel']}" outcome="candidateSearch" rendered="#{candidateEditBean.newCandidate}" />
							<p:button styleClass="btn-gray" value="#{i18n['action.cancel']}" outcome="candidate" rendered="#{not candidateEditBean.newCandidate}">
								<f:param name="candidateId" value="#{candidateEditBean.candidate.id}" />
							</p:button>
							<p:commandButton value="#{i18n['action.save']}" action="#{candidateEditBean.save}" process="@form" update="@form growl" />
						</div>
					</p:panel>
				</h:form>
			</div>
		</div>
	</ui:define>
</ui:composition>
