<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['candidate.candidate']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="candidates" />

	<ui:define name="content">
		<h:form id="form">
			<input type="hidden" id="candidateId" value="#{candidateEditBean.candidate.id}" />

			<div class="ui-g">
				<div class="ui-g-12">
					<p:panel styleClass="purple"
						header="#{candidateEditBean.candidate.id eq 0 ? i18n['candidate.new_candidate'] : candidateEditBean.candidate}">

						<div class="ui-g">
							<div class="ui-md-12 ui-lg-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['candidate.name']}" />
									<p:inputText id="name" value="#{candidateEditBean.candidate.name}" label="#{i18n['candidate.name']}"
										required="true" />
								</div>
								<h:message for="name" errorClass="error" />
							</div>
							<div class="ui-md-12 ui-lg-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['candidate.surename']}" />
									<p:inputText id="surename" value="#{candidateEditBean.candidate.surename}"
										label="#{i18n['candidate.surename']}" required="true" />
								</div>
								<h:message for="surename" errorClass="error" />
							</div>
							<div class="ui-md-12 ui-lg-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['candidate.age']}" />
									<p:inputText id="age" value="#{candidateEditBean.candidate.age}" label="#{i18n['candidate.age']}" />
								</div>
								<h:message for="age" errorClass="error" />
							</div>

							<div class="ui-md-12 ui-lg-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['address.city']}" />
									<p:inputText id="city" value="#{candidateEditBean.candidate.address.city}" label="#{i18n['address.city']}" />
								</div>
								<h:message for="city" errorClass="error" />
							</div>
							<div class="ui-md-12 ui-lg-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['address.state']}" />
									<p:inputText id="state" value="#{candidateEditBean.candidate.address.state}" label="#{i18n['address.state']}" />
								</div>
								<h:message for="state" errorClass="error" />
							</div>
						</div>
						<div class="ui-g">
							<div class="ui-md-12 ui-lg-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['candidate.phone_number']}" />
									<p:inputText id="phoneNumber" value="#{candidateEditBean.candidate.phoneNumber}" required="true"
										label="#{i18n['candidate.phone_number']}" />
								</div>
								<h:message for="phoneNumber" errorClass="error" />
							</div>
							<div class="ui-md-12 ui-lg-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['candidate.email']}" />
									<p:inputText id="email" pt:type="email" value="#{candidateEditBean.candidate.email}" required="true"
										label="#{i18n['candidate.email']}" />
								</div>
								<h:message for="email" errorClass="error" />
							</div>
						</div>
						<div class="ui-g">
							<div class="ui-md-12 ui-lg-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['candidate.position']}" />
									<p:inputText id="position" value="#{candidateEditBean.candidate.position}" required="true"
										label="#{i18n['candidate.position']}" />
								</div>
								<h:message for="position" errorClass="error" />
							</div>
							<div class="ui-md-12 ui-lg-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['candidate.salary']}" />
									<p:inputText id="salary" value="#{candidateEditBean.candidate.salary}" label="#{i18n['candidate.salary']}" />
									<h:message for="salary" errorClass="error" />
								</div>
							</div>
							<div class="ui-md-12 ui-lg-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['candidate.expected_salary']}" />
									<p:inputText id="expected_salary" value="#{candidateEditBean.candidate.expectedSalary}"
										label="#{i18n['candidate.expected_salary']}" />
								</div>
								<h:message for="expected_salary" errorClass="error" />
							</div>
						</div>
						<div class="ui-g">
							<div class="ui-g-12">
								<div class="push-right">
									<p:commandButton value="#{i18n['action.save']}" action="#{candidateEditBean.save}" process="@form"
										update="@form growl" />
									<p:commandButton value="#{i18n['action.cancel']}" action="#{candidateEditBean.cancel}" immediate="true"
										styleClass="btn-gray" />
								</div>
							</div>
						</div>
					</p:panel>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
