<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['candidate.candidate']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="candidates" />

	<ui:define name="content">

		<div class="ui-g">
			<div class="ui-g-12">
				<h:form id="form">
					<p:panel header="#{i18n['candidate.new_candidate']}">
						<div class="ui-g">
							<div class="ui-g-12 ui-md-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['candidate.name']}" for="name" />
									<p:inputText id="name" value="#{candidateEditBean.candidate.name}" required="true" />
								</div>
								<h:message for="name" errorClass="error" />
							</div>

							<div class="ui-g-12 ui-md-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['candidate.surename']}" for="surename" />
									<p:inputText id="surename" value="#{candidateEditBean.candidate.surename}" required="true" />
								</div>
								<h:message for="surename" errorClass="error" />
							</div>

							<div class="ui-g-12 ui-md-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['candidate.bornDate']}" for="bornDate" />
									<p:calendar id="bornDate" value="#{candidateEditBean.candidate.bornDate}" yearRange="c-100:c0" navigator="true"/>
								</div>
								<h:message for="bornDate" errorClass="error" />
							</div>
						</div>
						<div class="ui-g">
							<div class="ui-g-12 ui-md-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['candidate.phone_number']}" for="phoneNumber" />
									<p:inputText id="phoneNumber" value="#{candidateEditBean.candidate.phoneNumber}" required="true" />
								</div>
								<h:message for="phoneNumber" errorClass="error" />
							</div>

							<div class="ui-g-12 ui-md-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['candidate.email']}" for="email" />
									<p:inputText id="email" pt:type="email" value="#{candidateEditBean.candidate.email}" required="true" />
								</div>
								<h:message for="email" errorClass="error" />
							</div>

							<div class="ui-g-12 ui-md-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['candidate.skype']}" for="skype" />
									<p:inputText id="skype" pt:type="skype" value="#{candidateEditBean.candidate.skype}" />
								</div>
								<h:message for="skype" errorClass="error" />
							</div>
						</div>

						<div class="ui-g">
							<div class="ui-g-12 ui-md-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['address.city']}" for="city" />
									<p:inputText id="city" value="#{candidateEditBean.candidate.address.city}" />
								</div>
								<h:message for="city" errorClass="error" />
							</div>

							<div class="ui-g-12 ui-md-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['address.state']}" for="state" />
									<p:inputText id="state" value="#{candidateEditBean.candidate.address.state}" />
								</div>
								<h:message for="state" errorClass="error" />
							</div>
						</div>
						<div class="ui-g">
							<div class="ui-g-12 ui-md-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['candidate.jobProfile']}" for="jobProfile" />
									<p:inputText id="jobProfile" value="#{candidateEditBean.candidate.jobProfile}" required="true" />
								</div>
								<h:message for="jobProfile" errorClass="error" />
							</div>

							<div class="ui-g-12 ui-md-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['candidate.salary']}" for="salary" />
									<p:inputText id="salary" value="#{candidateEditBean.candidate.salary}" />
								</div>
								<h:message for="salary" errorClass="error" />
							</div>

							<div class="ui-g-12 ui-md-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['candidate.expected_salary']}" for="expected_salary" />
									<p:inputText id="expected_salary" value="#{candidateEditBean.candidate.expectedSalary}"
										label="#{i18n['candidate.expected_salary']}" />
								</div>
								<h:message for="expected_salary" errorClass="error" />
							</div>
							<div class="ui-g-12">
								<div class="form-group">
									<p:outputLabel value="#{i18n['candidate.tags']}" for="tags" />
									<p:chips id="tags" value="#{candidateEditBean.candidate.tags}" label="#{i18n['candidate.tags']}" />
								</div>
							</div>
						</div>
						<div class="ui-g">
							<div class="ui-g-12">
								<div class="form-action-primary">
									<p:commandButton value="#{i18n['action.save']}" action="#{candidateEditBean.save}" update="@form growl" />
									<p:commandButton styleClass="btn-gray" value="#{i18n['action.cancel']}" action="#{candidateEditBean.cancel}"
										update="@form" process="@this" />
								</div>
							</div>
						</div>
					</p:panel>
				</h:form>
			</div>
		</div>
	</ui:define>
</ui:composition>
