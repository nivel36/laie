<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html" xmlns:i18n="http://legion.com/i18n"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['candidate.candidate']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="candidates" />

	<ui:define name="content">
		<f:metadata>
			<f:viewParam name="id" value="#{candidateViewBean.id}" />
			<f:viewAction action="#{candidateViewBean.init}" />
		</f:metadata>

		<div class="ui-g">
			<div class="ui-g-12 ui-lg-3 ui-xl-2">
				<div class="panel user-card">
					<div class="panel-content">
						<div class="panel-candidate-detail">
							<div class="user-image">
								<p:graphicImage class="image" value="/images/#{candidateViewBean.candidate.imageFileName}"
									rendered="#{not empty candidateViewBean.candidate.imageFileName}" />
								<p:graphicImage class="image" value="/resources/img/default-avatar.png"
									rendered="#{empty candidateViewBean.candidate.imageFileName}" />
							</div>
							<div class="user-info">
								<div class="name">#{candidateViewBean.candidate.fullName}</div>
								<div class="position">#{candidateViewBean.candidate.jobProfile}</div>
							</div>
							<div class="user-rating">
								<h:form id="ratingForm">
									<p:rating value="#{candidateViewBean.candidate.rating}" cancel="false">
										<p:ajax event="rate" listener="#{candidateViewBean.onrate}" update="growl" />
									</p:rating>
								</h:form>
							</div>
						</div>
					</div>
				</div>
			</div>

			<div class="ui-g-12 ui-lg-9 ui-xl-6">
				<h:form id="form">
					<input type="hidden" id="candidateId" value="#{candidateViewBean.candidate.id}" />
					<p:panel header="#{candidateViewBean.candidate}">
						<div class="ui-g">
							<div class="ui-g-12 ui-md-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['candidate.name']}" for="name" />
									<p:inputText id="name" value="#{candidateViewBean.candidate.name}" required="true"
										readonly="#{!candidateViewBean.editable}" />
								</div>
								<h:message for="name" errorClass="error" />
							</div>

							<div class="ui-g-12 ui-md-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['candidate.surename']}" for="surename" />
									<p:inputText id="surename" value="#{candidateViewBean.candidate.surename}" required="true"
										readonly="#{!candidateViewBean.editable}" />
								</div>
								<h:message for="surename" errorClass="error" />
							</div>

							<div class="ui-g-12 ui-md-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['candidate.bornDate']}" for="bornDate" />
									<p:calendar id="bornDate" value="#{candidateViewBean.candidate.bornDate}"
										disabled="#{!candidateViewBean.editable}" yearRange="c-100:c0" navigator="true"/>
								</div>
								<h:message for="bornDate" errorClass="error" />
							</div>
						</div>
						<div class="ui-g">
							<div class="ui-g-12 ui-md-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['candidate.phone_number']}" for="phoneNumber" />
									<p:inputText id="phoneNumber" value="#{candidateViewBean.candidate.phoneNumber}" required="true"
										readonly="#{!candidateViewBean.editable}" />
								</div>
								<h:message for="phoneNumber" errorClass="error" />
							</div>

							<div class="ui-g-12 ui-md-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['candidate.email']}" for="email" />
									<p:inputText id="email" pt:type="email" value="#{candidateViewBean.candidate.email}" required="true"
										readonly="#{!candidateViewBean.editable}" />
								</div>
								<h:message for="email" errorClass="error" />
							</div>

							<div class="ui-g-12 ui-md-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['candidate.skype']}" for="skype" />
									<p:inputText id="skype" pt:type="skype" value="#{candidateViewBean.candidate.skype}"
										readonly="#{!candidateViewBean.editable}" />
								</div>
								<h:message for="skype" errorClass="error" />
							</div>
						</div>

						<div class="ui-g">
							<div class="ui-g-12 ui-md-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['address.city']}" for="city" />
									<p:inputText id="city" value="#{candidateViewBean.candidate.address.city}"
										readonly="#{!candidateViewBean.editable}" />
								</div>
								<h:message for="city" errorClass="error" />
							</div>

							<div class="ui-g-12 ui-md-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['address.state']}" for="state" />
									<p:inputText id="state" value="#{candidateViewBean.candidate.address.state}"
										readonly="#{!candidateViewBean.editable}" />
								</div>
								<h:message for="state" errorClass="error" />
							</div>
						</div>
						<div class="ui-g">
							<div class="ui-g-12 ui-md-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['candidate.jobProfile']}" for="jobProfile" />
									<p:inputText id="jobProfile" value="#{candidateViewBean.candidate.jobProfile}" required="true"
										readonly="#{!candidateViewBean.editable}" />
								</div>
								<h:message for="jobProfile" errorClass="error" />
							</div>

							<div class="ui-g-12 ui-md-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['candidate.salary']}" for="salary" />
									<p:inputText id="salary" value="#{candidateViewBean.candidate.salary}"
										readonly="#{!candidateViewBean.editable}" />
								</div>
								<h:message for="salary" errorClass="error" />
							</div>

							<div class="ui-g-12 ui-md-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['candidate.expected_salary']}" for="expected_salary" />
									<p:inputText id="expected_salary" value="#{candidateViewBean.candidate.expectedSalary}"
										label="#{i18n['candidate.expected_salary']}" readonly="#{!candidateViewBean.editable}" />
								</div>
								<h:message for="expected_salary" errorClass="error" />
							</div>
							<div class="ui-g-12">
								<div class="form-group">
									<p:outputLabel value="#{i18n['candidate.tags']}" for="tags" />
									<p:chips id="tags" value="#{candidateViewBean.tags}" label="#{i18n['candidate.tags']}"
										disabled="#{!candidateViewBean.editable}"
										rendered="#{not empty candidateViewBean.tags or candidateViewBean.editable}" />
									<h:outputText styleClass="text" value="#{i18n['candidate.message.no_tags']}"
										rendered="#{empty candidateViewBean.tags and not candidateViewBean.editable}" />
								</div>
							</div>
						</div>
						<div class="ui-g">
							<div class="ui-g-12">
								<div class="form-action-primary">
									<p:commandButton value="#{i18n['action.edit']}" action="#{candidateViewBean.editCandidate}"
										rendered="#{!candidateViewBean.candidate.deleted and !candidateViewBean.editable}" update="@form growl" />
									<p:commandButton value="#{i18n['action.save']}" action="#{candidateViewBean.saveCandidate}"
										rendered="#{candidateViewBean.editable}" update="@form growl" />
									<p:commandButton styleClass="btn-gray" value="#{i18n['action.cancel']}"
										action="#{candidateViewBean.cancelEditCandidate}" rendered="#{candidateViewBean.editable}" update="@form"
										process="@this" />
								</div>
							</div>
						</div>
					</p:panel>
				</h:form>
			</div>

			<div class="ui-g-12 ui-lg-6 ui-xl-4">

				<h:form id="file_form" enctype="multipart/form-data">
					<p:panel header="#{i18n['file.files']}">
						<div class="ui-g">
							<div class="ui-g-12">
								<p:dataTable var="file" id="files" value="#{candidateViewBean.files}" emptyMessage="#{i18n['file.no_files']}"
									reflow="true" rows="#{sessionBean.rowsPerPage}" rowKey="#{file.id}" >

									<p:column headerText="#{i18n['file.name']}">
										<h:commandLink action="#{candidateViewBean.openFile(file)}">
											<h:outputText value="#{file.name}" />
										</h:commandLink>
									</p:column>

									<p:column headerText="#{i18n['file.lopd']}">
										<p:selectBooleanCheckbox value="#{file.lopd}">
											<p:ajax event="change" listener="#{candidateViewBean.updateFile(file)}" update="growl file_form" />
										</p:selectBooleanCheckbox>
									</p:column>

									<p:column>
										<p:commandButton icon="fa fa-trash" styleClass="btn-gray" action="#{candidateViewBean.removeFile(file)}"
											update="growl file_form" />
									</p:column>
								</p:dataTable>
							</div>
						</div>

						<div class="ui-g">
							<div class="ui-g-12">
								<div class="form-action-primary">
									<p:fileUpload id="uploadFile" styleClass="btn-green" fileUploadListener="#{candidateViewBean.uploadFile}"
										mode="advanced" dragDropSupport="false" update="file_form growl" sizeLimit="100000" auto="true"
										label="#{i18n['action.add']}" disabled="#{candidateViewBean.candidate.files.size() gt 6}" />
								</div>
							</div>
						</div>
					</p:panel>
				</h:form>
			</div>

			<div class="ui-g-12 ui-lg-6 ui-xl-6">
				<p:panel header="#{i18n['job_candidature.job_candidatures']}">
				</p:panel>
			</div>

			<div class="ui-g-12 ui-lg-6 ui-xl-6">
				<p:panel header="#{i18n['curriculum.curricula']}">
				</p:panel>
			</div>

		</div>
	</ui:define>
</ui:composition>
