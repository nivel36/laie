<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:i18n="http://legion.com/i18n"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['candidate.candidate']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="candidates" />

	<ui:define name="content">
		<f:metadata>
			<f:viewParam name="id" value="#{candidateViewBean.id}" />
			<f:viewAction action="#{candidateViewBean.init}" />
		</f:metadata>

		<h:form id="form">

			<input type="hidden" id="candidateId"
				value="#{candidateViewBean.candidate.id}" />

			<p:panel styleClass="purple" header="#{candidateViewBean.candidate}">
				<div class="ui-g">
					<div class="ui-md-12 ui-lg-6 ui-xl-4">
						<div class="form-group">
							<p:outputLabel value="#{i18n['candidate.name']}" />
							<p:inputText id="name"
								value="#{candidateViewBean.candidate.name}" required="true"
								readonly="#{!candidateViewBean.editable}" />
						</div>
						<h:message for="name" errorClass="error" />
					</div>

					<div class="ui-md-12 ui-lg-6 ui-xl-4">
						<div class="form-group">
							<p:outputLabel value="#{i18n['candidate.surename']}" />
							<p:inputText id="surename"
								value="#{candidateViewBean.candidate.surename}" required="true"
								readonly="#{!candidateViewBean.editable}" />
						</div>
						<h:message for="surename" errorClass="error" />
					</div>

					<div class="ui-md-12 ui-lg-6 ui-xl-4">
						<div class="form-group">
							<p:outputLabel value="#{i18n['candidate.age']}" />
							<p:inputText id="age" value="#{candidateViewBean.candidate.age}"
								readonly="#{!candidateViewBean.editable}" />
						</div>
						<h:message for="age" errorClass="error" />
					</div>
				</div>

				<div class="ui-g">
					<div class="ui-md-12 ui-lg-6 ui-xl-4">
						<div class="form-group">
							<p:outputLabel value="#{i18n['candidate.phone_number']}" />
							<p:inputText id="phoneNumber"
								value="#{candidateViewBean.candidate.phoneNumber}"
								required="true" readonly="#{!candidateViewBean.editable}" />
						</div>
						<h:message for="phoneNumber" errorClass="error" />
					</div>

					<div class="ui-md-12 ui-lg-6 ui-xl-4">
						<div class="form-group">
							<p:outputLabel value="#{i18n['candidate.email']}" />
							<h:inputText id="email" pt:type="email"
								value="#{candidateViewBean.candidate.email}" required="true"
								readonly="#{!candidateViewBean.editable}" />
						</div>
						<h:message for="email" errorClass="error" />
					</div>
				</div>

				<div class="ui-g">
					<div class="ui-md-12 ui-lg-6 ui-xl-4">
						<div class="form-group">
							<p:outputLabel value="#{i18n['address.city']}" for="city" />
							<p:inputText id="city"
								value="#{candidateViewBean.candidate.address.city}"
								readonly="#{!candidateViewBean.editable}" />
						</div>
						<h:message for="city" errorClass="error" />
					</div>

					<div class="ui-md-12 ui-lg-6 ui-xl-4">
						<div class="form-group">
							<p:outputLabel value="#{i18n['address.state']}" for="state" />
							<p:inputText id="state"
								value="#{candidateViewBean.candidate.address.state}"
								readonly="#{!candidateViewBean.editable}" />
						</div>
						<h:message for="state" errorClass="error" />
					</div>

					<div class="ui-g">
						<div class="ui-md-12 ui-lg-6 ui-xl-4">
							<div class="form-group">
								<p:outputLabel value="#{i18n['candidate.position']}" />
								<p:inputText id="position"
									value="#{candidateViewBean.candidate.position}" required="true"
									readonly="#{!candidateViewBean.editable}" />
							</div>
							<h:message for="position" errorClass="error" />
						</div>

						<div class="ui-md-12 ui-lg-6 ui-xl-4">
							<div class="form-group">
								<p:outputLabel value="#{i18n['candidate.salary']}" />
								<p:inputText id="salary"
									value="#{candidateViewBean.candidate.salary}"
									readonly="#{!candidateViewBean.editable}" />
							</div>
							<h:message for="salary" errorClass="error" />
						</div>

						<div class="ui-md-12 ui-lg-6 ui-xl-4">
							<div class="form-group">
								<p:outputLabel value="#{i18n['candidate.expected_salary']}" />
								<p:inputText id="expected_salary"
									value="#{candidateViewBean.candidate.expectedSalary}"
									label="#{i18n['candidate.expected_salary']}"
									styleClass="#{ not component.valid ? 'inputError' : ''}"
									readonly="#{!candidateViewBean.editable}" />
							</div>
							<h:message for="expected_salary" errorClass="error" />
						</div>
					</div>
					<div class="ui-g">
						<div class="ui-g-12">
							<h:panelGroup id="undeleteButton" layout="block"
								rendered="#{candidateViewBean.candidate.deleted}">
								<p:commandButton value="#{i18n['action.undelete']}"
									action="#{candidateViewBean.undelete}" />
							</h:panelGroup>

							<h:panelGroup layout="block"
								rendered="#{candidateViewBean.editable}">
								<p:commandButton value="#{i18n['action.cancel']}"
									action="#{candidateViewBean.cancelEditCandidate}"
									update="@form" />
								<p:commandButton value="#{i18n['action.save']}"
									action="#{candidateViewBean.saveCandidate}" update="@form" />
							</h:panelGroup>

							<h:panelGroup id="actionButtons" layout="block"
								rendered="#{!candidateViewBean.candidate.deleted and !candidateViewBean.editable}">
								<p:commandButton value="#{i18n['action.edit']}"
									action="#{candidateViewBean.editCandidate}" update="@form" />
								<p:commandButton value="#{i18n['bookmark.add_to_bookmarks']}"
									action="#{bookmarksBean.add(candidateViewBean.candidate)}"
									rendered="#{not bookmarksBean.isBookmarked(candidateViewBean.candidate)}"
									update="actionButtons :asideForm:bookmarks" />
								<p:commandButton
									value="#{i18n['bookmark.remove_from_bookmarks']}"
									action="#{bookmarksBean.remove(candidateViewBean.candidate)}"
									rendered="#{bookmarksBean.isBookmarked(candidateViewBean.candidate)}"
									update="actionButtons :asideForm:bookmarks" />
							</h:panelGroup>
						</div>
					</div>
				</div>
			</p:panel>
		</h:form>

		<h:form id="file_form" prependId="false" enctype="multipart/form-data">
			<h:panelGroup layout="block" styleClass="row">

				<h:panelGroup layout="block" styleClass="half purple-panel">
					<h:panelGroup layout="block" styleClass="panel-header">
						<h4>#{i18n['curriculum.curricula']}</h4>
					</h:panelGroup>
					<h:panelGroup layout="block" styleClass="panel-content">
						<h:panelGroup layout="block" styleClass="buttonGroup">
							<p:commandButton value="#{i18n['action.add']}"
								action="#{candidateViewBean.addFile}" immediate="true">
								<f:ajax render="@form" />
							</p:commandButton>
						</h:panelGroup>
					</h:panelGroup>
				</h:panelGroup>

				<h:panelGroup layout="block" styleClass="half purple-panel">
					<h:panelGroup layout="block" styleClass="modalPanel"
						rendered="#{candidateViewBean.addingFile or candidateViewBean.editingFile}">
					</h:panelGroup>
					<h:panelGroup layout="block" styleClass="panel-header">
						<h4>#{i18n['file.files']}</h4>
					</h:panelGroup>
					<h:panelGroup layout="block" styleClass="panel-content">
						<h:panelGroup layout="block"
							rendered="#{not candidateViewBean.addingFile and not candidateViewBean.editingFile}">
							<h:outputText value="#{i18n['file.no_files']}"
								rendered="#{empty candidateViewBean.candidate.files}" />

							<h:dataTable var="file" id="files"
								value="#{candidateViewBean.candidate.files}"
								rendered="#{not empty candidateViewBean.candidate.files}"
								styleClass="dataTable">

								<h:column>
									<f:facet name="header">
										<h:outputText value="#{i18n['file.name']}" />
									</f:facet>
									<h:outputText value="#{file.id}" />
								</h:column>

								<h:column>
									<f:facet name="header">
										<h:outputText value="#{i18n['file.name']}" />
									</f:facet>
									<h:outputText value="#{file.name}" />
								</h:column>

								<h:column>
									<f:facet name="header">
										<h:outputText value="#{i18n['file.type']}" />
									</f:facet>
									<h:outputText value="#{file.fileType}" />
								</h:column>

								<h:column>
									<f:facet name="header">
										<h:outputText value="#{i18n['file.date']}" />
									</f:facet>
									<h:outputText value="#{file.date}" />
								</h:column>

								<h:column>
									<f:facet name="header">
										<h:outputText value="#{i18n['action.action']}" />
									</f:facet>
									<h:commandLink action="#{candidateViewBean.openFile(file)}"
										value="#{i18n['action.open']}" />
								|
							<h:commandLink action="#{candidateViewBean.editFile(file)}"
										value="#{i18n['action.edit']}">
										<f:ajax execute="file_form" render="@form" />
									</h:commandLink>
									|
							<h:commandLink action="#{candidateViewBean.removeFile(file)}"
										value="#{i18n['action.remove']}">
										<f:ajax execute="file_form" render="@form" />
									</h:commandLink>
								</h:column>
							</h:dataTable>

							<h:panelGroup layout="block" styleClass="buttonGroup">
								<p:commandButton value="#{i18n['action.add']}"
									action="#{candidateViewBean.addFile}" immediate="true">
									<f:ajax render="@form" />
								</p:commandButton>
							</h:panelGroup>
						</h:panelGroup>

						<h:panelGroup layout="block"
							rendered="#{candidateViewBean.addingFile  and not candidateViewBean.editingFile}">
							<h:outputLabel value="#{i18n['file.name']}" styleClass="required"></h:outputLabel>
							<h:inputFile id="uploadFile" value="#{candidateViewBean.part}"
								label="#{i18n['candidate.name']}" required="true"
								styleClass="#{not component.valid ? 'inputError' : ''}" />
							<h:message for="uploadFile" errorClass="error" />

							<h:panelGroup layout="block" styleClass="buttonGroup">
								<p:commandButton value="#{i18n['action.upload']}"
									action="#{candidateViewBean.upload}">
									<f:ajax execute="@form" render="@form" />
								</p:commandButton>
								<p:commandButton value="#{i18n['action.cancel']}"
									action="#{candidateViewBean.cancelAddFile}" immediate="true">
									<f:ajax execute="" render="@form" />
								</p:commandButton>
							</h:panelGroup>
						</h:panelGroup>

						<h:panelGroup layout="block"
							rendered="#{candidateViewBean.editingFile}">
							<h:outputLabel value="#{i18n['file.name']}"
								styleClass="large required">
								<h:inputText id="fileName"
									value="#{candidateViewBean.file.name}"
									label="#{i18n['file.name']}" required="true"
									styleClass="#{not component.valid ? 'inputError' : ''}" />
								<h:message for="fileName" errorClass="error" />
							</h:outputLabel>

							<h:outputLabel value="#{i18n['file.type']}" styleClass="required">
								<h:selectOneMenu id="fileType"
									value="#{candidateViewBean.file.fileType}">
									<f:selectItems var="fileType" itemValue="#{fileType.name}"
										value="#{applicationBean.fileTypes}"
										itemLabel="#{i18n:translate(fileType.name)}"
										styleClass="#{not component.valid ? 'inputError' : ''}" />
								</h:selectOneMenu>
								<h:message for="fileType" errorClass="error" />
							</h:outputLabel>

							<h:outputLabel value="#{i18n['file.description']}"
								styleClass="large">
								<h:inputText id="description"
									value="#{candidateViewBean.file.description}"
									label="#{i18n['file.description']}"
									styleClass="#{not component.valid ? 'inputError' : ''}" />
								<h:message for="description" errorClass="error" />
							</h:outputLabel>

							<h:panelGroup layout="block" styleClass="buttonGroup">
								<p:commandButton value="#{i18n['action.save']}"
									action="#{candidateViewBean.saveFile}" />
								<p:commandButton value="#{i18n['action.cancel']}"
									action="#{candidateViewBean.cancelAddFile}" immediate="true" />
							</h:panelGroup>
						</h:panelGroup>
					</h:panelGroup>
				</h:panelGroup>
			</h:panelGroup>
		</h:form>
	</ui:define>
</ui:composition>
