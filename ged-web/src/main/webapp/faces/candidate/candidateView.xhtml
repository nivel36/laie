<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://xmlns.jcp.org/jsf/passthrough" xmlns:i18n="http://legion.com/i18n"
	template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['candidate.candidate']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="candidates" />

	<ui:define name="content">
		<f:metadata>
			<f:viewParam name="id" value="#{candidateViewBean.id}" />
			<f:viewAction action="#{candidateViewBean.init}" />
		</f:metadata>

		<h:form id="form">

			<input type="hidden" id="candidateId" value="#{candidateViewBean.candidate.id}" />

			<h1 class="header">
				<i class="fa fa-users" /> #{candidateViewBean.candidate}
			</h1>

			<h:panelGroup id="actionButtons" layout="block" styleClass="actionPanel">
				<h:commandButton value="#{i18n['action.edit']}" action="#{candidateViewBean.editCandidate}" />
				<h:commandButton value="#{i18n['bookmark.add_to_bookmarks']}"
					action="#{bookmarksBean.add(candidateViewBean.candidate)}"
					rendered="#{not bookmarksBean.isBookmarked(candidateViewBean.candidate)}">
					<f:ajax render="actionButtons :asideForm:bookmarks" />
				</h:commandButton>
				<h:commandButton value="#{i18n['bookmark.remove_from_bookmarks']}"
					action="#{bookmarksBean.remove(candidateViewBean.candidate)}"
					rendered="#{bookmarksBean.isBookmarked(candidateViewBean.candidate)}">
					<f:ajax render="actionButtons :asideForm:bookmarks" />
				</h:commandButton>
				<h:button value="#{i18n['curriculum.view_curriculum']}" outcome="curriculumView">
					<f:param name="id" value="#{candidateViewBean.candidate.id}" />
				</h:button>
			</h:panelGroup>

			<h:panelGroup layout="block" styleClass="panel">
				<h1>#{i18n['candidate.detail']}</h1>

				<h:panelGroup layout="block" styleClass="textBlock">
					<h:outputText styleClass="label" value="#{i18n['candidate.name']}:" />
					<h:outputText value="#{candidateViewBean.candidate.name} #{candidateViewBean.candidate.surename}" />
				</h:panelGroup>

				<h:panelGroup layout="block" styleClass="textBlock">
					<h:outputText styleClass="label" value="#{i18n['candidate.age']}:" />
					<h:outputText value="#{candidateViewBean.candidate.age}" />
				</h:panelGroup>


				<h:panelGroup layout="block" styleClass="textBlock">
					<h:outputText styleClass="label" value="#{i18n['candidate.phone_number']} :" />
					<h:outputText value="#{candidateViewBean.candidate.phoneNumber}" />
				</h:panelGroup>

				<h:panelGroup layout="block" styleClass="textBlock">
					<h:outputText styleClass="label" value="#{i18n['candidate.email']} :" />
					<h:outputText value="#{candidateViewBean.candidate.email}" />
				</h:panelGroup>

				<h:panelGroup layout="block" styleClass="textBlock">
					<h:outputText styleClass="label" value="#{i18n['address.city']} :" />
					<h:outputText value="#{candidateViewBean.candidate.address.city}" />
				</h:panelGroup>

				<h:panelGroup layout="block" styleClass="textBlock">
					<h:outputText styleClass="label" value="#{i18n['address.state']} :" />
					<h:outputText value="#{candidateViewBean.candidate.address.state}" />
				</h:panelGroup>
			</h:panelGroup>


			<h:panelGroup layout="block" styleClass="panel">
				<h1>#{i18n['candidate.social_network']}</h1>
				<h:panelGroup layout="block" styleClass="textBlock">
					<h:outputText styleClass="label" value="#{i18n['social.linkedin']} :" />
					<h:outputText value="#{candidateViewBean.candidate.linkedinProfileUrl}" />
				</h:panelGroup>
				<h:panelGroup layout="block" styleClass="textBlock">
					<h:outputText styleClass="label" value="#{i18n['social.infojobs']} :" />
					<h:outputText value="#{candidateViewBean.candidate.infojobsProfileUrl}" />
				</h:panelGroup>
			</h:panelGroup>

			<h:panelGroup layout="block" styleClass="panel">
				<h1>#{i18n['candidate.work_data']}</h1>

				<h:panelGroup layout="block" styleClass="textBlock">
					<h:outputText styleClass="label" value="#{i18n['candidate.position']} :" />
					<h:outputText value="#{candidateViewBean.candidate.position}" />
				</h:panelGroup>

				<h:panelGroup layout="block" styleClass="textBlock">
					<h:outputText styleClass="label" value="#{i18n['candidate.salary']} :" />
					<h:outputText value="#{candidateViewBean.candidate.salary}" />
				</h:panelGroup>

				<h:panelGroup layout="block" styleClass="textBlock">
					<h:outputText styleClass="label" value="#{i18n['candidate.expected_salary']} :" />
					<h:outputText value="#{candidateViewBean.candidate.expectedSalary}" />
				</h:panelGroup>
			</h:panelGroup>

		</h:form>

		<h:form id="file_form" prependId="false" enctype="multipart/form-data">
			<h:panelGroup layout="block" styleClass="modalPanel"
				rendered="#{candidateViewBean.addingFile or candidateViewBean.editingFile}">
			</h:panelGroup>
			<h:panelGroup layout="block" styleClass="panel" style="#{candidateViewBean.style}">
				<h1>#{i18n['file.files']}</h1>

				<h:panelGroup layout="block" rendered="#{not candidateViewBean.addingFile and not candidateViewBean.editingFile}">
					<h:outputText value="#{i18n['file.no_files']}" rendered="#{empty candidateViewBean.candidate.files}" />

					<h:dataTable var="file" id="files" value="#{candidateViewBean.candidate.files}"
						rendered="#{not empty candidateViewBean.candidate.files}" styleClass="dataTable">

						<h:column>
							<f:facet name="header">
								<h:outputText value="#{i18n['file.name']}" />
							</f:facet>
							<h:outputText value="#{file.id}" />
						</h:column>

						<h:column>
							<f:facet name="header">
								<h:outputText value="#{i18n['file.name']}" />
							</f:facet>
							<h:outputText value="#{file.name}" />
						</h:column>

						<h:column>
							<f:facet name="header">
								<h:outputText value="#{i18n['file.type']}" />
							</f:facet>
							<h:outputText value="#{file.fileType}" />
						</h:column>

						<h:column>
							<f:facet name="header">
								<h:outputText value="#{i18n['file.date']}" />
							</f:facet>
							<h:outputText value="#{file.date}" />
						</h:column>

						<h:column>
							<f:facet name="header">
								<h:outputText value="#{i18n['action.action']}" />
							</f:facet>
							<h:commandLink action="#{candidateViewBean.openFile(file)}" value="#{i18n['action.open']}" />
								|
							<h:commandLink action="#{candidateViewBean.editFile(file)}" value="#{i18n['action.edit']}">
								<f:ajax execute="file_form" render="@form" />
							</h:commandLink>
									|
							<h:commandLink action="#{candidateViewBean.removeFile(file)}" value="#{i18n['action.remove']}">
								<f:ajax execute="file_form" render="@form" />
							</h:commandLink>
						</h:column>
					</h:dataTable>

					<h:panelGroup layout="block" styleClass="buttonGroup">
						<h:commandButton value="#{i18n['action.add']}" action="#{candidateViewBean.addFile}" immediate="true">
							<f:ajax render="@form" />
						</h:commandButton>
					</h:panelGroup>
				</h:panelGroup>

				<h:panelGroup layout="block" rendered="#{candidateViewBean.addingFile  and not candidateViewBean.editingFile}">
					<h:outputLabel value="#{i18n['file.name']}" styleClass="required"></h:outputLabel>
					<h:inputFile id="uploadFile" value="#{candidateViewBean.part}" label="#{i18n['candidate.name']}" required="true"
						styleClass="#{not component.valid ? 'inputError' : ''}" />
					<h:message for="uploadFile" errorClass="error" />

					<h:panelGroup layout="block" styleClass="buttonGroup">
						<h:commandButton value="#{i18n['action.upload']}" action="#{candidateViewBean.upload}">
							<f:ajax execute="@form" render="@form" />
						</h:commandButton>
						<h:commandButton value="#{i18n['action.cancel']}" action="#{candidateViewBean.cancelAddFile}" immediate="true">
							<f:ajax execute="" render="@form" />
						</h:commandButton>
					</h:panelGroup>
				</h:panelGroup>

				<h:panelGroup layout="block" rendered="#{candidateViewBean.editingFile}">
					<h:outputLabel value="#{i18n['file.name']}" styleClass="large required">
						<h:inputText id="fileName" value="#{candidateViewBean.file.name}" label="#{i18n['file.name']}" required="true"
							styleClass="#{not component.valid ? 'inputError' : ''}" />
						<h:message for="fileName" errorClass="error" />
					</h:outputLabel>

					<h:outputLabel value="#{i18n['file.type']}" styleClass="required">
						<h:selectOneMenu id="fileType" value="#{candidateViewBean.file.fileType}">
							<f:selectItems var="fileType" itemValue="#{fileType.name}" value="#{applicationBean.fileTypes}"
								itemLabel="#{i18n:translate(fileType.name)}" styleClass="#{not component.valid ? 'inputError' : ''}" />
						</h:selectOneMenu>
						<h:message for="fileType" errorClass="error" />
					</h:outputLabel>

					<h:outputLabel value="#{i18n['file.description']}" styleClass="large">
						<h:inputText id="description" value="#{candidateViewBean.file.description}" label="#{i18n['file.description']}"
							styleClass="#{not component.valid ? 'inputError' : ''}" />
						<h:message for="description" errorClass="error" />
					</h:outputLabel>

					<h:panelGroup layout="block" styleClass="buttonGroup">
						<h:commandButton value="#{i18n['action.save']}" action="#{candidateViewBean.saveFile}" />
						<h:commandButton value="#{i18n['action.cancel']}" action="#{candidateViewBean.cancelAddFile}" immediate="true">
						</h:commandButton>
					</h:panelGroup>
				</h:panelGroup>
			</h:panelGroup>
		</h:form>
	</ui:define>
</ui:composition>
