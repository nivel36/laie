<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" template="/WEB-INF/templates/default.xhtml" xmlns:p="http://primefaces.org/ui">

	<ui:define name="title">
		<title>#{i18n['curriculum.curriculum']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="candidates" />

	<ui:define name="content">

		<div class="ui-g">
			<div class="ui-g-12 ui-lg-12 ui-xl-7">
				<h:form id="form">
					<p:panel header="#{i18n['curriculum.curriculum']}">

						<!-- JOB EXPERIENCE -->
						<h2>#{i18n['curriculum.job_experiences']}</h2>
						<ui:repeat value="#{curriculumBean.jobExperiences}" var="jobExperience" id="jobExperience">
							<h3>#{jobExperience.jobPosition}</h3>
							<h4>#{jobExperience.companyName}</h4>
							<h4>
								<h:outputText value="#{jobExperience.fromDate}" />
								-
								<h:outputText value="#{jobExperience.toDate}" />
							</h4>
							<h:outputText value="#{jobExperience.description}" />
						</ui:repeat>
					</p:panel>
				</h:form>
			</div>
		</div>
	</ui:define>
</ui:composition>
