<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html" xmlns:i18n="http://legion.com/i18n"
	xmlns:p="http://primefaces.org/ui">

	<p:dialog modal="true" widgetVar="candidateSelectDlg" resizable="false" responsive="true"
		header="#{i18n['candidate.candidates']}">
		<h:form id="candidateSelectForm">

			<div class="searchForm">
				<div class="ui-g">
					<div class="ui-md-8">
						<div class="ui-inputgroup">
							<p:inputText id="searchText" value="#{candidateSelectBean.searchText}" />
							<p:commandButton icon="fa fa-search" styleClass="green-button" action="#{candidateSelectBean.searchPlus}"
								update="@form" process="@form" />
						</div>
					</div>
				</div>
			</div>
			<div class="searchResults">
				<p:dataTable var="candidate" id="candidates" value="#{candidateSelectBean.candidates}"
					emptyMessage="#{i18n['candidate.no_candidates_found']}" reflow="true" paginator="true" paginatorPosition="bottom"
					selection="#{candidateSelectBean.selectedCandidates}" rows="#{sessionBean.rowsPerPage}" rowKey="#{candidate.id}"
					sortBy="#{candidate.fullName}" sortOrder="ascending">

					<p:column selectionMode="multiple" style="width:16px;text-align:center" />

					<p:column headerText="#{i18n['candidate.name']}" sortBy="#{candidate.name}">
						<p:graphicImage class="image image-icon" value="/images/#{candidate.imageFileName}"
							rendered="#{not empty candidate.imageFileName}" />
						<p:graphicImage class="image image-icon" value="/resources/img/default-avatar.png"
							rendered="#{empty candidate.imageFileName}" />
						<h:outputText value="#{candidate}" />
					</p:column>

					<p:column headerText="#{i18n['candidate.jobProfile']}" sortBy="#{candidate.jobProfile}">
						<h:outputText value="#{candidate.jobProfile}" />
					</p:column>

					<p:column headerText="#{i18n['candidate.email']}">
						<h:outputText value="#{candidate.email}" />
					</p:column>

					<p:column headerText="#{i18n['candidate.phone_number']}">
						<h:outputText value="#{candidate.phoneNumber}" />
					</p:column>

					<p:column headerText="#{i18n['candidate.rating']}" sortBy="#{candidate.rating}">
						<p:rating value="#{candidate.rating}" cancel="false" readonly="true" />
					</p:column>

					<p:column headerText="#{i18n['candidate.state']}">
					</p:column>
				</p:dataTable>
				<div class="ui-g">
					<div class="ui-g-12">
						<div class="pull-right">
							<p:commandButton value="#{i18n['action.select']}" actionListener="#{candidateSelectBean.select}" />
						</div>
					</div>
				</div>
			</div>
		</h:form>
	</p:dialog>
</ui:composition>
