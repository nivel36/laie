<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:p="http://primefaces.org/ui"
	xmlns:i18n="http://legion.com/i18n">
	<p:link outcome="/faces/candidate/candidateView">
		<f:param name="id" value="#{candidate.id}" />
		<div class="user-minicard">
			<div class="user-image">
				<p:graphicImage class="image" value="/images/#{candidate.imageFileName}"
					rendered="#{not empty candidate.imageFileName}" />
				<p:graphicImage class="image" value="/resources/img/default-avatar.png" rendered="#{empty candidate.imageFileName}" />
			</div>
			<div class="user-info">
				<div class="name">#{candidate}</div>
				<div class="position">#{candidate.jobProfile}</div>
			</div>
		</div>
	</p:link>
</ui:composition>
