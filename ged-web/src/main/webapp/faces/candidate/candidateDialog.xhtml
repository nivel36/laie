<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:i18n="http://legion.com/i18n"
	xmlns:cc="http://java.sun.com/jsf/composite/components" xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" template="/WEB-INF/templates/dialog.xhtml">

	<ui:define name="title">
		<title>#{i18n['candidate.new_candidate']}</title>
	</ui:define>

	<ui:define name="content">

		<h:form id="candidateForm">
			<div class="ui-g">
				<div class="ui-g-12 ui-md-6">
					<div class="user-card">
						<p:outputPanel layout="block" id="userImage" styleClass="user-image">
							<p:fileUpload id="uploadImage" styleClass="uploadImageButton" fileUploadListener="#{candidateDialogBean.uploadImage}" mode="advanced"
								dragDropSupport="false" update="userImage" auto="true" label="#{i18n['action.add']}" />
							<h:outputLabel for="uploadImage_input">
								<p:graphicImage styleClass="selectable image" value="/images/#{candidateDialogBean.candidate.imageFileName}"
									rendered="#{not empty candidateDialogBean.candidate.imageFileName}" />
								<p:graphicImage styleClass="selectable image" value="/resources/img/default-avatar.png" rendered="#{empty candidateDialogBean.candidate.imageFileName}" />
							</h:outputLabel>
						</p:outputPanel>
						<div class="user-rating">
							<p:rating value="#{candidateDialogBean.candidate.rating}" cancel="false">
								<p:ajax event="rate" listener="#{candidateDialogBean.onrate}" update="" />
							</p:rating>
						</div>
					</div>
				</div>
				<div class="ui-g-12 ui-md-6">
					<div class="form-group">
						<p:outputLabel value="#{i18n['tag.tags']}" for="tags" />
						<p:chips id="tags" value="#{candidateDialogBean.tags}" label="#{i18n['candidate.tags']}" />
					</div>
				</div>

				<div class="ui-g-12 ui-md-6">
					<div class="form-group">
						<p:outputLabel value="#{i18n['candidate.name']}" for="name" />
						<p:inputText id="name" value="#{candidateDialogBean.candidate.name}" required="true" />
						<p:message for="name" />
					</div>
				</div>

				<div class="ui-g-12 ui-md-6">
					<div class="form-group">
						<p:outputLabel value="#{i18n['candidate.surname']}" for="surname" />
						<p:inputText id="surname" value="#{candidateDialogBean.candidate.surname}" required="true" />
						<p:message for="surname" />
					</div>
				</div>

				<div class="ui-g-12 ui-md-6">
					<div class="form-group">
						<p:outputLabel value="#{i18n['candidate.bornDate']}" for="bornDate" />
						<p:calendar id="bornDate" value="#{candidateDialogBean.candidate.bornDate}" yearRange="c-100:c0" navigator="true" />
						<p:message for="bornDate" />
					</div>
				</div>
			</div>
			<div class="ui-g">
				<div class="ui-g-12 ui-md-6">
					<div class="form-group">
						<p:outputLabel value="#{i18n['candidate.phone_number']}" for="phoneNumber" />
						<p:inputText id="phoneNumber" value="#{candidateDialogBean.candidate.phoneNumber}" required="true" />
						<p:message for="phoneNumber" />
					</div>
				</div>

				<div class="ui-g-12 ui-md-6">
					<div class="form-group">
						<p:outputLabel value="#{i18n['candidate.email']}" for="email" />
						<p:inputText id="email" pt:type="email" value="#{candidateDialogBean.candidate.email}" required="true" />
						<p:message for="email" />
					</div>
				</div>

				<div class="ui-g-12 ui-md-6">
					<div class="form-group">
						<p:outputLabel value="#{i18n['candidate.skype']}" for="skype" />
						<p:inputText id="skype" pt:type="skype" value="#{candidateDialogBean.candidate.skype}" />
						<p:message for="skype" />
					</div>
				</div>
			</div>

			<div class="ui-g">
				<div class="ui-g-12 ui-md-6">
					<div class="form-group">
						<p:outputLabel value="#{i18n['address.city']}" for="city" />
						<p:inputText id="city" value="#{candidateDialogBean.candidate.address.city}" />
						<p:message for="city" />
					</div>
				</div>

				<div class="ui-g-12 ui-md-6">
					<div class="form-group">
						<p:outputLabel value="#{i18n['address.state']}" for="state" />
						<p:inputText id="state" value="#{candidateDialogBean.candidate.address.state}" />
						<p:message for="state" />
					</div>
				</div>
			</div>
			<div class="ui-g">
				<div class="ui-g-12 ui-md-6">
					<div class="form-group">
						<p:outputLabel value="#{i18n['candidate.jobProfile']}" for="jobProfile" />
						<p:inputText id="jobProfile" value="#{candidateDialogBean.candidate.jobProfile}" required="true" />
						<p:message for="jobProfile" />
					</div>
				</div>

				<div class="ui-g-12 ui-md-6">
					<div class="form-group">
						<p:outputLabel value="#{i18n['candidate.salary']}" for="salary" />
						<p:inputText id="salary" value="#{candidateDialogBean.candidate.salary}" />
						<p:message for="salary" />
					</div>
				</div>

				<div class="ui-g-12 ui-md-6">
					<div class="form-group">
						<p:outputLabel value="#{i18n['candidate.expected_salary']}" for="expected_salary" />
						<p:inputText id="expected_salary" value="#{candidateDialogBean.candidate.expectedSalary}" label="#{i18n['candidate.expected_salary']}" />
						<p:message for="expected_salary" />
					</div>
				</div>
			</div>

			<div class="form-action-primary">
				<p:commandButton value="#{i18n['action.cancel']}" action="#{candidateDialogBean.closeDialog}" process="@this" styleClass="btn-gray" />
				<p:commandButton value="#{i18n['action.save']}" action="#{candidateDialogBean.save}" update="@form" />
			</div>
		</h:form>
	</ui:define>
</ui:composition>
