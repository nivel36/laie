<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a="http://java.sun.com/jsf/composite/legion" template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['candidate.candidates']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="candidates" />

	<ui:define name="content">
		<h:form id="newForm">
			<h1 class="header">
				<i class="fa fa-users" /> #{i18n['candidate.candidates']}
			</h1>

			<h:panelGroup layout="block" styleClass="actionPanel">
				<h:commandButton value="#{i18n['action.new']}" action="#{candidateSearchBean.newCandidate}" immediate="true" />
			</h:panelGroup>
		</h:form>
		<h:form id="form">
			<h:panelGroup layout="block" styleClass="panel">
				<h1>#{i18n['candidate.search']}</h1>
				<h:panelGroup layout="block" styleClass="panel" id="searchUserPanel">
					<h:outputLabel for="name" value="#{i18n['candidate.name']}">
						<h:inputText id="name" value="#{candidateSearchBean.name}" label="#{i18n['candidate.name']}" />
					</h:outputLabel>

					<h:outputLabel for="surename" value="#{i18n['candidate.surename']}">
						<h:inputText id="surename" value="#{candidateSearchBean.surename}" label="#{i18n['candidate.surename']}" />
					</h:outputLabel>

					<h:outputLabel for="position" value="#{i18n['candidate.position']}">
						<h:inputText id="position" value="#{candidateSearchBean.position}" label="#{i18n['candidate.position']}" />
					</h:outputLabel>

					<h:panelGroup layout="block" styleClass="buttonGroup">
						<h:commandButton value="#{i18n['action.search']}" action="#{candidateSearchBean.search}">
							<f:ajax execute="searchUserPanel" render="@form" />
						</h:commandButton>
						<h:commandButton value="#{i18n['action.clean']}" action="#{candidateSearchBean.clean}">
							<f:ajax render="@form" />
						</h:commandButton>
					</h:panelGroup>
				</h:panelGroup>
			</h:panelGroup>

			<h:panelGroup layout="block" styleClass="panel" id="resultados">
				<h1>#{i18n['candidate.search_results']}</h1>

				<h:outputText value="#{i18n['candidate.no_candidates_found']}"
					rendered="#{empty candidateSearchBean.paginator.entities}" />

				<h:dataTable var="candidate" id="candidate" value="#{candidateSearchBean.paginator.dataList}"
					rendered="#{not empty candidateSearchBean.paginator.entities}" styleClass="dataTable">
					<h:column>
						<f:facet name="header">
							<h:outputText value="#{i18n['candidate.name']}" />
						</f:facet>
						<h:outputText value="#{candidate}" />
					</h:column>

					<h:column>
						<f:facet name="header">
							<h:outputText value="#{i18n['candidate.position']}" />
						</f:facet>
						<h:outputText value="#{candidate.position}" />
					</h:column>

					<h:column>
						<f:facet name="header">
							<h:outputText value="#{i18n['candidate.email']}" />
						</f:facet>
						<h:outputText value="#{candidate.email}" />
					</h:column>

					<h:column>
						<f:facet name="header">
							<h:outputText value="#{i18n['candidate.phone_number']}" />
						</f:facet>
						<h:outputText value="#{candidate.phoneNumber}" />
					</h:column>

					<h:column>
						<f:facet name="header">
							<h:outputText value="#{i18n['user.owner']}" />
						</f:facet>
						<h:outputText value="#{candidate.owner.name}" />
					</h:column>

					<h:column>
						<f:facet name="header">
							<h:outputText value="Action" />
						</f:facet>
						<h:link value="#{i18n['action.view']}" outcome="candidateView">
							<f:param name="id" value="#{candidate.id}" />
						</h:link>
						|
						<h:commandLink action="#{candidateSearchBean.edit(candidate)}" value="#{i18n['action.edit']}" />
						|
						<h:commandLink action="#{candidateSearchBean.remove(candidate)}" value="#{i18n['action.remove']}">
							<f:ajax execute="@form" render="@form" />
						</h:commandLink>
					</h:column>
				</h:dataTable>

				<a:paginator id="paginator" paginator="#{candidateSearchBean.paginator}" />
			</h:panelGroup>
		</h:form>
	</ui:define>
</ui:composition>
