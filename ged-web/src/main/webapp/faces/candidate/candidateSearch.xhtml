<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['candidate.candidates']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="candidates" />

	<ui:define name="content">
		<div class="stats">
			<div class="ui-g">
				<div class="ui-g-12 ui-md-6 ui-lg-3">
					<div class="card card-stats" tabindex="1">
						<div class="card-header"></div>
						<div class="card-body">
							<p class="card-category">#{i18n['candidate.candidates']}</p>
							<span class="number">#{candidateListPanelBean.numberOfCandidates}</span>
						</div>
						<div class="card-footer"></div>
					</div>
				</div>
				<div class="ui-g-12 ui-md-6 ui-lg-3">
					<div class="card card-stats" tabindex="2">
						<div class="card-header"></div>
						<div class="card-body">
							<p class="card-category">Clientes</p>
							<span class="number">2</span>
						</div>
						<div class="card-footer"></div>
					</div>
				</div>
				<div class="ui-g-12 ui-md-6 ui-lg-3">
					<div class="card card-stats" tabindex="3">
						<div class="card-header"></div>
						<div class="card-body">
							<p class="card-category">Ofertas de empleo</p>
							<span class="number">4</span>
						</div>
						<div class="card-footer"></div>
					</div>
				</div>
				<div class="ui-g-12 ui-md-6 ui-lg-3">
					<div class="card card-stats" tabindex="4">
						<div class="card-header"></div>
						<div class="card-body">
							<p class="card-category">Ofertas cerradas</p>
							<span class="number">10</span>
						</div>
						<div class="card-footer"></div>
					</div>
				</div>
			</div>
		</div>

		<div class="ui-g">
			<div class="ui-g-12 ui-xl-8">
				<h:form id="searchForm">
					<p:panel id="searchUserPanel" header="#{i18n['candidate.search']}">
						<div class="searchForm">
							<div class="ui-g">
								<div class="ui-md-12 ui-lg-4">
									<div class="ui-inputgroup">
										<p:inputText id="searchText" value="#{candidateSearchBean.searchText}" />
										<p:commandButton icon="fa fa-plus" styleClass="green-button" action="#{candidateSearchBean.searchPlus}"
											update="@form" process="searchUserPanel"/>
									</div>
								</div>
								<div class="ui-md-12 ui-lg-4">
									<p:commandButton value="#{i18n['action.search']}" styleClass="btn-primary" action="#{candidateSearchBean.search}"
										update="@form" process="searchUserPanel" />
									<p:commandButton value="#{i18n['action.clean']}" action="#{candidateSearchBean.clean}" update="@form"
										styleClass="btn-gray" />
								</div>
							</div>
						</div>
						<div class="searchResults">
							<p:dataTable var="candidate" id="candidates" value="#{candidateSearchBean.candidates}"
								emptyMessage="#{i18n['candidate.no_candidates_found']}" reflow="true" paginator="true"
								paginatorPosition="bottom" rows="#{sessionBean.rowsPerPage}" selectionMode="single"
								selection="#{candidateSearchBean.selectedCandidate}" rowKey="#{candidate.id}" sortBy="#{candidate.fullName}"
								sortOrder="ascending">

								<p:ajax event="rowSelect" listener="#{candidateSearchBean.onCandidateSelect}" update="@form" />

								<p:column headerText="#{i18n['candidate.name']}" sortBy="#{candidate.name}">
									<p:graphicImage class="image image-icon" value="/images/#{candidate.imageFileName}"
										rendered="#{not empty candidate.imageFileName}" />
									<p:graphicImage class="image image-icon" value="/resources/img/default-avatar.png"
										rendered="#{empty candidate.imageFileName}" />
									<h:outputText value="#{candidate}" />
								</p:column>

								<p:column headerText="#{i18n['candidate.jobProfile']}" sortBy="#{candidate.jobProfile}">
									<h:outputText value="#{candidate.jobProfile}" />
								</p:column>

								<p:column headerText="#{i18n['candidate.email']}">
									<h:outputText value="#{candidate.email}" />
								</p:column>

								<p:column headerText="#{i18n['candidate.phone_number']}">
									<h:outputText value="#{candidate.phoneNumber}" />
								</p:column>

								<p:column headerText="#{i18n['candidate.rating']}" sortBy="#{candidate.rating}">
									<p:rating value="#{candidate.rating}" cancel="false" readonly="true" />
								</p:column>

								<p:column headerText="#{i18n['candidate.state']}">
								</p:column>
							</p:dataTable>
						</div>
					</p:panel>
				</h:form>
			</div>
			<ui:include src="/faces/candidate/candidateListPanel.xhtml" />

		</div>
	</ui:define>
</ui:composition>
