<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['candidate.candidates']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="candidates" />

	<ui:define name="content">
	<div class="stats">
			<div class="ui-g">
				<div class="ui-g-12 ui-md-6 ui-lg-3">
					<div class="card card-stats">
						<div class="card-header"></div>
						<div class="card-body">
							<p class="card-category">Candidatos</p>
							<span class="number">12</span>
						</div>
						<div class="card-footer"></div>
					</div>
				</div>
				<div class="ui-g-12 ui-md-6 ui-lg-3">
					<div class="card card-stats">
						<div class="card-header"></div>
						<div class="card-body">
							<p class="card-category">Clientes</p>
							<span class="number">2</span>
						</div>
						<div class="card-footer"></div>
					</div>
				</div>
				<div class="ui-g-12 ui-md-6 ui-lg-3">
					<div class="card card-stats">
						<div class="card-header"></div>
						<div class="card-body">
							<p class="card-category">Ofertas de empleo</p>
							<span class="number">4</span>
						</div>
						<div class="card-footer"></div>
					</div>
				</div>
				<div class="ui-g-12 ui-md-6 ui-lg-3">
					<div class="card card-stats">
						<div class="card-header"></div>
						<div class="card-body">
							<p class="card-category">Ofertas cerradas</p>
							<span class="number">10</span>
						</div>
						<div class="card-footer"></div>
					</div>
				</div>
			</div>
		</div>
		<h:form id="form">
			<div class="ui-g">
				<div class="ui-g-12 ui-xl-9">
					<p:panel id="searchUserPanel" header="#{i18n['candidate.search']}">
						<div class="ui-g">
							<div class="ui-md-12 ui-lg-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel class="control-label" for="name" value="#{i18n['candidate.name']}" />
									<p:inputText class="form-control" id="name" value="#{candidateSearchBean.name}" />
								</div>
							</div>

							<div class="ui-md-12 ui-lg-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel class="control-label" for="surename" value="#{i18n['candidate.surename']}" />
									<p:inputText class="form-control" id="surename" value="#{candidateSearchBean.surename}" />
								</div>
							</div>
							<div class="ui-md-12 ui-lg-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel class="control-label" for="position" value="#{i18n['candidate.position']}" />
									<p:inputText class="form-control" id="position" value="#{candidateSearchBean.position}" />
								</div>
							</div>

							<div class="ui-lg-12">
								<div class="form-action-primary">
									<p:commandButton value="#{i18n['action.new']}" action="#{candidateSearchBean.newCandidate}" immediate="true"
										styleClass="btn-green" />
									<p:commandButton value="#{i18n['action.search']}" action="#{candidateSearchBean.search}" update="@form"
										process="searchUserPanel" />
									<p:commandButton value="#{i18n['action.clean']}" action="#{candidateSearchBean.clean}" update="@form"
										styleClass="btn-gray" />
								</div>
							</div>
						</div>

						<p:dataTable var="candidate" id="candidate"
							value="#{candidateSearchBean.candidates}"
							emptyMessage="#{i18n['candidate.no_candidates_found']}"
							reflow="true" paginator="true" paginatorPosition="bottom"
							rows="#{sessionBean.rowsPerPage}">

							<p:column headerText="#{i18n['candidate.name']}"
								sortBy="#{candidate.name}">
								<h:outputText value="#{candidate}" />
							</p:column>

							<p:column headerText="#{i18n['candidate.position']}"
								sortBy="#{candidate.position}">
								<h:outputText value="#{candidate.position}" />
							</p:column>

							<p:column headerText="#{i18n['candidate.email']}"
								sortBy="#{candidate.email}">
								<h:outputText value="#{candidate.email}" />
							</p:column>

							<p:column headerText="#{i18n['candidate.phone_number']}"
								sortBy="#{candidate.phoneNumber}">
								<h:outputText value="#{candidate.phoneNumber}" />
							</p:column>

							<p:column headerText="#{i18n['user.owner']}"
								sortBy="#{candidate.owner.name}">
								<h:outputText value="#{candidate.owner.name}" />
							</p:column>

							<p:column>
								<p:button outcome="candidateView" icon="fa fa-eye">
									<f:param name="id" value="#{candidate.id}" />
								</p:button>
							</p:column>
						</p:dataTable>
					</p:panel>
				</div>
				<div class="ui-g-12 ui-md-6 ui-xl-3">
					<p:panel id="lastActions" header="#{i18n['index.last_candidates']}">
					</p:panel>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
