<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['candidate.candidate']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="candidates" />

	<ui:define name="content">
		<h:form id="form">
			<h1 class="header">
				<i class="fa fa-users" /> #{i18n['candidate.candidates']}
			</h1>
			<h:panelGroup layout="block" styleClass="actionPanel">
					<h:commandButton value="#{i18n['action.new']}"
						action="#{candidateSearchBean.newCandidate}" immediate="true" />
				</h:panelGroup>
			<h:panelGroup layout="block" styleClass="panel">
				<h1>#{i18n['candidate.search']}</h1>
				<h:outputLabel for="name" value="#{i18n['candidate.name']}">
					<h:inputText id="name" value="#{candidateSearchBean.name}"
						label="#{i18n['candidate.name']}" />
				</h:outputLabel>

				<h:outputLabel for="surename" value="#{i18n['candidate.surename']}">
					<h:inputText id="surename" value="#{candidateSearchBean.surename}"
						label="#{i18n['candidate.surename']}" />
				</h:outputLabel>

				<h:outputLabel for="phoneNumber1"
					value="#{i18n['candidate.phone_number']}">
					<h:inputText id="phoneNumber1"
						value="#{candidateSearchBean.phoneNumber}"
						label="#{i18n['candidate.phone_number']}" />
				</h:outputLabel>

				<h:outputLabel for="email" value="#{i18n['candidate.email']}"
					styleClass="large">
					<h:inputText id="email" value="#{candidateSearchBean.email}"
						label="#{i18n['candidate.email']}" />
				</h:outputLabel>

				<h:panelGroup layout="block" styleClass="buttonGroup">
					<h:commandButton value="#{i18n['action.clean']}"
						action="#{candidateSearchBean.clean}" />
					<h:commandButton value="#{i18n['action.search']}"
						action="#{candidateSearchBean.search}" />
				</h:panelGroup>
			</h:panelGroup>

			<h:panelGroup layout="block" styleClass="panel" id="resultados">
				<h1>#{i18n['candidate.search_results']}</h1>

				<h:outputText value="#{i18n['candidate.no_candidates_found']}"
					rendered="#{empty candidateSearchBean.paginator.entities}" />

				<h:dataTable var="candidate" id="candidate"
					value="#{candidateSearchBean.paginator.dataList}"
					rendered="#{not empty candidateSearchBean.paginator.entities}"
					styleClass="dataTable">
					<h:column>
						<f:facet name="header">
							<h:selectBooleanCheckbox />
						</f:facet>
						<h:selectBooleanCheckbox />
					</h:column>

					<h:column>
						<f:facet name="header">
							<h:outputText value="#{i18n['candidate.name']}" />
						</f:facet>
						<h:outputText value="#{candidate}" />
					</h:column>

					<h:column>
						<f:facet name="header">
							<h:outputText value="#{i18n['candidate.email']}" />
						</f:facet>
						<h:outputText value="#{candidate.email}" />
					</h:column>

					<h:column>
						<f:facet name="header">
							<h:outputText value="#{i18n['candidate.phone_number']} 1" />
						</f:facet>
						<h:outputText value="#{candidate.phoneNumber1}" />
					</h:column>

					<h:column>
						<f:facet name="header">
							<h:outputText value="#{i18n['candidate.phone_number']} 2" />
						</f:facet>
						<h:outputText value="#{candidate.phoneNumber2}" />
					</h:column>
					<h:column>
						<f:facet name="header">
							<h:outputText value="Action" />
						</f:facet>
						<h:link value="#{i18n['action.view']}" outcome="candidateView">
							<f:param name="id" value="#{candidate.id}" />
						</h:link>
						|
						<h:commandLink action="#{candidateSearchBean.edit(candidate)}"
							value="#{i18n['action.edit']}" />
						|
						<h:commandLink action="#{candidateSearchBean.remove(candidate)}"
							value="#{i18n['action.remove']}">
							<f:ajax execute="@form" render="@form" />
						</h:commandLink>
					</h:column>
				</h:dataTable>
				<h:panelGroup layout="block" styleClass="paginator" id="paginator"
					rendered="#{not empty candidateSearchBean.paginator.dataList}">
					<h:commandButton disabled="#{candidateSearchBean.paginator.currentPage eq 0}"
						value="#{i18n['paginator.first']}"
						action="#{candidateSearchBean.paginator.firstPage}">
						<f:ajax render=":form:resultados" />
					</h:commandButton>
					<h:commandButton disabled="#{candidateSearchBean.paginator.currentPage eq 0}"
						value="#{i18n['paginator.previous']}"
						action="#{candidateSearchBean.paginator.previousPage}">
						<f:ajax render=":form:resultados" />
					</h:commandButton>
					<ui:repeat value="#{candidateSearchBean.paginator.pages}" var="page">
						<h:commandButton value="#{page+1}"
							action="#{candidateSearchBean.paginator.gotoPage(page)}"
							disabled="#{candidateSearchBean.paginator.currentPage eq page}">
							<f:ajax render=":form:resultados" />
						</h:commandButton>
					</ui:repeat>
					<h:commandButton value="#{i18n['paginator.next']}"
						disabled="#{candidateSearchBean.paginator.currentPage eq candidateSearchBean.paginator.pagesSize-1}"
						action="#{candidateSearchBean.paginator.nextPage}">
						<f:ajax render=":form:resultados" />
					</h:commandButton>
					<h:commandButton value="#{i18n['paginator.last']}"
						disabled="#{candidateSearchBean.paginator.currentPage eq candidateSearchBean.paginator.pagesSize-1}"
						action="#{candidateSearchBean.paginator.lastPage}">
						<f:ajax render=":form:resultados" />
					</h:commandButton>
					<h:outputLabel value="#{i18n['paginator.show']}">
						<h:selectOneMenu value="#{candidateSearchBean.paginator.rowsPerPage}">
							<f:selectItem itemValue="5" itemLabel="5" />
							<f:selectItem itemValue="10" itemLabel="10" />
							<f:selectItem itemValue="25" itemLabel="25" />
							<f:ajax listener="#{candidateSearchBean.paginator.rowsPerPageChange}"
								render=":form:resultados" execute=":form:paginator" />
						</h:selectOneMenu>
					</h:outputLabel>
				</h:panelGroup>
			</h:panelGroup>
		</h:form>
	</ui:define>
</ui:composition>
