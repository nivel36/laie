<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html">

	<p:dialog id="candidateSearchDialog"
		header="#{i18n['candidate.search']}" modal="true" resizable="false">
		<h:form id="form">
			<div class="ui-g">
				<div class="ui-lg-12">
					<p:panel styleClass="purple" header="#{i18n['candidate.search']}">
						<div class="ui-g">
							<div class="ui-md-12 ui-lg-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel for="name" value="#{i18n['candidate.name']}" />
									<p:inputText id="name" value="#{candidateSearchBean.name}" />
								</div>
							</div>
							<div class="ui-md-12 ui-lg-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel for="surename"
										value="#{i18n['candidate.surename']}" />
									<p:inputText id="surename"
										value="#{candidateSearchBean.surename}" />
								</div>
							</div>
							<div class="ui-md-12 ui-lg-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel for="position"
										value="#{i18n['candidate.position']}" />
									<p:inputText id="position"
										value="#{candidateSearchBean.position}" />
								</div>
							</div>

							<div class="ui-lg-12">
								<div class="push-right">
									<p:commandButton value="#{i18n['action.search']}"
										action="#{candidateSearchBean.search}" update="@form"
										process="searchUserPanel" />
									<p:commandButton value="#{i18n['action.clean']}"
										action="#{candidateSearchBean.clean}" update="@form"
										styleClass="btn-gray" />
								</div>
							</div>
						</div>
					</p:panel>
				</div>
			</div>

			<div class="ui-g">
				<div class="ui-lg-12">
					<p:panel styleClass="purple"
						header="#{i18n['candidate.search_results']}" id="searchUserPanel">
						<p:dataTable var="candidate" id="candidate"
							value="#{candidateSearchBean.candidates}"
							emptyMessage="#{i18n['candidate.no_candidates_found']}"
							reflow="true" paginator="true" paginatorPosition="bottom"
							rows="#{sessionBean.rowsPerPage}">

							<p:column headerText="#{i18n['candidate.name']}"
								sortBy="#{candidate.name}">
								<h:outputText value="#{candidate}" />
							</p:column>

							<p:column headerText="#{i18n['candidate.position']}"
								sortBy="#{candidate.position}">
								<h:outputText value="#{candidate.position}" />
							</p:column>

							<p:column headerText="#{i18n['candidate.email']}"
								sortBy="#{candidate.email}">
								<h:outputText value="#{candidate.email}" />
							</p:column>

							<p:column headerText="#{i18n['candidate.phone_number']}"
								sortBy="#{candidate.phoneNumber}">
								<h:outputText value="#{candidate.phoneNumber}" />
							</p:column>

							<p:column headerText="#{i18n['user.owner']}"
								sortBy="#{candidate.owner.name}">
								<h:outputText value="#{candidate.owner.name}" />
							</p:column>

							<p:column>
								<p:button outcome="candidateView" icon="fa fa-eye">
									<f:param name="id" value="#{candidate.id}" />
								</p:button>
							</p:column>
						</p:dataTable>
					</p:panel>
				</div>
			</div>
		</h:form>
	</p:dialog>
</ui:composition>
