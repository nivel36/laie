<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['config.config']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="config" />

	<ui:define name="content">
		<ui:include src="/faces/config/changePasswordPopup.xhtml" />
		<div class="ui-g">
			<div class="ui-md-12 ui-lg-12 ui-xl-6">
				<h:form>
					<p:panel header="#{i18n['config.user_data']}">
						<div class="ui-g">
							<div class="ui-md-12 ui-lg-6">
								<div class="form-group">
									<p:outputLabel value="#{i18n['config.username']}" />
									<p:inputText id="username" value="#{configIndexBean.user.username}" label="#{i18n['config.username']}"
										required="true" styleClass="#{not component.valid ? 'inputError' : ''}" />
									<h:message for="username" errorClass="error" />
								</div>
							</div>
							<div class="ui-md-12 ui-lg-6">
								<div class="form-group">
									<p:outputLabel value="#{i18n['config.name']}" />
									<p:inputText id="name" value="#{configIndexBean.user.name}" label="#{i18n['config.name']}" required="true"
										styleClass="#{not component.valid ? 'inputError' : ''}" />
									<h:message for="name" errorClass="error" />
								</div>
							</div>
							<div class="ui-md-12 ui-lg-6">
								<div class="form-group">
									<p:outputLabel value="#{i18n['config.surename']}" />
									<p:inputText id="surename" value="#{configIndexBean.user.surename}" label="#{i18n['config.surename']}"
										required="true" styleClass="#{not component.valid ? 'inputError' : ''}" />
									<h:message for="surename" errorClass="error" />
								</div>
							</div>
							<div class="ui-md-12 ui-lg-6">
								<div class="form-group">
									<p:outputLabel value="#{i18n['config.email']}" />
									<p:inputText id="email" value="#{configIndexBean.user.email}" label="#{i18n['config.email']}" required="true"
										styleClass="#{not component.valid ? 'inputError' : ''}" />
									<h:message for="email" errorClass="error" />
								</div>
							</div>
						</div>
						<div class="ui-g">
							<div class="ui-g-12">
								<div class="push-right">
									<p:commandButton value="#{i18n['config.change_password']}" onclick="PF('changePasswordDlg').show();" />
									<p:commandButton value="#{i18n['action.save']}" action="#{configIndexBean.save}"  update="growl"/>
								</div>
							</div>
						</div>
					</p:panel>
				</h:form>
			</div>
			<div class="ui-md-12 ui-lg-12 ui-xl-6">
				<h:form>
					<p:panel header="#{i18n['config.preferences']}">
						<div class="ui-g">
							<div class="ui-md-12 ui-lg-6">
								<div class="form-group">
									<p:outputLabel value="#{i18n['config.rows_per_page']}" />
									<p:selectOneMenu value="#{configIndexBean.user.rowsPerPage}">
										<f:selectItem itemValue="5" itemLabel="5" />
										<f:selectItem itemValue="10" itemLabel="10" />
										<f:selectItem itemValue="25" itemLabel="25" />
									</p:selectOneMenu>
								</div>
							</div>

							<div class="ui-md-12 ui-lg-6">
								<div class="form-group">
									<p:outputLabel value="#{i18n['config.language']}" />
									<p:selectOneMenu id="language" value="#{configIndexBean.user.language}" style="text-transform: capitalize">
										<f:selectItems var="locale" value="#{applicationBean.locales}" itemValue="#{locale.language}"
											itemLabel="#{locale.displayLanguage}" />
									</p:selectOneMenu>
								</div>
							</div>
						</div>
						<div class="ui-g">
							<div class="ui-g-12">
								<div class="push-right">
									<p:commandButton styleClass="push-right" value="#{i18n['action.save']}" action="#{configIndexBean.save}" update="growl" />
								</div>
							</div>
						</div>
					</p:panel>
				</h:form>
			</div>
		</div>
	</ui:define>
</ui:composition>
