<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui"
	xmlns:composite="http://xmlns.jcp.org/jsf/composite" xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:o="http://omnifaces.org/ui" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['config.config']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="config" />

	<ui:define name="content">

		<h:form>
			<div class="panel">
				<div class="panel-header">
					<div class="panel-header-title">#{i18n['config.user_data']}</div>
				</div>
				<div class="panel-aside">
					<div class="candidate-metadata">
						<cc:inputImage id="userImage" value="#{configBean.user.imageFileName}"
							fileUploadListener="#{configBean.uploadImage}" allowCamera="true" captureListener="#{configBean.captureImage}" />
					</div>
				</div>
				<div class="panel-content panel-content-data">
					<div class="grid">
						<div class="col-12 sm-6">

							<h3>#{i18n['user.personal_information']}</h3>
							<cc:inputText label="#{i18n['config.name']}" id="name" value="#{configBean.user.name}" required="true" />

							<cc:inputText label="#{i18n['config.surname']}" id="surname" value="#{configBean.user.surname}" required="true" />

							<cc:inputText label="#{i18n['config.email']}" id="email" value="#{configBean.user.email}" required="true" />
						</div>
						<div class="col-12 md-6">

							<h3>#{i18n['user.personal_information']}</h3>

							<cc:inputSelect label="#{i18n['config.rows_per_page']}" value="#{configBean.user.rowsPerPage}"
								converter="javax.faces.Integer">
								<f:selectItem itemValue="5" itemLabel="5" />
								<f:selectItem itemValue="10" itemLabel="10" />
								<f:selectItem itemValue="25" itemLabel="25" />
							</cc:inputSelect>

							<cc:inputSelect label="#{i18n['config.language']}" value="#{configBean.user.language}"
								converter="stringConverter">
								<f:selectItems var="locale" value="#{applicationBean.locales}" itemValue="#{locale.language}"
									itemLabel="#{locale.displayLanguage}" />
								<f:ajax event="change" render="@all" listener="#{configBean.changeLocaleListener}" />
							</cc:inputSelect>
						</div>
					</div>
				</div>
				<div class="panel-footer">
					<div class="panel-buttons">
						<p:commandButton value="#{i18n['config.change_password']}" actionListener="#{configBean.openChangePasswordDialog}"
							process="@this" />
						<p:commandButton value="#{i18n['action.save']}" action="#{configBean.save}" process="@form" update="@form growl" />
					</div>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
