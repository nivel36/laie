<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui" xmlns:i18n="http://ged.com/i18n"
	xmlns:cc="http://java.sun.com/jsf/composite/components"
	template="/WEB-INF/templates/dialog.xhtml">

	<ui:define name="title">
		<title>#{i18n['config.change_picture']}</title>
	</ui:define>

	<ui:define name="content">
		<h:panelGroup id="changeImage">
			<h:panelGroup rendered="#{changePictureBean.showingImage}">
				<h:form id="imageForm">
					<div class="changePicture">
						<p:graphicImage styleClass="image"
							value="/resources/img/default-avatar.png"
							rendered="#{empty changePictureBean.user.imageFileName}" />
						<p:graphicImage styleClass="image"
							value="/images/#{changePictureBean.user.imageFileName}"
							rendered="#{not empty changePictureBean.user.imageFileName}" />
					</div>
					<div class="form-action-primary">
						<p:commandButton value="#{i18n['changeImage.camera']}"
							action="#{changePictureBean.showCamera}" process="@this"
							update="changeImage" />
						<p:commandButton value="#{i18n['action.close']}"
							action="#{changePictureBean.close}" process="@this"
							update="changeImage" />
					</div>
				</h:form>
			</h:panelGroup>
			<h:panelGroup rendered="#{changePictureBean.showingCamera}">
				<h:form id="cameraForm">
					<div class="changePicture">
						<p:photoCam widgetVar="pc"
							listener="#{changePictureBean.onCapture}" update="@form" />
					</div>
					<div class="form-action-primary">
						<p:commandButton value="#{i18n['action.capture']}"
							onclick="PF('pc').capture()" process="@form" update="changeImage" />
						<p:commandButton value="#{i18n['action.cancel']}"
							action="#{changePictureBean.cancel}" process="@this"
							update="changeImage" />
					</div>
				</h:form>
			</h:panelGroup>
		</h:panelGroup>
	</ui:define>
</ui:composition>
