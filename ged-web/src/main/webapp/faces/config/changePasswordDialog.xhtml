<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:i18n="http://legion.com/i18n" xmlns:p="http://primefaces.org/ui">

	<h:form id="changePasswordDialogForm">
		<p:dialog modal="true" widgetVar="changePasswordDlg" resizable="false" responsive="true" header="#{i18n['config.change_password']}" closable="false"
			visible="#{changePasswordDialogBean.showDialog}">
			<div class="ui-g">
				<div class="ui-g-12">
					<div class="form-group">
						<p:outputLabel value="#{i18n['config.password']}" />
						<p:password id="password" value="#{changePasswordDialogBean.password}" label="#{i18n['config.password']}" required="true"
							binding="#{changePasswordDialogBean.passwordComponent}" />
						<h:message for="password" errorClass="error" />
					</div>
				</div>
				<div class="ui-g-12">
					<div class="form-group">
						<p:outputLabel value="#{i18n['config.new_password']}" />
						<p:password id="newPassword" value="#{changePasswordDialogBean.newPassword}" label="#{i18n['config.new_password']}" required="true"
							binding="#{changePasswordDialogBean.newPasswordComponent}" />
						<h:message for="newPassword" errorClass="error" />
					</div>
				</div>
				<div class="ui-g-12">
					<div class="form-group">
						<p:outputLabel value="#{i18n['config.repeat_password']}" />
						<p:password id="repeatPassword" value="#{changePasswordDialogBean.repeatPassword}" label="#{i18n['config.repeat_password']}" required="true" />
						<h:message for="repeatPassword" errorClass="error" />
					</div>
				</div>
			</div>
			<div class="ui-g">
				<div class="ui-g-12">
					<div class="pull-right">
						<p:commandButton value="#{i18n['action.change']}" action="#{changePasswordDialogBean.change}" update="@form growl" />
						<p:commandButton styleClass="btn-gray" value="#{i18n['action.cancel']}" actionListener="#{changePasswordDialogBean.closeDialog}" update="@form" process="@this"/>
					</div>
				</div>
			</div>
		</p:dialog>
	</h:form>
</ui:composition>
