<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html" xmlns:i18n="http://legion.com/i18n"
	xmlns:p="http://xmlns.jcp.org/jsf/passthrough">

	<h:panelGroup layout="block" rendered="#{changePasswordPopupBean.rendered}"
		styleClass="#{changePasswordPopupBean.modal ? 'smallModalDialog': ''}">
		<h:panelGroup layout="block" id="modalContent">
			<h:form id="changePasswordPopupForm">
				<h:commandLink styleClass="close" action="#{changePasswordPopupBean.hide}" value="X" immediate="true" />
				<h3>#{i18n['config.change_password']}</h3>

				<h:outputLabel value="#{i18n['config.password']}" styleClass="password required">
					<h:inputSecret id="password" value="#{changePasswordPopupBean.password}" label="#{i18n['config.password']}"
						required="true" styleClass="#{not component.valid ? 'inputError' : ''}"
						binding="#{changePasswordPopupBean.passwordComponent}" />
					<h:message for="password" errorClass="error" />
				</h:outputLabel>

				<h:outputLabel value="#{i18n['config.new_password']}" styleClass="password required">
					<h:inputSecret id="newPassword" value="#{changePasswordPopupBean.newPassword}"
						label="#{i18n['config.new_password']}" required="true" styleClass="#{not component.valid ? 'inputError' : ''}"
						binding="#{changePasswordPopupBean.newPasswordComponent}" />
					<h:message for="newPassword" errorClass="error" />
				</h:outputLabel>

				<h:outputLabel value="#{i18n['config.repeat_password']}" styleClass="password required">
					<h:inputSecret id="repeatPassword" value="#{changePasswordPopupBean.repeatPassword}"
						label="#{i18n['config.repeat_password']}" required="true" styleClass="#{not component.valid ? 'inputError' : ''}" />
					<h:message for="repeatPassword" errorClass="error" />
				</h:outputLabel>

				<h:panelGroup layout="block" class="buttonGroup">
					<h:commandButton value="#{i18n['action.change']}" action="#{changePasswordPopupBean.change}" />
				</h:panelGroup>
			</h:form>
		</h:panelGroup>
	</h:panelGroup>
</ui:composition>
