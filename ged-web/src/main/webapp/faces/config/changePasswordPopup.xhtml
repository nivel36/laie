<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html" xmlns:i18n="http://legion.com/i18n"
	xmlns:p="http://primefaces.org/ui">

	<p:dialog modal="true" widgetVar="changePasswordDlg" header="#{i18n['config.change_password']}">
		<h:form>
			<div class="form-group">
				<p:outputLabel value="#{i18n['config.password']}" />
				<p:password id="password" value="#{changePasswordPopupBean.password}" label="#{i18n['config.password']}"
					required="true" styleClass="#{not component.valid ? 'inputError' : ''}"
					binding="#{changePasswordPopupBean.passwordComponent}" />
				<h:message for="password" errorClass="error" />
			</div>
			<div class="form-group">
				<p:outputLabel value="#{i18n['config.new_password']}" />
				<p:password id="newPassword" value="#{changePasswordPopupBean.newPassword}"
					label="#{i18n['config.new_password']}" required="true" styleClass="#{not component.valid ? 'inputError' : ''}"
					binding="#{changePasswordPopupBean.newPasswordComponent}" />
				<h:message for="newPassword" errorClass="error" />
			</div>
			<div class="form-group">
				<p:outputLabel value="#{i18n['config.repeat_password']}" />
				<p:password id="repeatPassword" value="#{changePasswordPopupBean.repeatPassword}"
					label="#{i18n['config.repeat_password']}" required="true" styleClass="#{not component.valid ? 'inputError' : ''}" />
				<h:message for="repeatPassword" errorClass="error" />
			</div>
			<p:commandButton styleClass="push-right" value="#{i18n['action.change']}" action="#{changePasswordPopupBean.change}" />
		</h:form>
	</p:dialog>
</ui:composition>
