<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui"
	xmlns:composite="http://xmlns.jcp.org/jsf/composite" xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:o="http://omnifaces.org/ui" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{clientEditBean.newClient ? i18n['client.new_client'] : clientEditBean.client.name}</title>
	</ui:define>

	<ui:define name="content">
		<p:breadCrumb styleClass="breadcrumb">
			<p:menuitem value="#{i18n['menu.index']}" url="/faces/index.xhtml" />
			<p:menuitem value="#{i18n['client.clients']}" url="/faces/client/clientSearch.xhtml" />
			<p:menuitem value="#{clientEditBean.client.name}"
				url="/faces/client/client.xhtml?clientId=#{clientEditBean.client.id}" rendered="#{not clientEditBean.newClient}" />
			<p:menuitem value="#{clientEditBean.newClient ? i18n['client.new_client'] : clientEditBean.client.name}"
				disabled="true" />
		</p:breadCrumb>

		<h:form id="clientForm">
			<div class="panel">
				<div class="panel-header">
					<h2>#{clientEditBean.newClient ? i18n['client.new_client'] : clientEditBean.client.name}</h2>
				</div>
				<div class="panel-content">
					<div class="grid">
						<div class="col-12 sm-6">
							<h3>#{i18n['client.client_information']}</h3>
							<cc:inputText id="name" label="#{i18n['client.name']}" value="#{clientEditBean.client.name}" required="true" />

							<cc:inputText id="cif" label="#{i18n['client.cif']}" value="#{clientEditBean.client.cif}" required="true" />

						</div>
						<div class="col-12 sm-6">
							<h3>#{i18n['client.contact_information']}</h3>

							<cc:inputText id="phoneNumber" label="#{i18n['client.phone_number']}"
								value="#{clientEditBean.client.phoneNumber}" />

							<cc:inputText id="city" label="#{i18n['client.city']}" value="#{clientEditBean.client.address.city}" />

							<cc:inputText id="state" label="#{i18n['client.state']}" value="#{clientEditBean.client.address.state}" />
						</div>
					</div>
				</div>
			</div>
			<div class="panel-footer">
				<div class="buttons">
					<p:button styleClass="btn-gray" value="#{i18n['action.cancel']}" outcome="clientSearch"
						rendered="#{clientEditBean.newClient}" />
					<p:button styleClass="btn-gray" value="#{i18n['action.cancel']}" outcome="client"
						rendered="#{not clientEditBean.newClient}">
						<f:param name="clientId" value="#{clientEditBean.client.id}" />
					</p:button>
					<p:commandButton styleClass="btn-primary" value="#{i18n['action.save']}" action="#{clientEditBean.save}"
						process="@form" update="@form growl" />

				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
