<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['client.client']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="clients" />

	<ui:define name="content">
		<h:form id="form">
			<input type="hidden" id="clientId"
				value="#{clientEditBean.client.id}" />

			<div class="ui-g">
				<div class="ui-g-12">
					<p:panel styleClass="cyan"
						header="#{clientEditBean.client.id eq 0 ? i18n['client.new_client'] : clientEditBean.client}">
						<div class="ui-g">
							<div class="ui-md-12 ui-lg-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['client.name']}" for="name" />
									<p:inputText id="name" value="#{clientEditBean.client.name}"
										required="true" />
								</div>
								<h:message for="name" errorClass="error" />
							</div>
							<div class="ui-md-12 ui-lg-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['client.cif']}" for="cif" />
									<p:inputText id="cif" value="#{clientEditBean.client.cif}"
										required="true" />
								</div>
								<h:message for="cif" errorClass="error" />
							</div>
							<div class="ui-md-12 ui-lg-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['client.city']}" for="city" />
									<p:inputText id="city"
										value="#{clientEditBean.client.address.city}" />
								</div>
								<h:message for="city" errorClass="error" />
							</div>
							<div class="ui-md-12 ui-lg-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['client.state']}" for="state" />
									<p:inputText id="state"
										value="#{clientEditBean.client.address.state}" />
								</div>
								<h:message for="state" errorClass="error" />
							</div>
						</div>
						<div class="ui-g">
							<div class="ui-g">
								<div class="push-right">
									<p:commandButton value="#{i18n['action.save']}"
										action="#{clientEditBean.save}" />
									<p:commandButton styleClass="btn-gray"
										value="#{i18n['action.cancel']}"
										action="#{clientEditBean.cancel}" immediate="true">
										<f:param name="clientId" value="#{clientEditBean.client.id}" />
									</p:commandButton>
								</div>
							</div>
						</div>
					</p:panel>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
