<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:i18n="http://ged.com/i18n"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{clientEditBean.newClient ? i18n['client.new_client'] : clientEditBean.client.name}</title>
	</ui:define>

	<ui:define name="content">
		<div class="grid">
			<div class="col-12">
				<p:breadCrumb homeDisplay="text">
					<p:menuitem value="#{i18n['menu.index']}" url="/faces/index.xhtml" />
					<p:menuitem value="#{i18n['client.clients']}" url="/faces/client/clientSearch.xhtml" />
					<p:menuitem value="#{clientEditBean.newClient ? i18n['client.new_client'] : clientEditBean.client.name}" disabled="true" />
				</p:breadCrumb>
			</div>
			
			<div class="col-12">
				<h:form id="clientForm">
					<p:panel header="#{clientEditBean.newClient ? i18n['client.new_client'] : clientEditBean.client.name}">
						<div class="grid">
							<div class="col-12 sm-6">
								<cc:inputText id="name" label="#{i18n['client.name']}" value="#{clientEditBean.client.name}" required="true" />
							</div>
							<div class="col-12 sm-6">
								<cc:inputText id="cif" label="#{i18n['client.cif']}" value="#{clientEditBean.client.cif}" required="true" />
							</div>
							<div class="col-12 sm-6">
								<cc:inputText id="phoneNumber" label="#{i18n['client.phone_number']}" value="#{clientEditBean.client.phoneNumber}" />
							</div>
							<div class="col-12 sm-6">
								<cc:inputText id="city" label="#{i18n['client.city']}" value="#{clientEditBean.client.address.city}" />
							</div>
							<div class="col-12 sm-6">
								<cc:inputText id="state" label="#{i18n['client.state']}" value="#{clientEditBean.client.address.state}" />
							</div>
							<div class="col-12">
								<div class="form-action-primary">
									<p:button styleClass="btn-gray" value="#{i18n['action.cancel']}" outcome="clientSearch" rendered="#{clientEditBean.newClient}" />
									<p:button styleClass="btn-gray" value="#{i18n['action.cancel']}" outcome="client" rendered="#{not clientEditBean.newClient}">
										<f:param name="clientId" value="#{clientEditBean.client.id}" />
									</p:button>
									<p:commandButton styleClass="btn-primary" value="#{i18n['action.save']}" action="#{clientEditBean.save}" process="@form" update="@form growl" />
								</div>
							</div>
						</div>
					</p:panel>
				</h:form>
			</div>
		</div>
	</ui:define>
</ui:composition>
