<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['contact.new_contact']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="contacts" />

	<ui:define name="content">
		<f:metadata>
			<f:viewParam name="id" value="#{contactBean.id}" />
			<f:viewAction action="#{contactBean.init}" />
		</f:metadata>

		<div class="ui-g">
			<div class="ui-g-12 ui-xl-6 ui-g-offset-2">
				<p:panel header="#{i18n['contact.new_contact']}">
					<h:form id="form">
						<div class="ui-g">
							<div class="ui-md-12 ui-lg-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['contact.name']}" for="name" />
									<p:inputText id="name" value="#{contactBean.contact.name}" required="true" readonly="#{not contactBean.editable}" />
								</div>
								<h:message for="name" errorClass="error" />
							</div>
							<div class="ui-md-12 ui-lg-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['contact.surname']}" for="surname" />
									<p:inputText id="surname" value="#{contactBean.contact.surname}" required="true"
										readonly="#{not contactBean.editable}" />
								</div>
								<h:message for="surname" errorClass="error" />
							</div>
							<div class="ui-md-12 ui-lg-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['contact.email']}" for="email" />
									<p:inputText id="email" value="#{contactBean.contact.email}" required="true" readonly="#{not contactBean.editable}" />
								</div>
								<h:message for="email" errorClass="error" />
							</div>
							<div class="ui-md-12 ui-lg-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['contact.phoneNumber']}" for="phone_number" />
									<p:inputText id="phone_number" value="#{contactBean.contact.phoneNumber}" required="true"
										readonly="#{not contactBean.editable}" />
								</div>
								<h:message for="phone_number" errorClass="error" />
							</div>
						</div>
						<div class="ui-g">
							<div class="ui-g-12">
								<div class="form-action-primary">
									<p:commandButton value="#{i18n['action.save']}" action="#{contactBean.update}" update="@form growl"
										rendered="#{contactBean.editable}" />
									<p:commandButton value="#{i18n['action.edit']}" action="#{contactBean.edit}" update="@form growl"
										rendered="#{not contactBean.editable}" />
									<p:commandButton value="#{i18n['action.cancel']}" action="#{contactBean.cancel}" update="@form growl" process="@this"
										rendered="#{contactBean.editable}" styleClass="btn-gray" />
								</div>
							</div>
						</div>
					</h:form>
				</p:panel>
			</div>
		</div>
	</ui:define>
</ui:composition>
