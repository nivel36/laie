<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:i18n="http://legion.com/i18n">

	<ui:include src="/faces/client/contactDialog.xhtml" />

	<h:form id="contactsForm">
		<p:panel id="contacts" header="#{i18n['client.contacts']}">
			<p:dataGrid layout="grid" var="contact" value="#{contactPanelBean.contacts}" emptyMessage="#{i18n['client.no_contacts_found']}" paginator="true" paginatorPosition="bottom">
				<div class="card contact">
					<div class="image">
						<p:graphicImage class="image image-icon" value="/resources/img/default-avatar.png" />
					</div>
					<div class="container">
						<h4>#{contact.fullName}</h4>
						<h5>#{contact.position}</h5>
						<div class="contact-info">
							<p class="email">#{contact.email}</p>
							<p class="phone">#{contact.phoneNumber}</p>
						</div>
					</div>
				</div>
			</p:dataGrid>

			<div class="pull-right">
				<p:commandButton id="openContactDialog" value="#{i18n['action.new']}" actionListener="#{contactDialogBean.openDialog}" process="@this" update="contactForm"
					styleClass="btn-primary">
					<f:attribute name="client" value="#{contactPanelBean.clientId}" />
				</p:commandButton>
			</div>
		</p:panel>
	</h:form>
</ui:composition>
