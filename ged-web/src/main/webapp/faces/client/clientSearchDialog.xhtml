<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html" xmlns:i18n="http://legion.com/i18n"
	xmlns:p="http://primefaces.org/ui">

	<ui:include src="/faces/client/clientDialog.xhtml" />

	<h:form id="clientSearchDialogForm">
		<p:dialog modal="true" widgetVar="clientSearchDlg" resizable="false" responsive="true"
			header="#{i18n['client.clients']}" id="clientSearchDlg" closable="false"
			visible="#{clientSearchDialogBean.showDialog}">

			<div class="ui-g">
				<div class="ui-md-12 ui-lg-4">
					<div class="ui-inputgroup">
						<p:inputText id="searchText" value="#{clientSearchDialogBean.searchText}" />
						<p:commandButton icon="fa fa-search" styleClass="green-button" action="#{clientSearchDialogBean.search}"
							update="@form" process="searchText" />
					</div>
				</div>
			</div>
			<div class="ui-g">
				<div class="ui-g-12">
					<p:dataTable var="client" id="clients" value="#{clientSearchDialogBean.clients}"
									emptyMessage="#{i18n['client.no_clients_found']}" reflow="true" paginator="true" paginatorPosition="bottom"
									rows="#{sessionBean.rowsPerPage}" selectionMode="single" selection="#{clientSearchDialogBean.selectedClient}"
									rowKey="#{client.id}" sortBy="#{client.name}" sortOrder="ascending">
						
						<p:ajax event="rowSelect" listener="#{clientSearchDialogBean.onClientSelect}" update="@form" />

						<p:column headerText="#{i18n['client.name']}" sortBy="#{client.name}">
							<h:outputText value="#{client.name}" />
						</p:column>

						<p:column headerText="#{i18n['client.phoneNumber']}" sortBy="#{client.phoneNumber}">
							<h:outputText value="#{client.phoneNumber}" />
						</p:column>

						<p:column headerText="#{i18n['client.cif']}" sortBy="#{client.cif}">
							<h:outputText value="#{client.cif}" />
						</p:column>

						<p:column headerText="#{i18n['client.city']}" sortBy="#{client.address.city}">
							<h:outputText value="#{client.address.city}" />
						</p:column>

						<p:column headerText="#{i18n['client.state']}" sortBy="#{client.address.state}">
							<h:outputText value="#{client.address.state}" />
						</p:column>

						<p:column headerText="#{i18n['client.owner']}" sortBy="#{client.user.fullName}">
							<h:outputText value="#{client.owner.fullName}" />
						</p:column>
					</p:dataTable>
				</div>
			</div>
		</p:dialog>
	</h:form>
</ui:composition>
