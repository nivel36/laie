<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:i18n="http://ged.com/i18n"
	xmlns:cc="http://java.sun.com/jsf/composite/components" template="/WEB-INF/templates/dialog.xhtml">

	<ui:define name="title">
		<title>#{i18n['client.clients']}</title>
	</ui:define>
	<ui:define name="content">
		<h:form id="clientsSearchForm">
			<div class="grid">
				<div class="col-12 md-6">
					<div class="ui-inputgroup">
						<p:inputText id="searchText" value="#{clientSearchDialogBean.searchText}" />
						<p:commandButton id="cleanSearchTextAction" action="#{clientSearchDialogBean.clean}" update="@form" styleClass="btn-gray" icon="fa fa-times"
							rendered="#{not empty clientSearchDialogBean.searchText}" />
						<p:commandButton id="searchAction" action="#{clientSearchDialogBean.search}" update="@form" icon="fa fa-search" />
					</div>
				</div>
				<div class="col-12">
					<p:dataTable var="client" id="clients" value="#{clientSearchDialogBean.clients}" emptyMessage="#{i18n['client.no_clients_found']}" reflow="true"
						paginator="true" paginatorPosition="bottom" rows="#{sessionUser.rowsPerPage}" selectionMode="single" selection="#{clientSearchDialogBean.selectedClient}"
						rowKey="#{client.id}" sortBy="#{client.name}" sortOrder="ascending">

						<p:ajax event="rowSelect" listener="#{clientSearchDialogBean.onClientSelect}" update="@form" resetValues="true" />

						<p:column headerText="#{i18n['client.name']}" sortBy="#{client.name}">
							<h:outputText value="#{client.name}" />
						</p:column>

						<p:column headerText="#{i18n['client.phone_number']}" sortBy="#{client.phoneNumber}">
							<h:outputText value="#{client.phoneNumber}" />
						</p:column>

						<p:column headerText="#{i18n['client.cif']}" sortBy="#{client.cif}">
							<h:outputText value="#{client.cif}" />
						</p:column>

						<p:column headerText="#{i18n['client.city']}" sortBy="#{client.address.city}">
							<h:outputText value="#{client.address.city}" />
						</p:column>

						<p:column headerText="#{i18n['client.state']}" sortBy="#{client.address.state}">
							<h:outputText value="#{client.address.state}" />
						</p:column>

						<p:column headerText="#{i18n['client.owner']}" sortBy="#{client.owner.fullName}">
							<h:outputText value="#{client.owner.fullName}" />
						</p:column>
					</p:dataTable>
				</div>
		
				<div class="col-12">
					<div class="form-action-primary">
						<p:commandButton value="#{i18n['action.cancel']}" action="#{clientSearchDialogBean.cancel}" process="@this" styleClass="btn-gray" />
					</div>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
