<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['contact.new_contact']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="contacts" />

	<ui:define name="content">
		<h:form id="form">
			<div class="ui-g">
				<div class="ui-g-12 ui-xl-6 ui-g-offset-2">
					<p:panel header="#{i18n['contact.new_contact']}">
						<div class="ui-g">
							<div class="ui-md-12 ui-lg-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['contact.name']}" for="name" />
									<p:inputText id="name" value="#{contactEditBean.contact.name}" required="true" />
								</div>
								<h:message for="name" errorClass="error" />
							</div>
							<div class="ui-md-12 ui-lg-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['contact.surname']}" for="surname" />
									<p:inputText id="surname" value="#{contactEditBean.contact.surname}" required="true" />
								</div>
								<h:message for="surname" errorClass="error" />
							</div>
							<div class="ui-md-12 ui-lg-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['contact.email']}" for="email" />
									<p:inputText id="email" value="#{contactEditBean.contact.email}" required="true" />
								</div>
								<h:message for="email" errorClass="error" />
							</div>
							<div class="ui-md-12 ui-lg-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['contact.phoneNumber']}" for="phone_number" />
									<p:inputText id="phone_number" value="#{contactEditBean.contact.phoneNumber}" />
								</div>
								<h:message for="phone_number" errorClass="error" />
							</div>
						</div>
						<div class="ui-g">
							<div class="ui-g-12">
								<div class="form-action-primary">
									<p:commandButton value="#{i18n['action.save']}" action="#{contactEditBean.insert}" update="growl" />
									<p:commandButton styleClass="btn-gray" value="#{i18n['action.cancel']}" action="#{contactEditBean.cancel}"
										immediate="true" />
								</div>
							</div>
						</div>
					</p:panel>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
