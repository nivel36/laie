<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['client.clients']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="clients" />

	<ui:define name="content">
		<h:form id="form">
			<div class="ui-g">
				<div class="ui-g-12">
					<p:panel header="#{i18n['client.search']}">
						<div class="ui-g">
							<div class="ui-md-12 ui-lg-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel for="name" value="#{i18n['client.name']}" />
									<p:inputText id="name" value="#{clientSearchBean.name}" />
								</div>
							</div>
						</div>
						<div class="ui-g">
							<div class="ui-g-12">
								<div class="form-action-primary">
									<p:commandButton styleClass="btn-green" value="#{i18n['action.new']}" action="#{clientSearchBean.newClient}"
										immediate="true" />
									<p:commandButton value="#{i18n['action.search']}" action="#{clientSearchBean.search}" />
									<p:commandButton styleClass="btn-gray" value="#{i18n['action.clean']}" action="#{clientSearchBean.clean}" />
								</div>
							</div>
						</div>
					</p:panel>
				</div>
			</div>
			<div class="ui-g">
				<div class="ui-g-12">
					<p:panel header="#{i18n['client.search_results']}">
						<p:dataTable var="client" value="#{clientSearchBean.clients}" emptyMessage="#{i18n['client.no_clients_found']}"
							reflow="true" paginator="true" paginatorPosition="bottom" rows="#{sessionBean.rowsPerPage}">

							<p:column headerText="#{i18n['client.name']}" sortBy="#{client.name}">
								<h:outputText value="#{client.name}" />
							</p:column>

							<p:column headerText="#{i18n['client.cif']}" sortBy="#{client.cif}">
								<h:outputText value="#{client.cif}" />
							</p:column>

							<p:column>
								<p:button outcome="clientView" icon="fa fa-eye">
									<f:param name="id" value="#{client.id}" />
								</p:button>
							</p:column>
						</p:dataTable>
					</p:panel>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
