<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['client.clients']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="clients" />

	<ui:define name="content">
		<div class="ui-g">
			<div class="ui-g-12 ui-xl-8">
				<h:form id="searchForm">
					<p:panel id="searchPanel" header="#{i18n['client.clients']}">
						<div class="ui-g">
							<div class="ui-g-12">
								<div class="pull-right">
									<p:commandButton value="#{i18n['action.new']}" action="#{clientSearchBean.newClient}" immediate="true" />
									<p:commandButton value="#{i18n['action.import']}" styleClass="btn-primary" action="#{clientSearchBean.clean}" />
								</div>
							</div>
						</div>
						<div class="ui-g">
							<div class="ui-md-12 ui-lg-4">
								<div class="ui-inputgroup">
									<p:inputText id="searchText" value="#{clientSearchBean.searchText}" />
									<p:commandButton icon="fa fa-search" styleClass="green-button" action="#{clientSearchBean.search}"
										update="@form" process="searchPanel" />
								</div>
							</div>
						</div>
						<div class="ui-g">
							<div class="ui-g-12">
								<p:dataTable var="client" id="clients" value="#{clientSearchBean.clients}"
									emptyMessage="#{i18n['client.no_clients_found']}" reflow="true" paginator="true" paginatorPosition="bottom"
									rows="#{sessionBean.rowsPerPage}" selectionMode="single" selection="#{clientSearchBean.selectedClient}"
									rowKey="#{client.id}" sortBy="#{client.name}" sortOrder="ascending">

									<p:ajax event="rowSelect" listener="#{clientSearchBean.onClientSelect}" update="@form" />

									<p:column headerText="#{i18n['client.name']}" sortBy="#{client.name}">
										<h:outputText value="#{client.name}" />
									</p:column>

									<p:column headerText="#{i18n['client.phoneNumber']}" sortBy="#{client.phoneNumber}">
										<h:outputText value="#{client.phoneNumber}" />
									</p:column>

									<p:column headerText="#{i18n['client.cif']}" sortBy="#{client.cif}">
										<h:outputText value="#{client.cif}" />
									</p:column>

									<p:column headerText="#{i18n['client.owner']}" sortBy="#{client.user.fullName}">
										<h:outputText value="#{client.user.fullName}" />
									</p:column>
								</p:dataTable>
							</div>
						</div>
					</p:panel>
				</h:form>
			</div>
		</div>
	</ui:define>
</ui:composition>
