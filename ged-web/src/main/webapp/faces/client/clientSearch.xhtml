<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui" template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['client.clients']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="clients" />

	<ui:define name="content">

		<ui:include src="/faces/client/clientDialog.xhtml" />

		<div class="ui-g">
			<div class="ui-g-12">
				<h:form id="searchForm">
					<p:defaultCommand target="searchAction" />
					<p:panel id="searchPanel" header="#{i18n['client.clients']}">
						<div class="ui-g">
							<div class="ui-g-12 ui-md-6 ui-lg-4">
								<div class="ui-inputgroup">
									<p:inputText id="searchText" value="#{clientSearchBean.searchText}" />
									<p:commandButton id="cleanSearchTextAction" action="#{clientSearchBean.clean}" update="@form" styleClass="btn-gray" icon="fa fa-times"
										rendered="#{not empty clientSearchBean.searchText}" />
									<p:commandButton id="searchAction" action="#{clientSearchBean.search}" update="@form" styleClass="btn-primary" icon="fa fa-search" />
								</div>
							</div>
							<div class="ui-g-12 ui-md-6 ui-lg-8">
								<div class="pull-right">
									<p:commandButton value="#{i18n['action.new']}" actionListener="#{clientDialogBean.openDialog}" update="clientForm" />
									<p:commandButton value="#{i18n['action.export']}" action="#{clientSearchBean.clean}" styleClass="btn-primary" icon="fa fa-file-excel-o" />
								</div>
							</div>
						</div>
						<div class="ui-g">
							<div class="ui-g-12">
								<p:dataTable var="client" id="clients" value="#{clientSearchBean.clients}" emptyMessage="#{i18n['client.no_clients_found']}" reflow="true"
									paginator="true" paginatorPosition="bottom" rows="#{sessionBean.rowsPerPage}" selectionMode="single" selection="#{clientSearchBean.selectedClient}"
									rowKey="#{client.id}" sortBy="#{client.name}" sortOrder="ascending">

									<p:ajax event="rowSelect" listener="#{clientSearchBean.onClientSelect}" update="@form" />

									<p:column headerText="#{i18n['client.name']}" sortBy="#{client.name}">
										<h:outputText value="#{client.name}" />
									</p:column>

									<p:column headerText="#{i18n['client.phoneNumber']}" sortBy="#{client.phoneNumber}">
										<h:outputText value="#{client.phoneNumber}" />
									</p:column>

									<p:column headerText="#{i18n['client.cif']}" sortBy="#{client.cif}">
										<h:outputText value="#{client.cif}" />
									</p:column>

									<p:column headerText="#{i18n['client.city']}" sortBy="#{client.address.city}">
										<h:outputText value="#{client.address.city}" />
									</p:column>

									<p:column headerText="#{i18n['client.state']}" sortBy="#{client.address.state}">
										<h:outputText value="#{client.address.state}" />
									</p:column>

									<p:column headerText="#{i18n['client.owner']}" sortBy="#{client.user.fullName}">
										<h:outputText value="#{client.owner.fullName}" />
									</p:column>
								</p:dataTable>
							</div>
						</div>
					</p:panel>
				</h:form>
			</div>
		</div>
	</ui:define>
</ui:composition>
