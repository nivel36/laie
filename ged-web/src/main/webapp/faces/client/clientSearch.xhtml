<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['client.clients']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="clients" />

	<ui:define name="content">
		<p:breadCrumb styleClass="breadcrumb">
			<p:menuitem value="#{i18n['menu.index']}" url="/faces/index.xhtml" />
			<p:menuitem value="#{i18n['client.clients']}" disabled="true" />
		</p:breadCrumb>

		<h:form id="clientSearchForm">
			<div class="panel">
				<div class="panel-header">
					<div class="panel-header-title">#{i18n['client.search']}</div>
				</div>
				<div class="panel-content">
					<div class="panel-content-data">
						<cc:inputSearch searchText="#{clientSearchBean.searchText}" searchAction="#{clientSearchBean.search}"
							update="@form" />
						<div class="buttons">
							<p:commandButton value="#{i18n['action.export']}" action="#{clientSearchBean.search}" process="@this"
								icon="fa-file-excel-o" rendered="#{not empty clientSearchBean.clients}" styleClass="btn-primary" />
							<p:button value="#{i18n['action.new']}" outcome="clientEdit" styleClass="btn-primary" />
						</div>
					</div>
					<p:dataTable var="client" id="clients" value="#{clientSearchBean.clients}"
						emptyMessage="#{i18n['client.no_clients_found']}" reflow="true" paginator="true" paginatorPosition="bottom"
						rows="#{sessionUser.rowsPerPage}" sortBy="#{client.name}" sortOrder="ascending">

						<p:column headerText="#{i18n['client.name']}" sortBy="#{client.name}">
							<h:link value="#{client.name}" outcome="/faces/client/client">
								<f:param name="clientId" value="#{client.id}" />
							</h:link>
						</p:column>

						<p:column headerText="#{i18n['client.phone_number']}" sortBy="#{client.phoneNumber}">
							<h:outputText value="#{client.phoneNumber}" />
						</p:column>

						<p:column headerText="#{i18n['client.cif']}" sortBy="#{client.cif}">
							<h:outputText value="#{client.cif}" />
						</p:column>

						<p:column headerText="#{i18n['client.city']}" sortBy="#{client.address.city}">
							<h:outputText value="#{client.address.city}" />
						</p:column>

						<p:column headerText="#{i18n['client.state']}" sortBy="#{client.address.state}">
							<h:outputText value="#{client.address.state}" />
						</p:column>

						<p:column headerText="#{i18n['client.owner']}" sortBy="#{client.owner.fullName}">
							<h:link value="#{client.owner.fullName}" outcome="/faces/user/user">
								<f:param name="userId" value="#{client.owner.id}" />
							</h:link>
						</p:column>
					</p:dataTable>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
