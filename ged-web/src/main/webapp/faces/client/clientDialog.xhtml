<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:i18n="http://legion.com/i18n" xmlns:p="http://primefaces.org/ui">

	<h:form id="clientForm">
		<p:dialog id="clientDlg" header="#{i18n['client.new_client']}" closable="false" modal="true" resizable="false" responsive="true" styleClass="medium"
			visible="#{clientDialogBean.showDialog}">
			<div class="ui-g">
				<div class="ui-g-12 ui-md-6">
					<div class="form-group">
						<p:outputLabel value="#{i18n['client.name']}" for="name" />
						<p:inputText id="name" value="#{clientDialogBean.client.name}" required="true" />
						<p:message for="name" />
					</div>
				</div>
				<div class="ui-g-12 ui-md-6">
					<div class="form-group">
						<p:outputLabel value="#{i18n['client.cif']}" for="cif" />
						<p:inputText id="cif" value="#{clientDialogBean.client.cif}" required="true" />
						<p:message for="cif" />
					</div>
				</div>
				<div class="ui-g-12 ui-md-6">
					<div class="form-group">
						<p:outputLabel value="#{i18n['client.phoneNumber']}" for="phone_number" />
						<p:inputText id="phone_number" value="#{clientDialogBean.client.phoneNumber}" />
						<p:message for="phone_number" />
					</div>
				</div>
				<div class="ui-g-12 ui-md-6">
					<div class="form-group">
						<p:outputLabel value="#{i18n['client.city']}" for="city" />
						<p:inputText id="city" value="#{clientDialogBean.client.address.city}" />
						<p:message for="city" />
					</div>
				</div>
				<div class="ui-g-12 ui-md-6">
					<div class="form-group">
						<p:outputLabel value="#{i18n['client.state']}" for="state" />
						<p:inputText id="state" value="#{clientDialogBean.client.address.state}" />
						<p:message for="state" />
					</div>
				</div>
			</div>
			<f:facet name="footer">
				<div class="form-action-primary">
					<p:commandButton value="#{i18n['action.cancel']}" action="#{clientDialogBean.closeDialog}" process="@this" update="@form" styleClass="btn-gray">
						<p:resetInput target="@form" />
					</p:commandButton>
					<p:commandButton value="#{i18n['action.save']}" action="#{clientDialogBean.save}" update="@form growl" />
				</div>
			</f:facet>
		</p:dialog>
	</h:form>
</ui:composition>
