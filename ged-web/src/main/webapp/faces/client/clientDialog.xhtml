<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html" xmlns:i18n="http://legion.com/i18n"
	xmlns:p="http://primefaces.org/ui">

	<h:form id="newClientForm">
		<p:dialog modal="true" widgetVar="newClientDlg" resizable="false" responsive="true"
			header="#{i18n['client.new_client']}" id="newClientDlg" closable="false" visible="#{clientDialogBean.showDialog}">

			<div class="ui-g">
				<div class="ui-md-12 ui-lg-6 ui-xl-4">
					<div class="form-group">
						<p:outputLabel value="#{i18n['client.name']}" for="name" />
						<p:inputText id="name" value="#{clientDialogBean.client.name}" required="true" />
					</div>
					<h:message for="name" errorClass="error" />
				</div>
				<div class="ui-md-12 ui-lg-6 ui-xl-4">
					<div class="form-group">
						<p:outputLabel value="#{i18n['client.cif']}" for="cif" />
						<p:inputText id="cif" value="#{clientDialogBean.client.cif}" required="true" />
					</div>
					<h:message for="cif" errorClass="error" />
				</div>
			</div>

			<div class="ui-g">
				<div class="ui-md-12 ui-lg-6 ui-xl-4">
					<div class="form-group">
						<p:outputLabel value="#{i18n['client.phoneNumber']}" for="phone_number" />
						<p:inputText id="phone_number" value="#{clientDialogBean.client.phoneNumber}" />
					</div>
					<h:message for="phone_number" errorClass="error" />
				</div>
				<div class="ui-md-12 ui-lg-6 ui-xl-4">
					<div class="form-group">
						<p:outputLabel value="#{i18n['client.city']}" for="city" />
						<p:inputText id="city" value="#{clientDialogBean.client.address.city}" />
					</div>
					<h:message for="city" errorClass="error" />
				</div>
				<div class="ui-md-12 ui-lg-6 ui-xl-4">
					<div class="form-group">
						<p:outputLabel value="#{i18n['client.state']}" for="state" />
						<p:inputText id="state" value="#{clientDialogBean.client.address.state}" />
					</div>
					<h:message for="state" errorClass="error" />
				</div>
			</div>
			<div class="ui-g">
				<div class="ui-g-12">
					<div class="form-action-primary">
						<p:commandButton value="#{i18n['action.save']}" action="#{clientDialogBean.save}" update="@form" />
						<p:commandButton styleClass="btn-gray" value="#{i18n['action.cancel']}" action="#{clientDialogBean.closeDialog}"
							process="@this" update="@form">
							<p:resetInput target="@form" />
						</p:commandButton>
					</div>
				</div>
			</div>
		</p:dialog>
	</h:form>
</ui:composition>
