<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:i18n="http://legion.com/i18n"
	xmlns:cc="http://java.sun.com/jsf/composite/components" template="/WEB-INF/templates/dialog.xhtml">

	<ui:define name="title">
		<title>#{clientDialogBean.newClient ? i18n['client.new_client'] : clientDialogBean.client.name}</title>
	</ui:define>

	<ui:define name="content">
		<h:form id="clientForm">
			<div class="ui-g">
				<div class="ui-g-12 ui-md-6">
					<cc:inputText name="name" label="#{i18n['client.name']}" value="#{clientDialogBean.client.name}" required="true" />
				</div>
				<div class="ui-g-12 ui-md-6">
					<cc:inputText name="cif" label="#{i18n['client.cif']}" value="#{clientDialogBean.client.cif}" required="true" />
				</div>
				<div class="ui-g-12 ui-md-6">
					<cc:inputText name="phoneNumber" label="#{i18n['client.phone_number']}" value="#{clientDialogBean.client.phoneNumber}" />
				</div>
				<div class="ui-g-12 ui-md-6">
					<cc:inputText name="city" label="#{i18n['client.city']}" value="#{clientDialogBean.client.address.city}" />
				</div>
				<div class="ui-g-12 ui-md-6">
					<cc:inputText name="state" label="#{i18n['client.state']}" value="#{clientDialogBean.client.address.state}" />
				</div>
			</div>
			<div class="ui-g">
				<div class="ui-g-12">
					<div class="form-action-primary">
						<p:commandButton value="#{i18n['action.cancel']}" action="#{clientDialogBean.closeDialog}" process="@this" styleClass="btn-gray" />
						<p:commandButton value="#{i18n['action.save']}" action="#{clientDialogBean.save}" />
					</div>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
