<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:i18n="http://legion.com/i18n"
	xmlns:cc="http://java.sun.com/jsf/composite/components" template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['client.client']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="clients" />

	<ui:define name="content">

		<ui:include src="/faces/client/clientDialog.xhtml" />

		<div class="ui-g">
			<div class="ui-g-12 ui-xl-6">
				<h:form id="clientViewForm">
					<input type="hidden" id="clientId" value="#{clientBean.client.id}" />
					<p:panel header="#{clientBean.client}" id="client">
						<div class="ui-g">
							<div class="ui-g-12 ui-md-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['client.name']}" for="name" />
									<p:inputText id="name" value="#{clientBean.client.name}" readonly="true" />
								</div>
							</div>
							<div class="ui-g-12 ui-md-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['client.cif']}" for="cif" />
									<p:inputText id="cif" value="#{clientBean.client.cif}" readonly="true" />
								</div>
							</div>
						</div>
						<div class="ui-g">
							<div class="ui-g-12 ui-md-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['client.phone_number']}" for="phoneNumber" />
									<p:inputText id="phoneNumber" value="#{clientBean.client.phoneNumber}" readonly="true" />
								</div>
							</div>
							<div class="ui-g-12 ui-md-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['client.city']}" for="city" />
									<p:inputText id="city" value="#{clientBean.client.address.city}" readonly="true" />
								</div>
							</div>
							<div class="ui-g-12 ui-md-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['client.state']}" for="state" />
									<p:inputText id="state" value="#{clientBean.client.address.state}" readonly="true" />
								</div>
							</div>
						</div>

						<h:panelGroup rendered="#{clientBean.userHasPermissionToEdit}" styleClass="pull-right">
							<p:commandButton id="exportExcel" value="#{i18n['action.export']}" action="#{clientBean.export}" icon="fa fa-file-excel-o" />
							<p:commandButton id="editClient" value="#{i18n['action.edit']}" actionListener="#{clientDialogBean.openDialog}" update="clientForm">
								<f:attribute name="client" value="#{clientBean.client}" />
								<f:attribute name="updateField" value="clientViewForm" />
								<f:attribute name="callback" value="#{clientBean}" />
							</p:commandButton>
						</h:panelGroup>
					</p:panel>
				</h:form>
			</div>
			<div class="ui-g-12 ui-xl-6">
				<ui:include src="/faces/client/contactDialog.xhtml" />
				<h:form id="contactsForm">
					<cc:contacts contacts="#{clientBean.contacts}">
						<p:commandButton value="#{i18n['action.new']}" actionListener="#{contactDialogBean.openDialog}" process="@this" update="contactForm"
							styleClass="btn-primary">
							<f:attribute name="client" value="#{clientBean.client}" />
						</p:commandButton>
					</cc:contacts>
				</h:form>
			</div>
			<div class="ui-g-12 ui-xl-6">
				<ui:include src="/faces/jobOffer/jobOfferDialog.xhtml" />
				<h:form id="jobOffersForm">
					<cc:jobOffers id="jobOffers" jobOffers="#{clientBean.jobOffers}">
						<p:commandButton value="#{i18n['action.new']}" actionListener="#{jobOfferDialogBean.openDialog}" process="@this" update="newJobOfferForm"
							styleClass="btn-primary">
							<f:attribute name="client" value="#{clientBean.client}" />
						</p:commandButton>
					</cc:jobOffers>
				</h:form>
			</div>
		</div>
	</ui:define>
</ui:composition>
