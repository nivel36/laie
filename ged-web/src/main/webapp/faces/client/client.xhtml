<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:i18n="http://legion.com/i18n" template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['client.client']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="clients" />

	<ui:define name="content">
		<f:metadata>
			<f:viewParam name="clientId" value="#{clientBean.clientId}" converter="javax.faces.Long" />
			<f:viewAction action="#{clientBean.init}" />
		</f:metadata>

		<ui:include src="/faces/jobOffer/jobOfferDialog.xhtml" />
		<ui:include src="/faces/client/clientDialog.xhtml" />

		<div class="ui-g">
			<div class="ui-g-12 ui-xl-6">
				<h:form id="form">
					<input type="hidden" id="clientId" value="#{clientBean.client.id}" />
					<p:panel header="#{clientBean.client}" id="client">
						<div class="ui-g">
							<div class="ui-g-12 ui-md-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['client.name']}" for="name" />
									<p:inputText id="name" value="#{clientBean.client.name}" readonly="true" required="true" />
								</div>
								<h:message for="name" errorClass="error" />
							</div>
							<div class="ui-g-12 ui-md-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['client.cif']}" for="cif" />
									<p:inputText id="cif" value="#{clientBean.client.cif}" readonly="true" required="true" />
								</div>
								<h:message for="cif" errorClass="error" />
							</div>
						</div>
						<div class="ui-g">
							<div class="ui-g-12 ui-md-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['client.phoneNumber']}" for="phone_number" />
									<p:inputText id="phone_number" value="#{clientBean.client.phoneNumber}" readonly="true" />
								</div>
								<h:message for="phone_number" errorClass="error" />
							</div>
							<div class="ui-g-12 ui-md-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['client.city']}" for="city" />
									<p:inputText id="city" value="#{clientBean.client.address.city}" readonly="true" />
								</div>
								<h:message for="city" errorClass="error" />
							</div>
							<div class="ui-g-12 ui-md-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['client.state']}" for="state" />
									<p:inputText id="state" value="#{clientBean.client.address.state}" readonly="true" />
								</div>
								<h:message for="state" errorClass="error" />
							</div>
						</div>

						<div class="pull-right">
							<p:commandButton id="exportExcel" value="#{i18n['action.export']}" action="#{clientBean.export}" icon="fa fa-file-excel-o" />
							<p:commandButton id="editClient" value="#{i18n['action.edit']}" actionListener="#{clientDialogBean.openDialog}" update="clientForm">
								<f:attribute name="client" value="#{clientBean.client}" />
							</p:commandButton>
						</div>
					</p:panel>
				</h:form>
			</div>
			<div class="ui-g-12 ui-xl-6">
				<ui:include src="/faces/client/contactPanel.xhtml" />
			</div>
			<div class="ui-g-12 ui-xl-6">
				<h:form id="jobOffersForm">
					<p:panel header="#{i18n['job.job_offers']}" id="jobOffers">
						<div class="ui-g">
							<div class="ui-g-12">
								<p:dataTable var="jobOffer" value="#{clientBean.jobOffers}" emptyMessage="#{i18n['client.no_job_offers_found']}" reflow="true" paginator="true"
									paginatorPosition="bottom" rows="#{sessionBean.rowsPerPage}" selectionMode="single" selection="#{clientBean.selectedJobOffer}" rowKey="#{jobOffer.id}"
									sortBy="#{jobOffer.name}" sortOrder="ascending">

									<p:ajax event="rowSelect" listener="#{clientBean.onJobOfferSelect}" />

									<p:column headerText="#{i18n['job.name']}">
										<h:outputText value="#{jobOffer.name}" />
									</p:column>
									<p:column headerText="#{i18n['job.date_closed']}">
										<h:outputText value="#{jobOffer.dateClosed}">
											<f:convertDateTime pattern="dd / MM / yyyy" />
										</h:outputText>
									</p:column>
								</p:dataTable>
							</div>
						</div>
						<div class="pull-right">
							<p:commandButton value="#{i18n['action.add']}" actionListener="#{jobOfferDialogBean.openDialog}" update="newJobOfferForm">
								<f:attribute name="client" value="#{clientBean.client}" />
							</p:commandButton>
							<p:commandButton value="#{i18n['action.new']}" actionListener="#{jobOfferDialogBean.openDialog}" update="newJobOfferForm" styleClass="btn-primary">
								<f:attribute name="client" value="#{clientBean.client}" />
							</p:commandButton>
						</div>
					</p:panel>
				</h:form>
			</div>
		</div>
	</ui:define>
</ui:composition>
