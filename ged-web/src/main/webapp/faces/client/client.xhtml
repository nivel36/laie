<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui"
	xmlns:i18n="http://legion.com/i18n" template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['client.client']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="clients" />

	<ui:define name="content">
		<f:metadata>
			<f:viewParam name="id" value="#{clientBean.id}" />
			<f:viewAction action="#{clientBean.init}" />
		</f:metadata>

		<div class="ui-g">
			<div class="ui-g-12 ui-xl-6">
				<h:form id="form">
					<input type="hidden" id="clientId" value="#{clientBean.client.id}" />
					<p:panel header="#{clientBean.insertable ? i18n['client.new_client'] : clientBean.client}" id="client">
						<div class="ui-g">
							<div class="ui-g-12 ui-md-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['client.name']}" for="name" />
									<p:inputText id="name" value="#{clientBean.client.name}" readonly="#{!clientBean.editable}" required="true" />
								</div>
								<h:message for="name" errorClass="error" />
							</div>
							<div class="ui-g-12 ui-md-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['client.cif']}" for="cif" />
									<p:inputText id="cif" value="#{clientBean.client.cif}" readonly="#{!clientBean.editable}" required="true" />
								</div>
								<h:message for="cif" errorClass="error" />
							</div>
						</div>
						<div class="ui-g">
							<div class="ui-g-12 ui-md-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['client.phoneNumber']}" for="phone_number" />
									<p:inputText id="phone_number" value="#{clientBean.client.phoneNumber}" readonly="#{!clientBean.editable}" />
								</div>
								<h:message for="phone_number" errorClass="error" />
							</div>
							<div class="ui-g-12 ui-md-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['client.city']}" for="city" />
									<p:inputText id="city" value="#{clientBean.client.address.city}" readonly="#{!clientBean.editable}" />
								</div>
								<h:message for="city" errorClass="error" />
							</div>
							<div class="ui-g-12 ui-md-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['client.state']}" for="state" />
									<p:inputText id="state" value="#{clientBean.client.address.state}" readonly="#{!clientBean.editable}" />
								</div>
								<h:message for="state" errorClass="error" />
							</div>
						</div>

						<div class="ui-g">
							<div class="ui-g-12">
								<div class="form-action-primary">
									<p:commandButton value="#{i18n['action.undelete']}" action="#{clientBean.undeleteClient}" immediate="true"
										rendered="#{clientBean.client.deleted}" />

									<p:commandButton value="#{i18n['action.save']}" action="#{clientBean.updateClient}"
										rendered="#{not clientBean.client.deleted and clientBean.editable and not clientBean.insertable}"
										update="client growl" />

									<p:commandButton value="#{i18n['action.save']}" action="#{clientBean.insertClient}"
										rendered="#{not clientBean.client.deleted and clientBean.insertable}" update="client growl" />

									<p:commandButton styleClass="btn-primary" value="#{i18n['action.edit']}" action="#{clientBean.editClient}"
										immediate="true" rendered="#{not clientBean.client.deleted and not clientBean.editable}" update="client growl" />

									<p:commandButton styleClass="btn-gray" value="#{i18n['action.cancel']}" action="#{clientBean.cancelEdit}"
										rendered="#{not clientBean.client.deleted and clientBean.editable}"
										update="client growl contactsForm jobOffersForm" process="@this" />

									<p:commandButton styleClass="btn-primary" id="exportExcel" icon="fa fa-file-excel-o"
										value="#{i18n['action.export']}" action="#{clientBean.export}" rendered="#{not clientBean.editable}" />
								</div>
							</div>
						</div>
					</p:panel>
				</h:form>
			</div>
			<div class="ui-g-12 ui-xl-6">
				<h:form id="contactsForm">
					<p:panel header="#{i18n['client.contacts']}" rendered="#{not clientBean.insertable}" id="contacts">
						<div class="ui-g">
							<div class="ui-g-12">
								<p:dataTable var="contact" value="#{clientBean.contacts}" emptyMessage="#{i18n['client.no_contacts_found']}"
									reflow="true" paginator="true" paginatorPosition="bottom" rows="#{sessionBean.rowsPerPage}"
									selectionMode="single" selection="#{clientBean.selectedContact}" rowKey="#{contact.id}"
									sortBy="#{contact.fullName}" sortOrder="ascending">

									<p:ajax event="rowSelect" listener="#{clientBean.onClientSelect}" />

									<p:column headerText="#{i18n['contact.name']}">
										<h:outputText value="#{contact.fullName}" />
									</p:column>
									<p:column headerText="#{i18n['contact.email']}">
										<h:outputText value="#{contact.email}" />
									</p:column>
									<p:column headerText="#{i18n['contact.phoneNumber']}">
										<h:outputText value="#{contact.phoneNumber}" />
									</p:column>
								</p:dataTable>
							</div>
						</div>
						<div class="ui-g">
							<div class="ui-g-12">
								<div class="form-action-primary">
									<p:commandButton value="#{i18n['action.add']}" process="@this" action="#{clientBean.newContact}" />
								</div>
							</div>
						</div>
					</p:panel>
				</h:form>
			</div>
			<div class="ui-g-12 ui-xl-6">
				<h:form id="jobOffersForm">
					<p:panel header="#{i18n['job.job_offers']}" rendered="#{not clientBean.insertable}" id="jobOffers">
						<div class="ui-g">
							<div class="ui-g-12">
								<p:dataTable var="jobOffer" value="#{clientBean.jobOffers}" emptyMessage="#{i18n['client.no_job_offers_found']}"
									reflow="true" paginator="true" paginatorPosition="bottom" rows="#{sessionBean.rowsPerPage}"
									selectionMode="single" selection="#{clientBean.selectedJobOffer}" rowKey="#{jobOffer.id}"
									sortBy="#{jobOffer.name}" sortOrder="ascending">

									<p:ajax event="rowSelect" listener="#{clientBean.onJobOfferSelect}" />

									<p:column headerText="#{i18n['job.name']}">
										<h:outputText value="#{jobOffer.name}" />
									</p:column>
									<p:column headerText="#{i18n['job.date_closed']}">
										<h:outputText value="#{jobOffer.dateClosed}">
											<f:convertDateTime pattern="dd / MM / yyyy" />
										</h:outputText>
									</p:column>
								</p:dataTable>
							</div>
						</div>
						<div class="ui-g">
							<div class="ui-g-12">
								<div class="form-action-primary">
									<p:commandButton value="#{i18n['action.add']}" action="#{clientBean.newJobOffer}" process="@this" />
								</div>
							</div>
						</div>
					</p:panel>
				</h:form>
			</div>
		</div>
	</ui:define>
</ui:composition>
