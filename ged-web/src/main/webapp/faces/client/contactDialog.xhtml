<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:i18n="http://ged.com/i18n"
	xmlns:cc="http://java.sun.com/jsf/composite/components" template="/WEB-INF/templates/dialog.xhtml">

	<ui:define name="title">
		<title>#{contactDialogBean.newContact ? i18n['contact.new_contact'] : contactDialogBean.contact.name}</title>
	</ui:define>

	<ui:define name="content">
		<h:form id="contactForm">
			<div class="grid">
				<div class="col-12 sm-6">
					<cc:inputText id="name" label="#{i18n['contact.name']}" value="#{contactDialogBean.contact.name}" required="true" />
				</div>
				<div class="col-12 sm-6">
					<cc:inputText id="surname" label="#{i18n['contact.surname']}" value="#{contactDialogBean.contact.surname}" required="true" />
				</div>
				<div class="col-12 sm-6">
					<cc:inputText id="position" label="#{i18n['contact.position']}" value="#{contactDialogBean.contact.position}" />
				</div>
				<div class="col-12 sm-6">
					<cc:inputText id="email" label="#{i18n['contact.email']}" value="#{contactDialogBean.contact.email}" />
				</div>
				<div class="col-12 sm-6">
					<cc:inputText id="phone_number" label="#{i18n['contact.phone_number']}" value="#{contactDialogBean.contact.phoneNumber}" />
				</div>
				<div class="col-12">
					<div class="form-action-primary">
						<p:commandButton value="#{i18n['action.cancel']}" action="#{contactDialogBean.closeDialog}" process="@this" styleClass="btn-gray" />
						<p:commandButton value="#{i18n['action.save']}" action="#{contactDialogBean.save}" update="@form" />
					</div>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
