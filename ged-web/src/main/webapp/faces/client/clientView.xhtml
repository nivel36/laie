<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui" xmlns:i18n="http://legion.com/i18n"
	template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['client.client']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="clients" />

	<ui:define name="content">
		<f:metadata>
			<f:viewParam name="id" value="#{clientViewBean.id}" />
			<f:viewAction action="#{clientViewBean.init}" />
		</f:metadata>

		<div class="ui-g">
			<div class="ui-g-12">
				<h:form id="form">
					<input type="hidden" id="clientId"
						value="#{clientViewBean.client.id}" />
					<p:panel styleClass="cyan" header="#{clientViewBean.client}">
						<div class="ui-g">
							<div class="ui-md-12 ui-lg-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['client.name']}" for="name" />
									<p:inputText id="name" value="#{clientViewBean.client.name}"
										readonly="#{!clientViewBean.editable}" required="true" />
								</div>
								<h:message for="name" errorClass="error" />
							</div>
							<div class="ui-md-12 ui-lg-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['client.cif']}" for="cif" />
									<p:inputText id="cif" value="#{clientViewBean.client.cif}"
										readonly="#{!clientViewBean.editable}" required="true" />
								</div>
								<h:message for="cif" errorClass="error" />
							</div>
							<div class="ui-md-12 ui-lg-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['client.city']}" for="city" />
									<p:inputText id="city"
										value="#{clientViewBean.client.address.city}"
										readonly="#{!clientViewBean.editable}" />
								</div>
								<h:message for="city" errorClass="error" />
							</div>
							<div class="ui-md-12 ui-lg-6 ui-xl-4">
								<div class="form-group">
									<p:outputLabel value="#{i18n['client.state']}" for="state" />
									<p:inputText id="state"
										value="#{clientViewBean.client.address.state}"
										readonly="#{!clientViewBean.editable}" />
								</div>
								<h:message for="state" errorClass="error" />
							</div>
						</div>

						<div class="ui-g">
							<div class="ui-g-12">
								<div class="push-right">
									<p:commandButton value="#{i18n['action.undelete']}"
										action="#{clientViewBean.undeleteClient}" immediate="true"
										rendered="#{clientViewBean.client.deleted}" />
									<p:commandButton value="#{i18n['action.save']}"
										action="#{clientViewBean.editClient}"
										rendered="#{not clientViewBean.client.deleted and clientViewBean.editable}" />
									<p:commandButton value="#{i18n['action.edit']}"
										action="#{clientViewBean.editClient}" immediate="true"
										rendered="#{not clientViewBean.client.deleted and not clientViewBean.editable}" />
									<p:commandButton value="#{i18n['bookmark.add_to_bookmarks']}"
										action="#{bookmarksBean.add(clientViewBean.client)}"
										immediate="true"
										rendered="#{(not bookmarksBean.isBookmarked(clientViewBean.client))	and (not clientViewBean.client.deleted)}"
										update="actionButtons :asideForm:bookmarks" />
									<p:commandButton
										value="#{i18n['bookmark.remove_from_bookmarks']}"
										action="#{bookmarksBean.remove(clientViewBean.client)}"
										immediate="true"
										rendered="#{bookmarksBean.isBookmarked(clientViewBean.client)}"
										update="actionButtons :asideForm:bookmarks" />
									<p:commandButton id="exportPdf" icon="fa fa-file-pdf-o"
										value="#{i18n['action.export']}" />
									<p:commandButton id="exportExcel" icon="fa fa-file-excel-o"
										value="#{i18n['action.export']}"
										action="#{clientViewBean.export}" />
								</div>
							</div>
						</div>
					</p:panel>
				</h:form>
			</div>
		</div>
		<div class="ui-g">
			<div class="ui-g-12">
				<p:panel styleClass="cyan" header="#{i18n['job.job_offers']}">
					<p:dataTable var="jobOffer"
						value="#{clientViewBean.jobOffers}"
						emptyMessage="#{i18n['client.no_job_offers_found']}" reflow="true"
						paginator="true" paginatorPosition="bottom"
						rows="#{sessionBean.rowsPerPage}">
						<p:column headerText="#{i18n['job.name']}">
							<h:outputText value="#{jobOffer.name}" />
						</p:column>
						<p:column headerText="#{i18n['job.date_closed']}">
							<h:outputText value="#{jobOffer.dateClosed}">
								<f:convertDateTime pattern="dd / MM / yyyy" />
							</h:outputText>
						</p:column>
						<p:column headerText="#{i18n['action.action']}">
							<h:link value="#{i18n['action.view']}"
								outcome="/faces/jobOffer/jobOfferView">
								<f:param name="id" value="#{jobOffer.id}" />
							</h:link>
						</p:column>
					</p:dataTable>
				</p:panel>
			</div>
		</div>
	</ui:define>
</ui:composition>
