<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['job.job_offer']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="offers" />

	<ui:define name="content">
		<h:form id="newForm">
			<h1 class="header">
				<i class="fa fa-industry" /> #{i18n['job.job_offers']}
			</h1>
			<h:panelGroup layout="block" styleClass="actionPanel">
				<h:commandButton value="#{i18n['action.new']}"
					action="#{jobOfferSearchBean.newJobOffer}" immediate="true" />
			</h:panelGroup>
		</h:form>
		
		<h:form id="form">
			<h:panelGroup layout="block" styleClass="panel">
				<h1>#{i18n['job.search']}</h1>
				<h:outputLabel value="#{i18n['job.name']}">
					<h:inputText id="name" value="#{jobOfferSearchBean.name}"
						label="#{i18n['job.name']}" />
				</h:outputLabel>

				<h:outputLabel value="#{i18n['job.client']}">
					<h:inputText id="clientName"
						value="#{jobOfferSearchBean.clientName}"
						label="#{i18n['job.client']}" />
				</h:outputLabel>

				<h:panelGroup layout="block" class="buttonGroup">
					<h:commandButton value="#{i18n['action.search']}"
						action="#{jobOfferSearchBean.search}" />
					<h:commandButton value="#{i18n['action.clean']}"
						action="#{jobOfferSearchBean.clean}" />
				</h:panelGroup>
			</h:panelGroup>

			<h:panelGroup layout="block" styleClass="panel" id="resultados">
				<h1>#{i18n['job.search_results']}</h1>

				<h:outputText value="#{i18n['job.no_jobs_found']}"
					rendered="#{empty jobOfferSearchBean.jobOfferPaginator.dataList}" />

				<h:dataTable var="jobOffer" id="jobOffer"
					value="#{jobOfferSearchBean.jobOfferPaginator.dataList}"
					rendered="#{not empty jobOfferSearchBean.jobOfferPaginator.dataList}"
					styleClass="dataTable">

					<h:column>
						<f:facet name="header">
							<h:outputText value="#{i18n['job.name']}" />
						</f:facet>
						<h:outputText value="#{jobOffer.name}" />
					</h:column>

					<h:column>
						<f:facet name="header">
							<h:outputText value="#{i18n['job.client']}" />
						</f:facet>
						<h:outputText value="#{jobOffer.client.name}" />
					</h:column>

					<h:column>
						<f:facet name="header">
							<h:outputText value="#{i18n['job.date_opened']}" />
						</f:facet>
						<h:outputText value="#{jobOffer.dateOpened}">
							<f:convertDateTime pattern="MM / yyyy" />
						</h:outputText>
					</h:column>

					<h:column>
						<f:facet name="header">
							<h:outputText value="#{i18n['job.date_closed']}" />
						</f:facet>
						<h:outputText value="#{jobOffer.dateClosed}">
							<f:convertDateTime pattern="MM / yyyy" />
						</h:outputText>
					</h:column>

					<h:column>
						<f:facet name="header">
							<h:outputText value="Action" />
						</f:facet>
						<h:link value="Ver" outcome="jobOfferView">
							<f:param name="id" value="#{jobOffer.id}" />
						</h:link>
						|
						<h:commandLink action="#{jobOfferSearchBean.edit(jobOffer)}"
							value="#{i18n['action.edit']}" />
						|
						<h:commandLink action="#{jobOfferSearchBean.remove(jobOffer)}"
							value="#{i18n['action.remove']}">
							<f:ajax execute="@form" render="@form" />
						</h:commandLink>
					</h:column>
				</h:dataTable>
				<h:panelGroup layout="block" styleClass="paginator" id="paginator"
					rendered="#{not empty jobOfferSearchBean.jobOfferPaginator.dataList}">
					<h:commandButton
						disabled="#{jobOfferSearchBean.jobOfferPaginator.currentPage eq 0}"
						value="#{i18n['paginator.first']}"
						action="#{jobOfferSearchBean.jobOfferPaginator.firstPage}">
						<f:ajax render=":form:resultados" />
					</h:commandButton>
					<h:commandButton
						disabled="#{jobOfferSearchBean.jobOfferPaginator.currentPage eq 0}"
						value="#{i18n['paginator.previous']}"
						action="#{jobOfferSearchBean.jobOfferPaginator.previousPage}">
						<f:ajax render=":form:resultados" />
					</h:commandButton>
					<ui:repeat value="#{jobOfferSearchBean.jobOfferPaginator.pages}"
						varStatus="page">
						<h:commandButton value="#{page.index+1}"
							action="#{jobOfferSearchBean.jobOfferPaginator.gotoPage(page.index)}"
							disabled="#{jobOfferSearchBean.jobOfferPaginator.currentPage eq page.index}">
							<f:ajax render=":form:resultados" />
						</h:commandButton>
					</ui:repeat>
					<h:commandButton value="#{i18n['paginator.next']}"
						disabled="#{jobOfferSearchBean.jobOfferPaginator.currentPage eq jobOfferSearchBean.jobOfferPaginator.pagesSize-1}"
						action="#{jobOfferSearchBean.jobOfferPaginator.nextPage}">
						<f:ajax render=":form:resultados" />
					</h:commandButton>
					<h:commandButton value="#{i18n['paginator.last']}"
						disabled="#{jobOfferSearchBean.jobOfferPaginator.currentPage eq jobOfferSearchBean.jobOfferPaginator.pagesSize-1}"
						action="#{jobOfferSearchBean.jobOfferPaginator.lastPage}">
						<f:ajax render=":form:resultados" />
					</h:commandButton>
					<h:outputLabel value="#{i18n['paginator.show']}">
						<h:selectOneMenu
							value="#{jobOfferSearchBean.jobOfferPaginator.rowsPerPage}">
							<f:selectItem itemValue="5" itemLabel="5" />
							<f:selectItem itemValue="10" itemLabel="10" />
							<f:selectItem itemValue="25" itemLabel="25" />
							<f:ajax
								listener="#{jobOfferSearchBean.jobOfferPaginator.rowsPerPageChange}"
								render=":form:resultados" execute=":form:paginator" />
						</h:selectOneMenu>
					</h:outputLabel>
				</h:panelGroup>
			</h:panelGroup>
		</h:form>
	</ui:define>
</ui:composition>
