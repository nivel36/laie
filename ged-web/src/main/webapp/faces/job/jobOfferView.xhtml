<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:i18n="http://legion.com/i18n"
	template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['job.job_offer']}</title>
	</ui:define>
	
	<ui:param name="selectedMenu" value="offers" />
	
	<ui:param name="id" value="#{jobOfferViewBean.jobOfferId}" />

	<ui:define name="content">
		<f:metadata>
			<f:viewParam name="id" value="#{jobOfferViewBean.jobOfferId}" />
			<f:viewAction action="#{jobOfferViewBean.init}" />
		</f:metadata>

		<h:form id="form">
			<h:graphicImage value="/resources/img/s.gif"
				styleClass="headerIcon candidateIcon" />

			<h1 class="header">#{jobOfferViewBean.jobOffer.name}</h1>

			<h:panelGroup layout="block" styleClass="panel">
				<h:outputLabel for="name" value="#{i18n['job.name']}"
					styleClass="very_large required">
					<h:inputText id="name" value="#{jobOfferViewBean.jobOffer.name}"
						label="#{i18n['job.name']}" required="true"
						styleClass="#{not component.valid ? 'inputError' : ''}" disabled="true" />
					<h:message for="name" errorClass="error" />
				</h:outputLabel>
				
				<h:outputLabel for="client" value="#{i18n['job.client']}"
					styleClass="required">
					<h:inputText id="client" value="#{jobOfferViewBean.jobOffer.client.name}"
						label="#{i18n['job.client']}" required="true"
						styleClass="#{not component.valid ? 'inputError' : ''}" disabled="true"/>
					<h:message for="client" errorClass="error" />
				</h:outputLabel>

				<h2>#{i18n['job.detail']}</h2>

				<h:outputLabel for="places" value="#{i18n['job.places']}"
					styleClass="small">
					<h:inputText id="places"
						value="#{jobOfferViewBean.jobOffer.places}"
						label="#{i18n['job.places']}"
						styleClass="#{not component.valid ? 'number inputError' : 'number'}" disabled="true"/>
					<h:message for="places" errorClass="error" />
				</h:outputLabel>

				<h:outputLabel for="dateOpened" value="#{i18n['job.date_opened']}"
					styleClass="small">
					<h:inputText id="dateOpened"
						value="#{jobOfferViewBean.jobOffer.dateOpened}"
						label="#{i18n['job.date_opened']}"
						styleClass="#{not component.valid ? 'inputError' : ''}" disabled="true">
						<f:convertDateTime pattern="MM / yyyy" />
					</h:inputText>
					<h:message for="dateOpened" errorClass="error" />
				</h:outputLabel>

				<h:outputLabel for="dateClosed" value="#{i18n['job.date_closed']}"
					styleClass="small required">
					<h:inputText id="dateClosed"
						value="#{jobOfferViewBean.jobOffer.dateClosed}"
						label="#{i18n['job.date_closed']}"
						styleClass="#{not component.valid ? 'inputError' : ''}"
						required="true" disabled="true">
						<f:convertDateTime pattern="MM / yyyy" />
					</h:inputText>
					<h:message for="dateClosed" errorClass="error" />
				</h:outputLabel>

				<h2>#{i18n['job.place']}</h2>

				<h:outputLabel for="city" value="#{i18n['address.city']}:">
					<h:inputText id="city" value="#{jobOfferViewBean.jobOffer.city}"
						label="#{i18n['address.city']}"
						styleClass="#{not component.valid ? 'inputError' : ''}" disabled="true"/>
					<h:message for="city" errorClass="error" />
				</h:outputLabel>

				<h:outputLabel for="state" value="#{i18n['address.state']}:">
					<h:inputText id="state" value="#{jobOfferViewBean.jobOffer.state}"
						label="#{i18n['address.state']}"
						styleClass="#{not component.valid ? 'inputError' : ''}" disabled="true"/>
					<h:message for="state" errorClass="error" />
				</h:outputLabel>

				<h:panelGroup layout="block" class="buttonGroup">
					<h:commandButton value="#{i18n['action.save']}"
						action="#{jobOfferViewBean.edit}" />
					<h:commandButton value="#{i18n['bookmark.add_to_bookmarks']}"
						action="#{favouritesBean.add(jobOfferViewBean.jobOffer)}"
						immediate="true"
						rendered="#{not favouritesBean.isBookmarked(jobOfferViewBean.jobOffer)}" />
					<h:commandButton value="#{i18n['bookmark.remove_from_bookmarks']}"
						action="#{favouritesBean.remove(jobOfferViewBean.jobOffer)}"
						immediate="true"
						rendered="#{favouritesBean.isBookmarked(jobOfferViewBean.jobOffer)}" />
				</h:panelGroup>
			</h:panelGroup>

			<h:panelGroup layout="block" styleClass="panel">
				<h1>#{i18n['candidate.candidates']}</h1>
				<h:outputText value="#{i18n['job_meeting.no_candidates']}"
					rendered="#{empty jobOfferViewBean.jobOffer.jobCandidatures}" />
				<h:panelGroup layout="block" styleClass="buttonGroup">
					<h:commandButton value="#{i18n['action.add']}"
						action="#{jobOfferViewBean.modify}" />
				</h:panelGroup>
			</h:panelGroup>

			<h:panelGroup layout="block" styleClass="panel">
				<h1>#{i18n['job_meeting.job_meetings']}</h1>

				<h:panelGroup layout="block" class=" half">
					<h2>#{i18n['job_meeting.conducted_job_meetings']}</h2>
					<h:outputText value="#{i18n['job_meeting.no_conducted']}"
						rendered="#{empty jobOfferViewBean.conductedJobMeetings}" />
				</h:panelGroup>

				<h:panelGroup layout="block" class=" half">
					<h2>#{i18n['job_meeting.planned_job_meetings']}</h2>
					<h:outputText value="#{i18n['job_meeting.no_planned']}"
						rendered="#{empty jobOfferViewBean.plannedJobMeetings}" />
				</h:panelGroup>
				<h:panelGroup layout="block" styleClass="buttonGroup">
					<h:commandButton value="#{i18n['action.create']}"
						action="#{jobOfferViewBean.modify}" />
				</h:panelGroup>
			</h:panelGroup>
		</h:form>
	</ui:define>

</ui:composition>
