<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:i18n="http://legion.com/i18n"
	template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['job.job_offer']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="offers" />

	<ui:param name="id" value="#{jobOfferViewBean.jobOfferId}" />

	<ui:define name="content">
		<f:metadata>
			<f:viewParam name="id" value="#{jobOfferViewBean.jobOfferId}" />
			<f:viewAction action="#{jobOfferViewBean.init}" />
		</f:metadata>

		<h:form id="form">
			<h1 class="header">
				<i class="fa fa-industry" /> #{jobOfferViewBean.jobOffer.name}
			</h1>

			<h:panelGroup layout="block" styleClass="panel">
				<h:panelGroup layout="block" styleClass="textBlock">
					<h:outputText styleClass="label" value="#{i18n['job.name']}:" />
					<h:outputText value="#{jobOfferViewBean.jobOffer.name}" />
				</h:panelGroup>

				<h:panelGroup layout="block" styleClass="textBlock">
					<h:outputText styleClass="label" value="#{i18n['job.client']}:" />
					<h:outputText value="#{jobOfferViewBean.jobOffer.client.name}" />
				</h:panelGroup>

				<h2>#{i18n['job.detail']}</h2>

				<h:panelGroup layout="block" styleClass="textBlock">
					<h:outputText styleClass="label" value="#{i18n['job.places']}:" />
					<h:outputText value="#{jobOfferEditBean.jobOffer.places}" />
				</h:panelGroup>

				<h:panelGroup layout="block" styleClass="textBlock">
					<h:outputText styleClass="label"
						value="#{i18n['job.date_opened']}:" />
					<h:outputText value="#{jobOfferViewBean.jobOffer.dateOpened}" />
				</h:panelGroup>

				<h:panelGroup layout="block" styleClass="textBlock">
					<h:outputText styleClass="label"
						value="#{i18n['job.date_closed']}:" />
					<h:outputText value="#{jobOfferViewBean.jobOffer.dateClosed}" />
				</h:panelGroup>

				<h:panelGroup layout="block" styleClass="textBlock">
					<h:outputText styleClass="label"
						value="#{i18n['job.description']}:" />
					<h:outputText value="#{jobOfferViewBean.jobOffer.description}" />
				</h:panelGroup>

				<h2>#{i18n['job.place']}</h2>

				<h:panelGroup layout="block" styleClass="textBlock">
					<h:outputText styleClass="label" value="#{i18n['address.city']}:" />
					<h:outputText value="#{jobOfferViewBean.jobOffer.city}" />
				</h:panelGroup>

				<h:panelGroup layout="block" styleClass="textBlock">
					<h:outputText styleClass="label" value="#{i18n['address.state']}:" />
					<h:outputText value="#{jobOfferViewBean.jobOffer.state}" />
				</h:panelGroup>

				<h:panelGroup layout="block" class="buttonGroup">
					<h:commandButton value="#{i18n['action.edit']}"
						action="#{jobOfferViewBean.edit}" rendered="jobOfferViewBean.canEdit"/>
					<h:commandButton value="#{i18n['bookmark.add_to_bookmarks']}"
						action="#{bookmarksBean.add(jobOfferViewBean.jobOffer)}"
						immediate="true"
						rendered="#{not bookmarksBean.isBookmarked(jobOfferViewBean.jobOffer)}" />
					<h:commandButton value="#{i18n['bookmark.remove_from_bookmarks']}"
						action="#{bookmarksBean.remove(jobOfferViewBean.jobOffer)}"
						immediate="true"
						rendered="#{bookmarksBean.isBookmarked(jobOfferViewBean.jobOffer)}" />
				</h:panelGroup>
			</h:panelGroup>

			<h:panelGroup layout="block" styleClass="panel">
				<h1>#{i18n['candidate.candidates']}</h1>
				<h:outputText value="#{i18n['job_meeting.no_candidates']}"
					rendered="#{empty jobOfferViewBean.jobOffer.jobCandidatures}" />
				<h:panelGroup layout="block" styleClass="buttonGroup">
					<h:commandButton value="#{i18n['action.add']}"
						action="#{jobOfferViewBean.edit}" />
				</h:panelGroup>
			</h:panelGroup>

			<h:panelGroup layout="block" styleClass="panel">
				<h1>#{i18n['job_meeting.job_meetings']}</h1>

				<h:panelGroup layout="block" class=" half">
					<h2>#{i18n['job_meeting.conducted_job_meetings']}</h2>
					<h:outputText value="#{i18n['job_meeting.no_conducted']}"
						rendered="#{empty jobOfferViewBean.conductedJobMeetings}" />
				</h:panelGroup>

				<h:panelGroup layout="block" class=" half">
					<h2>#{i18n['job_meeting.planned_job_meetings']}</h2>
					<h:outputText value="#{i18n['job_meeting.no_planned']}"
						rendered="#{empty jobOfferViewBean.plannedJobMeetings}" />
				</h:panelGroup>
				<h:panelGroup layout="block" styleClass="buttonGroup">
					<h:commandButton value="#{i18n['action.create']}"
						action="#{jobOfferViewBean.edit}" />
				</h:panelGroup>
			</h:panelGroup>
		</h:form>
	</ui:define>

</ui:composition>
