<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html" xmlns:i18n="http://legion.com/i18n"
	 template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>Ged</title>
	</ui:define>

	<ui:param name="selectedMenu" value="index" />

	<ui:define name="content">

		<f:metadata>
			<f:viewParam name="text" value="#{globalSearchBean.text}" />
			<f:viewAction action="#{globalSearchBean.search}" />
		</f:metadata>

		<h1 class="header">
			<i class="fa fa-search" /> #{i18n['job.search_results']}
		</h1>

		<h:panelGroup layout="block" styleClass="panel" id="userResults"
			rendered="#{not empty globalSearchBean.userPaginator.entities}">
			<h:form id="userSearchForm">
				<h1>#{i18n['user.users']}</h1>

				<h:dataTable id="user" var="user" value="#{globalSearchBean.userPaginator.entities}" styleClass="dataTable">
					<h:column>
						<f:facet name="header">
							<h:outputText value="#{i18n['user.name']}" />
						</f:facet>
						<h:outputText value="#{user.fullName}" />
					</h:column>

					<h:column>
						<f:facet name="header">
							<h:outputText value="#{i18n['user.username']}" />
						</f:facet>
						<h:outputText value="#{user.username}" />
					</h:column>

					<h:column>
						<f:facet name="header">
							<h:outputText value="#{i18n['user.email']}" />
						</f:facet>
						<h:outputText value="#{user.email}" />
					</h:column>

					<h:column>
						<f:facet name="header">
							<h:outputText value="#{i18n['user.role']}" />
						</f:facet>
						<h:outputText value="#{i18n:translate(user.role.name)}" />
					</h:column>
					<h:column>
						<f:facet name="header">
							<h:outputText value="Action" />
						</f:facet>
						<h:link value="#{i18n['action.view']}" outcome="/faces/user/userView">
							<f:param name="id" value="#{user.id}" />
						</h:link>
					</h:column>
				</h:dataTable>
			</h:form>
		</h:panelGroup>

		<h:panelGroup layout="block" styleClass="panel" id="jobOfferResults"
			rendered="#{not empty globalSearchBean.jobOfferPaginator.entities}">
			<h:form id="jobOfferForm">
				<h1>#{i18n['job.job_offers']}</h1>

				<h:dataTable var="jobOffer" id="jobOffer" value="#{globalSearchBean.jobOfferPaginator.dataList}"
					rendered="#{not empty globalSearchBean.jobOfferPaginator.dataList}" styleClass="dataTable">

					<h:column>
						<f:facet name="header">
							<h:outputText value="#{i18n['job.name']}" />
						</f:facet>
						<h:outputText value="#{jobOffer.name}" />
					</h:column>

					<h:column>
						<f:facet name="header">
							<h:outputText value="#{i18n['job.client']}" />
						</f:facet>
						<h:outputText value="#{jobOffer.client.name}" />
					</h:column>

					<h:column>
						<f:facet name="header">
							<h:outputText value="#{i18n['job.date_opened']}" />
						</f:facet>
						<h:outputText value="#{jobOffer.dateOpened}">
							<f:convertDateTime pattern="MM / yyyy" />
						</h:outputText>
					</h:column>

					<h:column>
						<f:facet name="header">
							<h:outputText value="#{i18n['job.date_closed']}" />
						</f:facet>
						<h:outputText value="#{jobOffer.dateClosed}">
							<f:convertDateTime pattern="MM / yyyy" />
						</h:outputText>
					</h:column>

					<h:column>
						<f:facet name="header">
							<h:outputText value="#{i18n['user.owner']}" />
						</f:facet>
						<h:outputText value="#{jobOffer.owner}" />
					</h:column>

					<h:column>
						<f:facet name="header">
							<h:outputText value="Action" />
						</f:facet>
						<h:link value="Ver" outcome="/faces/jobOffer/jobOfferView">
							<f:param name="id" value="#{jobOffer.id}" />
						</h:link>
					</h:column>
				</h:dataTable>
			</h:form>
		</h:panelGroup>
	</ui:define>
</ui:composition>
