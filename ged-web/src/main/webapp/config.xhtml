<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:composite="http://xmlns.jcp.org/jsf/composite"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" xmlns:o="http://omnifaces.org/ui" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['config.config']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="config" />

	<ui:define name="breadcrumb">
		<p:breadCrumb styleClass="breadcrumb">
			<p:menuitem value="#{i18n['menu.index']}" outcome="#{Page.INDEX.getUrl()}" />
			<p:menuitem value="#{i18n['config.config']}" disabled="true" />
		</p:breadCrumb>
	</ui:define>

	<ui:define name="content">
		<div class="grid">
			<div class="col-12 lg-9">
				<h:form enctype="multipart/form-data">
					<div class="panel">
						<div class="panel-aside">
							<div class="candidate-metadata">
								<cc:inputAvatar id="user-image" value="#{configView.user.imageFileName}" fileUploadListener="#{configView.uploadImage}"
									allowCamera="true" captureListener="#{configView.captureImage}" />
							</div>
						</div>
						<div class="panel-content panel-content-data">
							<div class="grid">
								<div class="col-12 sm-6">
									<h3>#{i18n['config.personal_information']}</h3>
									<cc:input label="#{i18n['config.name']}" id="name" value="#{configView.user.name}" required="true" />
									<cc:input label="#{i18n['config.surname']}" id="surname" value="#{configView.user.surname}" required="true" />
									<cc:input label="#{i18n['config.email']}" id="email" value="#{configView.user.email}" required="true" />
								</div>
								<div class="col-12 md-6">
									<h3>#{i18n['config.config_data']}</h3>
									<cc:inputSelect label="#{i18n['config.rows_per_page']}" value="#{configView.user.rowsPerPage}">
										<f:selectItem itemValue="5" itemLabel="5" />
										<f:selectItem itemValue="10" itemLabel="10" />
										<f:selectItem itemValue="25" itemLabel="25" />
									</cc:inputSelect>
									<cc:inputSelect label="#{i18n['config.language']}" value="#{configView.user.language}" styleClass="locales">
										<f:selectItems var="locale" value="#{applicationView.locales}" itemValue="#{locale.language}"
											itemLabel="#{locale.displayLanguage}" />
										<f:ajax event="change" render="@all" listener="#{configView.changeLocale}" />
									</cc:inputSelect>
								</div>
							</div>
						</div>
						<div class="panel-footer">
							<div class="panel-buttons">
								<p:commandButton value="#{i18n['config.change_password']}" process="@this" action="#{Page.CHANGE_PASSWORD.getUrl()}" />
								<p:commandButton value="#{i18n['action.save']}" action="#{configView.save}" process="@form" update="@form growl" />
							</div>
						</div>
					</div>
				</h:form>
			</div>
		</div>
	</ui:define>
</ui:composition>
