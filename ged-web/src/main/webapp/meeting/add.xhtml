<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:g="http://ged.org/ui" xmlns:h="http://java.sun.com/jsf/html" xmlns:o="http://omnifaces.org/ui"
	xmlns:p="http://primefaces.org/ui" xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://java.sun.com/jsf/facelets" template="/WEB-INF/templates/template.xhtml">

	<ui:define name="title">
		#{i18n['calendar.calendar']}
	</ui:define>

	<ui:param name="selectedMenu" value="meeting" />

	<ui:define name="breadcrumb">
		<p:breadCrumb>
			<p:menuitem value="#{i18n['menu.index']}" outcome="#{Page.INDEX.getUrl()}" />
			<p:menuitem value="#{i18n['meeting.meetings']}" outcome="#{Page.MEETING_SEARCH.getUrl()}" />
			<p:menuitem value="#{i18n['meeting.add_meeting']}" disabled="true" />
		</p:breadCrumb>
	</ui:define>

	<ui:define name="buttons">
		<h:form>
			<p:button value="#{i18n['action.cancel']}" outcome="#{Page.MEETING_SEARCH.getUrl()}"
				styleClass="ui-button-secondary ui-button-outlined" />
			<p:commandButton value="#{i18n['action.save']}" onclick="processForm()"
				styleClass="ui-button-success ui-button-outlined" />
		</h:form>
	</ui:define>

	<ui:define name="content">
		<h:form id="meetingForm">
			<p:remoteCommand name="processForm" process="@form" update="@form growl" action="#{addMeetingView.save}" />
			<div class="p-grid">
				<div class="p-col-12 p-md-7">
					<div class="card card-w-title ui-fluid">
						<h5>#{i18n['meeting.header.details']}</h5>
						<div class="p-grid p-formgrid">
							<div class="p-col-12">
								<g:input label="#{i18n['meeting.title']}" value="#{addMeetingView.meeting.title}" />
							</div>
							<div class="p-col-12 p-xl-4">
								<g:input id="datePlanned" label="#{i18n['meeting.date_planned']}" value="#{addMeetingView.meetingDate}"
									required="true" type="calendar" />
							</div>
							<div class="p-col-12 p-xl-4">
								<g:input label="#{i18n['meeting.hour_planned']}" value="#{addMeetingView.meetingHour}" required="true"
									type="selectOneMenu">
									<f:selectItems value="#{addMeetingView.hours}" var="meetingHour" itemValue="#{meetingHour}"
										itemLabel="#{meetingHour}" />
								</g:input>
							</div>
							<div class="p-col-12 p-xl-4">
								<g:input label="#{i18n['meeting.duration']}" value="#{addMeetingView.meetingDuration}" required="true"
									type="selectOneMenu">
									<f:selectItems value="#{addMeetingView.durations}" var="meetingDuration" itemLabel="#{meetingDuration}"/>
								</g:input>
							</div>
							<div class="p-col-12 p-xl-6">
								<g:input label="#{i18n['meeting.location']}" value="#{addMeetingView.meeting.location}" />
							</div>
							<div class="p-col-12 p-xl-6">
								<g:input label="#{i18n['meeting.type']}" value="#{addMeetingView.meeting.meetingType}" type="selectOneMenu">
									<f:selectItem />
									<f:selectItems value="#{addMeetingView.meetingTypes}" var="meetingType" itemValue="#{meetingType}"
										itemLabel="#{i18n[meetingType]}" />
								</g:input>
							</div>

						</div>
					</div>
				</div>
				<div class="p-col-12 p-md-5">
					<div class="card card-w-title ui-fluid">
						<h5>#{i18n['meeting.header.attendees']}</h5>
						<div class="p-grid p-formgrid">
							<div class="p-col-12">
								<div class="ui-inputgroup">
									<p:autoComplete id="input" value="#{addMeetingView.attendee}" inputStyleClass="input autocomplete"
										completeMethod="#{addMeetingView.searchPerson}" forceSelection="true" minQueryLength="3" var="person"
										itemValue="#{person}" itemLabel="#{person}" converter="personConverter">
										<p:column styleClass="select-person">
											<cc:person value="#{person}" />
										</p:column>
										<p:ajax event="itemSelect" listener="#{addMeetingView.addAttendee}" update="@this meetingForm:attendees" />
									</p:autoComplete>
									<h:panelGroup layout="block" styleClass="ui-inputgroup-addon">
										<em class="fa fa-search" aria-hidden="true" />
									</h:panelGroup>
								</div>
							</div>
							<div class="p-col-12">
								<h:panelGroup layout="block" id="attendees" styleClass="attendees">
									<ui:repeat var="person" value="#{addMeetingView.attendees}" varStatus="varStatus">
										<h:panelGroup layout="block" id="attendee" styleClass="attendee">
											<cc:person value="#{person}" styleClass="small" />
											<p:commandButton icon="fa fa-times" styleClass="ui-button-outlined"
												action="#{addMeetingView.removeAttendee(person)}" process="@this" update="meetingForm:attendees" />
										</h:panelGroup>
									</ui:repeat>
								</h:panelGroup>
							</div>
						</div>
					</div>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
