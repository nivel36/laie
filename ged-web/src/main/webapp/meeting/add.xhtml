<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui"
	xmlns:composite="http://xmlns.jcp.org/jsf/composite" xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:o="http://omnifaces.org/ui" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['calendar.calendar']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="calendar" />

	<ui:define name="breadcrumb">
		<p:breadCrumb styleClass="breadcrumb">
			<p:menuitem value="#{i18n['menu.index']}" outcome="#{Page.INDEX.getUrl()}" />
			<p:menuitem value="#{i18n['meeting.meetings']}" outcome="#{Page.MEETING_SEARCH.getUrl()}" />
			<p:menuitem value="#{i18n['meeting.add_meeting']}" disabled="true" />
		</p:breadCrumb>
	</ui:define>

	<ui:define name="content">
		<h:form id="meetingForm">
			<div class="panel">
				<div class="panel-content panel-content-data">
					<div class="grid">
						<div class="col-12 lg-7">
							<h4>#{i18n['meeting.header.details']}</h4>
							<cc:calendar label="#{i18n['meeting.date_planned']}" value="#{addMeetingView.meetingDate}" required="true" />

							<cc:inputSelect label="#{i18n['meeting.hour_planned']}" value="#{addMeetingView.meetingHour}" required="true">
								<f:selectItems value="#{addMeetingView.hours}" var="meetingHour" itemValue="#{meetingHour}"
									itemLabel="#{meetingHour}" />
							</cc:inputSelect>

							<cc:inputSelect label="#{i18n['meeting.type']}" value="#{addMeetingView.meeting.meetingType}">
								<f:selectItem />
								<f:selectItems value="#{addMeetingView.meetingTypes}" var="meetingType" itemValue="#{meetingType}"
									itemLabel="#{i18n[meetingType]}" />
							</cc:inputSelect>

							<cc:inputText label="#{i18n['meeting.location']}" value="#{addMeetingView.meeting.location}" />

							<cc:richText label="#{i18n['meeting.description']}" value="#{addMeetingView.meeting.description}" />
						</div>
						<div class="col-12 lg-5">
							<h4>#{i18n['meeting.header.attendees']}</h4>
							<h:panelGroup id="attendeesWrapper" layout="block">
								<cc:inputPerson id="person" value="#{addMeetingView.attendee}" completeMethod="#{addMeetingView.searchPerson}">
									<p:ajax event="selectPerson" listener="#{addMeetingView.addAttendee}" update="meetingForm:attendeesWrapper" />
								</cc:inputPerson>
								<h:panelGroup layout="block" id="attendees">
									<ui:repeat var="person" value="#{addMeetingView.attendees}" varStatus="varStatus">
										<h:panelGroup layout="block" id="attendee" styleClass="attendee">
											<cc:person value="#{person}" styleClass="small" />
											<p:commandButton icon="fa fa-times" styleClass="remove-attendee"
												action="#{addMeetingView.removeAttendee(person)}" process="@this" update="meetingForm:attendees" />
										</h:panelGroup>
									</ui:repeat>
								</h:panelGroup>
							</h:panelGroup>
						</div>
					</div>
				</div>
				<div class="panel-footer">
					<div class="panel-buttons">
						<p:button value="#{i18n['action.cancel']}" outcome="#{Page.MEETING_SEARCH.getUrl()}" styleClass="btn-gray" />
						<p:commandButton value="#{i18n['action.save']}" action="#{addMeetingView.save}" process="@form" update="@form" />
					</div>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
