<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui"
	xmlns:composite="http://xmlns.jcp.org/jsf/composite" xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:o="http://omnifaces.org/ui" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['calendar.calendar']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="calendar" />

	<ui:define name="breadcrumb">
		<p:breadCrumb styleClass="breadcrumb">
			<p:menuitem value="#{i18n['menu.index']}" outcome="#{Page.INDEX.getUrl()}" />
			<p:menuitem value="#{i18n['meeting.job_meetings']}" outcome="#{Page.MEETING.getUrl()}" />
			<p:menuitem value="#{i18n['meeting.add_job_meeting']}" disabled="true" />
		</p:breadCrumb>
	</ui:define>

	<ui:define name="content">
		<h:form>
			<div class="panel">
				<div class="panel-content panel-content-data">
					<cc:calendar label="#{i18n['meeting.date_planned']}" value="#{addMeetingView.meeting.datePlanned}" />
					<cc:inputText label="#{i18n['meeting.type']}" value="#{addMeetingView.meeting.type}"/>
					<cc:inputText label="#{i18n['meeting.location']}" value="#{addMeetingView.meeting.location}"/>
					<cc:inputText label="#{i18n['meeting.attendees']}" value="#{addMeetingView.meeting.attendees}" />
					<cc:richText label="#{i18n['meeting.description']}" value="#{addMeetingView.meeting.description}" />
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
