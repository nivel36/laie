<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" xmlns:f="http://java.sun.com/jsf/core" xmlns:g="http://ged.org/ui"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" xmlns:ui="http://java.sun.com/jsf/facelets" template="/WEB-INF/templates/template.xhtml">

	<ui:define name="title">
		#{i18n['job.job_offer_states']}
	</ui:define>

	<ui:param name="selectedMenu" value="maintenances" />

	<ui:define name="breadcrumb">
		<p:breadCrumb>
			<p:menuitem value="#{i18n['menu.index']}" outcome="#{Page.INDEX.getUrl()}" />
			<p:menuitem value="#{i18n['maintenance.maintenances']}" outcome="#{Page.MAINTENANCE.getUrl()}" />
			<p:menuitem value="#{i18n['maintenance.reports']}" disabled="true" />
		</p:breadCrumb>
	</ui:define>

	<ui:define name="content">
		<div class="p-grid">
			<div class="card card-w-title">
					<h1>#{i18n['maintenance.reports']}</h1>
					<ul>
						<ui:repeat var="item" value="#{isabelView.reportsList}" varStatus="status">
							<li>#{item.id} - #{item.name}</li>
						</ui:repeat>
					</ul>
					<h:form>
						<p:pickList value="#{isabelView.model}" var="item" converter="exportViewConverter" itemLabel="#{item.label}" itemValue="#{item}"
							showTargetControls="true" update="@form growl" />
						<div class="buttons">
							<p:commandButton value="Guardar" action="#{isabelView.save}" process="@form" update="@form growl" />
						</div>
					</h:form>
				</div>
		</div>
	</ui:define>
</ui:composition>
