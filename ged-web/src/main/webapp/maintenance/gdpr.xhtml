<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:g="http://ged.org/ui"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	template="/WEB-INF/templates/template.xhtml">

	<ui:define name="title">
		#{i18n['job_candidature.job_candidature_states']}
	</ui:define>

	<ui:param name="selectedMenu" value="maintenances" />

	<ui:define name="breadcrumb">
		<p:breadCrumb>
			<p:menuitem value="#{i18n['menu.index']}" outcome="#{Page.INDEX.getUrl()}" />
			<p:menuitem value="#{i18n['maintenance.maintenances']}" outcome="#{Page.MAINTENANCE.getUrl()}" />
			<p:menuitem value="#{i18n['maintenance.gdpr']}" disabled="true" />
		</p:breadCrumb>
	</ui:define>

	<ui:define name="buttons">
		<h:form enctype="multipart/form-data">
			<p:button value="#{i18n['action.cancel']}" outcome="#{Page.MAINTENANCE.getUrl()}" styleClass="secondary-button" />
			<p:commandButton value="#{i18n['action.export']}" action="#{gdprMaintenanceView.export}" icon="fa fa-file-excel-o" ajax="false" />
			<p:commandButton value="#{i18n['action.save']}" onclick="save()" styleClass="success-btn" />
		</h:form>
	</ui:define>

	<ui:define name="content">
		<h:form id="gdprForm">
			<p:remoteCommand name="save" process="@form" update="@form growl" action="#{gdprMaintenanceView.save}" />
			<div class="p-grid">
				<div class="p-col-12">
					<div class="card card-w-title ui-fluid">
						<h1>#{i18n['maintenance.gdpr']}</h1>
						<div class="p-grid">
							<div class="p-col-12 p-lg-5">
								<g:input id="title" label="#{i18n['document.title']}" value="#{gdprMaintenanceView.document.title}" />
							</div>
							<div class="p-col-12 p-lg-2">
								<g:input id="language" label="#{i18n['document.language']}" value="#{gdprMaintenanceView.language}" type="selectOneMenu">
									<f:selectItems var="language" value="#{applicationView.languages}" itemValue="#{language}" itemLabel="#{language.getCode}" />
									<p:ajax event="change" process="@this" update="@form" listener="#{gdprMaintenanceView.searchDocument}"/>
								</g:input>
							</div>
							<div class="p-col-12">
								<g:input id="text" label="#{i18n['document.text']}" value="#{gdprMaintenanceView.document.text}" type="rich" styleClass="document"/>
							</div>
						</div>
					</div>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
