<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" 
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core" 
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" 
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:g="http://ged.org/ui" 
	xmlns:h="http://java.sun.com/jsf/html" 
	xmlns:o="http://omnifaces.org/ui"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['client.clients']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="clients" />

	<ui:define name="actions">
		<p:button value="#{i18n['client.new_client']}" outcome="#{Page.CLIENT_ADD.getUrl()}" />
	</ui:define>

	<ui:define name="breadcrumb">
		<p:breadCrumb styleClass="breadcrumb">
			<p:menuitem value="#{i18n['menu.index']}" outcome="#{Page.INDEX.getUrl()}" />
			<p:menuitem value="#{i18n['client.clients']}" disabled="true" />
		</p:breadCrumb>
	</ui:define>

	<ui:define name="content">
		<h:form id="clientSearchForm">
			<p:panel>
				<div class="panel-content-data">
					<div class="search-bar">
						<cc:inputSearch searchText="#{searchClientView.searchText}" searchAction="#{searchClientView.search}" update="@form" />
					</div>
					<div class="panel-buttons">
						<p:commandButton value="#{i18n['action.export']}" action="#{searchClientView.export}" process="@this"
							icon="fa-file-excel-o" />
					</div>
				</div>

				<p:dataTable var="client" id="clients" value="#{searchClientView.clients}"
					emptyMessage="#{i18n['client.no_clients_found']}" reflow="true" paginator="true" paginatorPosition="bottom"
					rows="#{sessionUser.rowsPerPage}" sortBy="#{client.name}" sortOrder="descending" lazy="true">

					<p:column headerText="#{i18n['client.name']}" sortBy="#{client.name}">
						<h:link value="#{client.name}" outcome="#{Page.CLIENT.getUrl()}">
							<f:param name="id" value="#{client.id}" />
						</h:link>
					</p:column>

					<p:column headerText="#{i18n['client.phone_number']}">
						<h:outputText value="#{client.phoneNumber}" />
					</p:column>

					<p:column headerText="#{i18n['client.cif']}">
						<h:outputText value="#{client.cif}" />
					</p:column>

					<p:column headerText="#{i18n['client.city']}" sortBy="#{client.address.city}">
						<h:outputText value="#{client.address.city} " /> <h:panelGroup rendered="#{not empty client.address.state}">(<h:outputText value="#{client.address.state}" />)</h:panelGroup>
					</p:column>

					<p:column headerText="#{i18n['client.owner']}" sortBy="#{client.owner.name}">
						<h:link value="#{client.owner.fullName}" outcome="#{Page.USER_SEARCH.getUrl()}">
							<f:param name="id" value="#{client.owner.id}" />
						</h:link>
					</p:column>
				</p:dataTable>
			</p:panel>
		</h:form>
	</ui:define>
</ui:composition>
