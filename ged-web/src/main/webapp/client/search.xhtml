<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:i18n="http://ged.com/i18n" xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:p="http://primefaces.org/ui" xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" xmlns:o="http://omnifaces.org/ui"
	xmlns:of="http://omnifaces.org/functions" template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['client.clients']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="clients" />
	
	<ui:define name="actions">
		<p:button value="#{i18n['action.new']}" outcome="#{Page.CLIENT_ADD.getUrl()}" />
	</ui:define>

	<ui:define name="breadcrumb">
		<p:breadCrumb styleClass="breadcrumb">
			<p:menuitem value="#{i18n['menu.index']}" outcome="#{Page.INDEX.getUrl()}" />
			<p:menuitem value="#{i18n['client.clients']}" disabled="true" />
		</p:breadCrumb>
	</ui:define>

	<ui:define name="content">
		<h:form id="clientSearchForm">
			<div class="panel">
				<div class="panel-content">
					<div class="panel-content-data">
						<cc:inputSearch searchText="#{searchClientView.searchText}" searchAction="#{searchClientView.search}" update="@form" />
						<div class="panel-buttons">
							<p:commandButton value="#{i18n['action.export']}" action="#{searchClientView.export}" process="@this" icon="fa-file-excel-o"
								rendered="#{not empty searchClientView.clients}" />
						</div>
					</div>

					<p:dataTable var="client" id="clients" value="#{searchClientView.clients}" emptyMessage="#{i18n['client.no_clients_found']}"
						reflow="true" paginator="true" paginatorPosition="bottom" rows="#{sessionUser.rowsPerPage}" sortBy="#{client.name}"
						sortOrder="descending" lazy="true">

						<p:column headerText="#{i18n['client.name']}" sortBy="#{client.name}">
							<h:link value="#{client.name}" outcome="#{Page.CLIENT.getUrl()}">
								<f:param name="id" value="#{client.id}" />
							</h:link>
						</p:column>

						<p:column headerText="#{i18n['client.phone_number']}" sortBy="#{client.phoneNumber}">
							<h:outputText value="#{client.phoneNumber}" />
						</p:column>

						<p:column headerText="#{i18n['client.cif']}" sortBy="#{client.cif}">
							<h:outputText value="#{client.cif}" />
						</p:column>

						<p:column headerText="#{i18n['client.city']}" sortBy="#{client.address.city}">
							<h:outputText value="#{client.address.city}" />
						</p:column>

						<p:column headerText="#{i18n['client.state']}" sortBy="#{client.address.state}">
							<h:outputText value="#{client.address.state}" />
						</p:column>

						<p:column headerText="#{i18n['client.owner']}" sortBy="#{client.owner.fullName}">
							<h:link value="#{client.owner.fullName}" outcome="#{Page.USER_SEARCH.getUrl()}">
								<f:param name="id" value="#{client.owner.id}" />
							</h:link>
						</p:column>
					</p:dataTable>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
