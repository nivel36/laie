<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui"
	xmlns:i18n="http://ged.com/i18n" xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	template="/WEB-INF/templates/dialog.xhtml">

	<ui:define name="title">
		<title>#{i18n['client.select']}</title>
	</ui:define>

	<ui:define name="content">
		<h:form id="clientsSearchForm">
			<div class="panel">
				<div class="panel-content">
					<div class="panel-content-data">
						<cc:inputSearch searchText="#{selectClientBean.searchText}" searchAction="#{selectClientBean.search}"
							update="@form" />
					</div>
					<p:dataTable var="client" id="clients" value="#{selectClientBean.clients}"
						emptyMessage="#{i18n['client.no_clients_found']}" reflow="true" paginator="true" paginatorPosition="bottom"
						rows="#{sessionUser.rowsPerPage}" selectionMode="single" selection="#{selectClientBean.selectedClient}"
						rowKey="#{client.id}" sortBy="#{client.name}" sortOrder="ascending">

						<p:ajax event="rowSelect" listener="#{selectClientBean.onClientSelect}" update="@form" resetValues="true" />

						<p:column headerText="#{i18n['client.name']}" sortBy="#{client.name}">
							<h:outputText value="#{client.name}" />
						</p:column>

						<p:column headerText="#{i18n['client.phone_number']}" sortBy="#{client.phoneNumber}">
							<h:outputText value="#{client.phoneNumber}" />
						</p:column>

						<p:column headerText="#{i18n['client.cif']}" sortBy="#{client.cif}">
							<h:outputText value="#{client.cif}" />
						</p:column>

						<p:column headerText="#{i18n['client.city']}" sortBy="#{client.address.city}">
							<h:outputText value="#{client.address.city}" />
						</p:column>

						<p:column headerText="#{i18n['client.state']}" sortBy="#{client.address.state}">
							<h:outputText value="#{client.address.state}" />
						</p:column>

						<p:column headerText="#{i18n['client.owner']}" sortBy="#{client.owner.fullName}">
							<h:outputText value="#{client.owner.fullName}" />
						</p:column>
					</p:dataTable>

					<div class="panel-footer">
						<div class="panel-buttons">
							<p:commandButton value="#{i18n['action.cancel']}" action="#{selectClientBean.cancel}" process="@this"
								styleClass="btn-gray" />
						</div>
					</div>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
