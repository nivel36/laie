<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core" xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:g="http://ged.org/ui" xmlns:h="http://java.sun.com/jsf/html" xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" xmlns:ui="http://java.sun.com/jsf/facelets" template="/WEB-INF/templates/template.xhtml">

	<ui:define name="title">
		#{i18n['client.new_client']}
	</ui:define>

	<ui:param name="selectedMenu" value="clients" />

	<ui:define name="breadcrumb">
		<p:breadCrumb>
			<p:menuitem value="#{i18n['menu.index']}" outcome="#{Page.INDEX.getUrl()}" />
			<p:menuitem value="#{i18n['client.clients']}" outcome="#{Page.CLIENT_SEARCH.getUrl()}" />
			<p:menuitem value="#{i18n['client.new_client']}" disabled="true" />
		</p:breadCrumb>
	</ui:define>

	<ui:define name="buttons">
		<h:form>
			<p:button value="#{i18n['action.cancel']}" outcome="#{Page.CLIENT_SEARCH.getUrl()}" styleClass="secondary-button" />
			<p:commandButton value="#{i18n['action.save']}" onclick="processForm()" styleClass="success-btn" />
		</h:form>
	</ui:define>

	<ui:define name="content">
		<div class="p-grid">
			<div class="p-col-12 p-xl-6">
				<h:form id="clientForm">
					<p:remoteCommand name="processForm" process="@form" update="@form growl" action="#{addClientView.save}" />
					<h:panelGroup id="client" styleClass="card card-w-title ui-fluid" layout="block">
						<h1>#{i18n['client.client']}</h1>
						<div class="p-grid">
							<div class="p-col-12">
								<g:input id="name" label="#{i18n['client.name']}" value="#{addClientView.client.name}" required="true" />
							</div>
							<div class="p-col-12 p-sm-6">
								<g:input id="cif" label="#{i18n['client.cif']}" value="#{addClientView.client.cif}" />
							</div>
							<div class="p-col-12 p-sm-6">
								<g:input id="phoneNumber" label="#{i18n['client.phone_number']}" value="#{addClientView.client.phoneNumber}" />
							</div>
							<div class="p-col-12 p-sm-6">
								<g:input id="city" label="#{i18n['client.city']}" value="#{addClientView.client.address.city}" />
							</div>
							<div class="p-col-12 p-sm-6">
								<g:input id="state" label="#{i18n['client.state']}" value="#{addClientView.client.address.region}" />
							</div>
						</div>
					</h:panelGroup>
				</h:form>
			</div>
			<div class="p-col-12">
				<h:form id="contactForm">
					<div class="card card-w-title ui-fluid">
						<h1>#{i18n['contact.contacts']}</h1>
						<h:panelGroup id="contact" styleClass="p-grid" layout="block">
							<div class="p-col-12 p-sm-2">
								<g:input id="contact_name" label="#{i18n['contact.name']}" value="#{addClientView.contact.name}" />
							</div>
							<div class="p-col-12 p-sm-2">
								<g:input id="contact_surname" label="#{i18n['contact.surname']}" value="#{addClientView.contact.surname}" />
							</div>
							<div class="p-col-12 p-sm-3">
								<g:input id="contact_email" label="#{i18n['contact.email']}" value="#{addClientView.contact.email}" />
							</div>
							<div class="p-col-12 p-sm-2">
								<g:input id="contact_phoneNumber" label="#{i18n['contact.phone_number']}" value="#{addClientView.contact.phoneNumber}" />
							</div>
							<div class="p-col-12 p-sm-2">
								<g:input id="contact_position" label="#{i18n['contact.position']}" value="#{addClientView.contact.position}" />
							</div>
							<div class="p-col-12 p-sm-1">
								<div class="field-btn">
									<p:commandButton icon="fa fa-plus" action="#{addClientView.addContact}" process="@form" update="@form" styleClass="success-btn" />
								</div>
							</div>
						</h:panelGroup>
						<h:panelGroup id="contacts" styleClass="p-grid" layout="block">
							<ui:repeat value="#{addClientView.client.contacts}" var="contact">
								<div class="p-col-12 p-sm-2">
									<g:input id="contact_name" value="#{contact.name}" />
								</div>
								<div class="p-col-12 p-sm-2">
									<g:input id="contact_surname" value="#{contact.surname}" />
								</div>
								<div class="p-col-12 p-sm-3">
									<g:input id="contact_email" value="#{contact.email}" />
								</div>
								<div class="p-col-12 p-sm-2">
									<g:input id="contact_phoneNumber" value="#{contact.phoneNumber}" />
								</div>
								<div class="p-col-12 p-sm-2">
									<g:input id="contact_position" value="#{contact.position}" />
								</div>
								
								<div class="p-col-12 p-sm-1">
									<p:commandButton icon="fa fa-pencil" action="#{addClientView.editContact(contact)}" process="@this" update="contactForm:contact" />
									<p:commandButton icon="fa fa-trash" action="#{addClientView.removeContact(contact)}" process="@this" update="contactForm:contacts" styleClass="danger-btn" />
								</div>
							</ui:repeat>
						</h:panelGroup>
					</div>
				</h:form>
			</div>
		</div>
	</ui:define>
</ui:composition>
