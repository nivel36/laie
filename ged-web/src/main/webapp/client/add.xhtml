<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" 
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core" 
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" 
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:g="http://ged.org/ui" 
	xmlns:h="http://java.sun.com/jsf/html" 
	xmlns:o="http://omnifaces.org/ui"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['client.new_client']}</title>
	</ui:define>

	<ui:define name="breadcrumb">
		<p:breadCrumb>
			<p:menuitem value="#{i18n['menu.index']}" outcome="#{Page.INDEX.getUrl()}" />
			<p:menuitem value="#{i18n['client.clients']}" outcome="#{Page.CLIENT_SEARCH.getUrl()}" />
			<p:menuitem value="#{i18n['client.new_client']}" disabled="true" />
		</p:breadCrumb>
	</ui:define>

	<ui:define name="content">
		<h:form id="clientForm">
			<div class="panel">
				<div class="panel-header">
					<div class="panel-header-title">#{i18n['client.new_client']}</div>
				</div>
				<div class="panel-content panel-content-data">
					<div class="grid">
						<div class="col-12 sm-6">
							<h3>#{i18n['client.client_information']}</h3>
							
							<div class="form-field">
								<g:input id="name" label="#{i18n['client.name']}" value="#{addClientView.client.name}" required="true" />

								<g:input id="cif" label="#{i18n['client.cif']}" value="#{addClientView.client.cif}" required="true" />
							</div>
						</div>
						<div class="col-12 sm-6">
							<h3>#{i18n['client.contact_information']}</h3>

							<div class="form-field">
								<g:input id="phoneNumber" label="#{i18n['client.phone_number']}" value="#{addClientView.client.phoneNumber}" />
	
								<g:input id="city" label="#{i18n['client.city']}" value="#{addClientView.client.address.city}" />
	
								<g:input id="state" label="#{i18n['client.state']}" value="#{addClientView.client.address.state}" />
							</div>
						</div>
					</div>
				</div>
			</div>
			<div class="panel-footer">
				<div class="panel-buttons">
					<p:button styleClass="btn-gray" value="#{i18n['action.cancel']}" outcome="#{Page.CLIENT_SEARCH.getUrl()}" />
					<p:commandButton value="#{i18n['action.save']}" action="#{addClientView.save}" process="@form" update="@form growl" />
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
