<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui"
	xmlns:composite="http://xmlns.jcp.org/jsf/composite" xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:o="http://omnifaces.org/ui" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['client.new_client']}</title>
	</ui:define>

	<ui:define name="content">
		<p:breadCrumb styleClass="breadcrumb">
			<p:menuitem value="#{i18n['menu.index']}" outcome="#{Page.INDEX.getUrl()}" />
			<p:menuitem value="#{i18n['client.clients']}" outcome="#{Page.CLIENT_SEARCH.getUrl()}" />
			<p:menuitem value="#{i18n['client.new_client']}" disabled="true" />
		</p:breadCrumb>

		<h:form id="clientForm">
			<div class="panel">
				<div class="panel-header">
					<div class="panel-header-title">#{i18n['client.new_client']}</div>
				</div>
				<div class="panel-content panel-content-data">
					<div class="grid">
						<div class="col-12 sm-6">
							<h3>#{i18n['client.client_information']}</h3>
							<cc:inputText id="name" label="#{i18n['client.name']}" value="#{addClientBean.client.name}" required="true" />

							<cc:inputText id="cif" label="#{i18n['client.cif']}" value="#{addClientBean.client.cif}" required="true" />

						</div>
						<div class="col-12 sm-6">
							<h3>#{i18n['client.contact_information']}</h3>

							<cc:inputText id="phoneNumber" label="#{i18n['client.phone_number']}" value="#{addClientBean.client.phoneNumber}" />

							<cc:inputText id="city" label="#{i18n['client.city']}" value="#{addClientBean.client.address.city}" />

							<cc:inputText id="state" label="#{i18n['client.state']}" value="#{addClientBean.client.address.state}" />
						</div>
					</div>
				</div>
			</div>
			<div class="panel-footer">
				<div class="panel-buttons">
					<p:button styleClass="btn-gray" value="#{i18n['action.cancel']}" outcome="#{Page.CLIENT_SEARCH.getUrl()}" />
					<p:commandButton value="#{i18n['action.save']}" action="#{addClientBean.save}" process="@form" update="@form growl" />
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
