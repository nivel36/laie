<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" 
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core" 
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" 
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:g="http://ged.org/ui" 
	xmlns:h="http://java.sun.com/jsf/html" 
	xmlns:o="http://omnifaces.org/ui"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['client.client']} - #{viewClientView.client.name}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="clients" />

	<ui:define name="actions">
		<p:button value="#{i18n['client.new_client']}" outcome="#{Page.CLIENT_ADD.getUrl()}" />
	</ui:define>

	<ui:define name="breadcrumb">
		<p:breadCrumb>
			<p:menuitem value="#{i18n['menu.index']}" outcome="#{Page.INDEX.getUrl()}" />
			<p:menuitem value="#{i18n['client.clients']}" outcome="#{Page.CLIENT_SEARCH.getUrl()}" />
			<p:menuitem value="#{viewClientView.client.name}" disabled="true" />
		</p:breadCrumb>
	</ui:define>

	<ui:define name="content">
		<div class="grid">
			<div class="col-12 sm-7">
				<p:panel>
					<div class="panel-header">
						<div class="panel-header-title">#{viewClientView.client}</div>
						<h:form>
							<div class="panel-buttons">
								<p:commandButton value="#{i18n['action.export']}" process="@this" action="#{viewClientView.export}"
									icon="fa-file-excel-o" />
								<p:commandButton value="#{i18n['action.edit']}" process="@this" action="#{viewClientView.editClient}" />
							</div>
						</h:form>
					</div>
					<div class="panel-content-data grid">
						<div class="col-12 sm-6">
							<cc:outputText label="#{i18n['client.cif']}" value="#{viewClientView.client.cif}" styleClass="cif" />
						</div>
						<div class="col-12 sm-6">
							<cc:outputText label="#{i18n['client.phone_number']}" value="#{viewClientView.client.phoneNumber}"
								styleClass="phone_number" />

							<cc:outputText label="#{i18n['client.city']}" value="#{viewClientView.client.address.city}" styleClass="city" />

							<cc:outputText label="#{i18n['client.state']}" value="#{viewClientView.client.address.state}" styleClass="state" />
						</div>
					</div>
				</p:panel>
			</div>
			<div class="col-12 sm-5">
				<cc:contacts contacts="#{viewClientView.contacts}">
					<h:form id="contactsForm">
						<p:commandButton value="#{i18n['contact.new_contact']}" actionListener="#{viewClientView.newContact}"
							action="#{Page.CONTACT_ADD.getUrl()}" process="@this" />
					</h:form>
				</cc:contacts>
			</div>
			<div class="col-12 sm-8">
				<cc:jobOffers id="jobOffers" jobOffers="#{viewClientView.jobOffers}">
					<h:form id="jobOffersForm">
						<p:commandButton value="#{i18n['job.new_job_offer']}" actionListener="#{viewClientView.newJobOffer}"
							action="#{Page.JOB_ADD.getUrl()}" process="@this" />
					</h:form>
				</cc:jobOffers>
			</div>
		</div>
	</ui:define>
</ui:composition>
