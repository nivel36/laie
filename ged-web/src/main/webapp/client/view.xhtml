<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" xmlns:f="http://java.sun.com/jsf/core" xmlns:g="http://ged.org/ui"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" xmlns:ui="http://java.sun.com/jsf/facelets" template="/WEB-INF/templates/template.xhtml">

	<ui:define name="title">
		#{i18n['client.client']} - #{viewClientView.client.name}
	</ui:define>

	<ui:param name="selectedMenu" value="clients" />

	<ui:define name="breadcrumb">
		<p:breadCrumb>
			<p:menuitem value="#{i18n['menu.index']}" outcome="#{Page.INDEX.getUrl()}" />
			<p:menuitem value="#{i18n['client.clients']}" outcome="#{Page.CLIENT_SEARCH.getUrl()}" />
			<p:menuitem value="#{viewClientView.client.name}" disabled="true" />
		</p:breadCrumb>
	</ui:define>

	<ui:define name="content">
		<div class="p-grid">
			<div class="p-col-12 p-xl-5">
				<div class="card user-card">
					<div class="user-card-header">
						<p:graphicImage value="/resources/img/bg-header.png" />
					</div>
					<div class="user-card-content">
						<p class="user-image">#{viewClientView.capitalLetters}</p>

						<h:form>
							<p:menuButton icon="fa fa-cog">
								<p:menuitem value="#{i18n['action.export']}" process="@this" action="#{viewClientView.export}" icon="fa fa-file-excel-o" />
								<p:menuitem value="#{i18n['action.edit']}" process="@this" action="#{viewClientView.editClient}" icon="fa fa-pencil" />
							</p:menuButton>
						</h:form>

						<div class="user-card-name">#{viewClientView.client.name}</div>
						<div class="user-card-role">#{viewClientView.client.cif}</div>
						<div class="user-detail">
							<div class="p-grid">
								<div class="p-col-6">
									<cc:outputText label="#{i18n['client.phone_number']}" value="#{viewClientView.client.phoneNumber}" styleClass="phone_number" />
								</div>
								<div class="p-col-6">
									<cc:outputText label="#{i18n['client.city']}" value="#{viewClientView.client.address.city}" styleClass="city" />
								</div>
								<div class="p-col-6">
									<cc:outputText label="#{i18n['client.state']}" value="#{viewClientView.client.address.state}" styleClass="state" />
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>

			<div class="p-col-12 p-xl-7">
				<cc:contacts contacts="#{viewClientView.contacts}">
					<h:form id="contactsForm">
						<p:commandButton value="#{i18n['contact.new_contact']}" actionListener="#{viewClientView.newContact}"
							action="#{Page.CONTACT_ADD.getRedirectedUrl()}" process="@this" styleClass="success-btn" />
					</h:form>
				</cc:contacts>
			</div>

			<div class="p-col-12 p-xl-8">
				<cc:jobOffers id="jobOffers" jobOffers="#{viewClientView.jobOffers}">
					<h:form id="jobOffersForm">
						<p:commandButton value="#{i18n['job.new_job_offer']}" actionListener="#{viewClientView.newJobOffer}" action="#{Page.JOB_ADD.getUrl()}"
							process="@this" styleClass="success-btn" />
					</h:form>
				</cc:jobOffers>
			</div>
		</div>
	</ui:define>
</ui:composition>
