<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core" xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:g="http://ged.org/ui" xmlns:h="http://java.sun.com/jsf/html" xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" xmlns:ui="http://java.sun.com/jsf/facelets" template="/WEB-INF/templates/template.xhtml">

	<ui:define name="title">
		#{i18n['client.client']} - #{viewClientView.client.name}
	</ui:define>

	<ui:param name="selectedMenu" value="clients" />

	<ui:define name="breadcrumb">
		<p:breadCrumb>
			<p:menuitem value="#{i18n['menu.index']}" outcome="#{Page.INDEX.getUrl()}" />
			<p:menuitem value="#{i18n['client.clients']}" outcome="#{Page.CLIENT_SEARCH.getUrl()}" />
			<p:menuitem value="#{viewClientView.client.name}" disabled="true" />
		</p:breadCrumb>
	</ui:define>

	<ui:define name="buttons">
		<h:form>
			<p:commandButton value="#{i18n['action.edit']}" process="@this" action="#{viewClientView.editClient}" icon="fa fa-pencil" styleClass="secondary-button" />
			<p:commandButton value="#{i18n['action.export']}" process="@this" action="#{viewClientView.export}" icon="fa fa-file-excel-o" styleClass="info-button"/>
		</h:form>
	</ui:define>

	<ui:define name="content">
		<div class="p-grid">
			<div class="p-col-12 p-xl-6">
				<div class="card client-card">
					<div class="card-header"></div>
					<div class="client-card-content">
					<div class="client-card-name">#{viewClientView.client.name}</div>
						<div class="client-detail">
							<div class="p-grid">
								<div class="p-col">
									<cc:outputText label="#{i18n['client.cif']}" value="#{viewClientView.client.cif}" />
								</div>
								<div class="p-col">
									<cc:outputText label="#{i18n['client.phone_number']}" value="#{viewClientView.client.phoneNumber}" />
								</div>
								<div class="p-col">
									<cc:outputText label="#{i18n['client.city']}" value="#{viewClientView.client.address.city}" />
								</div>
								<div class="p-col">
									<cc:outputText label="#{i18n['client.state']}" value="#{viewClientView.client.address.region}" />
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
			
			<div class="p-col-12 p-lg-6">
				<div class="card card-w-title contacts">
					<h5>#{i18n['client.contacts']}</h5>
					<h:form id="contactsForm">
						<div class="p-grid">
							<div class="p-col-12">
								<p:dataTable var="contact" value="#{viewClientView.contacts}" emptyMessage="#{i18n['client.no_contacts_found']}" paginator="true" paginatorPosition="bottom"
									styleClass="ui-datatable-borderless" rows="5">
									<p:column headerText="#{i18n['contact.name']}" sortBy="#{contact.name}">
										<h:outputText value="#{contact.name} #{contact.surname}" />
									</p:column>
									<p:column headerText="#{i18n['contact.email']}">
										<h:outputText value="#{contact.email}" />
									</p:column>
									<p:column headerText="#{i18n['contact.position']}">
										<h:outputText value="#{contact.position}" />
									</p:column>
									<p:column>
										<p:button icon="fa fa-pencil" outcome="#{Page.CONTACT_EDIT.getUrl()}">
											<f:param name="id" value="#{contact.uid}" />
										</p:button>
										<p:commandButton icon="fa fa-trash" styleClass="danger-btn" />
									</p:column>
								</p:dataTable>
							</div>
							<div class="p-col-12">
								<div class="buttons">
									<p:button value="#{i18n['contact.new_contact']}" outcome="#{Page.CONTACT_ADD.getUrl()}" process="@this"	styleClass="success-btn" >
										<f:param name="clientId" value="#{viewClientView.client.uid}" />
									</p:button>
								</div>
							</div>
						</div>
					</h:form>
				</div>
			</div>
			
			<div class="p-col-12 p-lg-8">
				<cc:jobOffers id="jobOffers" value="#{viewClientView.jobOffers}" rows="5">
					<h:form id="jobOffersForm">
						<p:button value="#{i18n['job.new_job_offer']}" outcome="#{Page.JOB_ADD.getUrl()}" process="@this" styleClass="success-btn" >
							<f:param name="clientId" value="#{viewClientView.client.uid}" />
						</p:button>
					</h:form>
				</cc:jobOffers>
			</div>
		</div>
	</ui:define>
</ui:composition>
