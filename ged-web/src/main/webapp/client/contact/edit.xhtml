<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:composite="http://xmlns.jcp.org/jsf/composite"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" xmlns:o="http://omnifaces.org/ui" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{clientEditBean.client.name}</title>
	</ui:define>

	<ui:define name="content">
		<p:breadCrumb styleClass="breadcrumb">
			<p:menuitem value="#{i18n['menu.index']}" url="/index.xhtml" />
			<p:menuitem value="#{i18n['client.clients']}" url="/client/clientSearch.xhtml" />
			<p:menuitem value="#{contactEditBean.client.name}" url="/client/client.xhtml?clientId=#{contactEditBean.client.id}" />
			<p:menuitem value="#{contactEditBean.contact.fullName}" disabled="true" />
		</p:breadCrumb>

		<h:form id="contactForm">
			<div class="panel">
				<div class="panel-header">
					<div class="panel-header-title">#{contactEditBean.contact.fullName}</div>
				</div>
				<div class="panel-content panel-content-data">
					<div class="grid">
						<div class="col-12 sm-6">
							<cc:inputText id="name" label="#{i18n['contact.name']}" value="#{contactEditBean.contact.name}" required="true" />

							<cc:inputText id="surname" label="#{i18n['contact.surname']}" value="#{contactEditBean.contact.surname}" required="true" />

							<cc:inputText id="position" label="#{i18n['contact.position']}" value="#{contactEditBean.contact.position}" />

							<cc:inputText id="email" label="#{i18n['contact.email']}" value="#{contactEditBean.contact.email}" />

							<cc:inputText id="phone_number" label="#{i18n['contact.phone_number']}" value="#{contactEditBean.contact.phoneNumber}" />
						</div>
					</div>
				</div>
				<div class="panel-footer">
					<div class="panel-buttons">
						<p:button styleClass="btn-gray" value="#{i18n['action.cancel']}" outcome="#{PageEnum.CLIENT.getUrl()}">
							<f:param name="id" value="#{contactEditBean.client.id}" />
						</p:button>
						<p:commandButton value="#{i18n['action.save']}" action="#{contactEditBean.save}" update="@form" />
					</div>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
