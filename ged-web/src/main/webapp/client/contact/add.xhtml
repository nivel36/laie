<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core" xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:g="http://ged.org/ui" xmlns:h="http://java.sun.com/jsf/html" xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" xmlns:ui="http://java.sun.com/jsf/facelets" template="/WEB-INF/templates/template.xhtml">

	<ui:define name="title">
		#{clientEditView.newClient}
	</ui:define>

	<ui:define name="breadcrumb">
		<p:breadCrumb>
			<p:menuitem value="#{i18n['menu.index']}" outcome="#{Page.INDEX.getUrl()}" />
			<p:menuitem value="#{i18n['client.clients']}" outcome="#{Page.CLIENT_SEARCH.getUrl()}" />
			<p:menuitem value="#{addContactView.client.name}" outcome="#{Page.CLIENT.getUrl()}">
				<f:param name="id" value="#{addContactView.client.id}" />
			</p:menuitem>
			<p:menuitem value="#{i18n['contact.new_contact']}" disabled="true" />
		</p:breadCrumb>
	</ui:define>

	<ui:define name="content">
		<h:form id="contactForm">
			<div class="p-grid">
				<div class="p-col-12 p-xl-3">
					<div class="card card-w-title">
						<h3>#{i18n['contact.new_contact']}</h3>

						<div class="p-grid">
							<div class="p-col-12">
								<div class="form-field ui-fluid">
									<g:input id="name" label="#{i18n['contact.name']}" value="#{addContactView.contact.name}" required="true" />

									<g:input id="surname" label="#{i18n['contact.surname']}" value="#{addContactView.contact.surname}" required="true" />

									<g:input id="position" label="#{i18n['contact.position']}" value="#{addContactView.contact.position}" />

									<g:input id="email" label="#{i18n['contact.email']}" value="#{addContactView.contact.email}" />

									<g:input id="phone_number" label="#{i18n['contact.phone_number']}" value="#{addContactView.contact.phoneNumber}" />
								</div>
							</div>
							<div class="p-col-12">
								<div class="buttons">
									<p:button value="#{i18n['action.cancel']}" outcome="#{Page.CLIENT.getUrl()}" styleClass="secondary-button">
										<f:param name="id" value="#{addContactView.client.id}" />
									</p:button>
									<p:commandButton value="#{i18n['action.save']}" action="#{addContactView.save}" process="@form growl" update="@form" styleClass="success-btn" />
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
