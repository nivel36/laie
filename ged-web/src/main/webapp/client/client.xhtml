<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:composite="http://xmlns.jcp.org/jsf/composite"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" xmlns:o="http://omnifaces.org/ui" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['client.client']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="clients" />

	<ui:define name="content">
		<p:breadCrumb styleClass="breadcrumb">
			<p:menuitem value="#{i18n['menu.index']}" url="/index.xhtml" />
			<p:menuitem value="#{i18n['client.clients']}" url="/client/clientSearch.xhtml" />
			<p:menuitem value="#{clientBean.client.name}" disabled="true" />
		</p:breadCrumb>

		<div class="grid nogutter">
			<div class="col-12 sm-8">
				<div class="panel">
					<h:form>
						<div class="panel-header">
							<div class="panel-header-title">#{clientBean.client}</div>
							<div class="panel-buttons">
								<p:commandButton value="#{i18n['action.export']}" process="@this" actionListener="#{clientBean.editClient}" icon="fa-file-excel-o"
									action="/client/clientEdit?faces-redirect=true" />
								<p:commandButton value="#{i18n['action.edit']}" process="@this" actionListener="#{clientBean.editClient}"
									action="//client/clientEdit?faces-redirect=true" />
							</div>
						</div>
					</h:form>
					<div class="panel-content panel-content-data grid">
						<div class="col-12 sm-6">
							<cc:outputText label="#{i18n['client.cif']}" value="#{clientBean.client.cif}" styleClass="cif" />
						</div>
						<div class="col-12 sm-6">
							<cc:outputText label="#{i18n['client.phone_number']}" value="#{clientBean.client.phoneNumber}" styleClass="phone_number" />

							<cc:outputText label="#{i18n['client.city']}" value="#{clientBean.client.address.city}" styleClass="city" />

							<cc:outputText label="#{i18n['client.state']}" value="#{clientBean.client.address.state}" styleClass="state" />
						</div>
					</div>
				</div>
			</div>
			<div class="col-12 sm-4">
				<h:form id="contactsForm">
					<cc:contacts contacts="#{clientBean.contacts}">
						<p:commandButton value="#{i18n['action.new']}" actionListener="#{clientBean.newContact}" action="/client/contactEdit?faces-redirect=true" process="@this"/>
					</cc:contacts>
				</h:form>
			</div>
			<div class="col-12 sm-6">
				<h:form id="jobOffersForm">
					<cc:jobOffers id="jobOffers" jobOffers="#{clientBean.jobOffers}">
						<p:commandButton value="#{i18n['action.new']}" actionListener="#{clientBean.newJobOffer}"
							action="/jobOffer/jobOfferEdit?faces-redirect=true" process="@this" />
					</cc:jobOffers>
				</h:form>
			</div>
		</div>
	</ui:define>
</ui:composition>
