<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:i18n="http://ged.com/i18n"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" template="/WEB-INF/templates/dialog.xhtml">

	<ui:define name="title">
		<title>#{i18n['config.change_picture']}</title>
	</ui:define>

	<ui:define name="content">
		<p:tabView dynamic="true">
			<p:tab title="#{i18n['changeImage.image']}">
				<h:form id="imageForm">
					<div class="userImage">
						<p:graphicImage styleClass="image" value="/resources/img/default-avatar.png" rendered="#{empty changePictureBean.user.imageFileName}" />
						<p:graphicImage styleClass="image" value="/images/#{changePictureBean.user.imageFileName}" rendered="#{not empty changePictureBean.user.imageFileName}" />
					</div>
					<div class="form-action-primary">
						<p:fileUpload id="uploadImage" fileUploadListener="#{changePictureBean.uploadImage}" mode="advanced" dragDropSupport="false"
							update="@form" auto="true" label="#{i18n['changeImage.change_image']}" />
						<p:commandButton value="#{i18n['action.apply']}" action="#{changePictureBean.apply}" process="@this" />
					</div>
				</h:form>
			</p:tab>
			<p:tab title="#{i18n['changeImage.camera']}">
				<h:form id="cameraForm">
					<div class="userCamera">
						<p:photoCam widgetVar="pc" listener="#{changePictureBean.onCapture}" update="@form" />
					</div>
					<div class="form-action-primary">
						<p:commandButton value="#{i18n['action.capture']}" onclick="PF('pc').capture()" process="@form" update="@form" />
					</div>
				</h:form>
			</p:tab>
		</p:tabView>
	</ui:define>
</ui:composition>
