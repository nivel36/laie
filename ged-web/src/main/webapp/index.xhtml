<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" 
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core" 
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" 
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:g="http://ged.org/ui" 
	xmlns:h="http://java.sun.com/jsf/html" 
	xmlns:o="http://omnifaces.org/ui"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>Ged</title>
	</ui:define>

	<ui:param name="selectedMenu" value="index" />

	<ui:define name="breadcrumb">
		<p:breadCrumb styleClass="breadcrumb">
			<p:menuitem value="#{i18n['menu.index']}" disabled="true" />
		</p:breadCrumb>
	</ui:define>

	<ui:define name="content">
		<div class="grid">
			<div class="col-12 lg-6">
				<cc:jobOffers jobOffers="#{indexView.jobOffers}" />
			</div>
			<div class="col-12 lg-6">
				<cc:candidates candidates="#{indexView.candidates}" title="#{i18n['candidate.last_candidates']}">
					<p:button value="test" />
				</cc:candidates>
			</div>

			<div class="col-12 md-6">
				<cc:meetings value="#{indexView.meetings}" title="#{i18n['meeting.planned_meetings']}"
					emptyMessage="#{i18n['meeting.no_planned']}" />
			</div>
		</div>
	</ui:define>
</ui:composition>
