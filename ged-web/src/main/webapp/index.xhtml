<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>Ged</title>
	</ui:define>

	<ui:param name="selectedMenu" value="index" />

	<ui:define name="breadcrumb">
		<p:breadCrumb styleClass="breadcrumb">
			<p:menuitem value="#{i18n['menu.index']}" disabled="true" />
		</p:breadCrumb>
	</ui:define>

	<ui:define name="content">
		<div class="grid">
			<div class="col-12 lg-6">
				<cc:jobOffers jobOffers="#{indexBean.jobOffers}">
					<p:button value="#{i18n['action.new']}" outcome="#{Page.JOB_ADD.getUrl()}" />
				</cc:jobOffers>
			</div>
			<div class="col-12 lg-6">
				<cc:candidates candidates="#{indexBean.candidates}" title="#{i18n['candidate.last_candidates']}">
					<p:button value="#{i18n['action.new']}" outcome="#{Page.CANDIDATE_ADD.getUrl()}" />
				</cc:candidates>
			</div>

			<div class="col-12 lg-6">
				<p:panel header="#{i18n['index.last_reports']}">
					<div class="form-action-primary">
						<p:button value="#{i18n['action.new']}" outcome="#{Page.CANDIDATE_ADD.getUrl()}" />
					</div>
				</p:panel>
			</div>

			<div class="col-12 lg-6">
				<p:panel header="#{i18n['index.scheudele']}">
					<div class="form-action-primary">
						<p:button value="#{i18n['action.new']}" outcome="#{Page.CANDIDATE_ADD.getUrl()}" />
					</div>
				</p:panel>
			</div>
		</div>
	</ui:define>
</ui:composition>
