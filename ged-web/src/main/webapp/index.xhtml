<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" 
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core" 
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" 
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:g="http://ged.org/ui" 
	xmlns:h="http://java.sun.com/jsf/html" 
	xmlns:o="http://omnifaces.org/ui"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	template="/WEB-INF/templates/template.xhtml">

	<ui:define name="title">
		Ged
	</ui:define>

	<ui:param name="selectedMenu" value="index" />

	<ui:define name="breadcrumb">
		<p:breadCrumb>
			<p:menuitem value="#{i18n['menu.index']}"  url="#"/>
		</p:breadCrumb>
	</ui:define>

	<ui:define name="content">
		<div class="p-grid">
			<div class="p-col-12 p-xl-8">
				<cc:jobOffers jobOffers="#{indexView.jobOffers}" />
			</div>
			<div class="p-col-12 p-xl-4">
				<cc:candidates candidates="#{indexView.candidates}" title="#{i18n['candidate.last_candidates']}"/>
			</div>
			
			<div class="p-col-12">
				<cc:events value="#{indexView.events}" title="#{i18n['event.last_events']}" />
					
			</div>

			<div class="p-col-12 p-xl-4">
				<cc:meetings value="#{indexView.meetings}" title="#{i18n['meeting.planned_meetings']}"
					emptyMessage="#{i18n['meeting.no_planned']}" />
			</div>
		</div>
	</ui:define>
</ui:composition>
