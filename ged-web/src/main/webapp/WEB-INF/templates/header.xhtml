<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:jsf="http://xmlns.jcp.org/jsf">
	<div id="logo">
		<h:form id="userForm">
			<nav id="userMenu">
				<ul>
					<li><h:outputText value="#{sessionBean.user}" styleClass="name" /></li>
					<li><h:commandLink value="#{i18n['menu.config']}" action="/faces/config/configIndex?faces-redirect=true"
							styleClass="config" /></li>
					<li><h:commandLink value="#{i18n['user.logout']}" action="#{loginBean.logout}" styleClass="logout" /></li>
				</ul>
			</nav>
		</h:form>
	</div>
	<ui:insert name="menu">
		<h:form id="nav">
			<nav id="mainMenu" class="menu">
				<ul>
					<li><a jsf:action="#{menuBean.gotoIndex}" jsf:styleClass="#{selectedMenu eq 'index' ? 'selected': ''}"><span
							class="menu_icon"><em class="fa fa-home" /></span> <span class="menu_text">#{i18n['menu.index']}</span></a></li>
					<li><a jsf:action="#{menuBean.gotoCandidates}"
						jsf:styleClass="#{selectedMenu eq 'candidates' ? 'selected': ''}"><span class="menu_icon"><em
								class="fa fa-users" /></span> <span class="menu_text">#{i18n['menu.candidates']}</span></a></li>
					<li><a jsf:action="#{menuBean.gotoJobOffers}" jsf:styleClass="#{selectedMenu eq 'offers' ? 'selected': ''}"><span
							class="menu_icon"><em class="fa fa-suitcase" /></span> <span class="menu_text">#{i18n['menu.offers']}</span></a></li>
					<li><a jsf:action="#{menuBean.gotoClients}" jsf:styleClass="#{selectedMenu eq 'clients' ? 'selected': ''}"><span
							class="menu_icon"><em class="fa fa-industry" /></span> <span class="menu_text">#{i18n['menu.clients']}</span></a></li>
					<li><a jsf:action="#{menuBean.gotoReports}" jsf:styleClass="#{selectedMenu eq 'reports' ? 'selected': ''}"><span
							class="menu_icon"><em class="fa fa-bar-chart" /></span> <span class="menu_text">#{i18n['menu.reports']}</span></a></li>
					<li><a jsf:action="#{menuBean.gotoUsers}" jsf:rendered="#{request.isUserInRole('ADMIN')}"
						jsf:styleClass="#{selectedMenu eq 'users' ? 'selected': ''}"><span class="menu_icon"><em
								class="fa fa-user" /></span> <span class="menu_text">#{i18n['menu.users']}</span></a></li>
					<li><a jsf:action="#{menuBean.gotoMaintenances}"
						jsf:styleClass="#{selectedMenu eq 'maintenances' ? 'selected': ''}"><span class="menu_icon"><em
								class="fa fa-cogs" /></span> <span class="menu_text">#{i18n['menu.maintenances']}</span></a></li>
				</ul>
			</nav>
		</h:form>
	</ui:insert>
</ui:composition>
