<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:jsf="http://xmlns.jcp.org/jsf">
	<h:panelGroup layout="block" id="logo">
		<h:form id="userForm">
			<nav id="userMenu">
				<ul>
					<li><h:outputText value="#{sessionBean.user}" styleClass="name" /></li>
					<li><h:commandLink value="#{i18n['menu.config']}" action="/faces/config/configIndex?faces-redirect=true"
							styleClass="config" /></li>
					<li><h:commandLink value="#{i18n['user.logout']}" action="#{loginBean.logout}" styleClass="logout" /></li>
				</ul>
			</nav>
		</h:form>
	</h:panelGroup>
	<ui:insert name="menu">
		<h:form id="nav">
			<nav id="mainMenu" class="menu">
				<ul>
					<li><a jsf:action="#{menuBean.gotoIndex}" jsf:styleClass="#{selectedMenu eq 'index' ? 'selected': ''}"><i
							class="fa fa-home" /> #{i18n['menu.index']}</a></li>
					<li><a jsf:action="#{menuBean.gotoCandidates}"
						jsf:styleClass="#{selectedMenu eq 'candidates' ? 'selected': ''}"><i class="fa fa-users" />
							#{i18n['menu.candidates']}</a></li>
					<li><a jsf:action="#{menuBean.gotoJobOffers}" jsf:styleClass="#{selectedMenu eq 'offers' ? 'selected': ''}"><i
							class="fa fa-suitcase" /> #{i18n['menu.offers']}</a></li>
					<li><a jsf:action="#{menuBean.gotoClients}" jsf:styleClass="#{selectedMenu eq 'clients' ? 'selected': ''}"><i
							class="fa fa-industry" /> #{i18n['menu.clients']}</a></li>
					<li><a jsf:action="#{menuBean.gotoReports}" jsf:styleClass="#{selectedMenu eq 'reports' ? 'selected': ''}"><i
							class="fa fa-bar-chart" /> #{i18n['menu.reports']}</a></li>
					<li><a jsf:action="#{menuBean.gotoUsers}" jsf:rendered="#{request.isUserInRole('ADMIN')}"
						jsf:styleClass="#{selectedMenu eq 'users' ? 'selected': ''}"><i class="fa fa-user" /> #{i18n['menu.users']}</a></li>
					<li><a jsf:action="#{menuBean.gotoMaintenances}"
						jsf:styleClass="#{selectedMenu eq 'maintenances' ? 'selected': ''}"><i class="fa fa-cogs" />
							#{i18n['menu.maintenances']}</a></li>
				</ul>
			</nav>
		</h:form>
	</ui:insert>
</ui:composition>
