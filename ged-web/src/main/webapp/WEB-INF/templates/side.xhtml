<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:jsf="http://xmlns.jcp.org/jsf">


	<div class="col-lg-12 col-md-12 col-sm-12">
		<div class="card">
			<div class="card-header card-header-icon" >
				<i class="material-icons">bookmark</i>
			</div>
			<div class="card-content">
				<h4 class="card-title">#{i18n['aside.bookmarks']}</h4>
				<form jsf:id="bookmarkForm">
					<ui:repeat value="#{bookmarksBean.bookmarks}" var="bookmark">
						<h:commandLink action="#{bookmarksBean.go(bookmark)}" value="#{bookmark.text}" />
						<br />
					</ui:repeat>
				</form>
			</div>
		</div>
	</div>

	<div class="col-lg-12 col-md-12 col-sm-12">
		<div class="card">
			<div class="card-header card-header-icon" >
				<i class="material-icons">watch</i>
			</div>
			<div class="card-content">
				<h4 class="card-title">#{i18n['aside.last_actions']}</h4>
				<form jsf:id="actionForm">
					<ui:repeat value="#{bookmarksBean.bookmarks}" var="bookmark">
						<h:commandLink action="#{bookmarksBean.go(bookmark)}" value="#{bookmark.text}" />
						<br />
					</ui:repeat>
				</form>
			</div>
		</div>
	</div>
</ui:composition>
