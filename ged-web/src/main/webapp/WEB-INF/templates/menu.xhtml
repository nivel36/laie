<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html" xmlns:f="http://java.sun.com/jsf/core" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui" xmlns:po="http://primefaces.org/roma">

	<div class="layout-menu-container">
		<div class="nano">
			<div class="nano-content menu-scroll-content">

						<p:menuitem id="om_candidates" value="#{i18n['menu.candidates']}" icon="fa fa-fw fa-users" containerStyleClass="#{selectedMenu eq 'candidates' ? 'active-menuitem' : '' }"

							outcome="#{Page.CLIENT_SEARCH.getUrl()}" />

							outcome="#{Page.USER_SEARCH.getUrl()}" />
						<p:menuitem id="om_maintenances" value="#{i18n['menu.maintenances']}" containerStyleClass="#{selectedMenu eq 'maintenances' ? 'active-menuitem' : '' }"
