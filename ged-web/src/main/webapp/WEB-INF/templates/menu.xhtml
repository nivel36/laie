<ui:composition xmlns="http://www.w3.org/1999/xhtml" 
                xmlns:h="http://java.sun.com/jsf/html" 
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets" 
                xmlns:p="http://primefaces.org/ui"
                xmlns:po="http://primefaces.org/roma">

	<div class="layout-menu-container">
		<div class="nano">
			<div class="nano-content menu-scroll-content">
				<h:form id="menuform">
					<ui:fragment rendered="#{guestPreferences.profileMode == 'inline' ? true : false}">
						<div class="layout-profile">
							<a class="layout-profile-button" href="#"> <p:graphicImage name="images/avatar/avatar.png" library="roma-layout" />
								<div class="layout-profile-userinfo">
									<span class="layout-profile-name">Arlene Welch</span> <span class="layout-profile-role">Design Ops</span>
								</div>
							</a>
							<ul class="layout-profile-menu">
								<li><a href="#"> <i class="fa fa-fw fa-user"></i><span>Profile</span>
								</a></li>
								<li><a href="#"> <i class="fa fa-fw fa-cog"></i><span>Settings</span>
								</a></li>
								<li><a href="#"> <i class="fa fa-fw fa-envelope-o"></i><span>Messages</span>
								</a></li>
								<li><a href="#"> <i class="fa fa-fw fa-bell-o"></i><span>Notifications</span>
								</a></li>
							</ul>
						</div>
					</ui:fragment>
					<po:menu>
						<p:menuitem id="om_index" value="#{i18n['menu.index']}" icon="fa fa-fw fa-home" outcome="#{Page.INDEX.getUrl()}" />
						<p:menuitem id="om_candidates" value="#{i18n['menu.candidates']}" icon="fa fa-fw fa-users" outcome="#{Page.CANDIDATE_SEARCH.getUrl()}" />
						<p:menuitem id="om_offers" value="#{i18n['menu.offers']}" icon="fa fa-fw fa-suitcase" outcome="#{Page.JOB_SEARCH.getUrl()}" />
						<p:menuitem id="om_clients" value="#{i18n['menu.clients']}" icon="fa fa-fw fa-industry" outcome="#{Page.CLIENT_SEARCH.getUrl()}" />
						<p:menuitem id="om_reports" value="#{i18n['menu.reports']}" icon="fa fa-fw fa-area-chart" outcome="#{Page.REPORT.getUrl()}" />
						<p:menuitem id="om_users" value="#{i18n['menu.users']}" icon="fa fa-fw fa-user" outcome="#{Page.USER_SEARCH.getUrl()}" />
						<p:menuitem id="om_maintenances" value="#{i18n['menu.maintenances']}" icon="fa fa-fw fa-cogs" outcome="#{Page.MAINTENANCE.getUrl()}" />
						<p:menuitem id="om_meetings" value="#{i18n['menu.meetings']}" icon="fa fa-fw fa-calendar" outcome="#{Page.MEETING_SEARCH.getUrl()}" />
					</po:menu>
				</h:form>
			</div>
		</div>
	</div>
</ui:composition>
