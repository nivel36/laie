<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html" xmlns:f="http://java.sun.com/jsf/core"

<f:view contentType="text/html" locale="#{sessionUser.locale}">
	<h:head>

	<h:body>
		<header>
			<ui:insert name="header">
				<ui:decorate template="header.xhtml" />

		</header>
		<div id="main">
			<p:growl id="growl" globalOnly="true" />
			<div id="aside">
				<ui:insert name="aside">
					<ui:include src="aside.xhtml" />
				</ui:insert>
			</div>
			<div id="content">
				<ui:insert name="content" />
			</div>
		</div>
		<footer>
			<ui:insert name="footer">
				<ui:include src="footer.xhtml" />
			</ui:insert>
		</footer>

</html>
