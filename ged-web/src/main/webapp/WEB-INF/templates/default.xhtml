<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:p="http://primefaces.org/ui">

<f:view contentType="text/html" locale="#{sessionBean.locale}">
	<h:head>
		<ui:insert name="title">
			<title>Legion</title>
		</ui:insert>
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
		<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
		<meta http-equiv="Pragma" content="no-cache" />
		<meta http-equiv="Expires" content="-1" />
		<h:outputScript library="js" name="datepicker.js" />
		<script>{"describedby":"form"}</script>
		<h:outputStylesheet name="css/reset.css" />
		<h:outputStylesheet name="css/flat-classic-blue/layout.css" />
		<h:outputStylesheet name="css/flat-classic-blue/components.css" />
		<h:outputStylesheet library="webjars" name="font-awesome/4.5.0/css/font-awesome-jsf.css" />
		<link href='http://fonts.googleapis.com/css?family=Roboto:400,700,300|Material+Icons' rel='stylesheet' type='text/css' />
	</h:head>

	<h:body>
		<h:panelGroup layout="block" styleClass="wrapper">
			<header>
				<ui:insert name="header">
					<ui:decorate template="header.xhtml" />
				</ui:insert>
			</header>
			<h:panelGroup layout="block" id="main-panel">
				<h:panelGroup layout="block" id="aside">
					<aside>
						<ui:insert name="aside">
							<ui:include src="aside.xhtml" />
						</ui:insert>
					</aside>
				</h:panelGroup>
				<h:panelGroup layout="block" id="content">
					<p:growl id="growl" globalOnly="true" />
					<ui:insert name="content" />
					<footer>
						<ui:insert name="footer">
							<ui:include src="footer.xhtml" />
						</ui:insert>
					</footer>
				</h:panelGroup>
			</h:panelGroup>
		</h:panelGroup>
	</h:body>
</f:view>
</html>
