<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['job.job_offer']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="offers" />

	<ui:define name="content">
		<p:breadCrumb styleClass="breadcrumb">
			<p:menuitem value="#{i18n['menu.index']}" outcome="#{Page.INDEX.getUrl()}" />
			<p:menuitem value="#{i18n['job.job_offers']}" disabled="true" />
		</p:breadCrumb>

		<h:form id="jobOfferSearchform">
			<div class="panel">
				<div class="panel-header">
					<div class="panel-header-title">#{i18n['job.job_offers']}</div>
				</div>
				<div class="panel-content">
					<div class="panel-content-data">
						<cc:inputSearch searchText="#{searchJobBean.searchText}" searchAction="#{searchJobBean.search}"
							update="@form" />
						<div class="panel-buttons">
							<p:commandButton value="#{i18n['action.export']}" action="#{searchJobBean.search}" process="@this"
								icon="fa-file-excel-o" styleClass="btn-primary" />
							<p:button value="#{i18n['action.new']}" outcome="#{Page.JOB_ADD.getUrl()}" styleClass="btn-primary" />
						</div>
					</div>
					<p:dataTable var="jobOffer" value="#{searchJobBean.jobOffers}" emptyMessage="#{i18n['job.no_jobs_found']}"
						reflow="true" paginator="true" paginatorPosition="bottom" rows="#{sessionUser.rowsPerPage}">

						<p:column headerText="#{i18n['job.name']}" sortBy="#{jobOffer.name}">
							<h:link value="#{jobOffer.name}" outcome="#{Page.JOB.getUrl()}">
								<f:param name="id" value="#{jobOffer.id}" />
							</h:link>
						</p:column>
						<p:column headerText="#{i18n['job.client']}" sortBy="#{jobOffer.client.name}">
							<h:link value="#{jobOffer.client.name}" outcome="#{Page.CLIENT.getUrl()}">
								<f:param name="id" value="#{jobOffer.client.id}" />
							</h:link>
						</p:column>
						<p:column headerText="#{i18n['job.date_opened']}" sortBy="#{jobOffer.dateOpened}">
							<h:outputText value="#{jobOffer.dateOpened}">
								<f:convertDateTime type="localDate" pattern="dd/MM/yyyy" />
							</h:outputText>
						</p:column>
						<p:column headerText="#{i18n['job.date_closed']}" sortBy="#{jobOffer.dateClosed}">
							<h:outputText value="#{jobOffer.dateClosed}">
								<f:convertDateTime type="localDate" pattern="dd/MM/yyyy" />
							</h:outputText>
						</p:column>
						<p:column headerText="#{i18n['job.places']}">
							<h:outputText value="#{jobOffer.places}" />
						</p:column>
						<p:column headerText="#{i18n['user.owner']}" sortBy="#{user.owner.fullName}">
							<h:link value="#{jobOffer.owner.fullName}" outcome="#{Page.USER.getUrl()}">
								<f:param name="id" value="#{jobOffer.owner.id}" />
							</h:link>
						</p:column>
					</p:dataTable>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
