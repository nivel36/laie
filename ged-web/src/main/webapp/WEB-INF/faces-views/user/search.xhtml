<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html" xmlns:i18n="http://ged.com/i18n"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" xmlns:p="http://primefaces.org/ui"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" xmlns:o="http://omnifaces.org/ui"
	xmlns:of="http://omnifaces.org/functions" template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['user.users']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="users" />

	<ui:define name="content">
		<p:breadCrumb styleClass="breadcrumb">
			<p:menuitem value="#{i18n['menu.index']}" outcome="#{Page.INDEX.getUrl()}" />
			<p:menuitem value="#{i18n['user.users']}" disabled="true" />
		</p:breadCrumb>

		<o:form>
			<div class="panel">
				<div class="panel-header">
					<div class="panel-header-title">#{i18n['user.search']}</div>
				</div>
				<div class="panel-content">
					<div class="panel-content-data">
						<cc:inputSearch searchText="#{searchUserBean.searchText}" searchAction="#{searchUserBean.search}" update="@form" />
						<div class="panel-buttons">
							<p:commandButton value="#{i18n['action.export']}" action="#{searchUserBean.export}" process="@this"
								icon="fa-file-excel-o" />
							<p:button value="#{i18n['action.new']}" outcome="#{Page.USER_ADD.getUrl()}" />
						</div>
					</div>

					<p:dataTable var="user" id="users" value="#{searchUserBean.users}" emptyMessage="#{i18n['user.no_users_found']}"
						reflow="true" paginator="true" paginatorPosition="bottom" paginatorTemplate="{PageLinks}"
						rows="#{sessionUser.rowsPerPage}" sortBy="#{user.fullName}" sortOrder="ascending">

						<p:column>
							<p:graphicImage class="image image-icon" value="/images/#{user.imageFileName}"
								rendered="#{not empty user.imageFileName}" />
							<p:graphicImage class="image image-icon" value="/resources/img/default-avatar.png"
								rendered="#{empty user.imageFileName}" />
						</p:column>

						<p:column headerText="#{i18n['user.name']}" sortBy="#{user.fullName}">
							<h:link value="#{user.fullName}" outcome="#{Page.USER.getUrl()}">
								<f:param name="id" value="#{user.id}" />
							</h:link>
						</p:column>

						<p:column headerText="#{i18n['user.email']}" sortBy="#{user.email}">
							<h:outputText value="#{user.email}" />
						</p:column>

						<p:column headerText="#{i18n['user.role']}" sortBy="#{i18n:translate(user.role)}">
							<h:outputText value="#{i18n:translate(user.role)}" />
						</p:column>

						<p:column headerText="#{i18n['user.manager']}" sortBy="#{user.manager.fullName}">
							<h:link value="#{user.manager.fullName}" outcome="#{Page.USER.getUrl()}" rendered="#{not empty user.manager}">
								<f:param name="id" value="#{user.manager.id}" />
							</h:link>
						</p:column>
					</p:dataTable>
				</div>
			</div>
		</o:form>
	</ui:define>
</ui:composition>
