<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core" xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:g="http://ged.org/ui" xmlns:h="http://java.sun.com/jsf/html" xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" xmlns:ui="http://java.sun.com/jsf/facelets" template="/WEB-INF/templates/template.xhtml">

	<ui:define name="title">
		#{i18n['activity.activities']}
	</ui:define>

	<ui:param name="selectedMenu" value="users" />

	<ui:define name="breadcrumb">
		<p:breadCrumb>
			<p:menuitem value="#{i18n['menu.index']}" outcome="#{Page.INDEX.getUrl()}" />
			<p:menuitem value="#{i18n['activity.activities']}" disabled="true" />
		</p:breadCrumb>
	</ui:define>

	<ui:define name="content">
		<h:form id="searchActivities">
			<div class="card">
				<div class="p-grid">
					<div class="p-col-12 p-xl-5">
						<div class="searchBar ui-fluid">
						</div>
					</div>
					<div class="p-col-12 p-xl-7">
						<div class="buttons">
							<p:commandButton value="#{i18n['action.export']}" action="#{searchActivityView.export}" process="@this" icon="fa fa-file-excel-o" />
						</div>
					</div>
				</div>
			</div>
			<div class="card">
				<p:dataTable var="user" id="activities" value="#{searchActivityView.activities}" emptyMessage="#{i18n['activity.no_activities_found']}" reflow="true" paginator="true"
					paginatorPosition="bottom" paginatorTemplate="{PageLinks}" rows="#{sessionUser.rowsPerPage}" sortBy="#{activity.date}" sortOrder="descending" lazy="true">

					<p:column headerText="#{i18n['activity.type']}" sortBy="#{activity.type}">
						<h:outputText value="#{activity.type}" />
					</p:column>

					<p:column headerText="#{i18n['activity.date']}" sortBy="#{activity.date}">
						<h:outputText value="#{activity.date}">
							<f:convertDateTime type="localDate" pattern="dd/MM/yyyy" />
						</h:outputText>
					</p:column>

				</p:dataTable>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
