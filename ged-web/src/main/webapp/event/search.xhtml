<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core" xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:g="http://ged.org/ui" xmlns:h="http://java.sun.com/jsf/html" xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" xmlns:ui="http://java.sun.com/jsf/facelets" template="/WEB-INF/templates/template.xhtml">

	<ui:define name="title">
		#{i18n['event.events']}
	</ui:define>

	<ui:param name="selectedMenu" value="events" />

	<ui:define name="breadcrumb">
		<p:breadCrumb>
			<p:menuitem value="#{i18n['menu.index']}" outcome="#{Page.INDEX.getUrl()}" />
			<p:menuitem value="#{i18n['event.events']}" disabled="true" />
		</p:breadCrumb>
	</ui:define>

	<ui:define name="buttons">
		<h:form>
			<p:commandButton value="#{i18n['action.export']}" onclick="export()" icon="fa fa-file-excel-o" />
		</h:form>
	</ui:define>

	<ui:define name="content">
		<h:form id="searchEvents">
			<p:remoteCommand name="export" process="@form" update="@form growl" action="#{searchEventView.export}" />
			<div class="card ui-fluid">
				<div class="p-grid">
					<div class="p-col-12 p-xl-5">
						<p:selectOneMenu id="state" value="#{searchEventView.searchState}" styleClass="input input-select" panelStyleClass="jobCandidatureStates">
							<f:selectItem />
							<f:selectItems value="#{jobCandidatureStates.list}" var="jobCandidatureState" itemValue="#{jobCandidatureState}" itemLabel="#{g:translate(jobCandidatureState.name)}" />
							<p:ajax event="change" listener="#{searchEventView.search}" process="@form" update="@form" />
						</p:selectOneMenu>
					</div>
					<div class="p-col-12 p-xl-5">
						<p:selectBooleanCheckbox itemLabel="#{i18n['show_last_events']}" value="#{searchEventView.showLastEvents}" />
					</div>

					<div class="p-col-12">
						<p:dataTable var="event" id="events" value="#{searchEventView.events}" emptyMessage="#{i18n['event.no_events_found']}" reflow="true" paginator="true"
							paginatorPosition="bottom" rows="#{sessionUser.rowsPerPage}" sortBy="#{event.date}" sortOrder="ascending" lazy="true">

							<p:column headerText="#{i18n['event.type']}">
								<h:outputText value="#{i18n[event.type.name]}" />
							</p:column>

							<p:column headerText="#{i18n['event.candidate']}">
								<h:link value="#{event.jobCandidature.candidate.fullName}" outcome="#{Page.CANDIDATE.getUrl()}">
									<f:param name="id" value="#{event.jobCandidature.candidate.id}" />
								</h:link>
							</p:column>

							<p:column headerText="#{i18n['event.job_offer']}">
								<h:link value="#{event.jobCandidature.jobOffer.title}" outcome="#{Page.JOB.getUrl()}">
									<f:param name="id" value="#{event.jobCandidature.jobOffer.id}" />
								</h:link>
							</p:column>

							<p:column headerText="#{i18n['event.client']}" priority="6">
								<h:link value="#{event.jobCandidature.jobOffer.client.name}" outcome="#{Page.CLIENT.getUrl()}">
									<f:param name="id" value="#{event.jobCandidature.jobOffer.client.id}" />
								</h:link>
							</p:column>

							<p:column headerText="#{i18n['event.user']}" sortBy="#{event.user}" priority="5">
								<h:link value="#{event.user.fullName}" outcome="#{Page.USER.getUrl()}">
									<f:param name="id" value="#{event.user.id}" />
								</h:link>
							</p:column>

							<p:column headerText="#{i18n['event.date']}" sortBy="#{event.date}" priority="4">
								<h:outputText value="#{event.date}">
									<f:convertDateTime type="localDate" pattern="dd/MM/yyyy" />
								</h:outputText>
							</p:column>

							<p:column headerText="#{i18n['event.status']}">
								<div class="tag #{event.status.color}">#{g:translate(event.status.name)}</div>
							</p:column>
						</p:dataTable>
					</div>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
