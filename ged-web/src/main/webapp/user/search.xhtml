<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" 
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core" 
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" 
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:g="http://ged.org/ui" 
	xmlns:h="http://java.sun.com/jsf/html" 
	xmlns:o="http://omnifaces.org/ui"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['user.users']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="users" />

	<ui:define name="actions">
		<p:button value="#{i18n['user.new_user']}" outcome="#{Page.USER_ADD.getUrl()}" />
	</ui:define>

	<ui:define name="breadcrumb">
		<p:breadCrumb styleClass="breadcrumb">
			<p:menuitem value="#{i18n['menu.index']}" outcome="#{Page.INDEX.getUrl()}" />
			<p:menuitem value="#{i18n['user.users']}" disabled="true" />
		</p:breadCrumb>
	</ui:define>

	<ui:define name="content">
		<h:form id="searchUsers">
			<p:panel>
				<div class="panel-content-data">
					<div class="search-bar">
						<cc:inputSearch searchText="#{searchUserView.searchText}" searchAction="#{searchUserView.search}" update="@form" />
					</div>
					<div class="panel-buttons">
						<p:commandButton value="#{i18n['action.export']}" action="#{searchUserView.export}" process="@this" icon="fa-file-excel-o" />
					</div>
				</div>

				<p:dataTable var="user" id="users" value="#{searchUserView.users}" emptyMessage="#{i18n['user.no_users_found']}" reflow="true"
					paginator="true" paginatorPosition="bottom" paginatorTemplate="{PageLinks}" rows="#{sessionUser.rowsPerPage}" sortBy="#{user.name}"
					sortOrder="descending" lazy="true">

					<p:column>
						<cc:avatar value="#{user.imageFileName}" styleClass="image-icon" />
					</p:column>

					<p:column headerText="#{i18n['user.name']}" sortBy="#{user.name}">
						<h:link value="#{user.fullName}" outcome="#{Page.USER.getUrl()}">
							<f:param name="id" value="#{user.id}" />
						</h:link>
					</p:column>

					<p:column headerText="#{i18n['user.email']}">
						<h:outputText value="#{user.email}" />
					</p:column>

					<p:column headerText="#{i18n['user.role']}">
						<h:outputText value="#{g:translate(user.role)}" />
					</p:column>

					<p:column headerText="#{i18n['user.manager']}">
						<h:link value="#{user.manager.fullName}" outcome="#{Page.USER.getUrl()}" rendered="#{not empty user.manager}">
							<f:param name="id" value="#{user.manager.id}" />
						</h:link>
					</p:column>

					<p:column headerText="#{i18n['user.last_login']}">
						<h:outputText value="#{user.lastConnection}">
							<f:convertDateTime type="localDate" pattern="dd/MM/yyyy" />
						</h:outputText>
					</p:column>
				</p:dataTable>
			</p:panel>
		</h:form>
	</ui:define>
</ui:composition>
