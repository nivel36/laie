<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core" xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:g="http://ged.org/ui" xmlns:h="http://java.sun.com/jsf/html" xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" xmlns:ui="http://java.sun.com/jsf/facelets" template="/WEB-INF/templates/template.xhtml">

	<ui:define name="title">
		#{i18n['user.users']}
	</ui:define>

	<ui:param name="selectedMenu" value="users" />

	<ui:define name="breadcrumb">
		<p:breadCrumb homeDisplay="icon" lastItemDisabled="true">
			<p:menuitem value="#{i18n['menu.index']}" outcome="#{Page.INDEX.getUrl()}" />
			<p:menuitem value="#{i18n['user.users']}" />
		</p:breadCrumb>
	</ui:define>

	<ui:define name="buttons">
		<h:form>
			<p:button value="#{i18n['user.new_user']}" outcome="#{Page.USER_ADD.getUrl()}" styleClass="success-button" />
			<p:commandButton value="#{i18n['action.export']}" onclick="export()" icon="fa fa-file-excel-o" styleClass="info-button"/>
		</h:form>
	</ui:define>

	<ui:define name="content">
		<h:form id="searchUsers">
			<p:remoteCommand name="export" process="@form" update="@form growl" action="#{searchUserView.export}" />
			<div class="card">
				<div class="p-grid">
					<div class="p-col-12 p-lg-5">
						<div class="searchBar ui-fluid">
							<cc:inputSearch searchText="#{searchUserView.searchText}" searchAction="#{searchUserView.search}" update="searchUsers:users" />
						</div>
					</div>
					<div class="p-col-12">
						<p:dataTable id="users" value="#{searchUserView.users}" var="user" emptyMessage="#{i18n['user.no_users_found']}" reflow="true" paginator="true" paginatorPosition="bottom"
							rows="#{sessionUser.rowsPerPage}" sortMode="single" lazy="true">
							<p:column headerText="#{i18n['user.name']}" sortBy="#{user.name}">
								<h:link outcome="#{Page.USER.getUrl()}">
									<cc:avatar value="#{user.picture}" styleClass="small" />
									#{user.fullName}
									<f:param name="id" value="#{user.uid}" />
								</h:link>
							</p:column>

							<p:column headerText="#{i18n['user.role']}" sortBy="#{user.role}" >
								<span class="user-role role-#{user.role}">#{i18n[user.role]}</span>
							</p:column>

							<p:column headerText="#{i18n['user.manager']}" sortBy="#{user.manager.name}" >
								<h:link value="#{user.manager.fullName}" outcome="#{Page.USER.getUrl()}" rendered="#{not empty user.manager}">
									<f:param name="id" value="#{user.manager.uid}" />
								</h:link>
							</p:column>

							<p:column headerText="#{i18n['user.last_login']}" sortBy="#{user.lastConnection}" sortOrder="desc">
								<h:outputText value="#{user.lastConnection}">
									<f:convertDateTime type="localDate" pattern="dd/MM/yyyy" />
								</h:outputText>
							</p:column>
						</p:dataTable>
					</div>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
