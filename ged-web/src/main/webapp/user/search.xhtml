<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:i18n="http://ged.com/i18n" xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:p="http://primefaces.org/ui" xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" xmlns:o="http://omnifaces.org/ui"
	xmlns:of="http://omnifaces.org/functions" template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['user.users']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="users" />

	<ui:define name="actions">
		<p:button value="#{i18n['user.new_user']}" outcome="#{Page.USER_ADD.getUrl()}" />
	</ui:define>

	<ui:define name="breadcrumb">
		<p:breadCrumb styleClass="breadcrumb">
			<p:menuitem value="#{i18n['menu.index']}" outcome="#{Page.INDEX.getUrl()}" />
			<p:menuitem value="#{i18n['user.users']}" disabled="true" />
		</p:breadCrumb>
	</ui:define>

	<ui:define name="content">
		<h:form id="searchUsers">
			<div class="panel">
				<div class="panel-content">
					<div class="panel-content-data">
						<cc:inputSearch searchText="#{searchUserView.searchText}" searchAction="#{searchUserView.search}" update="@form" />
						<div class="panel-buttons">
							<p:commandButton value="#{i18n['action.export']}" action="#{searchUserView.export}" process="@this" icon="fa-file-excel-o" />
						</div>
					</div>

					<p:dataTable var="user" id="users" value="#{searchUserView.users}" emptyMessage="#{i18n['user.no_users_found']}" reflow="true"
						paginator="true" paginatorPosition="bottom" paginatorTemplate="{PageLinks}" rows="#{sessionUser.rowsPerPage}"
						sortBy="#{user.name}" sortOrder="descending" lazy="true">

						<p:column>
							<p:graphicImage class="image image-icon" value="/images/#{user.imageFileName}" rendered="#{not empty user.imageFileName}" />
							<p:graphicImage class="image image-icon" value="/resources/img/default-avatar.png" rendered="#{empty user.imageFileName}" />
						</p:column>

						<p:column headerText="#{i18n['user.name']}" sortBy="#{user.name}">
							<h:link value="#{user.fullName}" outcome="#{Page.USER.getUrl()}">
								<f:param name="id" value="#{user.id}" />
							</h:link>
						</p:column>

						<p:column headerText="#{i18n['user.email']}">
							<h:outputText value="#{user.email}" />
						</p:column>

						<p:column headerText="#{i18n['user.role']}">
							<h:outputText value="#{i18n:translate(user.role)}" />
						</p:column>

						<p:column headerText="#{i18n['user.manager']}">
							<h:link value="#{user.manager.fullName}" outcome="#{Page.USER.getUrl()}" rendered="#{not empty user.manager}">
								<f:param name="id" value="#{user.manager.id}" />
							</h:link>
						</p:column>
					</p:dataTable>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
