<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core" xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:g="http://ged.org/ui" xmlns:h="http://java.sun.com/jsf/html" xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" xmlns:ui="http://java.sun.com/jsf/facelets" template="/WEB-INF/templates/template.xhtml">

	<ui:define name="title">
		#{i18n['user.new_user']}
	</ui:define>

	<ui:param name="selectedMenu" value="users" />

	<ui:define name="breadcrumb">
		<p:breadCrumb>
			<p:menuitem value="#{i18n['menu.index']}" outcome="#{Page.INDEX.getUrl()}" />
			<p:menuitem value="#{i18n['user.users']}" outcome="#{Page.USER_SEARCH.getUrl()}" />
			<p:menuitem value="#{i18n['user.new_user']}" disabled="true" />
		</p:breadCrumb>
	</ui:define>

	<ui:define name="buttons">
		<h:form>
			<p:button value="#{i18n['action.cancel']}" outcome="#{Page.USER_SEARCH.getUrl()}" styleClass="secondary-button" />
			<p:commandButton value="#{i18n['action.save']}" onclick="processForm()" styleClass="success-btn" />
		</h:form>
	</ui:define>

	<ui:define name="content">
		<h:form id="userForm">
			<p:remoteCommand name="processForm" process="@form" update="@form growl" action="#{addUserView.save}"/>
			<div class="p-grid">
				<div class="p-col-12 p-xl-6">
					<div class="card card-w-title ui-fluid">
						<h1>#{i18n['user.personal_information']}</h1>
						<div class="p-grid">
							<div class="p-col-12 p-sm-6">
								<g:input id="name" label="#{i18n['user.name']}" value="#{addUserView.user.name}" required="true" />
							</div>
							<div class="p-col-12 p-sm-6">
								<g:input id="surname" label="#{i18n['user.surname']}" value="#{addUserView.user.surname}" required="true" />
							</div>
							<div class="p-col-12 p-sm-6">
								<g:input id="email" label="#{i18n['user.email']}" value="#{addUserView.user.email}" required="true" validator="#{addUserView.validateEmail}" />
							</div>
							<div class="p-col-12 p-sm-6"></div>
							<div class="p-col-12 p-sm-6">
								<g:input id="phone_number" label="#{i18n['user.phone_number']}" value="#{addUserView.user.phoneNumber}" />
							</div>
						</div>
					</div>
				</div>
				<div class="p-col-12 p-xl-6">
					<div class="card card-w-title ui-fluid">
						<h1>#{i18n['user.professional_information']}</h1>
						<div class="p-grid">
							<div class="p-col-12 p-sm-6">
								<g:input type="inputSelect" id="role" value="#{addUserView.user.role}" label="#{i18n['user.role']}" required="true">
									<f:selectItems value="#{roles.list}" var="role" itemValue="#{role}" itemLabel="#{g:translate(role)}" />
									<p:ajax event="change" update=":userForm:role :userForm:managerWrapper" process=":userForm:role" listener="#{addUserView.changeRoleListener}" />
								</g:input>
							</div>
							<div class="p-col-12 p-sm-6">
								<h:panelGroup id="managerWrapper" class="form-field ui-fluid" layout="block">
									<cc:autocomplete id="manager" label="#{i18n['user.manager']}" value="#{addUserView.user.manager}" completeMethod="#{addUserView.queryManager}" converter="userConverter"
										rendered="#{not addUserView.user.admin}">
										<p:column styleClass="user-select image">
											<cc:person value="#{var}" showDescription="false" />
										</p:column>
									</cc:autocomplete>
								</h:panelGroup>
							</div>
							<div class="p-col-12 p-sm-6">
								<g:input id="date_of_join" label="#{i18n['user.date_of_join']}" value="#{addUserView.user.dateOfJoin}" type="calendar" />
							</div>
							<div class="p-col-12 p-sm-6"></div>
							<div class="p-col-12 p-sm-6">
								<g:input id="welcome_email" label="#{i18n['user.send_welcome_email']}" value="#{addUserView.sendWelcomeEmail}" type="inputSwitch">
									<p:ajax process="@this" update="@this passwordWrapper repeatPasswordWrapper" />
								</g:input>
							</div>
							<div class="p-col-12 p-sm-6"></div>
							<h:panelGroup styleClass="p-col-12 p-sm-6" id="passwordWrapper" layout="block">
								<g:input id="password" label="#{i18n['user.password']}" value="#{addUserView.password}" type="password" rendered="#{not addUserView.sendWelcomeEmail}" />
							</h:panelGroup>
							<h:panelGroup styleClass="p-col-12 p-sm-6" id="repeatPasswordWrapper" layout="block">
								<g:input id="repeatPassword" label="#{i18n['user.repeat_password']}" value="#{addUserView.repeatPassword}" type="password" rendered="#{not addUserView.sendWelcomeEmail}" />
							</h:panelGroup>
						</div>
					</div>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
