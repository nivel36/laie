<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" 
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core" 
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" 
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:g="http://ged.org/ui" 
	xmlns:h="http://java.sun.com/jsf/html" 
	xmlns:o="http://omnifaces.org/ui"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	template="/WEB-INF/templates/template.xhtml">
	
	<p:link outcome="#{Page.USER.getUrl()}">
		<f:param name="id" value="#{user.uid}" />
		<div class="user-minicard">
			<div class="user-minicard-image">
				<cc:avatar value="#{user.imageFileName}" />
			</div>
			<div class="user-minicard-info">
				<div class="name">#{user}</div>
				<div class="position">#{g:translate(user.role)}</div>
			</div>
		</div>
	</p:link>
</ui:composition>
