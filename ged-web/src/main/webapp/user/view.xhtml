<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core" xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:g="http://ged.org/ui" xmlns:h="http://java.sun.com/jsf/html" xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" xmlns:ui="http://java.sun.com/jsf/facelets" template="/WEB-INF/templates/template.xhtml">

	<ui:define name="title">
		#{i18n['user.user']} - #{viewUserView.user.fullName}
	</ui:define>

	<ui:param name="selectedMenu" value="users" />

	<ui:define name="breadcrumb">
		<p:breadCrumb>
			<p:menuitem value="#{i18n['menu.index']}" outcome="#{Page.INDEX.getUrl()}" />
			<p:menuitem value="#{i18n['user.users']}" outcome="#{Page.USER_SEARCH.getUrl()}" />
			<p:menuitem value="#{viewUserView.user}" disabled="true" />
		</p:breadCrumb>
	</ui:define>

	<ui:define name="buttons">
		<h:form>
			<p:commandButton value="#{i18n['action.edit']}" process="@this" action="#{viewUserView.editUser}" icon="fa fa-pencil" />
			<p:commandButton value="#{i18n['action.export']}" process="@this" action="#{viewUserView.export}" icon="fa fa-file-excel-o" />
		</h:form>
	</ui:define>

	<ui:define name="content">
		<div class="p-grid">
			<div class="p-col-12 p-xl-6">
				<div class="card user-card">
					<div class="card-header">
						
					</div>
					<div class="user-card-content">
						<cc:avatar value="#{viewUserView.user.imageFileName}" styleClass="user-image with-border" />

						<div class="user-card-name">#{viewUserView.user.fullName}</div>
						<div class="user-card-role">#{g:translate(viewUserView.user.role)}</div>
						<div class="user-detail">
							<div class="p-grid">
								<div class="p-col-12 p-sm-6">
									<cc:outputText label="#{i18n['user.email']}" value="#{viewUserView.user.email}" />
								</div>
								<div class="p-col-12 p-sm-6">
									<cc:outputText label="#{i18n['user.phone_number']}" value="#{viewUserView.user.phoneNumber}" />
								</div>
								<div class="p-col-12 p-sm-6">
									<cc:outputText label="#{i18n['user.date_of_join']}" value="#{viewUserView.user.dateOfJoin}" styleClass="data date_of_join">
										<f:convertDateTime type="localDate" pattern="dd/MM/yyyy" for="text" />
									</cc:outputText>
								</div>
								<div class="p-col-12 p-sm-6">
									<cc:outputText label="#{i18n['user.last_login']}" value="#{viewUserView.user.lastConnection}" styleClass="data last_login">
										<f:convertDateTime type="localDateTime" pattern="dd/MM/yyyy HH:mm" for="text" />
									</cc:outputText>
								</div>
								<div class="p-col-12">
									<div class="data manager">
										<div class="label-container">
											<div class="label">#{i18n['user.manager']}</div>
										</div>
										<div class="text-container">
											<h:panelGroup layout="block" styleClass="text" rendered="#{not viewUserView.user.managed}"> --- </h:panelGroup>
											<h:panelGroup layout="block" class="text" rendered="#{viewUserView.user.managed}">
												<p:link outcome="#{Page.USER.getUrl()}" value="#{viewUserView.user.manager.fullName}">
													<f:param name="id" value="#{viewUserView.user.manager.id}" />
												</p:link>
											</h:panelGroup>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>

			<div class="p-col-12 p-xl-6">
				<h:form id="userTeamForm">
					<cc:users value="#{viewUserView.team}" title="#{i18n['user.team']}" rows="5" />
				</h:form>
			</div>

			<div class="p-col-12 p-xl-8">
				<h:form id="jobOffersForm">
					<cc:jobOffers value="#{viewUserView.jobOffers}" rows="5" />
				</h:form>
			</div>


			<div class="p-col-12 p-xl-4">
				<h:form id="jobMeetingsForm">
					<cc:meetings value="#{viewUserView.meetings}" rows="5" />
				</h:form>
			</div>
		</div>
	</ui:define>
</ui:composition>
