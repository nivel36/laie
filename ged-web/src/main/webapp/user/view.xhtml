<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html" xmlns:i18n="http://ged.com/i18n"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" xmlns:p="http://primefaces.org/ui"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" xmlns:o="http://omnifaces.org/ui"
	xmlns:of="http://omnifaces.org/functions" template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['user.user']}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="users" />

	<ui:define name="content">
		<p:breadCrumb styleClass="breadcrumb">
			<p:menuitem value="#{i18n['menu.index']}" outcome="#{Page.INDEX.getUrl()}" />
			<p:menuitem value="#{i18n['user.users']}" outcome="#{Page.USER_SEARCH.getUrl()}" />
			<p:menuitem value="#{viewUserBean.user}" disabled="true" />
		</p:breadCrumb>

		<div class="grid nogutter">
			<div class="panel user col-12 xl-8">
				<div class="panel-header">
					<div class="panel-header-image">
						<cc:avatar imageFileName="#{viewUserBean.user.imageFileName}" />
					</div>
					<div class="panel-header-data">
						<div class="name">#{viewUserBean.user.fullName}</div>
						<div class="job-profile">#{i18n:translate(viewUserBean.user.role)}</div>
						<div class="data email">
							<span class="icon"><i class="fa fa-envelope"></i></span><span class="text">#{viewUserBean.user.email}</span>
						</div>
						<h:panelGroup layout="block" styleClass="data phone" rendered="#{not empty viewUserBean.user.phoneNumber}">
							<span class="icon"><i class="fa fa-phone"></i></span>
							<span class="text">#{viewUserBean.user.phoneNumber}</span>
						</h:panelGroup>
					</div>
					<h:form>
						<div class="panel-buttons">
							<p:commandButton value="#{i18n['action.export']}" process="@this" action="#{viewUserBean.export}"
								icon="fa-file-excel-o" />
							<p:commandButton value="#{i18n['action.edit']}" process="@this" action="#{viewUserBean.editUser}" />
						</div>
					</h:form>
				</div>
				<div class="panel-content panel-content-data">
					<div class="grid">
						<div class="data manager col-12 sm-6">
							<div class="label">#{i18n['user.manager']}</div>
							<h:panelGroup layout="block" styleClass="name" rendered="#{not viewUserBean.user.managed}"> --- </h:panelGroup>
							<h:panelGroup class="user-minicard" rendered="#{viewUserBean.user.managed}">
								<p:link outcome="#{Page.USER.getUrl()}">
									<f:param name="id" value="#{viewUserBean.user.manager.id}" />
									<div class="user-minicard-image">
										<p:graphicImage class="image" value="/images/#{viewUserBean.user.manager.imageFileName}"
											rendered="#{not empty viewUserBean.user.manager.imageFileName}" />
										<p:graphicImage class="image" value="/resources/img/default-avatar.png"
											rendered="#{empty viewUserBean.user.manager.imageFileName}" />
									</div>
									<div class="user-minicard-info">
										<h:panelGroup layout="block" styleClass="name" rendered="#{viewUserBean.user.managed}">#{viewUserBean.user.manager}</h:panelGroup>
									</div>
								</p:link>
							</h:panelGroup>
						</div>
						<div class="data date_of_join col-12 sm-6">
							<cc:outputText label="#{i18n['user.date_of_join']}" value="#{viewUserBean.user.dateOfJoin}">
								<f:convertDateTime type="localDate" pattern="dd/MM/yyyy" for="element" />
							</cc:outputText>
						</div>
					</div>
				</div>
			</div>
			<div class="col-12 lg-12 xl-4">
				<h:form id="userTeamForm">
					<cc:users users="#{viewUserBean.team}" title="#{i18n['user.team']}" />
				</h:form>
			</div>
			<div class="col-12 lg-12">
				<h:form id="jobOffersForm">
					<cc:jobOffers jobOffers="#{viewUserBean.jobOffers}" />
				</h:form>
			</div>
			<div class="col-12 lg-12 xl-6">
				<h:form id="jobMeetingsForm">
					<cc:jobMeetings />
				</h:form>
			</div>
		</div>
	</ui:define>
</ui:composition>
