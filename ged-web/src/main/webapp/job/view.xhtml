<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core" xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:g="http://ged.org/ui" xmlns:h="http://java.sun.com/jsf/html" xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" xmlns:ui="http://java.sun.com/jsf/facelets" template="/WEB-INF/templates/template.xhtml">

	<ui:define name="title">
		#{i18n['job.job_offer']} - #{viewJobView.jobOffer.title}
	</ui:define>

	<ui:param name="selectedMenu" value="offers" />

	<ui:define name="breadcrumb">
		<p:breadCrumb>
			<p:menuitem value="#{i18n['menu.index']}" outcome="#{Page.INDEX.getUrl()}" />
			<p:menuitem value="#{i18n['job.job_offers']}" outcome="#{Page.JOB_SEARCH.getUrl()}" />
			<p:menuitem value="#{viewJobView.jobOffer}" disabled="true" />
		</p:breadCrumb>
	</ui:define>

	<ui:define name="buttons">
		<h:form>
			<p:commandButton value="#{i18n['action.export']}" action="#{viewJobView.export}" icon="fa fa-file-excel-o" />
			<p:commandButton value="#{i18n['action.edit']}" action="#{viewJobView.editJobOffer}" icon="fa fa-pencil" />
		</h:form>
	</ui:define>

	<ui:define name="content">
		<div class="p-grid">
			<div class="p-col-12 p-xl-6">
				<div class="card job-card">
					<div class="card-header">
						<div class="job-card-client">#{viewJobView.jobOffer.client.name}</div>
						<div class="job-card-name">#{viewJobView.jobOffer.title}</div>
					</div>
					<div class="job-card-content">
						<div class="p-grid">
							<div class="p-col-12 p-sm-6">
								<cc:outputLink label="#{i18n['job.client']}" value="#{viewJobView.jobOffer.client.name}" outcome="#{Page.CLIENT.getUrl()}">
									<f:param name="id" value="#{viewJobView.jobOffer.client.id}" />
								</cc:outputLink>
							</div>

							<div class="p-col-12 p-sm-6">
								<cc:outputText label="#{i18n['job.salary']}" value="#{viewJobView.jobOffer.salary}" />
							</div>
							<div class="p-col-12 p-sm-6">
								<cc:outputText label="#{i18n['job.places']}" value="#{viewJobView.jobOffer.places}" />
							</div>
							<div class="p-col-12 p-sm-6">
								<cc:outputText label="#{i18n['address.city']}" value="#{viewJobView.jobOffer.address.city}" />

							</div>
							<div class="p-col-12 p-sm-6">
								<cc:outputText label="#{i18n['job.state']}" value="#{viewJobView.jobOffer.address.state}" />
							</div>
							<div class="p-col-12">
								<cc:outputText label="#{i18n['job.description']}" value="#{viewJobView.jobOffer.description}" />
							</div>
						</div>
					</div>
				</div>
			</div>

			<div class="p-col-12 p-xl-6">
				<div class="card card-w-title">
					<h1>Datos</h1>
					<div class="p-grid">
						<div class="p-col-12 p-sm-6">
							<cc:outputLink label="#{i18n['job.owner']}" value="#{viewJobView.jobOffer.owner.fullName}" outcome="#{Page.USER.getUrl()}">
								<f:param name="id" value="#{viewJobView.jobOffer.owner.id}" />
							</cc:outputLink>
						</div>

						<div class="p-col-12 p-sm-6">
							<div class="data">
								<div class="label-container">
									<div class="label">#{i18n['job.job_offer_state']}</div>
								</div>
								<div class="text-container">
									<h:form>
										<div class="job-state">
											<p:commandLink action="#{viewJobView.editJobOffer}">
												<span class="tag #{viewJobView.jobOffer.jobOfferState.color}">#{g:translate(viewJobView.jobOffer.jobOfferState.name)}</span>
												<em class="icon fa fa-pencil" />
											</p:commandLink>
										</div>
									</h:form>
								</div>
							</div>
						</div>
						<div class="p-col-12 p-sm-6">
							<cc:outputText label="#{i18n['job.date_opened']}" value="#{viewJobView.jobOffer.dateOpened}">
								<f:convertDateTime type="localDate" pattern="dd/MM/yyyy" for="element" />
							</cc:outputText>
						</div>
						<div class="p-col-12 p-sm-6">
							<cc:outputText label="#{i18n['job.date_closed']}" value="#{viewJobView.jobOffer.dateClosed}">
								<f:convertDateTime type="localDate" pattern="dd/MM/yyyy" for="element" />
							</cc:outputText>
						</div>
						<div class="p-col-12 p-sm-6">
							<div class="data">
								<div class="label-container">
									<div class="label">#{i18n['job.recruiters']}</div>
								</div>
								<div class="text-container">
									<ui:repeat value="#{viewJobView.jobOffer.recruiters}" var="recruiter" varStatus="varStatus">
										<p:link outcome="#{Page.USER.getUrl()}">
											<f:param name="id" value="#{recruiter.id}" />
											<h:outputText value="#{recruiter.fullName}" />
										</p:link>
										<h:outputText value=", " styleClass="text" rendered="#{not varStatus.last}" />
									</ui:repeat>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>


			<div class="p-col-12 p-xl-7">
				<h:form>
					<cc:jobCandidatures value="#{viewJobView.jobCandidatures}" showJobOffer="false" rows="5">
						<p:commandButton value="#{i18n['action.add']}" action="#{viewJobView.selectCandidates}" process="@this">
							<p:ajax event="dialogReturn" listener="#{viewJobView.onCloseSelectCandidateDialog}" update="@form" />
						</p:commandButton>
					</cc:jobCandidatures>
				</h:form>
			</div>
		</div>
	</ui:define>
</ui:composition>
