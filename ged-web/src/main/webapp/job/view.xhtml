<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html" xmlns:i18n="http://ged.com/i18n"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" xmlns:p="http://primefaces.org/ui"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" xmlns:o="http://omnifaces.org/ui"
	xmlns:of="http://omnifaces.org/functions" template="/WEB-INF/templates/default.xhtml">

	<ui:define name="title">
		<title>#{i18n['job.job_offer']} - {viewJobBean.jobOffer.name}</title>
	</ui:define>

	<ui:param name="selectedMenu" value="offers" />

	<ui:define name="content">
		<p:breadCrumb styleClass="breadcrumb">
			<p:menuitem value="#{i18n['menu.index']}" outcome="#{Page.INDEX.getUrl()}" />
			<p:menuitem value="#{i18n['job.job_offers']}" outcome="#{Page.JOB_SEARCH.getUrl()}" />
			<p:menuitem value="#{viewJobBean.jobOffer.name}" disabled="true" />
		</p:breadCrumb>

		<div class="grid nogutter">
			<div class="panel job col-12 xl-8">
				<div class="panel-header">
					<div class="panel-header-data">
						<div class="panel-header-title">#{i18n['job.job_offer']}</div>
					</div>
					<h:form>
						<div class="panel-buttons">
							<p:commandButton value="#{i18n['action.export']}" action="#{viewJobBean.export}" icon="fa-file-excel-o" />
							<p:commandButton value="#{i18n['action.edit']}" action="#{viewJobBean.editJobOffer}" />
						</div>
					</h:form>
				</div>
				<div class="panel-content panel-content-data">
					<div class="grid">
						<div class="col-12 lg-6 xl-4">
							<cc:outputText label="#{i18n['job.name']}" value="#{viewJobBean.jobOffer.name}" />
						</div>
						<div class="col-12 lg-6 xl-4">
							<cc:outputText label="#{i18n['job.client']}" value="#{viewJobBean.jobOffer.client.name}" />
						</div>
						<div class="col-12 lg-6 xl-4">
							<cc:outputText label="#{i18n['job.places']}" value="#{viewJobBean.jobOffer.places}" />
						</div>
						<div class="col-12 lg-6 xl-4">
							<cc:outputText label="#{i18n['job.date_opened']}" value="#{viewJobBean.jobOffer.dateOpened}">
								<f:convertDateTime type="localDate" pattern="dd/MM/yyyy" for="element" />
							</cc:outputText>
						</div>
						<div class="col-12 lg-6 xl-4">
							<cc:outputText label="#{i18n['job.date_closed']}" value="#{viewJobBean.jobOffer.dateClosed}">
								<f:convertDateTime type="localDate" pattern="dd/MM/yyyy" for="element" />
							</cc:outputText>
						</div>
						<div class="col-12 lg-6 xl-4">
							<cc:outputText label="#{i18n['address.city']}" value="#{viewJobBean.jobOffer.city}" />

						</div>
						<div class="col-12 lg-6 xl-4">
							<cc:outputText label="#{i18n['address.state']}" value="#{viewJobBean.jobOffer.state}" />

						</div>
						<div class="col-12">
							<cc:outputText label="#{i18n['job.description']}" value="#{viewJobBean.jobOffer.description}" />
						</div>
					</div>
				</div>
			</div>
			<div class="col-12">
				<h:form id="candidatesForm">
					<cc:jobCandidatures jobCandidatures="#{viewJobBean.jobCandidatures}" showJobOffer="false">
						<p:commandButton value="#{i18n['action.add']}" actionListener="#{viewJobBean.selectCandidates}" process="@this">
							<p:ajax event="dialogReturn" listener="#{viewJobBean.onCloseSelectCandidateDialog}" update="@form" />
						</p:commandButton>
					</cc:jobCandidatures>
				</h:form>
			</div>

			<div class="col-12 md-12 lg-6">
				<p:panel header="#{i18n['job_meeting.conducted_job_meetings']}">
				</p:panel>
			</div>
			<div class="col-12 md-12 lg-6">
				<p:panel header="#{i18n['job_meeting.planned_job_meetings']}">
				</p:panel>
			</div>
		</div>
	</ui:define>
</ui:composition>
