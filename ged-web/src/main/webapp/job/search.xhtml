<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core" xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:g="http://ged.org/ui" xmlns:h="http://java.sun.com/jsf/html" xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" xmlns:ui="http://java.sun.com/jsf/facelets" template="/WEB-INF/templates/template.xhtml">

	<ui:define name="title">
		#{i18n['job.job_offer']}
	</ui:define>

	<ui:param name="selectedMenu" value="offers" />

	<ui:define name="breadcrumb">
		<p:breadCrumb>
			<p:menuitem value="#{i18n['menu.index']}" outcome="#{Page.INDEX.getUrl()}" />
			<p:menuitem value="#{i18n['job.job_offers']}" disabled="true" />
		</p:breadCrumb>
	</ui:define>

	<ui:define name="buttons">
		<h:form>
			<p:button value="#{i18n['job.new_job_offer']}" outcome="#{Page.JOB_ADD.getUrl()}" styleClass="ui-button-success ui-button-outlined" />
			<p:commandButton value="#{i18n['action.export']}" onclick="export()" icon="fa fa-file-excel-o" styleClass="ui-button-info ui-button-outlined"/>
		</h:form>
	</ui:define>

	<ui:define name="content">
		<h:form id="jobOfferSearchform">
			<p:remoteCommand name="export" process="@form" update="@form growl" action="#{searchJobView.export}" />
			<div class="card">
				<div class="p-grid">
					<div class="p-col-12 p-lg-5">
						<div class="searchBar ui-fluid">
							<cc:inputSearch searchText="#{searchJobView.searchText}" searchAction="#{searchJobView.search}" update="jobOfferSearchform:jobOffers" />
						</div>
					</div>
					<div class="p-col-12">
						<p:dataTable id="jobOffers" var="jobOffer" value="#{searchJobView.jobOffers}" emptyMessage="#{i18n['job.no_jobs_found']}" reflow="true" paginator="true"
							paginatorPosition="bottom" rows="#{sessionUser.rowsPerPage}" sortBy="#{jobOffer.title}" sortOrder="descending" lazy="true">

							<p:column headerText="#{i18n['job.title']}" sortBy="#{jobOffer.title}">
								<h:link outcome="#{Page.JOB.getUrl()}">#{jobOffer.title} - ${jobOffer.address.city}
									<f:param name="id" value="#{jobOffer.uid}" />
								</h:link>
							</p:column>

							<p:column headerText="#{i18n['job.client']}" sortBy="#{jobOffer.client.name}">
								<h:link value="#{jobOffer.client.name}" outcome="#{Page.CLIENT.getUrl()}">
									<f:param name="id" value="#{jobOffer.client.uid}" />
								</h:link>
							</p:column>

							<p:column headerText="#{i18n['job.places']}">
								<h:outputText value="#{jobOffer.places}" />
							</p:column>

							<p:column headerText="#{i18n['user.owner']}" sortBy="#{user.owner.name}">
								<h:link value="#{jobOffer.owner.fullName}" outcome="#{Page.USER.getUrl()}">
									<f:param name="id" value="#{jobOffer.owner.uid}" />
								</h:link>
							</p:column>

							<p:column headerText="#{i18n['job.job_offer_state']}">
								<cc:jobOfferState value="#{jobOffer.state}" />
							</p:column>
						</p:dataTable>
					</div>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
