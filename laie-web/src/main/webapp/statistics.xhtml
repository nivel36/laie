<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:po="http://primefaces.org/roma">

	<h:panelGroup layout="block"
		rendered="#{statisticsViewPart.showAppStatistics}">
		<div class="col-12 md:col-6 lg:col-3">
			<cc:statisticsPanel value="#{statisticsViewPart.getPanelValue(1)}"
				title="#{i18n['settings.statistics.type.'.concat(statisticsViewPart.getPanelTitle(1))]}"
				percentageChange="#{statisticsViewPart.getPanelPercentageChange(1)}" />
		</div>
		<div class="col-12 md:col-6 lg:col-3">
			<cc:statisticsPanel value="#{statisticsViewPart.getPanelValue(2)}"
				title="#{i18n['settings.statistics.type.'.concat(statisticsViewPart.getPanelTitle(2))]}"
				percentageChange="#{statisticsViewPart.getPanelPercentageChange(2)}" />
		</div>
		<div class="col-12 md:col-6 lg:col-3">
			<cc:statisticsPanel value="#{statisticsViewPart.getPanelValue(3)}"
				title="#{i18n['settings.statistics.type.'.concat(statisticsViewPart.getPanelTitle(3))]}"
				percentageChange="#{statisticsViewPart.getPanelPercentageChange(3)}" />
		</div>
		<div class="col-12 md:col-6 lg:col-3">
			<cc:statisticsPanel value="#{statisticsViewPart.getPanelValue(4)}"
				title="#{i18n['settings.statistics.type.'.concat(statisticsViewPart.getPanelTitle(4))]}"
				percentageChange="#{statisticsViewPart.getPanelPercentageChange(4)}" />
		</div>
	</h:panelGroup>

	<h:panelGroup layout="block"
		rendered="#{statisticsViewPart.showUserStatistics}">
		<div class="col-12 md:col-6 lg:col-3">
			<cc:statisticsPanel value="#{statisticsViewPart.getPanelValue(5)}"
				title="#{i18n['settings.statistics.type.'.concat(statisticsViewPart.getPanelTitle(5))]}"
				percentageChange="#{statisticsViewPart.getPanelPercentageChange(5)}" />
		</div>
		<div class="col-12 md:col-6 lg:col-3">
			<cc:statisticsPanel value="#{statisticsViewPart.getPanelValue(6)}"
				title="#{i18n['settings.statistics.type.'.concat(statisticsViewPart.getPanelTitle(6))]}"
				percentageChange="#{statisticsViewPart.getPanelPercentageChange(6)}" />
		</div>
		<div class="col-12 md:col-6 lg:col-3">
			<cc:statisticsPanel value="#{statisticsViewPart.getPanelValue(7)}"
				title="#{i18n['settings.statistics.type.'.concat(statisticsViewPart.getPanelTitle(7))]}"
				percentageChange="#{statisticsViewPart.getPanelPercentageChange(7)}" />
		</div>
		<div class="col-12 md:col-6 lg:col-3">
			<cc:statisticsPanel value="#{statisticsViewPart.getPanelValue(8)}"
				title="#{i18n['settings.statistics.type.'.concat(statisticsViewPart.getPanelTitle(8))]}"
				percentageChange="#{statisticsViewPart.getPanelPercentageChange(8)}" />
		</div>
	</h:panelGroup>
</ui:composition>
