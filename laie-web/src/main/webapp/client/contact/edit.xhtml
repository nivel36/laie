<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:g="http://nivel.36/laie/ui"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	template="/WEB-INF/templates/template.xhtml">

	<ui:define name="title">
		#{clientEditView.client.name}
	</ui:define>

	<ui:define name="content">
		<h:form id="contactForm">
			<div class="p-grid">
				<div class="p-col-12">
					<div class="card buttons">
						<p:button value="#{i18n['action.cancel']}"
							outcome="/client/view.xhtml"
							styleClass="ui-button-secondary ui-button-outlined">
							<f:param name="client"
								value="#{editContactView.contact.clientUid}" />
						</p:button>
						<p:commandButton value="#{i18n['action.delete']}"
							action="#{editContactView.delete}"
							styleClass="ui-button-danger ui-button-outlined">
							<p:confirm message="#{i18n['contact.message.remove']}"
								icon="pi pi-exclamation-triangle" />
						</p:commandButton>
						<p:commandButton value="#{i18n['action.save']}"
							action="#{editContactView.save}"
							styleClass="ui-button-success ui-button-outlined" />
					</div>
				</div>
				<div class="p-col-12 p-xl-6">
					<div class="card card-w-title ui-fluid">
						<h1>#{i18n['contact.data']}</h1>
						<div class="p-grid">
							<div class="p-col-12 p-sm-6">
								<g:input id="name" label="#{i18n['contact.name']}"
									value="#{editContactView.contact.name}" required="true" />
							</div>
							<div class="p-col-12 p-sm-6">
								<g:input id="surname" label="#{i18n['contact.surname']}"
									value="#{editContactView.contact.surname}" required="true" />
							</div>
							<div class="p-col-12 p-sm-6">
								<g:input id="position" label="#{i18n['contact.position']}"
									value="#{editContactView.contact.position}" />
							</div>
							<div class="p-col-12 p-sm-6">
								<g:input id="email" label="#{i18n['contact.email']}"
									value="#{editContactView.contact.email}" />
							</div>
							<div class="p-col-12 p-sm-6">
								<g:input id="phone_number"
									label="#{i18n['contact.phone_number']}"
									value="#{editContactView.contact.phoneNumber}" />
							</div>
						</div>
					</div>
				</div>
			</div>
			<p:confirmDialog global="true" showEffect="fade" hideEffect="fade"
				responsive="true" width="350">
				<p:commandButton value="#{i18n['action.confirm.no']}" type="button"
					styleClass="ui-confirmdialog-no ui-button-flat" />
				<p:commandButton value="#{i18n['action.confirm.yes']}" type="button"
					styleClass="ui-confirmdialog-yes" />
			</p:confirmDialog>
		</h:form>
	</ui:define>
</ui:composition>
