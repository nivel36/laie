<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core" xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:g="http://nivel.36/laie/ui" xmlns:h="http://java.sun.com/jsf/html" xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" xmlns:ui="http://java.sun.com/jsf/facelets" template="/WEB-INF/templates/template.xhtml">

	<ui:define name="title">
		#{clientEditView.newClient}
	</ui:define>

	<ui:define name="breadcrumb">
		<p:breadCrumb>
			<p:menuitem value="#{i18n['menu.index']}" outcome="/index.xhtml" />
			<p:menuitem value="#{i18n['client.clients']}" outcome="/client/search.xhtml" />
			<p:menuitem value="#{addContactView.client.name}" outcome="/client/view.xhtml">
				<f:param name="id" value="#{addContactView.client.uid}" />
			</p:menuitem>
			<p:menuitem value="#{i18n['contact.new_contact']}" disabled="true" />
		</p:breadCrumb>
	</ui:define>

	<ui:define name="buttons">
		<h:form>
			<p:button value="#{i18n['action.cancel']}" outcome="/client/view.xhtml" styleClass="ui-button-secondary ui-button-outlined">
				<f:param name="id" value="#{addContactView.client.uid}" />
			</p:button>
			<p:commandButton value="#{i18n['action.save']}" onclick="processForm()" styleClass="ui-button-success ui-button-outlined" />
		</h:form>
	</ui:define>

	<ui:define name="content">
		<div class="p-grid">
			<div class="p-col-12 p-xl-6">
				<h:form id="contactForm">
					<p:remoteCommand name="processForm" process="@form" update="@form growl" action="#{addContactView.save}" />
					<h:panelGroup id="contact" styleClass="card card-w-title ui-fluid" layout="block">
						<h1>#{i18n['client.client']}</h1>
						<div class="p-grid">
							<div class="p-col-12 p-sm-6">
								<g:input id="name" label="#{i18n['contact.name']}" value="#{addContactView.contact.name}" required="true" />
							</div>
							<div class="p-col-12 p-sm-6">
								<g:input id="surname" label="#{i18n['contact.surname']}" value="#{addContactView.contact.surname}" required="true" />
							</div>
							<div class="p-col-12 p-sm-6">
								<g:input id="position" label="#{i18n['contact.position']}" value="#{addContactView.contact.position}" />
							</div>
							<div class="p-col-12 p-sm-6">
								<g:input id="email" label="#{i18n['contact.email']}" value="#{addContactView.contact.email}" />
							</div>
							<div class="p-col-12 p-sm-6">
								<g:input id="phone_number" label="#{i18n['contact.phone_number']}" value="#{addContactView.contact.phoneNumber}" />
							</div>
						</div>
					</h:panelGroup>
				</h:form>
			</div>
		</div>
	</ui:define>
</ui:composition>
