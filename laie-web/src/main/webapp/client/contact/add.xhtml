<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:g="http://nivel.36/laie/ui"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	template="/WEB-INF/templates/template.xhtml">

	<ui:define name="title">
		#{i18n['contact.new_contact']}
	</ui:define>

	<ui:param name="selectedMenu" value="client" />

	<ui:define name="content">
		<h:form id="contactForm">
			<div class="grid">
				<div class="col-12 xl:col-6 xl:col-offset-3">
					<p:card>
						<f:facet name="title">
							<h4>#{i18n['contact.new_contact']}</h4>
						</f:facet>
						<p:divider />
						<div class="ui-fluid grid">
							<div class="col-12 md:col-4">
								<h5>#{i18n['contact.data']}</h5>
							</div>
							<div class="col-12 md:col-8">
								<div class="formgrid grid">
									<g:input id="name" label="#{i18n['contact.name']}"
										value="#{addContactView.contact.name}" required="true"
										styleClass="col" />
									<g:input id="surname" label="#{i18n['contact.surname']}"
										value="#{addContactView.contact.surname}" required="true"
										styleClass="col" />
								</div>
								<g:input id="position" label="#{i18n['contact.position']}"
									value="#{addContactView.contact.position}" />
								<g:input id="email" label="#{i18n['contact.email']}"
									value="#{addContactView.contact.email}" required="true" />
								<div class="formgrid grid">
									<g:input id="phone_number"
										label="#{i18n['contact.phone_number']}"
										value="#{addContactView.contact.phoneNumber}"
										styleClass="col-fixed" />
								</div>
							</div>
						</div>
						<f:facet name="footer">
							<div class="flex justify-content-end">
								<p:button value="#{i18n['action.cancel']}"
									outcome="/client/view.xhtml"
									styleClass="ui-button-secondary mr-2 mb-2">
									<f:param name="client" value="#{addContactView.client.id}" />
								</p:button>
								<p:commandButton value="#{i18n['action.save']}"
									action="#{addContactView.save}"
									styleClass="ui-button-primary mb-2" update="@form" />
							</div>
						</f:facet>
					</p:card>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
