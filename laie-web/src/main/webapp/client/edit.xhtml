<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" xmlns:f="http://java.sun.com/jsf/core" xmlns:g="http://nivel.36/laie/ui"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" xmlns:ui="http://java.sun.com/jsf/facelets" template="/WEB-INF/templates/template.xhtml">

	<ui:define name="title">
		#{i18n['client.edit_client']} - #{editClientView.client.name}
	</ui:define>

	<ui:param name="selectedMenu" value="clients" />

	<ui:define name="content">
		<h:form id="clientForm">
			<div class="card">
				<div class="p-grid">
					<div class="p-col-12 p-xl-6">
						<div id="client" class="form-card ui-fluid">
							<h5>#{i18n['client.client']}</h5>
							<div class="p-grid p-formgrid">
								<div class="p-col-12">
									<g:input id="name" label="#{i18n['client.name']}" value="#{editClientView.client.name}" required="true" />
								</div>
								<div class="p-col-12 p-sm-6">
									<g:input id="cif" label="#{i18n['client.cif']}" value="#{editClientView.client.cif}" />
								</div>
								<div class="p-col-12 p-sm-6">
									<g:input id="phoneNumber" label="#{i18n['client.phone_number']}" value="#{editClientView.client.phoneNumber}" />
								</div>
								<div class="p-col-12 p-sm-6">
									<g:input id="city" label="#{i18n['client.city']}" value="#{editClientView.client.address.city}" />
								</div>
								<div class="p-col-12 p-sm-6">
									<g:input id="state" label="#{i18n['client.state']}" value="#{editClientView.client.address.region}" />
								</div>
							</div>
						</div>
					</div>
					<div class="p-col-12">
						<div class="form-buttons">
							<p:button value="#{i18n['action.cancel']}" outcome="/client/view" styleClass="ui-button-secondary ui-button-outlined">
								<f:param name="client" value="#{editClientView.client.id}" />
							</p:button>
							<p:commandButton value="#{i18n['action.save']}" action="#{editClientView.save}" styleClass="ui-button-success ui-button-outlined" update="@form"/>
						</div>
					</div>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
