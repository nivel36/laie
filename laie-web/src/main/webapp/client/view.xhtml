<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:g="http://nivel.36/laie/ui"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:o="http://omnifaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	template="/WEB-INF/templates/template.xhtml">

	<ui:define name="title">
		#{i18n['client.client']} - #{viewClientView.client.name}
	</ui:define>

	<ui:param name="selectedMenu" value="clients" />

	<ui:define name="content">
		<div class="grid">
			<div class="col-12 xl:col-8">
				<div class="title-card">
					<h:form>
						<div class="title-card-content">
							<div class="title-card-content-info">
								<div class="title">#{viewClientView.client.name}</div>
								<div class="subtitle">#{viewClientView.client.cif}</div>
								<div class="text">
									<h:panelGroup
										rendered="#{not empty viewClientView.client.address.region}"
										styleClass="region">
										<i class="pi pi-map-marker" aria-hidden="true" />#{viewClientView.client.address.region}</h:panelGroup>

									<h:panelGroup
										rendered="#{not empty viewClientView.client.phoneNumber}"
										styleClass="phone">
										<i class="pi pi-phone" aria-hidden="true" />#{viewClientView.client.phoneNumber}</h:panelGroup>
								</div>
							</div>

							<p:menuButton styleClass="menu-button" icon="pi pi-ellipsis-v"
								id="menu-button">
								<p:menuitem value="#{i18n['action.edit']}"
									outcome="/client/edit.xhtml" icon="pi pi-pencil"
									rendered="#{viewClientView.editable}">
									<f:param name="client" value="#{viewClientView.client.id}" />
								</p:menuitem>
								<p:menuitem value="#{i18n['bookmark.add_to_bookmarks']}"
									action="#{viewClientView.addBookmark}"
									rendered="#{viewClientView.bookmarkable}" process="@this"
									update="menu-button" icon="pi pi-bookmark" />
								<p:menuitem value="#{i18n['bookmark.remove_from_bookmarks']}"
									action="#{viewClientView.removeFromBookmarks}"
									rendered="#{not viewClientView.bookmarkable}" process="@this"
									update="menu-button" icon="pi pi-bookmark" />
							</p:menuButton>
						</div>
					</h:form>
				</div>

				<cc:jobOffers id="jobOffers" value="#{viewClientView.jobOffers}"
					rows="5" showClient="false">
					<h:form id="jobOffersForm">
						<p:button icon="pi pi-plus" outcome="/job/add.xhtml"
							process="@this" styleClass="ui-button-success ui-button-outlined"
							rendered="#{viewClientView.addJobOffer}">
							<f:param name="client" value="#{viewClientView.client.id}" />
						</p:button>
					</h:form>
				</cc:jobOffers>
			</div>

			<div class="col-12 xl:col-4">
				<p:card styleClass="card card-w-title">
					<f:facet name="title">
						<h5>#{i18n['client.other_data']}</h5>
					</f:facet>
					<cc:outputLink label="#{i18n['job.owner']}"
						value="#{viewClientView.client.owner.fullName}"
						outcome="/user/view.xhtml">
						<f:param name="user" value="#{viewClientView.client.owner.id}" />
					</cc:outputLink>
				</p:card>

				<cc:contacts value="#{viewClientView.contacts}">
					<p:button icon="pi pi-plus" outcome="/client/contact/add.xhtml"
						process="@this" styleClass="ui-button-success ui-button-outlined">
						<f:param name="client" value="#{viewClientView.client.id}" />
					</p:button>
				</cc:contacts>
			</div>
		</div>
	</ui:define>
</ui:composition>
