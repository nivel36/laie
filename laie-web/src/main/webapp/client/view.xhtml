<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:g="http://nivel.36/laie/ui"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	template="/WEB-INF/templates/template.xhtml">

	<ui:define name="title">
		#{i18n['client.client']} - #{viewClientView.client.name}
	</ui:define>

	<ui:param name="selectedMenu" value="clients" />

	<ui:define name="content">
		<div class="p-grid">
			<div class="p-col-12">
				<div class="card buttons">
					<h:form>
						<p:button value="#{i18n['action.edit']}"
							outcome="/client/edit.xhtml"
							styleClass="ui-button-secondary ui-button-outlined" >
							<f:param name="client" value="#{viewClientView.client.uid}" />
						</p:button>
						<p:commandButton value="#{i18n['action.export']}" process="@this"
							action="#{viewClientView.export}" icon="pi pi-file-excel"
							styleClass="ui-button-info ui-button-outlined" />
						<p:commandButton value="#{i18n['bookmark.add_to_bookmarks']}" process="@this" update="@form :bookmarks"
							action="#{viewClientView.addToBoorkmarks}" icon="pi pi-bookmark"
							styleClass="ui-button-info ui-button-outlined" rendered="#{viewClientView.bookmarkable}"/> 
						<p:commandButton value="#{i18n['bookmark.remove_from_bookmarks']}" process="@this" update="@form :bookmarks"
							action="#{viewClientView.removeFromBoorkmarks}" icon="pi pi-bookmark"
							styleClass="ui-button-info ui-button-outlined" rendered="#{not viewClientView.bookmarkable}"/>
					</h:form>
				</div>
			</div>
			<div class="p-col-12 p-xl-8 p-col-nogutter">
				<div class="p-col-12">
					<div class="card client-card">
						<div class="client-card-header"></div>
						<div class="client-card-content">
							<div class="client-card-name">#{viewClientView.client.name}</div>
							<div class="client-detail">
								<div class="p-grid">
									<div class="p-col">
										<cc:outputText label="#{i18n['client.cif']}"
											value="#{viewClientView.client.cif}" />
									</div>
									<div class="p-col">
										<cc:outputText label="#{i18n['client.phone_number']}"
											value="#{viewClientView.client.phoneNumber}" />
									</div>
									<div class="p-col">
										<cc:outputText label="#{i18n['client.city']}"
											value="#{viewClientView.client.address.city}" />
									</div>
									<div class="p-col">
										<cc:outputText label="#{i18n['client.state']}"
											value="#{viewClientView.client.address.region}" />
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>

				<div class="p-col-12">
					<cc:jobOffers id="jobOffers" value="#{viewClientView.jobOffers}"
						rows="5">
						<h:form id="jobOffersForm">
							<p:button value="#{i18n['job.new_job_offer']}"
								outcome="/job/add.xhtml" process="@this"
								styleClass="ui-button-success ui-button-outlined">
								<f:param name="clientId" value="#{viewClientView.client.uid}" />
							</p:button>
						</h:form>
					</cc:jobOffers>
				</div>
			</div>

			<div class="p-col-12 p-sm-8 p-md-6 p-lg-5 p-xl-4">
				<cc:contacts value="#{viewClientView.client.contacts}">
					<p:button value="#{i18n['contact.new_contact']}"
						outcome="/client/contact/add.xhtml" process="@this"
						styleClass="ui-button-success ui-button-outlined">
						<f:param name="clientId" value="#{viewClientView.client.uid}" />
					</p:button>
				</cc:contacts>
			</div>
		</div>
	</ui:define>
</ui:composition>
