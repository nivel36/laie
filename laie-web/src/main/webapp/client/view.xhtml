<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core" xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:g="http://nivel.36/laie/ui" xmlns:h="http://java.sun.com/jsf/html" xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" xmlns:ui="http://java.sun.com/jsf/facelets" template="/WEB-INF/templates/template.xhtml">

	<ui:define name="title">
		#{i18n['client.client']} - #{viewClientView.client.name}
	</ui:define>

	<ui:param name="selectedMenu" value="clients" />

	<ui:define name="breadcrumb">
		<p:breadCrumb>
			<p:menuitem value="#{i18n['menu.index']}" outcome="#{Page.INDEX.getUrl()}" />
			<p:menuitem value="#{i18n['client.clients']}" outcome="#{Page.CLIENT_SEARCH.getUrl()}" />
			<p:menuitem value="#{viewClientView.client.name}" disabled="true" />
		</p:breadCrumb>
	</ui:define>

	<ui:define name="buttons">
		<h:form>
			<p:commandButton value="#{i18n['action.edit']}" process="@this" action="#{viewClientView.editClient}" icon="fa fa-pencil" styleClass="ui-button-secondary ui-button-outlined" />
			<p:commandButton value="#{i18n['action.export']}" process="@this" action="#{viewClientView.export}" icon="fa fa-file-excel-o" styleClass="ui-button-info ui-button-outlined"/>
		</h:form>
	</ui:define>

	<ui:define name="content">
		<div class="p-grid">
			<div class="p-col-12 p-xl-8 p-col-nogutter">
			<div class="p-col-12">
				<div class="card client-card">
					<div class="card-header"></div>
					<div class="client-card-content">
					<div class="client-card-name">#{viewClientView.client.name}</div>
						<div class="client-detail">
							<div class="p-grid">
								<div class="p-col">
									<cc:outputText label="#{i18n['client.cif']}" value="#{viewClientView.client.cif}" />
								</div>
								<div class="p-col">
									<cc:outputText label="#{i18n['client.phone_number']}" value="#{viewClientView.client.phoneNumber}" />
								</div>
								<div class="p-col">
									<cc:outputText label="#{i18n['client.city']}" value="#{viewClientView.client.address.city}" />
								</div>
								<div class="p-col">
									<cc:outputText label="#{i18n['client.state']}" value="#{viewClientView.client.address.region}" />
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
			
			<div class="p-col-12">
				<cc:jobOffers id="jobOffers" value="#{viewClientView.jobOffers}" rows="5">
					<h:form id="jobOffersForm">
						<p:button value="#{i18n['job.new_job_offer']}" outcome="#{Page.JOB_ADD.getUrl()}" process="@this" styleClass="ui-button-success ui-button-outlined" >
							<f:param name="clientId" value="#{viewClientView.client.uid}" />
						</p:button>
					</h:form>
				</cc:jobOffers>
			</div>
			</div>
			
			<div class="p-col-12 p-sm-8 p-md-6 p-lg-5 p-xl-4">
				<cc:contacts value="#{viewClientView.client.contacts}" >
					<p:button value="#{i18n['contact.new_contact']}" outcome="#{Page.CONTACT_ADD.getUrl()}" process="@this" styleClass="ui-button-success ui-button-outlined" >
						<f:param name="clientId" value="#{viewClientView.client.uid}" />
					</p:button>
				</cc:contacts>
			</div>
		</div>
	</ui:define>
</ui:composition>
