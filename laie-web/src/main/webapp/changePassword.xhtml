<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:p="http://primefaces.org/ui" lang="es">

<h:head>
	<f:facet name="first">
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
	</f:facet>
	<title>#{i18n['config.change_password']}</title>
</h:head>

<h:body styleClass="change-password-body" onload="document.body.style.opacity='1'">
	<p:growl id="growl" globalOnly="true" />
	<h:form id="loginForm">
		<div class="card login-panel ui-fluid">
			<div class="login-panel-content">
				<h5>#{i18n['config.change_password']}</h5>
				<div class="p-grid">
					<div class="p-col-12 password-container">
						<h:panelGroup>
							<label>#{i18n['config.password']}</label>
							<div class="login-input">
								<p:inputText id="username" value="#{changePasswordView.password}" required="true" />
							</div>
						</h:panelGroup>
					</div>
					<div class="p-col-12 new-password-container">
						<h:panelGroup>
							<label>#{i18n['config.new_password']}</label>
							<div class="login-input">
								<p:password id="new_password" value="#{changePasswordView.newPassword}" required="true" />
							</div>
						</h:panelGroup>
					</div>
					<div class="p-col-12 repeat-password-container">
						<h:panelGroup>
							<label>#{i18n['config.repeat_password']}</label>
							<div class="login-input">
								<p:password id="repeat_password" value="#{changePasswordView.repeatPassword}" required="true" />
							</div>
						</h:panelGroup>
					</div>

					<div class="p-col-6">
						<p:button outcome="/index.xtml" value="${i18n['action.cancel']}" styleClass="ui-button-secondary ui-button-outlined" />
					</div>
					<div class="p-col-6">
						<p:commandButton action="#{changePasswordView.change}" value="${i18n['action.accept']}" update="@form growl" styleClass="ui-button-outlined ui-button-success" />
					</div>
				</div>
			</div>
		</div>
	</h:form>
	<h:outputStylesheet name="css/primeicons.css" library="roma-layout" />
	<h:outputStylesheet name="css/primeflex.min.css" library="roma-layout" />
	<h:outputStylesheet name="css/layout.css" library="roma-layout" />
</h:body>

</html>
