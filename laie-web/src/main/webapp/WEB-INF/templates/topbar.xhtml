<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:p="http://primefaces.org/ui" xmlns:po="http://primefaces.org/roma"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components">

	<div class="layout-topbar">
		<a class="layout-menu-button layout-topbar-icon" href="#"> <i class="pi pi-bars" aria-hidden="true" /></a>
		<ui:include src="./menu.xhtml" />
		<div class="topbar-menu-form">
			<h:form>
				<p:menuButton styleClass="topbar-menu" id="menu-button" value="#{sessionUser.get().fullName}">
					<p:menuitem value="#{i18n['menu.profile']}" outcome="/user/view.xhtml" icon="pi pi-user">
						<f:param name="user" value="#{sessionUser.get().id}" />
					</p:menuitem>
					<p:menuitem value="#{i18n['menu.meetings']}" outcome="/meeting/search.xhtml" icon="pi pi-calendar" />
					<p:menuitem value="#{i18n['menu.setting']}" outcome="/config.xhtml" icon="pi pi-cog" />
					<p:menuitem value="#{i18n['user.logout']}" action="#{sessionUser.logout}" icon="pi pi-sign-out" />
				</p:menuButton>
			</h:form>
		</div>
	</div>

</ui:composition>
