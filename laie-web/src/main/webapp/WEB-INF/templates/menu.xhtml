<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:p="http://primefaces.org/ui" xmlns:po="http://primefaces.org/roma">

	<div class="layout-menu-container">
		<div class="menu-scroll-content">
			<h:form id="menuform">
				<po:menu widgetVar="RomaMenuWidget">
					<p:menuitem id="om_index" value="#{i18n['menu.index']}" icon="pi pi-home"
						containerStyleClass="#{selectedMenu eq 'index' ? 'active-menuitem' : 'menuitem' }" outcome="/index.xhtml" />
					<p:menuitem id="om_candidates" value="#{i18n['menu.candidates']}" icon="pi pi-users"
						containerStyleClass="#{selectedMenu eq 'candidates' ? 'active-menuitem' : 'menuitem' }" outcome="/candidate/search.xhtml" />
					<p:menuitem id="om_offers" value="#{i18n['menu.offers']}" icon="pi pi-compass"
						containerStyleClass="#{selectedMenu eq 'offers' ? 'active-menuitem' : 'menuitem' }" outcome="/job/search.xhtml" />
					<p:menuitem id="om_clients" value="#{i18n['menu.clients']}" icon="pi pi-briefcase"
						containerStyleClass="#{selectedMenu eq 'clients' ? 'active-menuitem' : 'menuitem' }" outcome="/client/search.xhtml)" />
					<p:menuitem id="om_reports" value="#{i18n['menu.reports']}" icon="pi pi-chart-bar"
						containerStyleClass="#{selectedMenu eq 'reports' ? 'active-menuitem' : 'menuitem' }" outcome="/report/search.xhtml" />
					<p:menuitem id="om_users" value="#{i18n['menu.users']}" icon="pi pi-user"
						containerStyleClass="#{selectedMenu eq 'users' ? 'active-menuitem' : 'menuitem' }" outcome="/user/search.xhtml" />
					<p:menuitem id="om_config" value="#{i18n['menu.settings']}" icon="pi pi-cog"
						containerStyleClass="#{selectedMenu eq 'settings' ? 'active-menuitem' : 'menuitem' }" outcome="/settings.xhtml" />
				</po:menu>
			</h:form>
		</div>
	</div>
</ui:composition>
