<ui:composition xmlns="http://www.w3.org/1999/xhtml" 
                xmlns:h="http://java.sun.com/jsf/html" 
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets" 
                xmlns:p="http://primefaces.org/ui"
                xmlns:po="http://primefaces.org/roma">

    <div class="layout-menu-container">
        <div class="menu-scroll-content">
            <h:form id="menuform">
					 <po:menu widgetVar="RomaMenuWidget">
						<p:menuitem id="om_candidates" value="#{i18n['menu.candidates']}" icon="fa fa-fw fa-users" containerStyleClass="#{selectedMenu eq 'candidates' ? 'active-menuitem' : 'menuitem' }"
							outcome="#{Page.CANDIDATE_SEARCH.getUrl()}" />
						<p:menuitem id="om_offers" value="#{i18n['menu.offers']}" icon="fa fa-fw fa-suitcase" containerStyleClass="#{selectedMenu eq 'offers' ? 'active-menuitem' : 'menuitem' }"
							outcome="#{Page.JOB_SEARCH.getUrl()}" />
						<p:menuitem id="om_clients" value="#{i18n['menu.clients']}" icon="fa fa-fw fa-industry" containerStyleClass="#{selectedMenu eq 'clients' ? 'active-menuitem' : 'menuitem' }"
							outcome="#{Page.CLIENT_SEARCH.getUrl()}" />
						<p:menuitem id="om_events" value="#{i18n['menu.events']}" icon="fa fa-fw fa-laptop" containerStyleClass="#{selectedMenu eq 'events' ? 'active-menuitem' : 'menuitem' }"
							outcome="#{Page.EVENT_SEARCH.getUrl()}" />
						<p:menuitem id="om_reports" value="#{i18n['menu.reports']}" icon="fa fa-fw fa-area-chart" containerStyleClass="#{selectedMenu eq 'reports' ? 'active-menuitem' : 'menuitem' }"
							outcome="#{Page.REPORT.getUrl()}" />
						<p:menuitem id="om_meetings" value="#{i18n['menu.meetings']}" icon="fa fa-fw fa-calendar" containerStyleClass="#{selectedMenu eq 'meetings' ? 'active-menuitem' : 'menuitem' }"
							outcome="#{Page.MEETING_SEARCH.getUrl()}" />
						<p:menuitem id="om_users" value="#{i18n['menu.users']}" icon="fa fa-fw fa-user" containerStyleClass="#{selectedMenu eq 'users' ? 'active-menuitem' : 'menuitem' }"
							outcome="#{Page.USER_SEARCH.getUrl()}" />
					</po:menu>
				</h:form>
			</div>
		</div>
</ui:composition>
