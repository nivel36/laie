<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core" xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:g="http://nivel.36/laie/ui" xmlns:h="http://java.sun.com/jsf/html" xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:pc="http://primefaces.org/roma">
	<div class="layout-right-panel">
		<h:form id="chat" style="height:100%">
			<p:tabView activeIndex="#{chatView.activePanel}" id="tabs">
				<p:tab title="#{i18n['chat.contacts']}">
					<h:panelGroup id="users" layout="block" styleClass="users">
						<div class="users-search ui-g">
							<div class="ui-flId ui-g-12">
								<cc:inputSearch id="searchText" searchText="#{chatView.searchText}" searchAction="#{chatView.search}" placeholder="#{i18n['chat.search_an_user']}" update="chat:tabs:users" />
							</div>
						</div>
						<ui:repeat var="user" value="#{chatView.users}">
							<p:commandLink action="#{chatView.selectUser(user)}" process="@this" update="@form">
								<cc:person name="#{user.fullName}" path="#{user.picture.path}" description="#{user.email}"/>
							</p:commandLink>
						</ui:repeat>
					</h:panelGroup>
				</p:tab>
				<p:tab title="#{chatView.selectedUser.fullName}">
					<h:panelGroup id="messages" styleClass="messages" layout="block"> 
						<div id="chatId" />
						<script type="text/javascript">
 							function socketListener(message, channel, event) {   
 								if (message.firstMsgOfDay) {
 									document.getElementById("chatId").innerHTML += '<div class="messages-title"><span>' + message.date + '</span></div>';
 								}
 								document.getElementById("chatId").innerHTML += '<div class="messages-content ui-g">';
  								document.getElementById("chatId").innerHTML += 	 '<div class="time ui-g-3">' + message.time + '</div>';
  								document.getElementById("chatId").innerHTML +=   '<div class="message ui-g-9">' + message.message + '</div>';
  								document.getElementById("chatId").innerHTML += '</div>';
 							}
 						</script>
 					</h:panelGroup>
					<div class="messages-input ui-g">
						<div class="ui-flId ui-g-12">
							<p:remoteCommand name="keyPressChatMessageRc" action="#{chatView.updateMessage}" process="@this chatMessage" />
							<p:remoteCommand name="enterChatMessageRc" action="#{chatView.sendMessage}" process="@this chatMessage" update="chatMessage" />
							<p:inputText id="chatMessage" placeholder="#{i18n['chat.write_a_message']}" value="#{chatView.currentMessage}" 
								 onkeyup="if (event.keyCode == 13) { enterChatMessageRc(); } else { keyPressChatMessageRc(); return false; }" />
						</div>
					</div>
				</p:tab>
			</p:tabView>
		</h:form>
		<f:websocket channel="chat" onmessage="socketListener" user="#{sessionUser.user}" />
	</div>
</ui:composition>
