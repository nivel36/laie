<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      lang="#{sessionUser.locale.language}">

    <h:head>
        <f:facet name="first">
            <meta http-equiv="X-UA-Compatible" content="IE=edge" />
            <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"/>
            <meta name="apple-mobile-web-app-capable" content="yes" />
        </f:facet>
        <title>#{i18n['error.error']}</title>
    </h:head>

    <h:body styleClass="exception-body error">
        <div class="exception-panel">
            <div class="exception-content">
                <img src="./resources/roma-layout/images/pages/icon-error.svg" alt="Error"/>
                <h1>#{i18n['error.error_title']}</h1>
                <p>#{i18n['error.error_message']}</p>
                <p:button outcome="/index" value="#{i18n['error.goto_dashboard']}" />
            </div>
        </div>

        <h:outputStylesheet name="css/layout-blue.css" library="roma-layout" />
    </h:body>

</html>
