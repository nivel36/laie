<?xml version="1.0" encoding="UTF-8"?>
<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:composite="http://xmlns.jcp.org/jsf/composite"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:g="http://nivel.36/laie/ui"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://java.sun.com/jsf/facelets">

	<composite:interface>
		<composite:attribute name="value" required="true" />
		<composite:attribute name="styleClass" required="false" default="" />
		<composite:attribute name="title" required="false"
			default="#{i18n['contact.contacts']}" />
		<composite:attribute name="rows" required="false" default="10" />
	</composite:interface>

	<composite:implementation>
		<p:card id="#{cc.clientId}"
			styleClass="card card-w-title contacts #{cc.attrs.styleClass}">
			<f:facet name="title">
				<h5>#{cc.attrs.title}</h5>
			</f:facet>
			<p:dataView var="contact" value="#{cc.attrs.value}"
				gridIcon="pi pi-th-large" listIcon="pi pi-bars" paginator="true"
				layout="grid" paginatorPosition="bottom" rows="4"
				emptyMessage="#{i18n['client.no_contacts_found']}" lazy="true">
				<p:dataViewGridItem columns="1">
					<cc:contact value="#{contact}" />
				</p:dataViewGridItem>
			</p:dataView>

			<div class="card-header-buttons">
				<composite:insertChildren />
			</div>
		</p:card>
	</composite:implementation>
</ui:component>
