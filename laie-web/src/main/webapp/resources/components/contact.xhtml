<ui:component xmlns="http://www.w3.org/1999/xhtml" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" xmlns:composite="http://xmlns.jcp.org/jsf/composite"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:g="http://nivel.36/laie/ui" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui" xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://java.sun.com/jsf/facelets">

	<composite:interface>
		<composite:attribute name="value" required="true" type="es.nivel36.laie.ejb.client.ContactDto" />
		<composite:attribute name="styleClass" required="false" default="" />
	</composite:interface>

	<composite:implementation>
		<div id="#{cc.clientId}" class="contact #{cc.attrs.styleClass}">
			<div class="contact-box">
				<div class="contact-name">#{cc.attrs.value.fullName}</div>
				<h:panelGroup layout="block" styleClass="contact-position" rendered="#{not empty cc.attrs.value.position}">#{cc.attrs.value.position}</h:panelGroup>
				<div class="contact-data">
					<h:panelGroup layout="block" styleClass="contact-phone" rendered="#{not empty cc.attrs.value.phoneNumber}">
						<i class="pi pi-phone" />#{cc.attrs.value.phoneNumber}
					</h:panelGroup>
					<h:panelGroup layout="block" styleClass="contact-email" rendered="#{not empty cc.attrs.value.email}">
						<i class="pi pi-envelope" />#{cc.attrs.value.email}
					</h:panelGroup>
				</div>
			</div>
			<div class="buttons">
				<p:button icon="pi pi-pencil" outcome="/client/contact/edit.xhtml" styleClass="ui-button-outlined">
					<f:param name="contact" value="#{cc.attrs.value.uid}" />
					<f:param name="client" value="#{cc.attrs.value.clientUid}" />
				</p:button>
			</div>
		</div>
	</composite:implementation>
</ui:component>
