<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core" 
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:composite="http://xmlns.jcp.org/jsf/composite" 
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:g="http://nivel.36/laie/ui" 
	xmlns:h="http://java.sun.com/jsf/html" 
	xmlns:o="http://omnifaces.org/ui"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://java.sun.com/jsf/facelets">

	<composite:interface componentType="inputYearMonth">
		<composite:attribute name="label" required="false" />
		<composite:attribute name="required" type="java.lang.Boolean" default="false" />
		<composite:attribute name="disabled" type="java.lang.Boolean" default="false" />
		<composite:attribute name="value" type="es.nivel36.laie.web.core.YearMonth" required="true" />
		<composite:attribute name="plusYear" type="java.lang.Integer" required="false" default="0" />
		<composite:attribute name="minusYear" type="java.lang.Integer" required="false" default="20" />
		<composite:attribute name="styleClass" required="false" default="" />
	</composite:interface>

	<composite:implementation>
		<div id="#{cc.clientId}" class="p-field input-group input-year-month #{cc.attrs.styleClass}">
			<p:outputLabel id="label" for="month" value="#{cc.attrs.label}" styleClass="label" />
			<div class="input-container">
				<p:selectOneMenu id="month" value="#{cc.attrs.value.month}" required="#{cc.attrs.required}" styleClass="input input-select"
					disabled="#{cc.attrs.disabled}">
					<f:selectItem itemLabel="#{i18n['date.month']}" itemValue="" />
					<f:selectItems var="month" value="#{cc.months}" itemValue="#{month.monthNumber}" itemLabel="#{month.monthName}" />
				</p:selectOneMenu>
				<p:selectOneMenu id="year" value="#{cc.attrs.value.year}" required="#{cc.attrs.required}" styleClass="input input-select"
					disabled="#{cc.attrs.disabled}">
					<f:selectItem itemLabel="#{i18n['date.year']}" itemValue="" />
					<f:selectItems var="year" value="#{cc.years}" itemValue="#{year}" itemLabel="#{year}" />
				</p:selectOneMenu>
			</div>
			<p:message id="message" for="month" styleClass="message-error" />
		</div>
	</composite:implementation>
</ui:component>
