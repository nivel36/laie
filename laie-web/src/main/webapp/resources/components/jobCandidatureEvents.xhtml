<?xml version="1.0" encoding="UTF-8"?>
<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:composite="http://xmlns.jcp.org/jsf/composite"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:g="http://nivel.36/laie/ui"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://java.sun.com/jsf/facelets">

	<composite:interface>
		<composite:attribute name="value" required="true" />
		<composite:attribute name="styleClass" required="false" default="" />
		<composite:attribute name="title" required="false"
			default="#{i18n['event.events']}" />
		<composite:attribute name="rows" required="false" default="10" />
	</composite:interface>

	<composite:implementation>

		<div id="#{cc.clientId}"
			class="ui-card card card-w-title events #{cc.attrs.styleClass}">
			<div class="ui-card-body">
				<div class="ui-card-title">
					<h5>#{cc.attrs.title}</h5>
				</div>
				<div class="ui-card-content">
					<div id="#{cc.clientId}:table">
						<p:dataTable var="event" id="events" value="#{cc.attrs.value}"
							emptyMessage="#{i18n['event.no_events_found']}" reflow="true"
							paginator="true" paginatorPosition="bottom"
							rows="#{cc.attrs.rows}" sortBy="#{event.date}"
							sortOrder="ascending" lazy="true"
							styleClass="ui-datatable-borderless">

							<p:column headerText="#{i18n['event.candidate']}">
								<h:link value="#{event.jobCandidature.candidate.fullName}"
									outcome="/candidate/view.xhtml">
									<f:param name="candidate"
										value="#{event.jobCandidature.candidate.id}" />
								</h:link>
							</p:column>

							<p:column headerText="#{i18n['event.state']}">
								<h:outputText
									value="#{i18n['job_candidature_state.'.concat(event.state)]}" />
							</p:column>

							<p:column headerText="#{i18n['event.type']}">
								<h:outputText
									value="#{i18n['job_candidature_event.'.concat(event.type)]}" />
							</p:column>

							<p:column headerText="#{i18n['event.date']}">
								<h:outputText value="#{event.date}">
									<f:convertDateTime type="localDate" pattern="dd/MM/yyyy" />
								</h:outputText>
							</p:column>

							<p:column styleClass="button">
								<h:form>
									<p:commandButton icon="pi pi-eye"
										onclick="$(PrimeFaces.escapeClientId('#{cc.clientId}:detail:#{event.id}')).css('display', 'block');$(PrimeFaces.escapeClientId('#{cc.clientId}:table')).css('display', 'none')" />
								</h:form>
							</p:column>
						</p:dataTable>
						<h:panelGroup id="children" styleClass="buttons">
							<composite:insertChildren />
						</h:panelGroup>
					</div>
					<div id="#{cc.clientId}:detail">
						<ui:repeat var="event" value="#{cc.attrs.value}">
							<div id="#{cc.clientId}:detail:#{event.id}" style="display: none">
								<cc:outputLink label="#{i18n['event.candidate']}"
									value="#{event.jobCandidature.candidate.fullName}"
									outcome="/candidate/view">
									<f:param name="candidate"
										value="#{event.jobCandidature.candidate.id}" />
								</cc:outputLink>
								<cc:outputLink label="#{i18n['event.user']}"
									value="#{event.user.fullName}" outcome="/user/view">
									<f:param name="user" value="#{event.user.id}" />
								</cc:outputLink>
								<cc:outputText label="#{i18n['event.state']}"
									value="#{i18n['job_candidature_state.'.concat(event.state)]}" />
								<cc:outputText label="#{i18n['event.type']}"
									value="#{i18n['job_candidature_event.'.concat(event.type)]}" />
								<cc:outputText label="#{i18n['event.date']}"
									value="#{event.date}">
									<f:convertDateTime type="localDate"
										pattern="dd/MM/yyyy HH:mm:ss" for="text" />
								</cc:outputText>
								<cc:outputText label="#{i18n['event.notes']}"
									value="#{event.notes}" />
								<div class="form-buttons">
									<p:commandButton icon="pi pi-times"
										onclick="$(PrimeFaces.escapeClientId('#{cc.clientId}:detail:#{event.id}')).css('display', 'none');$(PrimeFaces.escapeClientId('#{cc.clientId}:table')).css('display', 'block')" />
								</div>
							</div>
						</ui:repeat>
					</div>
				</div>
			</div>
		</div>
	</composite:implementation>
</ui:component>
