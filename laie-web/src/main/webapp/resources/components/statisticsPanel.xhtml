<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core" 
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:composite="http://xmlns.jcp.org/jsf/composite" 
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:g="http://nivel.36/laie/ui" 
	xmlns:h="http://java.sun.com/jsf/html" 
	xmlns:o="http://omnifaces.org/ui"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://java.sun.com/jsf/facelets">

	<composite:interface>
		<composite:attribute name="value" />
		<composite:attribute name="title" />
		<composite:attribute name="percentageChange" />
		<composite:attribute name="styleClass" required="false" default="" />
	</composite:interface>

	<composite:implementation>
		<div id="#{cc.clientId}" class="overview-box card #{cc.attrs.styleClass}">
			<div class="overview-box-value">#{cc.attrs.value}</div>
			<div class="overview-box-title">#{cc.attrs.title}</div>

			<p:graphicImage name="images/dashboard/graph-tasks.svg"
				library="roma-layout" />
			<div class="overview-box-status">
				#{cc.attrs.percentageChange}% <i
					class="pi#{cc.attrs.percentageChange >= 0 ? 'pi-arrow-circle-up' : 'pi-arrow-circle-down'}" />
			</div>
		</div>
	</composite:implementation>
</ui:component>
