<?xml version="1.0" encoding="UTF-8"?>
<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:composite="http://xmlns.jcp.org/jsf/composite"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:g="http://nivel.36/laie/ui"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://java.sun.com/jsf/facelets">


	<composite:interface>
		<composite:attribute name="value" required="true" />
		<composite:attribute name="styleClass" required="false" default="" />
		<composite:attribute name="title" required="false"
			default="#{i18n['meeting.meetings']}" />
		<composite:attribute name="emptyMessage" required="false"
			default="#{i18n['meeting.no_meetings']}" />
		<composite:attribute name="rows" required="false" default="10" />
	</composite:interface>

	<composite:implementation>
		<p:card id="#{cc.clientId}"
			class="card card-w-title meetings #{cc.attrs.styleClass}">
			<f:facet name="title">
				<h5>#{cc.attrs.title}</h5>
			</f:facet>
			<div class="panel-content-data">
				<ui:repeat var="meeting" value="#{cc.attrs.value}"
					rendered="#{not empty cc.attrs.value}">
					<h:link outcome="/meeting/edit.xhtml" style="display:block;">
						<f:param name="meeting" value="#{meeting.id}" />
						<cc:meeting value="#{meeting}" />
					</h:link>
				</ui:repeat>
				<h:panelGroup class="meetings-empty-message"
					rendered="#{empty cc.attrs.value}">
					<h:outputText value="#{cc.attrs.emptyMessage}" />
				</h:panelGroup>
			</div>
			<div class="card-header-buttons">
				<composite:insertChildren />
			</div>
		</p:card>
	</composite:implementation>
</ui:component>
