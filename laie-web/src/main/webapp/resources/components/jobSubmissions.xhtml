<?xml version="1.0" encoding="UTF-8"?>
<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:composite="http://xmlns.jcp.org/jsf/composite"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:g="http://nivel.36/laie/ui"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://java.sun.com/jsf/facelets">

	<composite:interface>
		<composite:attribute name="value" required="true" />
		<composite:attribute name="showCandidate" default="true" />
		<composite:attribute name="showJobOffer" default="true" />
		<composite:attribute name="styleClass" required="false" default="" />
		<composite:attribute name="title" required="false"
			default="#{i18n['job_submission.job_submissions']}" />
		<composite:attribute name="rows" required="false" default="10" />
	</composite:interface>

	<composite:implementation>
		<div id="#{cc.clientId}"
			class="ui-card card card-w-title jobSubmissions #{cc.attrs.styleClass}">
			<div class="ui-card-body">
				<div class="ui-card-title">
					<h5>#{cc.attrs.title}</h5>
				</div>
				<div class="ui-card-content">
					<p:dataTable var="jobSubmission" value="#{cc.attrs.value}"
						emptyMessage="#{i18n['job_submission.no_job_submissions_found']}"
						reflow="true" paginator="true" paginatorPosition="bottom"
						rows="#{cc.attrs.rows}" sortBy="#{jobOffer.title}"
						sortOrder="ascending" styleClass="ui-datatable-borderless">

						<p:column headerText="#{i18n['job_submission.job_offer']}"
							rendered="#{cc.attrs.showJobOffer}">
							<h:link value="#{jobSubmission.jobOffer.title}"
								outcome="/job/view.xhtml">
								<f:param name="jobOffer" value="#{jobSubmission.jobOffer.id}" />
							</h:link>
						</p:column>
						<p:column headerText="#{i18n['job_submission.city']}"
							rendered="#{cc.attrs.showJobOffer}">
					#{jobSubmission.jobOffer.address.city} <h:outputText value="("
								rendered="#{not empty jobSubmission.jobOffer.address.region}" /> #{jobSubmission.jobOffer.address.region}<h:outputText
								value=")"
								rendered="#{not empty jobSubmission.jobOffer.address.region}" />
						</p:column>
						<p:column headerText="#{i18n['job_submission.client']}"
							rendered="#{cc.attrs.showJobOffer}">
							<h:link value="#{jobSubmission.jobOffer.client.name}"
								outcome="/client/view.xhtml">
								<f:param name="client"
									value="#{jobSubmission.jobOffer.client.id}" />
							</h:link>
						</p:column>
						<p:column headerText="#{i18n['job_submission.job_submission']}"
							rendered="#{cc.attrs.showCandidate}" styleClass="align-center">

							<h:link outcome="/candidate/view.xhtml">
								<cc:avatar name="#{jobSubmission.candidate.fullName}"
									path="#{jobSubmission.candidate.picture.path}"
									styleClass="small mr-2" />
								<h:outputText styleClass="link"
									value="#{jobSubmission.candidate.fullName}" />
								<f:param name="candidate" value="#{jobSubmission.candidate.id}" />
							</h:link>
						</p:column>
						<p:column headerText="#{i18n['candidate.rating']}"
							rendered="#{cc.attrs.showCandidate}">
							<p:rating value="#{jobSubmission.candidate.rating}"
								cancel="false" readonly="true" />
						</p:column>
						<p:column
							headerText="#{i18n['job_submission.state']}">

							<p:link outcome="/event/add.xhtml">
								<f:param name="jobSubmission" value="#{jobSubmission.id}" />
								<div class="tag">#{jobSubmission.state.name}</div>
							</p:link>
							<p:progressBar value="#{jobSubmission.state.progress}"
								style="height: 0.5rem;" styleClass="mt-2" />
						</p:column>
					</p:dataTable>
					<div class="card-header-buttons">
						<composite:insertChildren />
					</div>
				</div>
			</div>
		</div>
	</composite:implementation>
</ui:component>
