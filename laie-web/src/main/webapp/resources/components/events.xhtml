<?xml version="1.0" encoding="UTF-8"?>
<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:composite="http://xmlns.jcp.org/jsf/composite"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:g="http://nivel.36/laie/ui"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://java.sun.com/jsf/facelets">

	<composite:interface componentType="events">
		<composite:attribute name="value" required="true" />
		<composite:attribute name="styleClass" required="false" default="" />
		<composite:attribute name="rowStyleClass" required="false" default="" />
		<composite:attribute name="title" required="false"
			default="#{i18n['event.events']}" />
		<composite:attribute name="rows" required="false" default="10" />
		<composite:attribute name="showUser" required="false" default="true" />
	</composite:interface>

	<composite:implementation>
		<p:card id="#{cc.clientId}"
			class="card card-w-title events #{cc.attrs.styleClass}">
			<f:facet name="title">
				<h5>#{cc.attrs.title}</h5>
			</f:facet>
			<p:dataView var="event" value="#{cc.attrs.value}"
				gridIcon="pi pi-th-large" listIcon="pi pi-bars" paginator="true"
				layout="grid" paginatorPosition="bottom" rows="5"
				emptyMessage="#{i18n['user.no_team']}" lazy="true"
				gridRowStyleClass="event #{cc.attrs.rowStyleClass}">
				<p:dataViewGridItem columns="1">
					<h:panelGroup rendered="#{event.entityName eq 'CLIENT'}">
						<i class="pi pi-compass client" />
					</h:panelGroup>
					<h:panelGroup rendered="#{event.entityName eq 'CANDIDATE'}">
						<i class="pi pi-users candidate" />
					</h:panelGroup>
					<h:panelGroup rendered="#{event.entityName eq 'CONTACT'}">
						<i class="pi pi-user contact" />
					</h:panelGroup>
					<h:panelGroup rendered="#{event.entityName eq 'JOB_OFFER'}">
						<i class="pi pi-briefcase job" />
					</h:panelGroup>
					<span class="event-title"><h:link
							value="#{event.entityTitle}" outcome="/client/view.xhtml"
							rendered="#{event.entityName eq 'CLIENT'}">
							<f:param name="client" value="#{event.entityId}" />
						</h:link> <h:link value="#{event.entityTitle}"
							outcome="/candidate/view.xhtml"
							rendered="#{event.entityName eq 'CANDIDATE'}">
							<f:param name="candidate" value="#{event.entityId}" />
						</h:link> <h:link value="#{event.entityTitle}"
							outcome="/contact/view.xhtml"
							rendered="#{event.entityName eq 'CONTACT'}">
							<f:param name="contact" value="#{event.entityId}" />
						</h:link> <h:link value="#{event.entityTitle}" outcome="/job/view.xhtml"
							rendered="#{event.entityName eq 'JOB_OFFER'}">
							<f:param name="jobOffer" value="#{event.entityId}" />
						</h:link></span>
					<span class="event-time"><h:outputText
							value="#{cc.elapsedTime(event.date)}" /></span>
					<p>
						<h:link value="#{event.user.fullName}" outcome="/user/view.xhtml">
							<f:param name="user" value="#{event.user.id}" />
						</h:link>
						ha
						<h:outputText value="#{i18n['event.'.concat(event.type)]}" />
						<h:outputText value=" " />
						<h:outputText value="#{i18n['event.'.concat(event.entityName)]}" />
						<h:outputText value=" " />
						<h:link value="#{event.entityTitle}" outcome="/client/view.xhtml"
							rendered="#{event.entityName eq 'CLIENT'}">
							<f:param name="client" value="#{event.entityId}" />
						</h:link>
						<h:link value="#{event.entityTitle}"
							outcome="/candidate/view.xhtml"
							rendered="#{event.entityName eq 'CANDIDATE'}">
							<f:param name="candidate" value="#{event.entityId}" />
						</h:link>
						<h:link value="#{event.entityTitle}" outcome="/contact/view.xhtml"
							rendered="#{event.entityName eq 'CONTACT'}">
							<f:param name="contact" value="#{event.entityId}" />
						</h:link>
						<h:link value="#{event.entityTitle}" outcome="/job/view.xhtml"
							rendered="#{event.entityName eq 'JOB_OFFER'}">
							<f:param name="jobOffer" value="#{event.entityId}" />
						</h:link>
					</p>
				</p:dataViewGridItem>
			</p:dataView>
			<div class="card-header-buttons">
				<composite:insertChildren />
			</div>
		</p:card>
	</composite:implementation>
</ui:component>
