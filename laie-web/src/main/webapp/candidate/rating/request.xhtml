<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" xmlns:f="http://java.sun.com/jsf/core" xmlns:g="http://nivel.36/laie/ui"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" xmlns:ui="http://java.sun.com/jsf/facelets" template="/WEB-INF/templates/template.xhtml">

	<ui:define name="title">
		#{i18n['candidate.new_candidate']}
	</ui:define>

	<ui:param name="selectedMenu" value="candidates" />

	<ui:define name="content">
		<h:form id="candidateForm">
			<div class="card">
				<div class="p-grid">
					<div class="p-col-12 p-md-6">
						<div class="form-card ui-fluid">
							<h5>#{i18n['rating.request']}</h5>
							<div class="p-grid p-formgrid">
								<div class="p-col-12 p-sm-6">
									<cc:autocomplete id="requestTo" label="#{i18n['rating.request_to']}" value="#{addRatingRequest.requestTo}"
										completeMethod="#{addRatingRequest.query}">
										<p:column styleClass="user-select image">
											<cc:person name="#{var.fullName}" path="#{var.picture.path}" description="#{var.email}" />
										</p:column>
									</cc:autocomplete>
								</div>
								<div class="p-col-12">
									<g:input id="notes" type="textarea" label="#{i18n['rating.request_notes']}" value="#{addRatingRequest.notes}" />
								</div>
							</div>
						</div>
					</div>

					<div class="p-col-12">
						<div class="form-buttons">
							<p:button value="#{i18n['action.cancel']}" outcome="/candidate/view.xhtml" styleClass="ui-button-secondary ui-button-outlined">
								<f:param name="candidate" value="#{addRatingRequest.candidate.id}" />
							</p:button>
							<p:commandButton value="#{i18n['action.send']}" action="#{addRatingRequest.send}" update="@form growl"
								styleClass="ui-button-success ui-button-outlined" process="@form" />
						</div>
					</div>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
