<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:g="http://nivel.36/laie/ui"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	template="/WEB-INF/templates/template.xhtml">

	<ui:define name="title">
		Laie
	</ui:define>

	<ui:param name="selectedMenu" value="index" />

	<ui:define name="content">
		<h:form>
			<div class="grid">
				<div class="col-12 md:col-6 lg:col-3">
					<div class="overview-box card">
						<div class="overview-box-value">90</div>
						<div class="overview-box-title">OFERTAS</div>

						<p:graphicImage name="images/dashboard/graph-tasks.svg"
							library="roma-layout" />
						<div class="overview-box-status">
							+8.9% <i class="pi pi-arrow-circle-up" />
						</div>
					</div>
				</div>
				<div class="col-12 md:col-6 lg:col-3">
					<div class="overview-box card">
						<div class="overview-box-value">1259</div>
						<div class="overview-box-title">CANDIDATOS</div>

						<p:graphicImage name="images/dashboard/graph-purchases.svg"
							library="roma-layout" />
						<div class="overview-box-status">
							+67.2% <i class="pi pi-arrow-circle-up" />
						</div>
					</div>
				</div>
				<div class="col-12 md:col-6 lg:col-3">
					<div class="overview-box card">
						<div class="overview-box-value">21</div>
						<div class="overview-box-title">OFERTAS CERRADAS</div>

						<p:graphicImage name="images/dashboard/graph-issues.svg"
							library="roma-layout" />
						<div class="overview-box-status">
							-3.0% <i class="pi pi-arrow-circle-down" />
						</div>
					</div>
				</div>
				<div class="col-12 md:col-6 lg:col-3">
					<div class="overview-box card">
						<div class="overview-box-value">42</div>
						<div class="overview-box-title">MENSAJES</div>

						<p:graphicImage name="images/dashboard/graph-messages.svg"
							library="roma-layout" />
						<div class="overview-box-status">
							-2.5% <i class="pi pi-arrow-circle-down" />
						</div>
					</div>
				</div>
				<div class="col-12 xl:col-8">
					<cc:jobOffers value="#{indexView.jobOffers}" rows="5"
						showClient="#{true}">
						<p:button icon="pi pi-plus" outcome="/job/add.xhtml"
							styleClass="ui-button-success ui-button-outlined" />
					</cc:jobOffers>

					<cc:candidates value="#{indexView.candidates}"
						title="#{i18n['candidate.last_candidates']}" rows="5">
						<p:button icon="pi pi-plus" outcome="/candidate/add.xhtml"
							styleClass="ui-button-success ui-button-outlined" />
					</cc:candidates>
				</div>

				<div class="col-12 xl:col-4">
					<cc:meetings value="#{indexView.meetings}"
						title="#{i18n['meeting.planned_meetings']}"
						emptyMessage="#{i18n['meeting.no_planned']}" rows="5">
						<p:button icon="pi pi-plus" outcome="/meeting/add.xhtml"
							styleClass="ui-button-success ui-button-outlined" />
					</cc:meetings>
					
					<cc:events title="#{i18n['event.last_events']}" rows="5"
						value="#{indexView.actions}" />
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
