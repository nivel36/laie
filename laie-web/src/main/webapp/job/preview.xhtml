<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:g="http://nivel.36/laie/ui"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:o="http://omnifaces.org/ui" 
	xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	template="/WEB-INF/templates/template.xhtml">

	<ui:define name="title">
		#{i18n['job.new_job_offer']}
	</ui:define>

	<ui:param name="selectedMenu" value="offers" />

	<ui:define name="breadcrumb">
		<p:breadCrumb>
			<p:menuitem value="#{i18n['menu.index']}" outcome="/index.xhtml" />
			<p:menuitem value="#{i18n['job.job_offers']}" outcome="/job/search.xhtml" />
			<p:menuitem value="#{previewJobView.jobOffer}" outcome="/job/view.xhtml">
				<f:param name="id" value="#{previewJobView.jobOffer.id}" />
			</p:menuitem>
			<p:menuitem value="#{i18n['job.preview']}" disabled="true" />
		</p:breadCrumb>
	</ui:define>

	<ui:define name="buttons">
		<h:form>
			<p:button value="#{i18n['action.back']}" outcome="/job/edit.xhtml" styleClass="ui-button-secondary ui-button-outlined">
				<f:param name="id" value="#{previewJobView.jobOffer.id}" />
			</p:button>
		</h:form>
	</ui:define>

	<ui:define name="content">
		<div class="p-grid">
			<div class="p-col-12 p-xl-6">
				<div class="card card-w-title ui-flId">
					<h1>#{previewJobView.jobOffer.title}</h1>
					<h:outputText value="#{previewJobView.jobOffer.description}" escape="false" />
				</div>
			</div>
		</div>
	</ui:define>
</ui:composition>
