<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" xmlns:f="http://java.sun.com/jsf/core" xmlns:g="http://nivel.36/laie/ui"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" xmlns:ui="http://java.sun.com/jsf/facelets" template="/WEB-INF/templates/template.xhtml">

	<ui:define name="title">
		#{i18n['job.new_job_offer']}
	</ui:define>

	<ui:param name="selectedMenu" value="offers" />

	<ui:define name="content">
		<h:form id="jobOfferForm">
			<div class="card">
				<div class="p-grid">
					<div class="p-col-12 p-md-6">
						<div class="form-card ui-fluid">
							<h5>#{i18n['job.data']}</h5>
							<div class="p-grid p-formgrid">
								<div class="p-col-12">
									<g:input label="#{i18n['job.title']}" value="#{addJobView.jobOffer.title}" required="true" />
								</div>
								<div class="p-col-12">
									<cc:autocomplete id="client" label="#{i18n['job.client']}" value="#{addJobView.jobOffer.client}"
										completeMethod="#{addJobView.completeClient}" itemSelectEvent="#{addJobView.addClient}" required="true" update="jobOfferForm:city jobOfferForm:state">
										<p:column>
											#{var.name}
										</p:column>
									</cc:autocomplete>
								</div>
								<div class="p-col-12 p-sm-6">
									<g:input id="min_salary" label="#{i18n['job.min_salary']}" value="#{addJobView.jobOffer.minSalary}" type="money" />
								</div>
								<div class="p-col-12 p-sm-6">
									<g:input id="max_salary" label="#{i18n['job.max_salary']}" value="#{addJobView.jobOffer.maxSalary}" type="money" />
								</div>
								<div class="p-col-12 p-sm-6">
									<g:input id="places" label="#{i18n['job.places']}" value="#{addJobView.jobOffer.places}" type="number" min="0" />
								</div>
								<div class="p-col-12 p-sm-6"></div>
								<div class="p-col-12 p-sm-6">
									<g:input id="city" label="#{i18n['job.city']}" value="#{addJobView.jobOffer.address.city}" required="true" />
								</div>
								<div class="p-col-12 p-sm-6">
									<g:input id="state" label="#{i18n['job.state']}" value="#{addJobView.jobOffer.address.region}" required="true" />
								</div>
							</div>
						</div>
					</div>
					<div class="p-col-12 p-md-6">
						<div class="form-card ui-fluid">
							<h5>#{i18n['job.other_data']}</h5>
							<div class="p-grid  p-formgrid">
								<div class="p-col-12 p-sm-6">
									<g:input id="dateOpened" label="#{i18n['job.date_opened']}" value="#{addJobView.jobOffer.openDate}" type="calendar" required="true" />
								</div>
								<div class="p-col-12 p-sm-6">
									<g:input id="dateClosed" label="#{i18n['job.date_closed']}" value="#{addJobView.jobOffer.closeDate}" type="calendar" />
								</div>
								<div class="p-col-12 p-sm-6">
									<cc:autocomplete id="owner" label="#{i18n['job.owner']}" value="#{addJobView.jobOffer.owner}" completeMethod="#{addJobView.queryOwner}">
										<p:column styleClass="user-select image">
											<cc:person name="#{var.fullName}" path="#{var.picture.path}" />
										</p:column>
									</cc:autocomplete>
								</div>
								<div class="p-col-12">
									<cc:inputUsers id="recruiters" label="#{i18n['job.recruiters']}" completeMethod="#{addJobView.queryRecruiter}"
										value="#{addJobView.recruiters}" />
								</div>
							</div>
						</div>
					</div>
					<div class="p-col-12">
						<div class="form-buttons">
							<p:button value="#{i18n['action.cancel']}" outcome="/job/search.xhtml" styleClass="ui-button-secondary ui-button-outlined" />
							<p:commandButton value="#{i18n['action.save_and_next']}" process="@form" update="@form growl" action="#{addJobView.next}"
								styleClass="ui-button-success ui-button-outlined" />
						</div>
					</div>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
