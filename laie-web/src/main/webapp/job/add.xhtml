<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:g="http://nivel.36/laie/ui"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	template="/WEB-INF/templates/template.xhtml">

	<ui:define name="title">
		#{i18n['job.add_job']} - #{addJobView.jobOffer.title}
	</ui:define>

	<ui:param name="selectedMenu" value="offers" />

	<ui:define name="content">
		<h:form id="jobOfferForm">
			<div class="grid">
				<div class="col-12 xl:col-6 xl:col-offset-3">
					<p:card styleClass="card card-w-title">
						<f:facet name="title">
							<h5>#{i18n['job.new_job_offer']}</h5>
						</f:facet>
						<p:divider />
						<div class="ui-fluid grid">
							<div class="col-12 md:col-4">
								<h5>#{i18n['job.data']}</h5>
							</div>
							<div class="col-12 md:col-8">
								<g:input label="#{i18n['job.title']}"
									value="#{addJobView.jobOffer.title}" required="true" />
								<cc:autocomplete id="client" label="#{i18n['job.client']}"
									value="#{addJobView.jobOffer.client}"
									completeMethod="#{addJobView.completeClient}"
									itemSelectEvent="#{addJobView.addClient}" required="true"
									update="jobOfferForm:city jobOfferForm:state">
									<p:column>
											#{var.name}
										</p:column>
								</cc:autocomplete>
								<div class="formgrid grid">
									<g:input id="min_salary" label="#{i18n['job.min_salary']}"
										value="#{addJobView.jobOffer.minSalary}" type="money"
										styleClass="col" />
									<g:input id="max_salary" label="#{i18n['job.max_salary']}"
										value="#{addJobView.jobOffer.maxSalary}" type="money"
										styleClass="col" />
								</div>
								<div class="formgrid grid">
									<g:input id="places" label="#{i18n['job.places']}"
										value="#{addJobView.jobOffer.places}" type="number" min="0"
										styleClass="col-fixed" />
								</div>
								<div class="formgrid grid">
									<g:input id="city" label="#{i18n['job.city']}"
										value="#{addJobView.jobOffer.address.city}" required="true"
										styleClass="col" />
									<g:input id="state" label="#{i18n['job.state']}"
										value="#{addJobView.jobOffer.address.region}" required="true"
										styleClass="col" />
								</div>
							</div>
							<p:divider />
							<div class="col-12 md:col-4">
								<h5>#{i18n['job.other_data']}</h5>
							</div>
							<div class="col-12 md:col-8">
								<div class="formgrid grid">
									<g:input id="dateOpened" label="#{i18n['job.date_opened']}"
										value="#{addJobView.jobOffer.openDate}" type="calendar"
										styleClass="col" />
									<g:input id="dateClosed" label="#{i18n['job.date_closed']}"
										value="#{addJobView.jobOffer.closeDate}" type="calendar"
										styleClass="col" />
								</div>
								<cc:autocomplete id="owner" label="#{i18n['job.owner']}"
									value="#{addJobView.jobOffer.owner}"
									completeMethod="#{addJobView.queryOwner}">
									<p:column styleClass="user-select image">
										<cc:person name="#{var.fullName}" path="#{var.picture.path}" />
									</p:column>
								</cc:autocomplete>
								<cc:inputUsers id="recruiters" label="#{i18n['job.recruiters']}"
									completeMethod="#{addJobView.queryRecruiter}"
									value="#{addJobView.recruiters}" />
							</div>
							<p:divider />
							<div class="col-12 md:col-4">
								<h5>#{i18n['job.description']}</h5>
							</div>
							<div class="col-12 md:col-8">
								<g:input id="published" label="#{i18n['job.publish']}"
									value="#{addJobView.jobOffer.published}" type="inputSwitch" />
								<g:input id="description" label="#{i18n['job.description']}"
									value="#{addJobView.jobOffer.description}" type="rich" />
							</div>
						</div>
						<f:facet name="footer">
							<div class="flex justify-content-end">
								<p:button value="#{i18n['action.cancel']}"
									outcome="/job/search.xhtml"
									styleClass="ui-button-secondary  mr-2 mb-2">
								</p:button>
								<p:commandButton value="#{i18n['action.save']}" process="@form"
									update="@form growl" action="#{addJobView.save}"
									styleClass="ui-button-primary mb-2" />
							</div>
						</f:facet>
					</p:card>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
