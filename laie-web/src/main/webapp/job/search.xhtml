<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" xmlns:f="http://java.sun.com/jsf/core" xmlns:g="http://nivel.36/laie/ui"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" xmlns:ui="http://java.sun.com/jsf/facelets" template="/WEB-INF/templates/template.xhtml">

	<ui:define name="title">
		#{i18n['job.job_offer']}
	</ui:define>

	<ui:param name="selectedMenu" value="offers" />

	<ui:define name="content">
		<h:form id="jobOfferSearchform">
			<p:card styleClass="card card-w-title">
				<div class="searchBar-buttons">
					<cc:inputSearch searchText="#{searchJobView.searchText}" searchAction="#{searchJobView.search}" update="jobOfferSearchform:jobOffers"
						styleClass="ui-fluid" />
					<div class="buttons">
						<p:button value="#{i18n['job.new_job_offer']}" outcome="/job/add.xhtml" styleClass="ui-button-success ui-button-outlined" />
					</div>
				</div>

				<p:dataTable id="jobOffers" var="jobOffer" value="#{searchJobView.jobOffers}" emptyMessage="#{i18n['job.no_jobs_found']}" reflow="true"
					paginator="true" paginatorPosition="bottom" rows="10" lazy="true" styleClass="ui-datatable-borderless">

					<p:column headerText="#{i18n['job.title']}" sortBy="#{jobOffer.title}" sortOrder="asc">
						<h:link outcome="/job/view.xhtml">#{jobOffer.title} <h:outputText value="-" rendered="#{not empty jobOffer.address.city}" /> ${jobOffer.address.city}
									<f:param name="jobOffer" value="#{jobOffer.id}" />
						</h:link>
					</p:column>

					<p:column headerText="#{i18n['job.client']}" sortBy="#{jobOffer.client.name}">
						<h:link value="#{jobOffer.client.name}" outcome="/client/view.xhtml">
							<f:param name="client" value="#{jobOffer.client.id}" />
						</h:link>
					</p:column>

					<p:column headerText="#{i18n['job.positions']}">
						<h:outputText value="#{jobOffer.positions}" />
					</p:column>

					<p:column headerText="#{i18n['user.owner']}">
						<h:link value="#{jobOffer.owner.fullName}" outcome="/user/view.xhtml">
							<f:param name="user" value="#{jobOffer.owner.id}" />
						</h:link>
					</p:column>

					<p:column headerText="#{i18n['job.job_offer_state']}">
						<cc:jobOfferState value="#{jobOffer.state}" />
					</p:column>
				</p:dataTable>
			</p:card>
		</h:form>
	</ui:define>
</ui:composition>
