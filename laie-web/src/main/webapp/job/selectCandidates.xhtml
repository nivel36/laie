<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:g="http://nivel.36/laie/ui"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	template="/WEB-INF/templates/template.xhtml">

	<ui:define name="title">
		#{i18n['job.new_job_offer']}
	</ui:define>

	<ui:param name="selectedMenu" value="offers" />

	<ui:define name="content">
		<h:form id="candidateSearchForm">
			<div class="card">
				<div class="searchBar-buttons">
					<cc:inputSearch searchText="#{selectCandidatesView.searchText}"
						searchAction="#{selectCandidatesView.search}"
						update="candidateSearchForm:candidates" styleClass="ui-fluid" />
					<div class="buttons">
						<p:button value="#{i18n['action.cancel']}"
							outcome="/job/view.xhtml"
							styleClass="ui-button-secondary ui-button-outlined">
							<f:param name="jobOffer"
								value="#{selectCandidatesView.jobOffer.id}" />
						</p:button>
						<p:commandButton value="#{i18n['action.select']}" process="@form"
							update="@form growl" action="#{selectCandidatesView.select}"
							styleClass="ui-button-success ui-button-outlined" />
					</div>
				</div>
				<h4>#{selectCandidatesView.jobOffer.client.name} -
					#{i18n['job_jobSubmission.add_to_job_offer']}</h4>
				<p:dataTable var="candidate" id="candidates"
					value="#{selectCandidatesView.candidates}"
					emptyMessage="#{i18n['candidate.no_candidates_found']}"
					reflow="true" paginator="true" paginatorPosition="bottom"
					selection="#{selectCandidatesView.selectedCandidates}"
					disabledSelection="#{selectCandidatesView.isAlredySelected(candidate)}"
					rows="10" sortBy="#{candidate.name}" sortOrder="ascending"
					lazy="true">

					<p:column selectionMode="multiple"
						style="width:16px;text-align:center" />

					<p:column>
						<cc:avatar name="#{candidate.fullName}"
							path="#{candidate.picture.path}" styleClass="small" />
					</p:column>

					<p:column headerText="#{i18n['candidate.name']}"
						sortBy="#{candidate.name}">
						<h:outputText value="#{candidate.fullName}" />
					</p:column>

					<p:column headerText="#{i18n['candidate.jobProfile']}"
						sortBy="#{candidate.jobProfile}">
						<h:outputText value="#{candidate.jobProfile}" />
					</p:column>

					<p:column headerText="#{i18n['candidate.email']}">
						<h:outputText value="#{candidate.email}" />
					</p:column>

					<p:column headerText="#{i18n['candidate.phone_number']}">
						<h:outputText value="#{candidate.phoneNumber}" />
					</p:column>

					<p:column headerText="#{i18n['candidate.rating']}"
						sortBy="#{candidate.rating}" sortOrder="desc">
						<p:rating value="#{candidate.rating}" cancel="false"
							readonly="true" />
					</p:column>
				</p:dataTable>
			</div>

		</h:form>
	</ui:define>
</ui:composition>
