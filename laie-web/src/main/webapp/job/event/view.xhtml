<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" xmlns:f="http://java.sun.com/jsf/core" xmlns:g="http://nivel.36/laie/ui"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" xmlns:ui="http://java.sun.com/jsf/facelets" template="/WEB-INF/templates/template.xhtml">

	<ui:define name="title">
		#{i18n['job.job_offer']} - #{viewJobView.jobOffer.title}
	</ui:define>

	<ui:param name="selectedMenu" value="offers" />

	<ui:define name="content">
		<div class="grid">
			<div class="col-12 xl:col-8">
				<h:link value="#{event.jobSubmission.candidate.fullName}" outcome="/candidate/view.xhtml">
					<f:param name="candidate" value="#{event.jobSubmission.candidate.id}" />
				</h:link>

				<h:outputText value="#{i18n['job_jobSubmission_state.'.concat(event.state)]}" />

				<h:outputText value="#{event.date}">
					<f:convertDateTime type="localDate" pattern="dd/MM/yyyy HH:mm:ss" />
				</h:outputText>

				<h:link value="#{event.user.fullName}" outcome="/user/view.xhtml">
					<f:param name="user" value="#{event.user.id}" />
				</h:link>

				<h:outputText value="#{i18n['job_jobSubmission_event.'.concat(event.type)]}" />

				<h:outputText value="#{event.notes}" />

			</div>
		</div>
	</ui:define>
</ui:composition>
