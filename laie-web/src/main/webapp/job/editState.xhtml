<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" xmlns:f="http://java.sun.com/jsf/core" xmlns:g="http://nivel.36/laie/ui"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" xmlns:ui="http://java.sun.com/jsf/facelets" template="/WEB-INF/templates/template.xhtml">

	<ui:define name="title">
		#{i18n['job.edit_job_state']} - #{editJobStateView.jobOffer.title}
	</ui:define>

	<ui:param name="selectedMenu" value="offers" />

	<ui:define name="content">
		<h:form id="userForm">
			<div class="card">
				<div class="grid">

					<div class="col-12 md:col-6">
						<div class="form-card ui-fluid">
							<h5>#{i18n['job.new_state']}</h5>
							<div class="grid formgrid">
								<div class="col-12">
									<g:input label="#{i18n['event.state']}" value="#{editJobStateView.state}" required="true" type="selectOneMenu">
										<f:selectItems value="#{editJobStateView.states}" />
									</g:input>
								</div>
								<div class="col-12">
									<g:input id="notes" label="#{i18n['job.edit_state.notes']}" value="#{editJobStateView.notes}" type="textarea" />
								</div>
							</div>
						</div>
					</div>
					<div class="col-12">
						<div class="form-buttons">
							<p:button value="#{i18n['action.cancel']}" outcome="/job/view.xhtml" styleClass="ui-button-secondary ui-button-outlined">
								<f:param name="jobOffer" value="#{editJobStateView.jobOffer.id}" />
							</p:button>
							<p:commandButton value="#{i18n['action.save']}" process="@form" update="@form growl" action="#{editJobStateView.save}"
								styleClass="ui-button-success ui-button-outlined" />
						</div>
					</div>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
