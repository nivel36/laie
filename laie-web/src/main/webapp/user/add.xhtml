<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:g="http://nivel.36/laie/ui"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	template="/WEB-INF/templates/template.xhtml">

	<ui:define name="title">
		#{i18n['user.new_user']}
	</ui:define>

	<ui:param name="selectedMenu" value="users" />

	<ui:define name="content">
		<h:form id="userForm">
			<div class="p-grid">
				<div class="p-col-12">
					<div class="card buttons">
						<p:button value="#{i18n['action.cancel']}"
							outcome="#{Page.USER_SEARCH.getUrl()}"
							styleClass="ui-button-secondary ui-button-outlined" />
						<p:commandButton value="#{i18n['action.save']}"
							action="#{addUserView.save}"
							styleClass="ui-button-success ui-button-outlined" />
					</div>
				</div>
				<div class="p-col-12 p-md-6">
					<div class="card card-w-title ui-fluid">
						<h5>#{i18n['user.personal_information']}</h5>
						<div class="p-grid p-formgrid">
							<div class="p-col-12 p-sm-6">
								<g:input id="name" label="#{i18n['user.name']}"
									value="#{addUserView.user.name}" required="true" />
							</div>
							<div class="p-col-12 p-sm-6">
								<g:input id="surname" label="#{i18n['user.surname']}"
									value="#{addUserView.user.surname}" required="true" />
							</div>
							<div class="p-col-12 p-sm-6">
								<g:input id="email" label="#{i18n['user.email']}"
									value="#{addUserView.user.email}" required="true"
									validator="#{addUserView.validateEmail}" />
							</div>
							<div class="p-col-12 p-sm-6"></div>
							<div class="p-col-12 p-sm-6">
								<g:input id="phone_number" label="#{i18n['user.phone_number']}"
									value="#{addUserView.user.phoneNumber}" />
							</div>
						</div>
					</div>
				</div>
				<div class="p-col-12 p-md-6">
					<div class="card card-w-title ui-fluid">
						<h5>#{i18n['user.professional_information']}</h5>
						<div class="p-grid p-formgrid">
							<div class="p-col-12 p-sm-6">
								<g:input type="selectOneMenu" id="role"
									value="#{addUserView.user.roleName}"
									label="#{i18n['user.role']}" required="true">
									<f:selectItem itemValue="#{null}" noSelectionOption="true"
										itemDisabled="#{not empty addUserView.user}" />
									<f:selectItems value="#{roles.list}" var="role"
										itemValue="#{role}" itemLabel="#{i18n[role]}" />
									<p:ajax event="change"
										update=":userForm:role :userForm:managerWrapper"
										process=":userForm:role"
										listener="#{addUserView.changeRoleListener}" />
								</g:input>
							</div>
							<div class="p-col-12 p-sm-6">
								<h:panelGroup id="managerWrapper" class="form-field ui-fluid"
									layout="block">
									<cc:autocomplete id="manager" label="#{i18n['user.manager']}"
										value="#{addUserView.user.manager}"
										completeMethod="#{addUserView.queryManager}"
										converter="userConverter">
										<p:column styleClass="user-select image">
											<cc:person name="#{var.fullName}" path="#{var.avatarUrl}"
												description="#{var.email}" />
										</p:column>
									</cc:autocomplete>
								</h:panelGroup>
							</div>
							<div class="p-col-12 p-sm-6">
								<g:input id="date_of_join" label="#{i18n['user.date_of_join']}"
									value="#{addUserView.user.dateOfJoin}" type="calendar" />
							</div>							
						</div>
					</div>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
