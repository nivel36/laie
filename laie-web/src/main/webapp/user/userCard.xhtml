<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:g="http://nivel.36/laie/ui" xmlns:h="http://java.sun.com/jsf/html" xmlns:o="http://omnifaces.org/ui"
	xmlns:p="http://primefaces.org/ui" xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://java.sun.com/jsf/facelets">

	<p:link outcome="/user/view.xhtml">
		<f:param name="userId" value="#{user.uid}" />
		<div class="user-minicard">
			<div class="user-minicard-image">
				<cc:avatar name="#{user.fullName}" path="#{user.avatarUrl}" />
			</div>
			<div class="user-minicard-info">
				<div class="name">#{user}</div>
				<div class="position">#{i18n[user.role]}</div>
			</div>
		</div>
	</p:link>
</ui:composition>
