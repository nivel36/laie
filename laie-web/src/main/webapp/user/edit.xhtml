<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:g="http://nivel.36/laie/ui"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	template="/WEB-INF/templates/template.xhtml">

	<ui:define name="title">
		#{i18n['user.edit_user']} - #{editUserView.user.fullName}
	</ui:define>

	<ui:param name="selectedMenu" value="users" />

	<ui:define name="content">
		<h:form id="userForm">
			<div class="grid">
				<div class="col-12 xl:col-6 xl:col-offset-3">
					<p:card>
						<f:facet name="title">
							<h4>#{i18n['user.edit_user']} -
								#{editUserView.user.fullName}</h4>
						</f:facet>

						<p:divider />
						<div class="ui-fluid grid">
							<div class="col-12 md:col-4">
								<h5>#{i18n['user.personal_information']}</h5>
							</div>
							<div class="col-12 md:col-8">
								<div class="formgrid grid">
									<g:input id="name" label="#{i18n['user.name']}"
										value="#{editUserView.user.name}" required="true"
										styleClass="col" />
									<g:input id="surname" label="#{i18n['user.surname']}"
										value="#{editUserView.user.surname}" required="true"
										styleClass="col" />
								</div>
								<g:input id="email" label="#{i18n['user.email']}"
									value="#{editUserView.user.email}" required="true" />
								<g:input id="phone_number"
									label="#{i18n['user.phone_number']}"
									value="#{editUserView.user.phoneNumber}" />
							</div>
							<p:divider />
							<div class="col-12 md:col-4">
								<h5>#{i18n['user.professional_information']}</h5>
							</div>
							<div class="col-12 md:col-8">
								<g:input type="selectOneMenu" id="role"
									value="#{editUserView.user.role}"
									label="#{i18n['user.role']}" required="true">
									<f:selectItem itemValue="#{null}" noSelectionOption="true"
										itemDisabled="#{not empty editUserView.user}" />
									<f:selectItems value="#{roles.list}" var="role"
										itemValue="#{role}" itemLabel="#{i18n[role]}" />
									<p:ajax event="change"
										update=":userForm:role :userForm:managerWrapper"
										process=":userForm:role"
										listener="#{editUserView.changeRoleListener}" />
								</g:input>
								<h:panelGroup id="managerWrapper" class="form-field ui-fluid"
									layout="block">
									<cc:autocomplete id="manager"
										label="#{i18n['user.manager']}"
										value="#{editUserView.user.manager}"
										completeMethod="#{editUserView.queryManager}">
										<p:column styleClass="user-select image">
											<cc:person name="#{var.fullName}" path="#{var.picture.path}"
												description="#{var.email}" />
										</p:column>
									</cc:autocomplete>
								</h:panelGroup>
								<g:input id="date_of_join"
									label="#{i18n['user.date_of_join']}"
									value="#{editUserView.user.dateOfJoin}" type="calendar" />
							</div>
						</div>
						<f:facet name="footer">
							<div class="flex justify-content-end">
								<p:button value="#{i18n['action.cancel']}"
									outcome="/user/view.xhtml"
									styleClass="ui-button-warning mr-2 mb-2">
									<f:param name="user" value="#{editUserView.user.id}" />
								</p:button>
								<p:commandButton value="#{i18n['action.save']}"
									action="#{editUserView.save}" update="@form"
									styleClass="ui-button-primary mr-2 mb-2" />
							</div>
						</f:facet>
					</p:card>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
