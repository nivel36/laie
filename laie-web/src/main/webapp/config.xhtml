<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:g="http://nivel.36/laie/ui"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	template="/WEB-INF/templates/template.xhtml">

	<ui:define name="title">
		#{i18n['config.config']}
	</ui:define>

	<ui:param name="selectedMenu" value="config" />

	<ui:define name="content">
		<h:form id="configForm" enctype="multipart/form-data">
			<div class="grid">
				<div class="col-12 xl:col-6 xl:col-offset-3">
					<p:card>
						<f:facet name="title">
							<h4>#{i18n['config.config_data']}</h4>
						</f:facet>
						<p:divider />
						<div class="ui-fluid grid">
							<div class="col-12 md:col-4">
								<h5>#{i18n['user.picture']}</h5>
							</div>
							<div class="col-12 md:col-8">
								<cc:inputAvatar id="account-image"
									value="#{configView.userImage.path}"
									fileUploadListener="#{configView.uploadImage}"
									allowCamera="true" captureListener="#{configView.captureImage}"
									deleteImage="#{configView.deleteImage}" />
							</div>

							<p:divider />
							<div class="col-12 md:col-4">
								<h5>#{i18n['user.personal_information']}</h5>
							</div>
							<div class="col-12 md:col-8">
								<div class="formgrid grid">
									<g:input id="name" label="#{i18n['config.name']}"
										value="#{configView.user.name}" required="true"
										styleClass="col" />
									<g:input id="surname" label="#{i18n['config.surname']}"
										value="#{configView.user.surname}" required="true"
										styleClass="col" />
								</div>
								<g:input id="email" label="#{i18n['config.email']}"
									value="#{configView.user.email}" required="true" />
								<g:input id="phone" label="#{i18n['user.phone_number']}"
									value="#{configView.user.phoneNumber}" />
							</div>
							<p:divider />
							<div class="col-12 md:col-4">
								<h5>#{i18n['user.language_localization']}</h5>
							</div>
							<div class="col-12 md:col-8">
								<g:input id="locale" label="#{i18n['config.language']}"
									value="#{configView.user.language}" type="selectOneMenu">
									<f:selectItems var="language"
										value="#{applicationView.languages}"
										itemValue="#{language.code}"
										itemLabel="#{i18n[language.code]}" />
									<f:ajax event="click" render="@all"
										listener="#{configView.changeLanguage}" />
								</g:input>
							</div>
						</div>
						<f:facet name="footer">
							<div class="flex justify-content-end">
								<p:button value="#{i18n['action.cancel']}"
									outcome="/index.xhtml"
									styleClass="ui-button-secondary mr-2 mb-2" />
								<p:button value="#{i18n['config.change_password']}"
									outcome="/changePassword.xhtml"
									styleClass="ui-button-help mr-2 mb-2" />
								<p:commandButton value="#{i18n['action.save']}"
									action="#{configView.save}" process="@form" update="@all"
									styleClass="ui-button-success mb-2" />
							</div>
						</f:facet>
					</p:card>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
