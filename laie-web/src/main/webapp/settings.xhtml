<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:g="http://nivel.36/laie/ui"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	template="/WEB-INF/templates/template.xhtml">

	<ui:define name="title">
		#{i18n['maintenance.maintenances']}
	</ui:define>

	<ui:param name="selectedMenu" value="maintenances" />

	<ui:define name="breadcrumb">
		<p:breadCrumb>
			<p:menuitem value="#{i18n['menu.index']}" outcome="/index.xhtml" />
			<p:menuitem value="#{i18n['maintenance.maintenances']}"
				disabled="true" />
		</p:breadCrumb>
	</ui:define>

	<ui:define name="content">
		<div class="grid">
		<div class="col-12 xl:col-6">
				<p:card styleClass="card card-w-title">
					<f:facet name="title">
						<h5>#{i18n['settings.statistics']}</h5>
					</f:facet>
					<ul>
						<li><h:link outcome="/settings/statistics.xhtml"
								value="#{i18n['settings.statistics']}"
								styleClass="link" /></li>
					</ul>
				</p:card>
			</div>
			<div class="col-12 xl:col-6">
	
			</div>
			<div class="col-12 xl:col-6">
				<p:card styleClass="card card-w-title">
					<f:facet name="title">
						<h5>#{i18n['maintenance.reports']}</h5>
					</f:facet>
					<ul>
						<li><h:link outcome="/settings/reports.xhtml"
								value="#{i18n['maintenance.reports']}" /></li>
					</ul>
				</p:card>
			</div>
			<div class="col-12 xl:col-6">
				<p:card styleClass="card card-w-title">
					<f:facet name="title">
						<h5>#{i18n['maintenance.documents']}</h5>
					</f:facet>
					<ul>
						<li><h:link outcome="/settings/gdpr.xhtml"
								value="#{i18n['maintenance.gdpr']}" /></li>
					</ul>
				</p:card>
			</div>
		</div>
	</ui:define>
</ui:composition>
