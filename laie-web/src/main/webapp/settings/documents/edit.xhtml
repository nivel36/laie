<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" xmlns:f="http://java.sun.com/jsf/core" xmlns:g="http://nivel.36/laie/ui"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" xmlns:ui="http://java.sun.com/jsf/facelets" template="/WEB-INF/templates/template.xhtml">

	<ui:define name="title">
		#{i18n['job_candidature.job_candidature_states']}
	</ui:define>

	<ui:param name="selectedMenu" value="settings" />

	<ui:define name="content">
		<h:form id="gdprForm">
			<div class="card">
				<div class="p-grid">
					<div class="p-col-12">
						<div id="client" class="form-card ui-fluid">
							<div class="p-grid p-formgrid">
								<div class="p-col-12 p-lg-5">
									<g:input id="title" label="#{i18n['document.title']}" value="#{gdprMaintenanceView.document.title}" />
								</div>
								<div class="p-col-12 p-lg-2">
									<g:input id="language" label="#{i18n['document.language']}" value="#{gdprMaintenanceView.language}" type="selectOneMenu">
										<f:selectItems var="language" value="#{applicationView.languages}" itemValue="#{language}" itemLabel="#{i18n[language.code]}" />
										<p:ajax event="change" process="@this" update="@form" listener="#{gdprMaintenanceView.searchDocument}" />
									</g:input>
								</div>
								<div class="p-col-12">
									<g:input id="text" label="#{i18n['document.text']}" value="#{gdprMaintenanceView.document.text}" type="rich" styleClass="document" />
								</div>
							</div>
						</div>
					</div>
				</div>
				<div class="p-col-12">
					<div class="form-buttons">
						<p:button value="#{i18n['action.cancel']}" outcome="/settings.xhtml" styleClass="ui-button-secondary ui-button-outlined" />
						<p:commandButton value="#{i18n['action.export']}" action="#{gdprMaintenanceView.export}" icon="fa fa-file-excel-o" ajax="false" />
						<p:commandButton value="#{i18n['action.save']}" styleClass="ui-button-success ui-button-outlined" />
					</div>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
