<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" xmlns:f="http://java.sun.com/jsf/core" xmlns:g="http://nivel.36/laie/ui"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" xmlns:ui="http://java.sun.com/jsf/facelets" template="/WEB-INF/templates/template.xhtml">

	<ui:define name="title">
		#{i18n['job_candidature.job_candidature_states']}
	</ui:define>

	<ui:param name="selectedMenu" value="maintenances" />

	<ui:define name="breadcrumb">
		<p:breadCrumb>
			<p:menuitem value="#{i18n['menu.index']}" outcome="/index.xhtml" />
			<p:menuitem value="#{i18n['maintenance.maintenances']}" outcome="/settings.xhtml" />
			<p:menuitem value="#{i18n['job_candidature.job_candidature_states']}" disabled="true" />
		</p:breadCrumb>
	</ui:define>

	<ui:define name="content">
		<div class="grid">
			<div class="col-12 xl:col-4">
				<div class="card">
					<div class="grid">
						<ui:repeat var="jobCandidatureState" value="#{jobCandidatureStatesMaintenanceView.states}">
							<div class="col-12">
								<div class="tag #{jobCandidatureState.name}">#{i18n[jobCandidatureState.name]}</div>
							</div>
						</ui:repeat>
					</div>
				</div>
			</div>
		</div>
	</ui:define>
</ui:composition>
