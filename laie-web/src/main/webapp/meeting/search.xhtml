<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:g="http://nivel.36/laie/ui"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	template="/WEB-INF/templates/template.xhtml">

	<ui:define name="title">
		#{i18n['calendar.calendar']}
	</ui:define>

	<ui:param name="selectedMenu" value="meetings" />

	<ui:define name="content">
		<h:form>
			<p:schedule id="schedule" value="#{searchMeetingView.eventModel}"
				widgetVar="myschedule"
				timeZone="#{searchMeetingView.serverTimeZone}"
				clientTimeZone="#{searchMeetingView.serverTimeZone}">
			</p:schedule>
		</h:form>
	</ui:define>
</ui:composition>
