<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:g="http://nivel.36/laie/ui"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	template="/WEB-INF/templates/template.xhtml">

	<ui:define name="title">
		#{i18n['meeting.add_meeting']}
	</ui:define>

	<ui:param name="selectedMenu" value="meeting" />

	<ui:define name="content">
		<h:form id="meetingForm">
			<div class="col-12 xl:col-6 xl:col-offset-3">
				<p:card styleClass="card card-w-title">
					<f:facet name="title">
						<h4>#{i18n['meeting.edit_meeting']}</h4>
					</f:facet>
					<div class="grid">
						<p:divider />
						<div class="ui-fluid grid">
							<div class="col-12 md:col-4">
								<h5>#{i18n['meeting.header.details']}</h5>
							</div>
							<div class="col-12 md:col-8">
								<g:input label="#{i18n['meeting.title']}"
									value="#{editMeetingView.meeting.title}" />
								<div class="formgrid grid">
									<g:input id="datePlanned"
										label="#{i18n['meeting.date_planned']}"
										value="#{editMeetingView.meetingDate}" required="true"
										type="calendar" styleClass="col" />
									<g:input label="#{i18n['meeting.hour_planned']}"
										value="#{editMeetingView.meetingHour}" required="true"
										type="selectOneMenu" styleClass="col">
										<f:selectItems value="#{editMeetingView.hours}"
											var="meetingHour" itemValue="#{meetingHour}"
											itemLabel="#{meetingHour}" />
									</g:input>
									<g:input label="#{i18n['meeting.duration']}"
										value="#{editMeetingView.meetingDuration}" required="true"
										type="selectOneMenu" styleClass="col">
										<f:selectItems value="#{editMeetingView.durations}"
											var="meetingDuration" itemLabel="#{meetingDuration}" />
									</g:input>
								</div>
								<g:input label="#{i18n['meeting.location']}"
									value="#{editMeetingView.meeting.location}" />
								<g:input label="#{i18n['meeting.type']}"
									value="#{editMeetingView.meeting.meetingType}"
									type="selectOneMenu">
									<f:selectItem />
									<f:selectItems value="#{editMeetingView.meetingTypes}"
										var="meetingType" itemValue="#{meetingType}"
										itemLabel="#{i18n[meetingType]}" />
								</g:input>
								<g:input label="#{i18n['meeting.description']}"
									value="#{editMeetingView.meeting.description}" type="textarea" />
							</div>
							<p:divider />
							<div class="col-12 md:col-4">
								<h5>#{i18n['meeting.header.attendees']}</h5>
							</div>
							<div class="col-12 md:col-8">
								<cc:autocomplete id="attendee"
									value="#{editMeetingView.attendee}"
									completeMethod="#{editMeetingView.searchPerson}"
									itemSelectEvent="#{editMeetingView.addAttendee}"
									update="@this meetingForm:attendees">
									<p:column styleClass="user-select image">
										<cc:person name="#{var.fullName}" description="#{var.email}" />
									</p:column>
								</cc:autocomplete>
								<h:panelGroup layout="block" id="attendees"
									styleClass="attendees">
									<ui:repeat var="person" value="#{editMeetingView.attendees}"
										varStatus="varStatus">
										<h:panelGroup layout="block" id="attendee"
											styleClass="attendee">
											<cc:person name="#{person.fullName}"
												description="#{person.email}">
												<p:tag styleClass="mr-2" icon="pi pi-check"
													severity="success" rounded="true"
													value="#{i18n['meeting.available']}"
													rendered="#{editMeetingView.isAvaliable(person)}" />
												<p:tag styleClass="mr-2" icon="pi pi-times"
													severity="danger" rounded="true"
													value="#{i18n['meeting.non_available']}"
													rendered="#{not editMeetingView.isAvaliable(person)}" />
											</cc:person>
											<div class="buttons">
												<p:commandButton icon="pi pi-times"
													styleClass="ui-button-outlined"
													action="#{editMeetingView.removeAttendee(person)}"
													process="@this" update="meetingForm:attendees" />
											</div>
										</h:panelGroup>
									</ui:repeat>
								</h:panelGroup>
							</div>
						</div>
					</div>
					<f:facet name="footer">
						<div class="flex justify-content-end">
							<p:button value="#{i18n['action.cancel']}" outcome="/index.xhtml"
								styleClass="ui-button-secondary mr-2 mb-2" />
							<p:commandButton value="#{i18n['action.remove']}"
								action="#{editMeetingView.delete}"
								styleClass="ui-button-warning mr-2 mb-2" />
							<p:commandButton value="#{i18n['action.save']}"
								action="#{editMeetingView.save}" update="@form"
								styleClass="ui-button-primary mb-2" />
						</div>
					</f:facet>
				</p:card>

			</div>
		</h:form>
	</ui:define>
</ui:composition>
