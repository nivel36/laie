<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" xmlns:f="http://java.sun.com/jsf/core" xmlns:g="http://nivel.36/laie/ui"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" xmlns:ui="http://java.sun.com/jsf/facelets" template="/WEB-INF/templates/template.xhtml">

	<ui:define name="title">
		#{i18n['event.new_event']}
	</ui:define>

	<ui:param name="selectedMenu" value="events" />

	<ui:define name="content">
		<h:form id="form">
			<div class="card">
				<div class="p-grid">
					<div class="p-col-12 p-xl-7">
						<div class="form-card ui-fluid">
							<h1>#{i18n['event.event']}</h1>
							<div class="p-grid">
								<div class="p-col-12">
									<g:input type="selectOneMenu" label="#{i18n['event.job_candidature']}" value="#{addEventView.event.jobCandidature}">
										<f:selectItems value="#{addEventView.jobCandidatures}" var="jobCandidature" itemValue="#{jobCandidature}" itemLabel="#{jobCandidature}" />
										<p:ajax event="change" process="@this" update="eventForm:state" listener="#{addEventView.updateState}" />
									</g:input>
								</div>

								<div class="p-col-12 p-xl-6">
									<g:input type="selectOneMenu" label="#{i18n['event.type']}" value="#{addEventView.event.type}">
										<f:selectItems value="#{eventTypes.list}" var="event" itemValue="#{event}" itemLabel="#{i18n[event.name]}" />
									</g:input>
								</div>

								<div class="p-col-12">
									<g:input id="notes" label="#{i18n['event.notes']}" value="#{addEventView.event.notes}" type="textarea" />
								</div>

								<div class="p-col-12 p-xl-6">
									<div class="input-group input-group-select">
										<div class="label-container">
											<p:outputLabel id="label" value="#{i18n['event.state']}" for="state" styleClass="label" />
										</div>
										<p:selectOneMenu id="state" value="#{addEventView.event.state}" styleClass="input input-select" panelStyleClass="jobCandidatureStates"
											var="state">
											<f:selectItems value="#{jobCandidatureStates.list}" var="state" itemValue="#{state}" itemLabel="#{i18n[state.name]}" />
											<p:column>
												<div class="tag #{state.color}">#{i18n[state.name]}</div>
											</p:column>
										</p:selectOneMenu>
									</div>
								</div>

							</div>
						</div>
						<div class="p-col-12">
							<div class="form-buttons">
								<p:button value="#{i18n['action.cancel']}" outcome="/event/search.xhtml" styleClass="ui-button-secondary ui-button-outlined" />
								<p:commandButton value="#{i18n['action.save']}" action="#{addEventView.save}" styleClass="ui-button-success ui-button-outlined" />
							</div>
						</div>
					</div>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
