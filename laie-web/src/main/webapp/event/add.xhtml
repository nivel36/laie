<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite/components" xmlns:f="http://java.sun.com/jsf/core" xmlns:g="http://nivel.36/laie/ui"
	xmlns:h="http://java.sun.com/jsf/html" xmlns:o="http://omnifaces.org/ui" xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" xmlns:ui="http://java.sun.com/jsf/facelets" template="/WEB-INF/templates/template.xhtml">

	<ui:define name="title">
		#{i18n['event.new_event']}
	</ui:define>

	<ui:param name="selectedMenu" value="events" />

	<ui:define name="content">
		<h:form id="form">
			<div class="card">
				<div class="p-grid">
					<div class="p-col-12 p-xl-7">
						<div class="form-card ui-fluid">
							<h1>#{i18n['event.event']}</h1>
							<div class="p-grid">
								<div class="p-col-12">
									<g:input type="selectOneMenu" label="#{i18n['event.state']}" value="#{addEventView.event.state}">
										<f:selectItems value="#{addEventView.states}" var="state" itemValue="#{state}"
											itemLabel="#{i18n['job_candidature_state.'.concat(state.name)]}" />
									</g:input>
								</div>

								<div class="p-col-12 p-xl-6">
									<g:input type="selectOneMenu" label="#{i18n['event.type']}" value="#{addEventView.event.type}">
										<f:selectItems value="#{addEventView.types}" var="var" itemValue="#{var}" itemLabel="#{i18n['event_type.'.concat(var.name)]}" />
									</g:input>
								</div>

								<div class="p-col-12">
									<g:input id="notes" label="#{i18n['event.notes']}" value="#{addEventView.event.notes}" type="textarea" />
								</div>
							</div>
						</div>
						<div class="p-col-12">
							<div class="form-buttons">
								<p:button value="#{i18n['action.cancel']}" outcome="/job/view.xhtml" styleClass="ui-button-secondary ui-button-outlined" >
								<f:param name="jobOffer" value="#{addEventView.jobCandidature.jobOffer.id}" />
								</p:button>
								<p:commandButton value="#{i18n['action.save']}" action="#{addEventView.save}" process="@form" update="@form"
									styleClass="ui-button-success ui-button-outlined" />
							</div>
						</div>
					</div>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
